[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prob4d"
version = "0.3.1"
description = "Probabilistic recursive fusion for long-horizon 4D reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Florian Pfaff"}]
keywords = [
  "4d-reconstruction",
  "bayesian-estimation",
  "computer-vision",
  "robotics",
  "uncertainty-quantification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/IPS-Stuttgart/Prob4D"
Documentation = "https://github.com/IPS-Stuttgart/Prob4D/tree/main/docs"
Issues = "https://github.com/IPS-Stuttgart/Prob4D/issues"
Changelog = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/CHANGELOG.md"
Citation = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/CITATION.cff"
Security = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/SECURITY.md"
License = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/LICENSE"
Project-Notes = "https://github.com/FlorianPfaff/BayesianPhysTwin-Paper"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0",
]

[project.scripts]
prob4d = "prob4d.cli:main"
prob4d-provider-manifest = "prob4d.provider_manifest_cli:main"
prob4d-ablate = "prob4d.experiments:main"
prob4d-ablate-provider-v2-gauge = "prob4d.provider_v2_gauge_ablation:main"
prob4d-benchmark = "prob4d.benchmark_safe:main"
prob4d-evaluate-provider = "prob4d.provider_evaluation:main"
prob4d-export-observation-belief = "prob4d.causal_stream_cli:main"
prob4d-export-calibrated-observation-belief = "prob4d.provider_v2_cli:main_calibrated"
prob4d-export-exploratory-observation-belief = "prob4d.provider_v2_cli:main_exploratory"
prob4d-motioncrafter = "prob4d.motioncrafter_safe:main"
prob4d-phystwin = "prob4d.phystwin_experiment:main"
prob4d-phystwin-state = "prob4d.phystwin_state:main"
prob4d-phystwin-uncertainty = "prob4d.phystwin_uncertainty:main"
prob4d-sintel-uncertainty = "prob4d.sintel_uncertainty:main"
prob4d-validate-observation = "prob4d.observation_validation:main"
prob4d-vggt-baseline = "prob4d.vggt_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prob4d = [
    "py.typed",
    "contract_data/observation_belief_v1/*.json",
    "contract_data/observation_belief_v1/vectors/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
