[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prob4d"
version = "0.5.0"
description = "Probabilistic recursive fusion for long-horizon 4D reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Florian Pfaff"}]
keywords = [
  "4d-reconstruction",
  "bayesian-estimation",
  "computer-vision",
  "robotics",
  "uncertainty-quantification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/IPS-Stuttgart/Prob4D"
Documentation = "https://github.com/IPS-Stuttgart/Prob4D/tree/main/docs"
Issues = "https://github.com/IPS-Stuttgart/Prob4D/issues"
Changelog = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/CHANGELOG.md"
Citation = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/CITATION.cff"
Security = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/SECURITY.md"
License = "https://github.com/IPS-Stuttgart/Prob4D/blob/main/LICENSE"
Project-Notes = "https://github.com/FlorianPfaff/BayesianPhysTwin-Paper"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0",
]

[project.scripts]
prob4d = "prob4d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prob4d = [
    "__init__.pyi",
    "_build_identity.json",
    "py.typed",
    "contract_data/observation_belief_v1/*.json",
    "contract_data/observation_belief_v1/vectors/*.json",
    "contract_data/provider_v2_factors_v1/*.json",
    "contract_data/provider_v2_factors_v1/vectors/*.json",
]
prob4d_independent_verifier = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/science/run_pointworld_model_load_smoke.py" = ["UP022"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "prob4d._observation_gaussian_common",
    "prob4d._observation_gaussian_tree",
    "prob4d._observation_gaussian_woodbury",
    "prob4d._provider_portfolio_model",
    "prob4d.api.v2",
    "prob4d.diagnostics.covariance_support",
    "prob4d.observation_gaussian_operator",
    "prob4d.provider_portfolio",
    "prob4d.public_api_manifest",
]
disallow_untyped_defs = true
warn_return_any = true
