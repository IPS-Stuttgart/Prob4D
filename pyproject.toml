[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prob4d"
version = "0.2.0"
description = "Probabilistic recursive fusion for long-horizon 4D reconstruction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Florian Pfaff"}]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/FlorianPfaff/Prob4D"
Documentation = "https://github.com/FlorianPfaff/Prob4D/tree/main/docs"
Issues = "https://github.com/FlorianPfaff/Prob4D/issues"
Project-Notes = "https://github.com/FlorianPfaff/2026-07-Causal4D-BPT-Paper"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
prob4d-ablate = "prob4d.experiments:main"
prob4d-benchmark = "prob4d.benchmark:main"
prob4d-export-observation-belief = "prob4d.observation_export:main"
prob4d-motioncrafter = "prob4d.motioncrafter:main"
prob4d-phystwin = "prob4d.phystwin_experiment:main"
prob4d-phystwin-state = "prob4d.phystwin_state:main"
prob4d-phystwin-uncertainty = "prob4d.phystwin_uncertainty:main"
prob4d-sintel-uncertainty = "prob4d.sintel_uncertainty:main"
prob4d-validate-observation = "prob4d.observation_contract:validate_main"
prob4d-vggt-baseline = "prob4d.vggt_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
