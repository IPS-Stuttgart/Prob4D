name: DEFORM DLO4/DLO5 query-gate source calibration

on:
  push:
    branches:
      - science/deform-dlo45-query-observability-real-v1
    paths:
      - protocols/execution_requests/deform_dlo45_query_gate_source_v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-query-gate-source-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/deform_dlo45_query_gate_source_v1.json
  OUTPUT_DIR: outputs/deform-dlo45-query-gate-source-v1
  OFFICIAL_DEFORM_REVISION: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  PYTHONPATH: src:scripts/science
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-calibration:
    name: Calibrate query gate on real DLO training geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering Prob4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact public DEFORM revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: roahmlab/DEFORM
          ref: b73b8b8ecc033caefa693fab7898741d4e6dbeff
          path: external/DEFORM
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact identities and train-only inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          test "$(git -C external/DEFORM rev-parse HEAD)" = "$OFFICIAL_DEFORM_REVISION"
          test "$(find external/DEFORM/data_set/DLO4/train -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
          test "$(find external/DEFORM/data_set/DLO5/train -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
          test -f "$REQUEST_PATH"

      - name: Set up isolated Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.2.6"
          python -m py_compile \
            src/prob4d/observable_gauge.py \
            src/prob4d/query_observability.py \
            scripts/science/audit_deform_dlo45_observability_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py

      - name: Run source-only gate calibration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$OUTPUT_DIR"
          python scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py \
            --request "$REQUEST_PATH" \
            --output-dir "$OUTPUT_DIR"

      - name: Validate selected gate and retained boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("outputs/deform-dlo45-query-gate-source-v1/result.json").read_text()
          )
          assert result["stage"] == "source-query-gate-calibration"
          assert result["dataset"]["opened_split"] == "train"
          assert result["dataset"]["manifest"]["file_count"] == 112
          assert result["accounting"]["successful_rank_six_cases"] >= 1000
          selected = result["selected_gate"]["minimum_direct_observability_fraction"]
          assert 0.0 <= selected <= 1.0
          boundary = result["information_boundary"]
          assert boundary["evaluation_file_contents_opened"] is False
          assert boundary["provider_predictions_opened"] is False
          assert boundary["bayesian_phystwin_outcomes_opened"] is False
          assert boundary["causal4d_outcomes_opened"] is False
          print(result["result_id"])
          print("selected direct threshold", selected)
          PY
          cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform-dlo45-query-gate-source-v1-${{ github.sha }}
          path: |
            outputs/deform-dlo45-query-gate-source-v1/
            protocols/execution_requests/deform_dlo45_query_gate_source_v1.json
          if-no-files-found: warn
          retention-days: 30
