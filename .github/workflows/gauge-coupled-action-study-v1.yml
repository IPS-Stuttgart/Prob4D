name: Gauge-coupled action study v1

on:
  push:
    branches:
      - research/symmetry-complete-belief-v1
      - main
    paths:
      - ".github/workflows/gauge-coupled-action-study-v1.yml"
      - "docs/equivariant-decision-identifiability.md"
      - "protocols/gauge-coupled-action-study-v1.json"
      - "scripts/science/run_gauge_coupled_action_study_v1.py"
      - "src/prob4d/equivariant_decision.py"
      - "tests/test_equivariant_decision.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gauge-coupled-action-study-v1.yml"
      - "docs/equivariant-decision-identifiability.md"
      - "protocols/gauge-coupled-action-study-v1.json"
      - "scripts/science/run_gauge_coupled_action_study_v1.py"
      - "src/prob4d/equivariant_decision.py"
      - "tests/test_equivariant_decision.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauge-coupled-action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    name: Equivariant decision tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify focused implementation
        run: |
          python -m ruff check \
            src/prob4d/equivariant_decision.py \
            scripts/science/run_gauge_coupled_action_study_v1.py \
            tests/test_equivariant_decision.py
          python -m ruff format --check \
            src/prob4d/equivariant_decision.py \
            scripts/science/run_gauge_coupled_action_study_v1.py \
            tests/test_equivariant_decision.py
          python -m pytest -q tests/test_equivariant_decision.py

  controlled-study:
    name: Byte-identical controlled mechanism result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install NumPy-only package
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Execute twice and verify the registered result
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gauge-coupled-action-study-v1"
          mkdir -p "$root"
          python scripts/science/run_gauge_coupled_action_study_v1.py \
            --output "$root/result-a.json"
          python scripts/science/run_gauge_coupled_action_study_v1.py \
            --output "$root/result-b.json"
          cmp "$root/result-a.json" "$root/result-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "gauge-coupled-action-study-v1"
          result = json.loads((root / "result-a.json").read_text(encoding="utf-8"))
          protocol = json.loads(
              Path("protocols/gauge-coupled-action-study-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          assert result["decision"] == "controlled-shared-gauge-passed"
          assert all(result["checks"].values())
          assert result["sample_counts"] == protocol["group"]["sample_counts"]
          assert result["action_templates"] == [
              entry["name"] for entry in protocol["actions"]
          ]
          for row in result["rows"]:
              shared = row["shared_gauge"]
              independent = row["independent_gauge_control"]
              assert shared["selected_action"] == 0
              assert shared["worst_case_regret_upper_bound"][0] < 1e-12
              assert shared["posterior_gauge_irrelevant"] is True
              assert independent["admitted"] is False
              assert independent["selected_action"] == 2
          world = result["world_frame_point_completion"]
          assert world["representative_completion_harm_fraction_vs_fallback"] > 0.66
          assert world["representative_completion_worst_loss"] > 3.9
          assert world["zero_fallback_worst_loss"] <= 1.000000000001
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          sha256sum \
            protocols/gauge-coupled-action-study-v1.json \
            "$root/result-a.json"
      - name: Upload controlled evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: gauge-coupled-action-study-${{ github.sha }}
          path: ${{ runner.temp }}/gauge-coupled-action-study-v1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
