name: Temporary retain bounded-orbit robustness v1

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-retain-bounded-orbit-robustness-v1.yml"

permissions:
  contents: write
  actions: read

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESULT_RUN_ID: "33564072262"
      RESULT_ARTIFACT_ID: "9822421238"
      RESULT_ARTIFACT_NAME: tracking-cloth-bounded-orbit-robustness-v1-33564072262
      RESULT_ARTIFACT_DIGEST: sha256:7d6ed4e938361f4cde0f4e3cbfcb12bba4036863934222e04730089925917868
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          clean: true

      - name: Verify immutable artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['RESULT_RUN_ID']}/artifacts?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "Prob4D-bounded-orbit-retention/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              rows = json.load(response)["artifacts"]
          matches = [row for row in rows if int(row["id"]) == int(os.environ["RESULT_ARTIFACT_ID"])]
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact["name"] == os.environ["RESULT_ARTIFACT_NAME"]
          assert artifact["digest"] == os.environ["RESULT_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

      - name: Download exact result artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.RESULT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/bounded-orbit-result
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RESULT_RUN_ID }}

      - name: Generate durable evidence summary and scientific note
        shell: bash
        run: |
          set -euo pipefail
          RESULT_ROOT="$RUNNER_TEMP/bounded-orbit-result" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          source = json.loads((root / "source_seal.json").read_text(encoding="utf-8"))
          assert result["result_id"] == (
              "5afbb2ae23ab34f8cb1944ed39d9517c8d7233096de8ae2e07b822d0e7299552"
          )
          assert result["protocol_id"] == (
              "6b372b78329a809aee508a68ffd51abeb945fc941c0db29ca996459ddf52f711"
          )
          assert result["target_group_count"] == 15
          assert result["target_case_count"] == 1803
          assert source["source_group_count"] == 24
          assert source["source_case_count"] == 288
          assert all(result["mathematical_checks"].values())

          rows = []
          for aggregate in result["aggregate"]:
              q50 = next(
                  row for row in aggregate["thresholds"]
                  if row["threshold_name"] == "q50"
              )
              rows.append(
                  {
                      "point_error_fraction": aggregate["point_error_fraction"],
                      "total_perturbation_cases": aggregate["total_perturbation_cases"],
                      "plugin_orbit_containment": aggregate["metrics"][
                          "plugin_orbit_containment"
                      ],
                      "outer_orbit_containment": aggregate["metrics"][
                          "outer_orbit_containment"
                      ],
                      "outer_width_ratio_mean": aggregate["metrics"][
                          "outer_width_ratio_mean"
                      ],
                      "q50_plugin_false_accept": q50["metrics"][
                          "plugin_false_accept"
                      ],
                      "q50_outer_false_accept": q50["metrics"][
                          "outer_false_accept"
                      ],
                      "q50_outer_false_reject": q50["metrics"][
                          "outer_false_reject"
                      ],
                  }
              )
          summary = {
              "schema": (
                  "prob4d.tracking-cloth-bounded-orbit-robustness-summary.v1"
              ),
              "protocol_id": result["protocol_id"],
              "result_id": result["result_id"],
              "source_seal_id": result["source_seal_id"],
              "source_revision": result["source_revision"],
              "workflow_run_id": int(os.environ["RESULT_RUN_ID"]),
              "artifact_id": int(os.environ["RESULT_ARTIFACT_ID"]),
              "artifact_digest": os.environ["RESULT_ARTIFACT_DIGEST"],
              "parent_result_id": result["parent_result"]["result_id"],
              "source_group_count": source["source_group_count"],
              "source_case_count": source["source_case_count"],
              "target_group_count": result["target_group_count"],
              "target_case_count": result["target_case_count"],
              "perturbation_replicates_per_case": 16,
              "source_thresholds_mm": result["source_thresholds_mm"],
              "source_width_summary_mm": source["width_summary_mm"],
              "mathematical_checks": result["mathematical_checks"],
              "aggregate": rows,
              "self_collision_header_audit": {
                  **result["self_collision_header_audit"],
                  "workflow_run_id": 33561974194,
                  "artifact_id": 9821603739,
                  "artifact_digest": (
                      "sha256:c3632e85d574f70c655bf5eeb117f7c2cc498425b33364196b7da2d3556a5229"
                  ),
              },
              "claim_boundary": result["claim_boundary"],
          }
          evidence = Path(
              "evidence/tracking-cloth-bounded-orbit-robustness-v1"
          )
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (evidence / "aggregate.csv").write_bytes((root / "aggregate.csv").read_bytes())

          lines = [
              "# Bounded finite-orbit certificates under uncertain geometry",
              "",
              "Status: secondary robustness evidence on the 15 public real-trajectory recordings already used by the primary Tracking Cloth experiment. It is not a second independent confirmation and does not use a learned visual provider.",
              "",
              "## Guarantee",
              "",
              "For observed anchors $\\hat a,\\hat b$ and probe $\\hat p$, suppose each true point lies inside a Euclidean ball of radius $\\epsilon$. Let $\\hat d=\\|\\hat b-\\hat a\\|$, $\\hat t$ be the observed axial coordinate, and $\\hat r$ the observed probe-to-line radius. When $\\hat d>2\\epsilon$, the true radius satisfies",
              "",
              "$$",
              "r \\leq \\hat r + 2\\epsilon + |\\hat t|\\min\\left(2,\\frac{4\\epsilon}{\\hat d-2\\epsilon}\\right).",
              "$$",
              "",
              "If $\\hat d\\leq2\\epsilon$, the axis direction is not certified and the implementation fails closed. Any query accepted using the outer orbit is therefore also accepted on the unknown true orbit, conditional on the declared point-error balls being valid.",
              "",
              "## Public real-trajectory stress test",
              "",
              "The error radius was swept from 0% to 10% of the true anchor separation. Sixteen deterministic boundary perturbations were evaluated for each of 1,803 cases from 15 held-out recordings. Decision thresholds were the 25th, 50th, and 75th percentiles of full radial-orbit width computed from 288 source cases in 24 shake/twist recordings.",
              "",
              "| point error / anchor span | plug-in containment | certified containment | certified width / truth | q50 plug-in false accept | q50 certified false accept | q50 certified false reject |",
              "|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              lines.append(
                  "| {error:.1%} | {plugin:.4f} | {outer:.4f} | {width:.3f} | {pfa:.4f} | {ofa:.4f} | {ofr:.4f} |".format(
                      error=row["point_error_fraction"],
                      plugin=row["plugin_orbit_containment"]["mean"],
                      outer=row["outer_orbit_containment"]["mean"],
                      width=row["outer_width_ratio_mean"]["mean"],
                      pfa=row["q50_plugin_false_accept"]["mean"],
                      ofa=row["q50_outer_false_accept"]["mean"],
                      ofr=row["q50_outer_false_reject"]["mean"],
                  )
              )
          lines += [
              "",
              "The plug-in orbit ceases to be a reliable outer approximation immediately: at nonzero error it contains the true orbit only about half the time. At 2% point error, its q50 false-acceptance rate is 12.86%. The certified outer orbit retains 100% containment and zero false acceptance at every tested error level, at the price of 1.261x mean width and 40.50% false rejection at the source-median threshold. At 10% error, the mean width inflation is 2.470x and false rejection is 49.92%.",
              "",
              "This establishes graceful, auditable conservatism rather than hidden optimism when the orbit generator is estimated imperfectly. The guarantee is conditional on the point-error balls; it does not estimate those balls from images.",
              "",
              "## Unsupported second cohort",
              "",
              "A separate header-only audit examined the 27 untouched Self-collision recordings without parsing trajectory values. No source/target marker-identity namespace shared three cloth markers. Those recordings were therefore not forced into an invalid correspondence-based replication and remain outcome-unopened.",
              "",
              "## Provenance",
              "",
              f"- Protocol: `{result['protocol_id']}`",
              f"- Result: `{result['result_id']}`",
              f"- Source seal: `{result['source_seal_id']}`",
              f"- Run: `{os.environ['RESULT_RUN_ID']}`",
              f"- Artifact: `{os.environ['RESULT_ARTIFACT_ID']}`",
              f"- Artifact digest: `{os.environ['RESULT_ARTIFACT_DIGEST']}`",
              "",
          ]
          Path("docs/tracking-cloth-bounded-orbit-robustness-v1.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY

      - name: Commit durable evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence/tracking-cloth-bounded-orbit-robustness-v1/ \
            docs/tracking-cloth-bounded-orbit-robustness-v1.md
          git commit -m "Retain bounded-orbit robustness evidence"
          git push origin HEAD:repair/tracking-cloth-finite-orbit-motive-parser-v1
