name: Temporary repair for PR 117

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-repair-pr117.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-repair-pr117
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 117 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/provider-neutral-common-mode-bias'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated validation environment
        run: |
          python -m venv "$RUNNER_TEMP/pr117-repair"
          echo "$RUNNER_TEMP/pr117-repair/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pr117-repair/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pr117-repair/bin/python" -m pip install -e ".[dev]"
          "$RUNNER_TEMP/pr117-repair/bin/python" -m pip install "numpy>=1.24,<2.3"

      - name: Apply exact type-contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/prob4d/prediction_provider_manifest.py"): [
                  (
                      '''        for name, values in {
                      "payload paths": [item.path for item in payloads],
                      "payload IDs": [item.payload_id for item in payloads],
                      "window IDs": [item.window_id for item in payloads],
                  }.items():
                      if len(set(values)) != len(values):
                          raise ValueError(f"{name} must be unique")
          ''',
                      '''        payload_paths = [item.path for item in payloads]
                  if len(set(payload_paths)) != len(payload_paths):
                      raise ValueError("payload paths must be unique")
                  payload_ids: list[str] = []
                  for item in payloads:
                      if item.payload_id is None:
                          raise ValueError("payload IDs must be materialized")
                      payload_ids.append(item.payload_id)
                  if len(set(payload_ids)) != len(payload_ids):
                      raise ValueError("payload IDs must be unique")
                  window_ids = [item.window_id for item in payloads]
                  if len(set(window_ids)) != len(window_ids):
                      raise ValueError("window IDs must be unique")
          ''',
                  )
              ],
              Path("src/prob4d/common_mode_stress.py"): [
                  (
                      "        aware_visual_variance = np.finfo(np.float64).tiny\n",
                      "        aware_visual_variance = float(np.finfo(np.float64).tiny)\n",
                  )
              ],
              Path("src/prob4d/visual_bias.py"): [
                  (
                      "            np.savez_compressed(stream, **arrays)\n",
                      "            np.savez_compressed(stream, **dict(arrays))  # type: ignore[arg-type]\n",
                  ),
                  (
                      '''        result = np.zeros(
                      (3 * self.observation_count, self.latent_dimension),
                      dtype=np.float64,
                  )
          ''',
                      '''        result: FloatArray = np.zeros(
                      (3 * self.observation_count, self.latent_dimension),
                      dtype=np.float64,
                  )
          ''',
                  ),
                  (
                      '''            result = np.zeros((self.observation_count, 3, 0), dtype=np.float64)
                      result.setflags(write=False)
                      return result
          ''',
                      '''            empty: FloatArray = np.zeros(
                      (self.observation_count, 3, 0),
                      dtype=np.float64,
                  )
                      empty.setflags(write=False)
                      return empty
          ''',
                  ),
                  (
                      '''        result = np.empty(
                      (self.observation_count, 3, int(np.count_nonzero(keep))),
                      dtype=np.float64,
                  )
          ''',
                      '''        result: FloatArray = np.empty(
                      (self.observation_count, 3, int(np.count_nonzero(keep))),
                      dtype=np.float64,
                  )
          ''',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              content = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = content.count(old)
                  if count != 1:
                      raise RuntimeError(
                          f"expected one exact repair target in {path}, found {count}"
                      )
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")
          PY

      - name: Validate repaired source and focused behavior
        run: |
          python -m ruff check \
            src/prob4d/cli.py \
            src/prob4d/prediction_provider_manifest.py \
            src/prob4d/visual_bias.py \
            src/prob4d/common_mode_stress.py \
            tests/test_cli.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_visual_bias.py \
            tests/test_common_mode_stress.py
          python -m mypy \
            src/prob4d/prediction_provider_manifest.py \
            src/prob4d/visual_bias.py \
            src/prob4d/common_mode_stress.py
          python -m pytest -q \
            tests/test_cli.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_visual_bias.py \
            tests/test_common_mode_stress.py \
            tests/test_source_diagnostics.py \
            tests/test_data.py \
            tests/test_data_storage.py
          python -m compileall -q src/prob4d
          git diff --check

      - name: Remove the one-use workflow and publish the validated patch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-repair-pr117.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/prediction_provider_manifest.py \
            src/prob4d/visual_bias.py \
            src/prob4d/common_mode_stress.py
          git commit -m "Fix provider-neutral type contracts"
          git push origin "HEAD:${HEAD_BRANCH}"
