name: Temporary execute Tracking Cloth finite-orbit v3

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-tracking-cloth-finite-orbit-v3-execution.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: temporary-tracking-cloth-finite-orbit-v3-execution
  cancel-in-progress: false

env:
  ZENODO_URL: https://zenodo.org/records/14644526/files/tracking_dataset.zip?download=1
  ZENODO_MD5: b4868b702f8a42b2ea1069d0f1a3b8f6
  PROTOCOL_PATH: protocols/tracking-cloth-finite-orbit-real-v3.json
  PROTOCOL_ID: 9c0fb1a4191743a5038a2f26e521db1640fd5abfc3cac389e851485b7836a472
  PROTOCOL_BLOB: 87c902740221285858942350e489349832044309
  V3_EVALUATOR_BLOB: 534d9ac6ae2d4b94a82eecfa27d31a0029b67775
  V2_EVALUATOR_BLOB: 921ff4dedb2759f85a5f3cbb821c699da7544baa
  PARSER_BLOB: 58df295f20e0badc439faec7eaedc82570db5f63
  PARENT_PROTOCOL_BLOB: 808d85e29b498ba1e7f92ea4ed67c4f6ec156c6d
  BASE_SCRIPT_BLOB: 081da94007493480b1e8efb8169c1c642bed1761
  QUALIFICATION_RUN_ID: "33532387635"
  QUALIFICATION_ARTIFACT_ID: "9810268001"
  QUALIFICATION_ARTIFACT_NAME: tracking-cloth-finite-orbit-real-v2-result-33532387635
  QUALIFICATION_ARTIFACT_DIGEST: sha256:c7c61a117c1e3dbcf33997c528fb1703bfae44cbdfb560d176a9880bc04b05e3
  QUALIFICATION_RESULT_ID: 5f130c8643c18346ad55e7d5997deefadc20481d14c8024e641ce811f23119e0
  QUALIFICATION_SOURCE_SEAL_ID: 1bb2236a087f5d309199fadd1cc2ebcc6a6242eaf6ab4f65a0d077ab9545ba52
  QUALIFICATION_SUPPORT_ID: 2d3b385f69bbeace010412771ad988bc51509cfe61e071cdc6ed0f7803938abb
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  execute:
    name: Run exact 15-group support-qualified replication
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify frozen scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$PROTOCOL_PATH")" = "$PROTOCOL_BLOB"
          test "$(git hash-object scripts/science/run_tracking_cloth_finite_orbit_real_v3.py)" = \
            "$V3_EVALUATOR_BLOB"
          test "$(git hash-object scripts/science/run_tracking_cloth_finite_orbit_real_v2.py)" = \
            "$V2_EVALUATOR_BLOB"
          test "$(git hash-object src/prob4d/motive_csv.py)" = "$PARSER_BLOB"
          test "$(git hash-object protocols/tracking-cloth-finite-orbit-real-v1.json)" = \
            "$PARENT_PROTOCOL_BLOB"
          test "$(git hash-object scripts/science/run_tracking_cloth_finite_orbit_real_v1.py)" = \
            "$BASE_SCRIPT_BLOB"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text(encoding="utf-8"))
          supplied = value.pop("protocol_id")
          encoded = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
          assert supplied == os.environ["PROTOCOL_ID"]
          assert hashlib.sha256(encoded).hexdigest() == supplied
          assert value["dataset"]["expected_source_files"] == 24
          assert value["dataset"]["expected_target_files"] == 15
          assert value["scientific_settings"]["target_frames_per_recording"] == 128
          assert value["scientific_settings"]["minimum_target_cases"] == 1000
          assert value["information_order"]["target_trajectory_values_opened_before_v3_freeze"] is False
          assert value["information_order"]["target_side_retuning_allowed"] is False
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact lightweight runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5"
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Initialize isolated workspace and runtime receipt
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tracking-cloth-v3-one-shot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$root"
          mkdir -p "$root/data" "$root/qualification" "$root/custody"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          ROOT="$root" python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          import numpy

          value = {
              "schema": "prob4d.tracking-cloth-finite-orbit-runtime.v3",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "repository_revision": os.environ["GITHUB_SHA"],
              "python": platform.python_version(),
              "numpy": numpy.__version__,
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
          }
          Path(os.environ["ROOT"], "custody", "runtime.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify exact header-only qualification artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.workspace.outputs.root }}" python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['QUALIFICATION_RUN_ID']}/artifacts?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "Prob4D-Tracking-Cloth-v3/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              artifacts = json.load(response)["artifacts"]
          matches = [
              row for row in artifacts
              if int(row["id"]) == int(os.environ["QUALIFICATION_ARTIFACT_ID"])
          ]
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact["name"] == os.environ["QUALIFICATION_ARTIFACT_NAME"]
          assert artifact["digest"] == os.environ["QUALIFICATION_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          Path(os.environ["ROOT"], "custody", "qualification-metadata.json").write_text(
              json.dumps(artifact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download exact header-only qualification artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.QUALIFICATION_ARTIFACT_NAME }}
          path: ${{ steps.workspace.outputs.root }}/qualification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFICATION_RUN_ID }}

      - name: Verify support qualification without target trajectory outcomes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.workspace.outputs.root }}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          qualification = root / "qualification"
          result = json.loads((qualification / "evaluation" / "result.json").read_text())
          source = json.loads((qualification / "evaluation" / "source_seal.json").read_text())
          support = json.loads((qualification / "evaluation" / "target_support.json").read_text())

          def verify_id(value, field):
              unsigned = dict(value)
              supplied = unsigned.pop(field)
              encoded = json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
              assert hashlib.sha256(encoded).hexdigest() == supplied
              return supplied

          assert verify_id(result, "result_id") == os.environ["QUALIFICATION_RESULT_ID"]
          assert verify_id(source, "source_seal_id") == os.environ["QUALIFICATION_SOURCE_SEAL_ID"]
          assert verify_id(support, "support_id") == os.environ["QUALIFICATION_SUPPORT_ID"]
          assert result["status"] == "target-marker-support-negative"
          assert support["required_marker_labels"] == ["1", "20", "5"]
          assert support["target_trajectory_values_parsed"] is False
          assert support["unsupported_groups_replaced"] is False
          assert len(support["supported"]) == 15
          assert len(support["unsupported"]) == 27
          protocol = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text())
          expected_ids = protocol["dataset"]["target_group_ids"]
          assert [row["group_id"] for row in support["supported"]] == expected_ids
          assert all(row["missing_marker_labels"] == [] for row in support["supported"])
          assert all(
              row["missing_marker_labels"] == ["1", "20", "5"]
              for row in support["unsupported"]
          )
          receipt = {
              "schema": "prob4d.tracking-cloth-v3-support-qualification.v1",
              "result_id": result["result_id"],
              "source_seal_id": source["source_seal_id"],
              "support_id": support["support_id"],
              "supported_target_group_ids": expected_ids,
              "unsupported_target_group_count": 27,
              "target_trajectory_values_parsed": False,
              "target_outcomes_used_for_v3_selection": False,
          }
          Path(root, "custody", "support-qualification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -rf -- "${{ steps.workspace.outputs.root }}/qualification"

      - name: Download and verify official public release
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          archive="$root/tracking_dataset.zip"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output "$archive" "$ZENODO_URL"
          printf '%s  %s\n' "$ZENODO_MD5" "$archive" | md5sum --check --strict
          unzip -q "$archive" -d "$root/data"
          count=$(find "$root/data" -type f -iname '*.csv' -printf '.' | wc -c)
          test "$count" -eq 120
          ARCHIVE="$archive" ROOT="$root" COUNT="$count" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          receipt = {
              "schema": "prob4d.tracking-cloth-official-release-receipt.v3",
              "zenodo_record": "14644526",
              "archive_filename": archive.name,
              "archive_bytes": archive.stat().st_size,
              "archive_md5": os.environ["ZENODO_MD5"],
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "csv_count": int(os.environ["COUNT"]),
          }
          Path(os.environ["ROOT"], "custody", "official-release.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "root=$root/data" >> "$GITHUB_OUTPUT"

      - name: Execute frozen source seal and 15-group target replication once
        id: experiment
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          set +e
          python scripts/science/run_tracking_cloth_finite_orbit_real_v3.py \
            --dataset-root "${{ steps.dataset.outputs.root }}" \
            --protocol "$PROTOCOL_PATH" \
            --output-dir "$root/evaluation" \
            --source-revision "$(git rev-parse HEAD)" \
            > "$root/stdout.txt" 2> "$root/stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/process-exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Remove raw dataset before evidence publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          rm -rf -- "$root/data" "$root/tracking_dataset.zip"
          if find "$root/evaluation" -type f \( -iname '*.csv' -o -iname '*.zip' \) \
              -print -quit 2>/dev/null | grep -q .; then
            echo "raw dataset payload appeared in evidence" >&2
            exit 3
          fi

      - name: Independently verify one registered terminal result
        id: result
        if: always()
        env:
          PROCESS_EXIT: ${{ steps.experiment.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.workspace.outputs.root }}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          evaluation = root / "evaluation"
          required = [
              evaluation / "source_seal.json",
              evaluation / "target_support.json",
              evaluation / "result.json",
              evaluation / "summary.md",
          ]
          if not all(path.is_file() for path in required):
              stderr = (root / "stderr.txt").read_text(encoding="utf-8", errors="replace")
              raise SystemExit("no terminal scientific result: " + stderr[-3000:])
          source = json.loads(required[0].read_text(encoding="utf-8"))
          support = json.loads(required[1].read_text(encoding="utf-8"))
          result = json.loads(required[2].read_text(encoding="utf-8"))

          def verify_id(value, field):
              unsigned = dict(value)
              supplied = unsigned.pop(field)
              encoded = json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
              assert hashlib.sha256(encoded).hexdigest() == supplied
              return supplied

          source_id = verify_id(source, "source_seal_id")
          support_id = verify_id(support, "support_id")
          result_id = verify_id(result, "result_id")
          assert source["protocol_id"] == os.environ["PROTOCOL_ID"]
          assert result["protocol_id"] == os.environ["PROTOCOL_ID"]
          assert result["schema"] == "prob4d.tracking-cloth-finite-orbit-result.v3"
          assert source["eligible_source_group_count"] == 24
          assert source["eligible_target_group_count_from_filename_metadata"] == 15
          assert source["target_header_opened"] is False
          assert source["target_trajectory_opened"] is False
          assert source["selected_anchor_a"] == "1"
          assert source["selected_anchor_b"] == "20"
          assert source["selected_probe"] == "5"
          assert support["source_seal_id"] == source_id
          assert support["target_trajectory_values_parsed"] is False
          assert support["unsupported_groups_replaced"] is False
          assert len(support["supported"]) + len(support["unsupported"]) == 15
          protocol = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text())
          expected_ids = protocol["dataset"]["target_group_ids"]
          assert result["frozen_target_group_ids"] == expected_ids
          assert result["support_qualification"]["target_trajectory_values_parsed"] is False
          assert result["scientific_settings"]["target_frames_per_recording"] == 128
          status = result["status"]
          allowed = {
              "evaluated-real-geometry-passed",
              "evaluated-real-geometry-failed",
              "target-marker-support-negative",
          }
          assert status in allowed
          process_exit = int(os.environ["PROCESS_EXIT"])
          assert process_exit == (0 if status == "evaluated-real-geometry-passed" else 2)
          if status == "target-marker-support-negative":
              assert support["unsupported"]
              assert not (evaluation / "inventory.json").exists()
          else:
              assert support["unsupported"] == []
              assert [row["group_id"] for row in support["supported"]] == expected_ids
              assert result["cohort"]["source_groups"] == 24
              assert result["cohort"]["target_groups"] == 15
              assert result["cohort"]["excluded_source_groups"] == 40
              assert result["cohort"]["excluded_target_groups"] == 41
              assert result["aggregate"]["target_groups"] == 15
              assert len(result["groups"]) == 15
              assert len({row["group_id"] for row in result["groups"]}) == 15
              assert [row["group_id"] for row in result["groups"]] == expected_ids
              assert all(row["material"] in {"cotton", "denim", "wool"} for row in result["groups"])
              assert all(row["size"] == "A2" for row in result["groups"])
              if status == "evaluated-real-geometry-passed":
                  assert result["aggregate"]["total_cases"] >= 1000
                  assert all(result["criteria"].values())
              else:
                  assert not all(result["criteria"].values())
          receipt = {
              "schema": "prob4d.tracking-cloth-finite-orbit-v3-verification.v1",
              "status": status,
              "result_id": result_id,
              "source_seal_id": source_id,
              "support_id": support_id,
              "source_groups": 24,
              "target_groups": 15,
              "unsupported_target_group_count": len(support["unsupported"]),
              "unsupported_target_group_replaced": False,
              "target_outcomes_used_for_roster_selection": False,
              "scientific_settings_changed_after_target_access": False,
          }
          Path(root, "custody", "result-verification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"status={status}\n")
              stream.write(f"result_id={result_id}\n")
          PY

      - name: Publish scientific summary
        if: always()
        shell: bash
        run: |
          summary="${{ steps.workspace.outputs.root }}/evaluation/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact immutable result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-finite-orbit-real-v3-result-${{ github.run_id }}
          path: |
            ${{ steps.workspace.outputs.root }}/custody/
            ${{ steps.workspace.outputs.root }}/evaluation/
            ${{ steps.workspace.outputs.root }}/stdout.txt
            ${{ steps.workspace.outputs.root }}/stderr.txt
            ${{ steps.workspace.outputs.root }}/process-exit-code.txt
          if-no-files-found: error
          retention-days: 90

      - name: Require one registered terminal outcome
        if: always()
        env:
          STATUS: ${{ steps.result.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$STATUS" in
            evaluated-real-geometry-passed|evaluated-real-geometry-failed|target-marker-support-negative)
              ;;
            *)
              exit 3
              ;;
          esac
