      - name: Register and validate target control plane before any target request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow_name = "dot-rope-r21-r40-confirmation-v1.yml"
          constant = "DOT_ROPE_R21_R40_CONFIRMATION_WORKFLOW"
          candidates = [
              Path("tests/_trusted_self_hosted_validation_policy_base.py"),
              Path("tests/test_trusted_self_hosted_validation_policy.py"),
          ]
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              if workflow_name in text:
                  break
              anchor = re.search(
                  r"(?m)^(DOT_ROPE_[A-Z0-9_]+_WORKFLOW\s*=\s*\(.*?^\))",
                  text,
                  re.DOTALL,
              )
              if anchor is None:
                  continue
              declaration = (
                  f'\n{constant} = (\n'
                  f'    WORKFLOW_ROOT / "{workflow_name}"\n'
                  f')\n'
              )
              text = text[: anchor.end()] + declaration + text[anchor.end() :]
              tuple_match = re.search(
                  r"TRUSTED_SELF_HOSTED_WORKFLOWS\s*=\s*\((.*?)\n\)",
                  text,
                  re.DOTALL,
              )
              if tuple_match is not None:
                  body = tuple_match.group(1)
                  replacement = (
                      "TRUSTED_SELF_HOSTED_WORKFLOWS = ("
                      + body
                      + f"\n    {constant},"
                      + "\n)"
                  )
                  text = text[: tuple_match.start()] + replacement + text[tuple_match.end() :]
              path.write_text(text, encoding="utf-8", newline="\n")
              break
          PY
          cp /tmp/dot-rope-r21-r40-request.json \
            protocols/execution_requests/dot_rope_r21_r40_confirmation_v1.json
          python -m pip install -e ".[dev]"
          python -m ruff check \
            scripts/science/run_dot_rope_r21_r40_confirmation_v1.py \
            tests/test_dot_r21_r40_confirmation_v1.py
          python -m ruff format --check \
            scripts/science/run_dot_rope_r21_r40_confirmation_v1.py \
            tests/test_dot_r21_r40_confirmation_v1.py
          python -m pytest -q \
            tests/test_dot_r21_r40_confirmation_v1.py \
            tests/test_github_action_pins.py
          python -m compileall -q \
            scripts/science/run_dot_rope_r21_r40_confirmation_v1.py

