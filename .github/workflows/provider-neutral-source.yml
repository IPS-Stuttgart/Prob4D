name: Provider-neutral source contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/provider-neutral-source.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/architecture.md"
      - "docs/compatibility.md"
      - "docs/data-format.md"
      - "docs/source-provider-contract.md"
      - "src/prob4d/contracts.py"
      - "src/prob4d/source.py"
      - "tests/test_source.py"
      - "tests/test_stable_facades.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-neutral-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Source contracts and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation environment
        run: python -m pip install -e ".[dev]"
      - name: Check focused quality
        run: |
          python -m ruff check \
            src/prob4d/contracts.py \
            src/prob4d/source.py \
            tests/test_source.py \
            tests/test_stable_facades.py
          python -m ruff format --check \
            src/prob4d/contracts.py \
            src/prob4d/source.py \
            tests/test_source.py \
            tests/test_stable_facades.py
          python -m mypy \
            src/prob4d/contracts.py \
            src/prob4d/source.py
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_source.py
          tests/test_stable_facades.py
      - name: Verify stable imports avoid GPU stacks
        run: |
          python - <<'PY'
          import sys

          import prob4d.contracts
          import prob4d.source

          forbidden = {"torch", "diffusers", "decord"}
          loaded = sorted(forbidden & set(sys.modules))
          if loaded:
              raise SystemExit(f"stable source imports loaded optional GPU dependencies: {loaded}")
          PY
      - name: Build and inspect source distribution
        run: |
          python -m build --sdist --wheel
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = {
              "docs/source-provider-contract.md",
              "src/prob4d/contracts.py",
              "src/prob4d/source.py",
              "tests/test_source.py",
              "tests/test_stable_facades.py",
          }
          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive, "r:gz") as handle:
              names = {
                  "/".join(Path(name).parts[1:])
                  for name in handle.getnames()
                  if len(Path(name).parts) > 1
              }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"source distribution omitted files: {missing}")

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as handle:
              wheel_names = set(handle.namelist())
          for path in ("prob4d/contracts.py", "prob4d/source.py"):
              if path not in wheel_names:
                  raise SystemExit(f"wheel omitted {path}")
          PY
