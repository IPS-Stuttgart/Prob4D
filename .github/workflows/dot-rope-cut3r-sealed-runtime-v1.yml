name: DOT rope CUT3R sealed runtime v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dot-rope-cut3r-sealed-runtime-v1.yml"
      - "docs/dot-rope-cut3r-sealed-runtime-v1.md"
      - "protocols/dot-rope-cut3r-native-provider-v1.json"
      - "scripts/science/prepare_cut3r_runtime.py"
      - "scripts/science/run_dot_rope_cut3r_native_provider.py"
      - "src/prob4d/cut3r_runtime_contract.py"
      - "src/prob4d/dot_rope_cut3r_study.py"
      - "tests/test_dot_rope_cut3r_native_provider.py"
      - "tests/test_dot_rope_cut3r_sealed_runtime_workflow.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/dot_rope_cut3r_sealed_runtime_v1.json"

permissions:
  contents: read

concurrency:
  group: dot-rope-cut3r-sealed-runtime-v1-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/dot_rope_cut3r_sealed_runtime_v1.json
  PROTOCOL_PATH: protocols/dot-rope-cut3r-native-provider-v1.json
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/dot
  CUT3R_RUNTIME_ROOT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1
  CUT3R_RUNTIME_CHECKOUT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/CUT3R
  CUT3R_RUNTIME_PYTHON: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python
  CUT3R_RUNTIME_CHECKPOINT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/cut3r_512_dpt_4_64.pth
  CUT3R_RUNTIME_MANIFEST: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/bootstrap-manifest.json
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  CUT3R_CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contract:
    name: Validate sealed-runtime DOT control plane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate source, tests, and self-hosted policy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            scripts/science/prepare_cut3r_runtime.py \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            src/prob4d/cut3r_runtime_contract.py \
            src/prob4d/dot_rope_cut3r_study.py \
            tests/test_dot_rope_cut3r_native_provider.py \
            tests/test_dot_rope_cut3r_sealed_runtime_workflow.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format --check \
            scripts/science/prepare_cut3r_runtime.py \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            src/prob4d/cut3r_runtime_contract.py \
            src/prob4d/dot_rope_cut3r_study.py \
            tests/test_dot_rope_cut3r_native_provider.py \
            tests/test_dot_rope_cut3r_sealed_runtime_workflow.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_dot_rope_cut3r_native_provider.py \
            tests/test_dot_rope_cut3r_sealed_runtime_workflow.py \
            tests/test_trusted_self_hosted_validation_policy.py \
            tests/test_github_action_pins.py
          python -m compileall -q \
            scripts/science/prepare_cut3r_runtime.py \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            src/prob4d/cut3r_runtime_contract.py \
            src/prob4d/dot_rope_cut3r_study.py

  authorize:
    name: Authorize one immutable merged-main request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      protocol_id: ${{ steps.request.outputs.protocol_id }}
      protocol_git_blob_sha: ${{ steps.request.outputs.protocol_git_blob_sha }}
      head_sha: ${{ steps.request.outputs.head_sha }}
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exactly one non-forced request-file change
        id: request
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = "refs/heads/main"
          test "$EVENT_AFTER" = "$(/usr/bin/git rev-parse HEAD)"
          test "$EVENT_FORCED" = "false"
          test "$EVENT_DELETED" = "false"
          test "$EVENT_BEFORE" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(
            /usr/bin/git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" | sort
          )
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$REQUEST_PATH" ]]; then
            printf 'Expected only %s; changed paths were:\n' "$REQUEST_PATH" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 2
          fi
          test -f "$REQUEST_PATH"
          test ! -L "$REQUEST_PATH"
          protocol_blob=$(/usr/bin/git rev-parse "$EVENT_AFTER:$PROTOCOL_PATH")
          python -m pip install -e .
          validation=$(
            python scripts/science/run_dot_rope_cut3r_native_provider.py \
              validate-request \
              --request "$REQUEST_PATH" \
              --protocol "$PROTOCOL_PATH" \
              --protocol-git-blob-sha "$protocol_blob"
          )
          VALIDATION="$validation" \
            PROTOCOL_BLOB="$protocol_blob" \
            EVENT_AFTER="$EVENT_AFTER" \
            /usr/bin/python3 - <<'PY'
          import json
          import os

          value = json.loads(os.environ["VALIDATION"])
          outputs = {
              "request_id": value["request_id"],
              "protocol_id": value["protocol_id"],
              "protocol_git_blob_sha": os.environ["PROTOCOL_BLOB"],
              "head_sha": os.environ["EVENT_AFTER"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, item in outputs.items():
                  output.write(f"{key}={item}\n")
          PY

  provider:
    name: Seal marker-free R01-R03 predictions on gpuserver4090
    if: github.event_name == 'push'
    needs: authorize
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      runtime_artifact_id: ${{ steps.result.outputs.runtime_artifact_id }}
      provider_bundle_id: ${{ steps.result.outputs.provider_bundle_id }}
    steps:
      - name: Initialize isolated provider workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-dot-sealed-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p "$root/provider" "$root/home" "$root/cache" "$root/tmp"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "TMPDIR=$root/tmp"
            echo "TORCH_EXTENSIONS_DIR=$root/cache/torch-extensions"
            echo "WANDB_MODE=disabled"
            echo "WANDB_DISABLED=true"
          } >> "$GITHUB_ENV"
      - name: Require the intended runner and complete DOT source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v nvidia-smi >/dev/null 2>&1
          test -d "$DATASET_ROOT"
          test ! -L "$DATASET_ROOT"
          test -r "$DATASET_ROOT/R01-10.zip"
          test -f "$DATASET_ROOT/R01-10.zip"
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify clean exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
      - name: Bind the sealed persistent CUT3R runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUT3R_RUNTIME_PYTHON"
          test -d "$CUT3R_RUNTIME_CHECKOUT/.git"
          test -f "$CUT3R_RUNTIME_CHECKPOINT"
          test -f "$CUT3R_RUNTIME_MANIFEST"
          test "$(/usr/bin/git -C "$CUT3R_RUNTIME_CHECKOUT" rev-parse HEAD)" = \
            "$CUT3R_REVISION"
          test "$(sha256sum "$CUT3R_RUNTIME_CHECKPOINT" | awk '{print $1}')" = \
            "$CUT3R_CHECKPOINT_SHA256"
          MANIFEST="$CUT3R_RUNTIME_MANIFEST" \
            EXPECTED_REVISION="$CUT3R_REVISION" \
            EXPECTED_CHECKPOINT_SHA256="$CUT3R_CHECKPOINT_SHA256" \
            EXPECTED_PYTHON="$CUT3R_RUNTIME_PYTHON" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          if manifest.get("schema") != "prob4d.dot-cut3r-gpuserver4090-runtime-bootstrap":
              raise SystemExit("runtime manifest schema changed")
          if manifest.get("schema_version") != 4:
              raise SystemExit("runtime manifest version changed")
          if manifest.get("cut3r_revision") != os.environ["EXPECTED_REVISION"]:
              raise SystemExit("runtime manifest binds another CUT3R revision")
          checkpoint = manifest.get("checkpoint") or {}
          if checkpoint.get("sha256") != os.environ["EXPECTED_CHECKPOINT_SHA256"]:
              raise SystemExit("runtime manifest binds another checkpoint")
          if manifest.get("runtime_python") != os.environ["EXPECTED_PYTHON"]:
              raise SystemExit("runtime manifest binds another interpreter")
          if not str(manifest.get("torch_version", "")).startswith("2.11.0"):
              raise SystemExit("runtime manifest binds another Torch version")
          if manifest.get("torch_cuda_version") != "12.6":
              raise SystemExit("runtime manifest binds another CUDA version")
          if manifest.get("cuda_available") is not True:
              raise SystemExit("runtime manifest does not attest CUDA")
          if manifest.get("dot_dataset_accessed") is not False:
              raise SystemExit("runtime bootstrap crossed the DOT data boundary")
          native_id = manifest.get("native_rope_artifact_id")
          if not isinstance(native_id, str) or re.fullmatch(r"[0-9a-f]{64}", native_id) is None:
              raise SystemExit("runtime manifest has no native RoPE identity")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"native_rope_artifact_id={native_id}\n")
          PY
          PYTHONPATH="$CUT3R_RUNTIME_CHECKOUT:$CUT3R_RUNTIME_CHECKOUT/src" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import torch
          from dust3r.model import ARCroco3DStereo

          print(f"dust3r_model_import={ARCroco3DStereo.__name__}")
          print(f"torch={torch.__version__}")
          print(f"torch_cuda={torch.version.cuda}")
          print(f"cuda_device={torch.cuda.get_device_name(0)}")
          if torch.version.cuda != "12.6" or not torch.cuda.is_available():
              raise SystemExit("persistent CUT3R runtime is not CUDA 12.6")
          PY
      - name: Copy and attest the sealed native-RoPE runtime
        shell: bash
        env:
          NATIVE_ROPE_ARTIFACT_ID: ${{ steps.runtime.outputs.native_rope_artifact_id }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          /usr/bin/mkdir -p "$root/CUT3R"
          /usr/bin/cp -a "$CUT3R_RUNTIME_CHECKOUT/." "$root/CUT3R/"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            "$CUT3R_RUNTIME_PYTHON" \
            scripts/science/prepare_cut3r_runtime.py \
              --cut3r-checkout "$root/CUT3R" \
              --expected-artifact-id "$NATIVE_ROPE_ARTIFACT_ID" \
              --output "$root/provider/runtime-receipt.json"
      - name: Run synthetic native-RoPE forward pass
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "$CUT3R_RUNTIME_PYTHON" \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
              runtime-smoke \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --cut3r-checkout "$root/CUT3R" \
              --checkpoint "$CUT3R_RUNTIME_CHECKPOINT" \
              --runtime-receipt "$root/provider/runtime-receipt.json" \
              --output-dir "$root/provider/smoke"
      - name: Execute marker-free normal-view predictions
        id: execute
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "$CUT3R_RUNTIME_PYTHON" \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
              predict \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$DATASET_ROOT" \
              --cut3r-checkout "$root/CUT3R" \
              --checkpoint "$CUT3R_RUNTIME_CHECKPOINT" \
              --runtime-receipt "$root/provider/runtime-receipt.json" \
              --output-dir "$root/provider/bundle"
      - name: Read sealed provider identity
        id: result
        if: always()
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          ROOT="$root" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          manifest_path = root / "provider" / "bundle" / "manifest.json"
          receipt_path = root / "provider" / "runtime-receipt.json"
          smoke_path = root / "provider" / "smoke" / "smoke-result.json"
          runtime_id = "unavailable"
          if receipt_path.is_file():
              runtime_id = json.loads(receipt_path.read_text(encoding="utf-8"))["artifact_id"]
          if os.environ["EXECUTION_OUTCOME"] == "success" and manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              decision = manifest["decision"]
              provider_id = manifest["provider_bundle_id"]
          else:
              decision = "technical-failure"
              provider_id = "unavailable"
              failure = {
                  "schema": "prob4d.dot-rope-cut3r-sealed-runtime-technical-receipt",
                  "schema_version": 1,
                  "smoke_outcome": os.environ["SMOKE_OUTCOME"],
                  "prediction_outcome": os.environ["EXECUTION_OUTCOME"],
                  "runtime_artifact_id": runtime_id,
                  "smoke_result_present": smoke_path.is_file(),
                  "provider_manifest_present": manifest_path.is_file(),
              }
              (root / "provider" / "technical-receipt.json").write_text(
                  json.dumps(failure, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={decision}\n")
              output.write(f"runtime_artifact_id={runtime_id}\n")
              output.write(f"provider_bundle_id={provider_id}\n")
          PY
      - name: Upload sealed provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-rope-cut3r-sealed-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce a sealed provider bundle
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          test "$DECISION" = "sealed-provider-predictions"

  evaluate:
    name: Evaluate sealed R01-R03 predictions against markers
    if: >-
      github.event_name == 'push' &&
      needs.provider.outputs.decision == 'sealed-provider-predictions'
    needs: [authorize, provider]
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      evaluation_id: ${{ steps.result.outputs.evaluation_id }}
      best_method: ${{ steps.result.outputs.best_method }}
    steps:
      - name: Initialize isolated evaluation workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-dot-sealed-evaluate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p "$root/provider" "$root/evaluation" "$root/home" "$root/tmp"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "TMPDIR=$root/tmp"
          } >> "$GITHUB_ENV"
      - name: Require the intended runner and complete DOT source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -r "$DATASET_ROOT/R01-10.zip"
          test -x "$CUT3R_RUNTIME_PYTHON"
          "$CUT3R_RUNTIME_PYTHON" -c 'import numpy'
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify clean exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
      - name: Download exact sealed provider bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dot-rope-cut3r-sealed-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider
      - name: Open source markers only after prediction seal and evaluate
        id: execute
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "$CUT3R_RUNTIME_PYTHON" \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
              evaluate \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$DATASET_ROOT" \
              --provider-bundle "$root/provider/bundle" \
              --output-dir "$root/evaluation/result"
      - name: Read evaluation identity
        id: result
        if: always()
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          result="$root/evaluation/result/result.json"
          if [[ "$EXECUTION_OUTCOME" == "success" && -f "$result" ]]; then
            RESULT="$result" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          best = value["aggregate_methods"][0]["method"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={value['decision']}\n")
              output.write(f"evaluation_id={value['evaluation_id']}\n")
              output.write(f"best_method={best}\n")
          PY
          else
            echo "decision=technical-failure" >> "$GITHUB_OUTPUT"
            echo "evaluation_id=unavailable" >> "$GITHUB_OUTPUT"
            echo "best_method=unavailable" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload complete source evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-rope-cut3r-sealed-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/evaluation/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce complete source evaluation
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          test "$DECISION" = "complete-source-evaluation"

  summarize:
    name: Publish bounded source-only result
    if: always() && github.event_name == 'push'
    needs: [authorize, provider, evaluate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Write run summary
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          RUNTIME_ID: ${{ needs.provider.outputs.runtime_artifact_id }}
          PROVIDER_DECISION: ${{ needs.provider.outputs.decision }}
          PROVIDER_ID: ${{ needs.provider.outputs.provider_bundle_id }}
          EVALUATION_DECISION: ${{ needs.evaluate.outputs.decision }}
          EVALUATION_ID: ${{ needs.evaluate.outputs.evaluation_id }}
          BEST_METHOD: ${{ needs.evaluate.outputs.best_method }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## DOT marker-free CUT3R source experiment"
            echo
            echo "- request ID: \`${REQUEST_ID:-unavailable}\`"
            echo "- native runtime ID: \`${RUNTIME_ID:-unavailable}\`"
            echo "- provider: \`${PROVIDER_DECISION:-skipped}\` / \`${PROVIDER_ID:-unavailable}\`"
            echo "- evaluation: \`${EVALUATION_DECISION:-skipped}\` / \`${EVALUATION_ID:-unavailable}\`"
            echo "- lowest registered source NLL: \`${BEST_METHOD:-unavailable}\`"
            echo "- workflow run: ${RUN_URL}"
            echo
            echo "Only DOT R01-R03 were authorized. R04-R70 remained unopened."
            echo "No BayesianPhysTwin or Causal4D outcome was executed."
          } >> "$GITHUB_STEP_SUMMARY"
