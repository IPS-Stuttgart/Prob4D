name: Trusted exact-head validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request number
        required: true
        type: string
      head_sha:
        description: Exact reviewed 40-character pull-request head SHA
        required: true
        type: string
      profile:
        description: Reviewed self-hosted workload
        required: true
        default: full-validation
        type: choice
        options:
          - full-validation
          - production-memory
          - cut3r-deform360-source-freeze

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-exact-head-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  authorize:
    name: Authorize exact pull-request head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - name: Require the default-branch workflow definition
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "trusted validation must be dispatched from main" >&2
            exit 1
          }

      - name: Verify open same-repository pull request and exact SHA
        id: pr
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          expected_head_sha = os.environ["EXPECTED_HEAD_SHA"]
          if re.fullmatch(r"[1-9][0-9]*", pr_number) is None:
              raise SystemExit("pr_number must be a positive integer")
          if re.fullmatch(r"[0-9a-f]{40}", expected_head_sha) is None:
              raise SystemExit("head_sha must be a full lowercase SHA-1")

          request = urllib.request.Request(
              f"{os.environ['API_URL']}/repos/{repository}/pulls/{pr_number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          actual_head_sha = str(pull["head"]["sha"])
          if pull["state"] != "open":
              raise SystemExit("the requested pull request is not open")
          if pull["base"]["ref"] != "main":
              raise SystemExit("pull request base must be main")
          if pull["head"]["repo"]["full_name"] != repository:
              raise SystemExit("only same-repository pull requests are admitted")
          if pull["base"]["repo"]["full_name"] != repository:
              raise SystemExit("pull request base repository changed")
          if actual_head_sha != expected_head_sha:
              raise SystemExit("pull-request head moved or expected SHA is stale")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pr_number={pull['number']}\n")
              output.write(f"head_sha={actual_head_sha}\n")
              output.write(f"base_sha={pull['base']['sha']}\n")
              output.write(f"head_ref={pull['head']['ref']}\n")
          PY

  validate:
    name: Validate approved exact head on workstation2
    needs: authorize
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    steps:
      - name: Initialize isolated validation workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-exact-head-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected="${RUNNER_TEMP}/prob4d-exact-head-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p \
            "$root/home" \
            "$root/cache" \
            "$root/tmp" \
            "$root/evidence"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "PIP_CACHE_DIR=$root/cache/pip"
            echo "HF_HOME=$root/cache/huggingface"
            echo "TMPDIR=$root/tmp"
          } >> "$GITHUB_ENV"

      - name: Check out only the authorized exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact clean checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"

      - name: Install reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.workspace.outputs.root }}/venv/bin/python"
          "$python_bin" -m pip install --no-cache-dir ".[dev]" "numpy>=1.24,<2.3"
          "$python_bin" -m pip check

      - name: Verify workflow security policies first
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.workspace.outputs.root }}/venv/bin/python"
          "$python_bin" -m pytest -q -p no:cacheprovider \
            tests/test_github_action_pins.py \
            tests/test_trusted_self_hosted_validation_policy.py \
            tests/test_security_scanning_workflow_policy.py

      - name: Run full source validation
        if: inputs.profile == 'full-validation'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          python_bin="$root/venv/bin/python"
          "$python_bin" -m ruff check src tests scripts/ci
          "$python_bin" -m ruff format --check \
            tests/test_trusted_self_hosted_validation_policy.py \
            tests/test_security_scanning_workflow_policy.py
          "$python_bin" -m mypy \
            src/prob4d/_provider_export_core.py \
            src/prob4d/api/v2.py \
            src/prob4d/cli.py \
            src/prob4d/calibration_compatibility.py \
            src/prob4d/composition_jacobian.py \
            src/prob4d/covariance_root.py \
            src/prob4d/observation_factor_stream.py \
            src/prob4d/prediction_store.py \
            src/prob4d/prediction_store_benchmark.py \
            src/prob4d/prediction_store_cli.py \
            src/prob4d/project_identity.py \
            src/prob4d/provider_attestation.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/provider_manifest_cli.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_v2.py \
            src/prob4d/provider_v2_cli.py \
            src/prob4d/provider_v2_loading.py \
            src/prob4d/public_api_manifest.py \
            src/prob4d/runtime_revision.py \
            src/prob4d/source_diagnostics.py
          "$python_bin" -m pytest --tb=short \
            --junitxml="$root/evidence/pytest.xml"
          "$python_bin" -m compileall -q src/prob4d tests
          /usr/bin/rm -rf build dist ./*.egg-info
          /usr/bin/git restore --worktree -- src/prob4d.egg-info
          "$python_bin" -m build
          "$python_bin" -m twine check dist/*
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          "$python_bin" scripts/ci/check_sdist.py "$archive"
          "$python_bin" -m pip check
          /usr/bin/git restore --worktree -- src/prob4d.egg-info
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain=v1)"

      - name: Run reviewed production memory profile
        if: inputs.profile == 'production-memory'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          python_bin="$root/venv/bin/python"
          output="$root/evidence/memory"
          /usr/bin/mkdir -p "$output"
          "$python_bin" -m prob4d.fusion_memory_benchmark \
            --frames 25 --height 320 --width 640 --contributors 3 \
            --method covariance_intersection \
            --fusion-tile-size 16384 \
            --output-json "$output/fusion.json"
          "$python_bin" -m prob4d.evaluation_memory_benchmark \
            --frames 25 --height 320 --width 640 --include-flow \
            --evaluation-chunk-size 65536 \
            --output-json "$output/evaluation.json"
          EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" EVIDENCE_ROOT="$root" \
            "$python_bin" - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"]) / "evidence" / "memory"
          for name in ("fusion", "evaluation"):
              report = json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              if report["repository_revision"] != os.environ["EXPECTED_HEAD_SHA"]:
                  raise SystemExit(f"{name} report is not bound to the reviewed head")
              peak = report["memory_bytes"]["peak_process_rss"]
              if peak is None or int(peak) <= 0:
                  raise SystemExit(f"{name} report has no positive peak RSS")
          PY
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain=v1)"

      - name: Run target-closed CUT3R Deform360 source freeze
        if: inputs.profile == 'cut3r-deform360-source-freeze'
        shell: bash
        env:
          BPT_CHECKOUT: ${{ vars.BPT_CHECKOUT }}
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: ${{ vars.DEFORM360_PROCESSED_ROOT }}
        run: |
          set -euo pipefail
          for name in \
            BPT_CHECKOUT \
            CUT3R_CHECKOUT \
            CUT3R_CHECKPOINT \
            DEFORM360_PROCESSED_ROOT
          do
            value=${!name:-}
            if [[ -z "$value" ]]; then
              echo "Required protected repository variable $name is unset" >&2
              exit 2
            fi
          done
          test -d "$BPT_CHECKOUT/.git"
          test -d "$CUT3R_CHECKOUT/.git"
          test -f "$CUT3R_CHECKPOINT"
          test -d "$DEFORM360_PROCESSED_ROOT"

          root="${{ steps.workspace.outputs.root }}"
          build_python="$root/venv/bin/python"
          wheel_dir="$root/cut3r-freeze-dist"
          run_venv="$root/cut3r-freeze-run-venv"
          output="$root/evidence/cut3r-deform360-source-freeze"
          raw_log="$root/tmp/cut3r-deform360-source-freeze.log"
          sanitized_log="$output/freeze.log"
          /usr/bin/rm -rf -- "$wheel_dir" "$run_venv" "$output" "$raw_log"
          /usr/bin/mkdir -p "$wheel_dir" "$output"

          "$build_python" -m build --wheel --outdir "$wheel_dir"
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' | sort)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one built Prob4D wheel" >&2
            exit 2
          fi
          python -m venv "$run_venv"
          "$run_venv/bin/python" -m pip install "pip==25.2"
          "$run_venv/bin/python" -m pip install "${wheels[0]}"
          "$run_venv/bin/python" -m pip check

          selection="$BPT_CHECKOUT/protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
          test -f "$selection"
          set +e
          "$run_venv/bin/python" scripts/science/build_cut3r_deform360_source_freeze.py \
            --repository . \
            --protocol protocols/cut3r_deform360_source_v1.json \
            --selection "$selection" \
            --processed-root "$DEFORM360_PROCESSED_ROOT" \
            --cut3r-checkout "$CUT3R_CHECKOUT" \
            --checkpoint "$CUT3R_CHECKPOINT" \
            --prob4d-wheel "${wheels[0]}" \
            --output-dir "$output" \
            > "$raw_log" 2>&1
          status=$?
          set -e

          RAW_LOG="$raw_log" SANITIZED_LOG="$sanitized_log" \
            "$build_python" - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          text = Path(os.environ["RAW_LOG"]).read_text(encoding="utf-8", errors="replace")
          replacements: dict[str, str] = {}
          for name in (
              "BPT_CHECKOUT",
              "CUT3R_CHECKOUT",
              "CUT3R_CHECKPOINT",
              "DEFORM360_PROCESSED_ROOT",
          ):
              value = os.environ.get(name, "")
              if not value:
                  continue
              replacements[value] = f"<{name}>"
              try:
                  replacements[str(Path(value).resolve())] = f"<{name}>"
              except OSError:
                  pass
          for value in sorted(replacements, key=len, reverse=True):
              text = text.replace(value, replacements[value])
          Path(os.environ["SANITIZED_LOG"]).write_text(text, encoding="utf-8")
          PY
          cat "$sanitized_log"
          printf '%s\n' "$status" > "$output/exit-status.txt"
          /usr/bin/rm -f -- "$raw_log"
          if [[ $status -ne 0 && $status -ne 3 ]]; then
            exit "$status"
          fi

          if [[ $status -eq 0 ]]; then
            "$run_venv/bin/prob4d" prediction cut3r-comparison build \
              "$output/cut3r-comparison-spec.json" \
              --output "$output/cut3r-comparison-lock.json"
            "$run_venv/bin/prob4d" prediction cut3r-comparison verify \
              "$output/cut3r-comparison-lock.json"
            "$run_venv/bin/prob4d" prediction cut3r-comparison summarize \
              "$output/cut3r-comparison-lock.json" \
              --json \
              > "$output/cut3r-comparison-summary.json"
          fi

          STATUS="$status" OUTPUT_DIR="$output" \
            "$run_venv/bin/python" - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          status = int(os.environ["STATUS"])
          freeze_path = output / "cut3r-deform360-source-freeze.json"
          freeze = json.loads(freeze_path.read_text(encoding="utf-8"))
          boundary = freeze["information_boundary"]
          forbidden_true = (
              "source_rgb_frames_decoded",
              "source_prediction_payloads_opened",
              "source_residuals_or_truth_opened",
              "source_future_geometry_opened",
              "target_payloads_opened",
              "target_outcomes_opened",
              "downstream_physical_innovations_opened",
          )
          if any(boundary[name] is not False for name in forbidden_true):
              raise SystemExit("source-freeze information boundary was exceeded")
          if freeze["source_group_count"] != 10:
              raise SystemExit("source freeze does not contain exactly ten groups")
          if freeze["forbidden_target_group_count"] != 12:
              raise SystemExit("source freeze does not retain all twelve forbidden targets")

          specification = output / "cut3r-comparison-spec.json"
          lock = output / "cut3r-comparison-lock.json"
          if status == 0:
              if freeze["decision"] != "source-support-freeze-ready":
                  raise SystemExit("successful source freeze has the wrong decision")
              if not specification.is_file() or not lock.is_file():
                  raise SystemExit("successful source freeze lacks canonical comparison outputs")
          elif status == 3:
              if freeze["decision"] != "insufficient-common-camera-support":
                  raise SystemExit("support-negative source freeze has the wrong decision")
              if specification.exists() or lock.exists():
                  raise SystemExit("support-negative source freeze published comparison outputs")
          else:
              raise SystemExit("unexpected source-freeze exit status")
          PY

          /usr/bin/git restore --worktree -- src/prob4d.egg-info
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)"

      - name: Record exact validation evidence
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_REF: ${{ needs.authorize.outputs.head_ref }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          root="${{ steps.workspace.outputs.root }}"
          python_bin="$root/venv/bin/python"
          checked_out_sha="$(/usr/bin/git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "pull_request=${{ needs.authorize.outputs.pr_number }}"
            echo "head_sha=$EXPECTED_HEAD_SHA"
            echo "checked_out_sha=$checked_out_sha"
            echo "base_sha=$EXPECTED_BASE_SHA"
            echo "head_ref=$HEAD_REF"
            echo "profile=${{ inputs.profile }}"
            echo "validation_status=$VALIDATION_STATUS"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            "$python_bin" --version
            "$python_bin" -m pip --version
            "$python_bin" -m pip freeze --all
          } > "$root/evidence/environment.txt"
          {
            /usr/bin/uname -a
            command -v lscpu >/dev/null 2>&1 && lscpu || true
            command -v free >/dev/null 2>&1 && free -b || true
            command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi || true
          } > "$root/evidence/host.txt" 2>&1
          "$python_bin" - "$root/evidence" <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload compact validation evidence
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-exact-head-${{ needs.authorize.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove isolated validation workspace and checkout residue
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          expected="${RUNNER_TEMP}/prob4d-exact-head-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/git reset --hard HEAD
          /usr/bin/git clean -ffdx
