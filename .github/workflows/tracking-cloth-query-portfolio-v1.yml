name: Tracking Cloth query portfolio v1

on:
  push:
    branches:
      - science/tracking-cloth-query-portfolio-v1
    paths:
      - ".github/workflows/tracking-cloth-query-portfolio-v1.yml"
      - "protocols/execution_requests/tracking_cloth_query_portfolio_v1.json"
      - "protocols/tracking-cloth-query-portfolio-v1.json"
      - "scripts/science/run_tracking_cloth_query_portfolio_v1.py"
      - "tests/test_tracking_cloth_query_portfolio_v1.py"
      - "src/prob4d/posterior_preserving_compression.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-cloth-query-portfolio-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  PROTOCOL_PATH: protocols/tracking-cloth-query-portfolio-v1.json
  REQUEST_PATH: protocols/execution_requests/tracking_cloth_query_portfolio_v1.json
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  preflight:
    name: Validate query-portfolio capsule
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate request and protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          protocol = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text())
          assert request["schema"] == "prob4d.self-hosted-experiment-request.v1"
          assert request["branch"] == "science/tracking-cloth-query-portfolio-v1"
          assert request["runner_labels"] == ["self-hosted", "Linux", "X64", "gpuserver4090"]
          assert request["dataset_root"] == os.environ["DATASET_ROOT"]
          assert request["raw_data_publication_authorized"] is False
          assert request["provider_promotion_authorized"] is False
          assert protocol["schema"] == "prob4d.tracking-cloth-query-portfolio.v1"
          assert protocol["query_counts"] == [1, 2, 4, 8, 12, 20]
          assert protocol["payload_accounting"]["standalone_cache_preferred_when_model_blocks_are_not_resident"] is True
          PY
      - name: Install development package
        run: python -m pip install -e ".[dev]"
      - name: Focused tests and lint
        run: |
          python -m pytest -q tests/test_posterior_preserving_compression.py tests/test_tracking_cloth_query_portfolio_v1.py
          python -m ruff check scripts/science/run_tracking_cloth_query_portfolio_v1.py tests/test_tracking_cloth_query_portfolio_v1.py
          python -m compileall -q scripts/science/run_tracking_cloth_query_portfolio_v1.py

  evaluate:
    name: Evaluate query portfolios on gpuserver4090
    needs: preflight
    if: >-
      github.actor == 'FlorianPfaff' &&
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref_name == 'science/tracking-cloth-query-portfolio-v1'
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Bind runner and complete dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -d "$DATASET_ROOT"
          count=$(find "$DATASET_ROOT" -type f -iname '*.csv' -printf '.' | wc -c)
          test "$count" -eq 120
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create isolated pinned runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/tracking-cloth-query-portfolio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$root"
          mkdir -p "$root/evidence"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install --disable-pip-version-check "numpy==2.3.5"
          "$root/venv/bin/python" -m pip install --disable-pip-version-check --no-deps -e .
          "$root/venv/bin/python" - <<'PY' > "$root/runtime.json"
          import json
          import platform
          import sys
          import numpy
          print(json.dumps({
              "python": platform.python_version(),
              "executable": sys.executable,
              "numpy": numpy.__version__,
          }, indent=2, sort_keys=True))
          PY
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "python=$root/venv/bin/python" >> "$GITHUB_OUTPUT"
      - name: Execute recording-disjoint portfolio study
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.runtime.outputs.root }}"
          set +e
          PYTHONPATH=src "${{ steps.runtime.outputs.python }}" \
            scripts/science/run_tracking_cloth_query_portfolio_v1.py \
              --dataset-root "$DATASET_ROOT" \
              --protocol "$PROTOCOL_PATH" \
              --output-dir "$root/evidence/run" \
              --source-revision "$GITHUB_SHA" \
              > "$root/stdout.txt" 2> "$root/stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/process-exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reject accidental raw-data output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.runtime.outputs.root }}"
          if find "$root/evidence" -type f \( -iname '*.csv' -o -iname '*.zip' \) -print -quit | grep -q .; then
            echo "Raw dataset payload appeared in evidence" >&2
            exit 3
          fi
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-query-portfolio-v1-${{ github.run_attempt }}
          path: ${{ steps.runtime.outputs.root }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          summary="${{ steps.runtime.outputs.root }}/evidence/run/summary.md"
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Enforce completed diagnostic and exact parity
        shell: bash
        env:
          RESULT_PATH: ${{ steps.runtime.outputs.root }}/evidence/run/result.json
          PROCESS_EXIT: ${{ steps.experiment.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$PROCESS_EXIT" = "0"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text())
          assert result["status"] == "evaluated-real-query-portfolios"
          assert result["inventory"]["accepted_recording_count"] >= 80
          aggregate = result["aggregate"]
          assert aggregate["maximum_relative_gain_error"] <= 1e-7
          assert aggregate["maximum_relative_posterior_covariance_error"] <= 1e-7
          assert aggregate["all_exact_posteriors_valid"] is True
          assert aggregate["all_spectral_posteriors_valid"] is True
          PY
