name: Proof4D strict typing fix once

on:
  push:
    branches:
      - science/proof-carrying-factors-v1
    paths:
      - protocols/execution_requests/proof4d_typing_fix_once.trigger

permissions:
  contents: write

concurrency:
  group: proof4d-strict-typing-fix-once
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact Proof4D branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/proof-carrying-factors-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Apply narrow typing corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          producer_path = Path("src/prob4d/proof_carrying_factor.py")
          producer = producer_path.read_text(encoding="utf-8")
          old = producer
          producer = producer.replace(
              "import json\nimport re\n",
              "import json\nimport re\nimport sys\nfrom numbers import Real\n",
              1,
          )
          producer = producer.replace(
              "from typing import Any, TypeAlias\n",
              "from typing import Any, TypeAlias, cast\n",
              1,
          )
          producer = producer.replace(
              "def _unit_interval(value: object, *, name: str) -> float:\n"
              "    numeric = float(value)\n"
              "    if not np.isfinite(numeric) or not 0.0 <= numeric <= 1.0:\n"
              "        raise ValueError(f\"{name} must lie in [0, 1]\")\n"
              "    return numeric\n",
              "def _unit_interval(value: object, *, name: str) -> float:\n"
              "    if isinstance(value, bool) or not isinstance(value, Real):\n"
              "        raise TypeError(f\"{name} must be a real number\")\n"
              "    numeric = float(cast(Any, value))\n"
              "    if not np.isfinite(numeric) or not 0.0 <= numeric <= 1.0:\n"
              "        raise ValueError(f\"{name} must lie in [0, 1]\")\n"
              "    return numeric\n",
              1,
          )
          replacements = producer.count("np.finfo(np.float64).tiny")
          if replacements != 1:
              raise SystemExit(
                  f"expected one producer float64-tiny expression, found {replacements}"
              )
          producer = producer.replace(
              "np.finfo(np.float64).tiny",
              "sys.float_info.min",
          )
          if producer == old:
              raise SystemExit("producer patch made no change")
          producer_path.write_text(producer, encoding="utf-8")

          verifier_path = Path("src/prob4d_independent_verifier/proof_carrying.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          old = verifier
          verifier = verifier.replace(
              "import json\nimport re\n",
              "import json\nimport re\nimport sys\n",
              1,
          )
          replacements = verifier.count("np.finfo(np.float64).tiny")
          if replacements != 3:
              raise SystemExit(
                  f"expected three verifier float64-tiny expressions, found {replacements}"
              )
          verifier = verifier.replace(
              "np.finfo(np.float64).tiny",
              "sys.float_info.min",
          )
          if verifier == old:
              raise SystemExit("verifier patch made no change")
          verifier_path.write_text(verifier, encoding="utf-8")

          workflow_path = Path(".github/workflows/proof-carrying-factor.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old = workflow
          matrix_expression = "$" + "{{ matrix.python }}"
          needle = (
              "          python -m mypy \\\n"
              "            --config-file pyproject.toml \\\n"
          )
          replacement = (
              "          python -m mypy \\\n"
              "            --config-file pyproject.toml \\\n"
              f"            --python-version \"{matrix_expression}\" \\\n"
          )
          if workflow.count(needle) != 1:
              raise SystemExit("mypy workflow command was not found exactly once")
          workflow = workflow.replace(needle, replacement, 1)
          if workflow == old:
              raise SystemExit("workflow patch made no change")
          workflow_path.write_text(workflow, encoding="utf-8")
          PY
      - name: Validate strict Python 3.10 typing and behavior before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          files=(
            src/prob4d/proof_carrying_factor.py
            src/prob4d_independent_verifier/proof_carrying.py
            scripts/generate_proof_carrying_factor_examples.py
            tests/test_proof_carrying_factor.py
            tests/test_proof_carrying_factor_full_rank.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            --config-file pyproject.toml \
            --python-version 3.10 \
            src/prob4d/proof_carrying_factor.py \
            src/prob4d_independent_verifier/proof_carrying.py
          python scripts/generate_proof_carrying_factor_examples.py --check
          python -m pytest -q \
            tests/test_proof_carrying_factor.py \
            tests/test_proof_carrying_factor_full_rank.py
      - name: Remove this temporary workflow and trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/proof4d-typing-fix-once.yml \
            protocols/execution_requests/proof4d_typing_fix_once.trigger
      - name: Commit the validated strict-typing correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/proof-carrying-factor.yml \
            src/prob4d/proof_carrying_factor.py \
            src/prob4d_independent_verifier/proof_carrying.py
          git commit -m "Fix strict typing across the Proof4D Python matrix"
          git push origin HEAD:science/proof-carrying-factors-v1
