name: DOT rope query-selective source support v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dot-rope-query-selective-source-support-v2.yml"
      - ".github/workflows/dot-rope-query-selective-source-support-v2-execute.yml"
      - "protocols/dot-rope-query-selective-source-support-v2.json"
      - "scripts/science/run_dot_rope_query_selective_source_support_v2.py"
      - "tests/test_dot_rope_query_selective_source_support_v2.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
      - "docs/dot-rope-query-selective-source-support-v2.md"
      - "CHANGELOG.d/dot-rope-query-selective-source-support-v2.md"

permissions:
  contents: read

concurrency:
  group: dot-rope-query-selective-source-support-v2-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate reviewed source-support control plane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate source-support contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            scripts/science/run_dot_rope_query_selective_source_support_v2.py \
            tests/test_dot_rope_query_selective_source_support_v2.py
          python -m pytest -q \
            tests/test_dot_rope_query_selective_source_support_v2.py \
            tests/test_github_action_pins.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m compileall -q \
            scripts/science/run_dot_rope_query_selective_source_support_v2.py
