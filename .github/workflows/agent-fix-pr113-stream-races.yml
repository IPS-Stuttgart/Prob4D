name: Agent fix PR 113 stream races

on:
  push:
    branches:
      - agent/harden-factor-stream-contract
    paths:
      - .github/workflows/agent-fix-pr113-stream-races.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-factor-stream-contract
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Bind bundle bytes and serialize stream writers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/prob4d/observation_factor_stream.py')
          text = source.read_text(encoding='utf-8')
          text = text.replace(
              'import tempfile\nfrom collections.abc import Mapping\n',
              'import tempfile\nfrom collections.abc import Iterator, Mapping\nfrom contextlib import contextmanager\n',
              1,
          )
          marker = '''def _require_nonnegative_integer(value: object, *, name: str) -> int:
              return require_exact_integer(value, name=name, minimum=0)
          '''
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          addition = '''def _load_json_object_bytes(content: bytes, *, name: str) -> dict[str, Any]:
              def object_pairs(pairs: list[tuple[str, Any]]) -> dict[str, Any]:
                  result: dict[str, Any] = {}
                  for key, item in pairs:
                      if key in result:
                          raise ValueError(
                              f"{name} contains duplicate JSON object key {key!r}"
                          )
                      result[key] = item
                  return result

              def reject_constant(token: str) -> Any:
                  raise ValueError(
                      f"{name} contains non-finite JSON number {token!r}"
                  )

              try:
                  value = json.loads(
                      content.decode("utf-8"),
                      object_pairs_hook=object_pairs,
                      parse_constant=reject_constant,
                  )
              except UnicodeDecodeError as error:
                  raise ValueError(f"{name} must contain valid UTF-8 JSON") from error
              except json.JSONDecodeError as error:
                  raise ValueError(f"{name} must contain valid JSON") from error
              if not isinstance(value, dict):
                  raise ValueError(f"{name} must contain one JSON object")
              return value


          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          if marker not in text:
              raise SystemExit('JSON helper insertion marker changed')
          text = text.replace(marker, addition + marker, 1)

          text = text.replace(
              '    admitted_frame_start: int,\n',
              '    admitted_frame_start: int | None,\n',
              1,
          )
          old = '''    record = load_json_object(manifest, name="observation-factor bundle manifest")
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    try:
              manifest_bytes = manifest.read_bytes()
          except OSError as error:
              raise ValueError("cannot read observation-factor bundle manifest") from error
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          record = _load_json_object_bytes(
              manifest_bytes,
              name="observation-factor bundle manifest",
          )
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('bundle manifest load marker changed')
          text = text.replace(old, new, 1)

          old = '''    if _sha256_file(payload_path) != payload_sha:
              raise ValueError("observation-factor payload checksum mismatch")

              bundle = load_observation_factor_bundle(manifest)
              frame_indices = [factor.frame_index for factor in bundle.factors]
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    try:
              payload_bytes = payload_path.read_bytes()
          except OSError as error:
              raise ValueError("cannot read observation-factor payload") from error
          if hashlib.sha256(payload_bytes).hexdigest() != payload_sha:
              raise ValueError("observation-factor payload checksum mismatch")

          with tempfile.TemporaryDirectory(
              prefix="prob4d-factor-bundle-snapshot-"
          ) as snapshot_name:
              snapshot_root = Path(snapshot_name)
              snapshot_manifest = snapshot_root / manifest.name
              snapshot_payload = snapshot_root / Path(
                  *PurePosixPath(payload_relative).parts
              )
              snapshot_payload.parent.mkdir(parents=True, exist_ok=True)
              snapshot_manifest.write_bytes(manifest_bytes)
              snapshot_payload.write_bytes(payload_bytes)
              bundle = load_observation_factor_bundle(snapshot_manifest)
          frame_indices = [factor.frame_index for factor in bundle.factors]
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('payload snapshot marker changed')
          text = text.replace(old, new, 1)

          old = '''    if not frame_indices:
              raise ValueError("stream updates require at least one factor")
              if min(frame_indices) < admitted_frame_start:
                  raise ValueError("stream update reintroduces an already admitted frame")
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    if not frame_indices:
              raise ValueError("stream updates require at least one factor")
          effective_start = (
              min(frame_indices)
              if admitted_frame_start is None
              else admitted_frame_start
          )
          if min(frame_indices) < effective_start:
              raise ValueError("stream update reintroduces an already admitted frame")
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('effective start marker changed')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        admitted_frame_start=admitted_frame_start,\n',
              '        admitted_frame_start=effective_start,\n',
              1,
          )
          text = text.replace(
              '        bundle_manifest_sha256=_sha256_file(manifest),\n',
              '        bundle_manifest_sha256=manifest_sha,\n',
              1,
          )

          old = '''    if stream is None:
              update_index = 0
              previous_update_id = None
              if admitted_frame_start is None:
                  preview = load_observation_factor_bundle(manifest)
                  admitted_start = min(factor.frame_index for factor in preview.factors)
              else:
                  admitted_start = _require_nonnegative_integer(
                      admitted_frame_start,
                      name="admitted_frame_start",
                  )
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    if stream is None:
              update_index = 0
              previous_update_id = None
              admitted_start = (
                  None
                  if admitted_frame_start is None
                  else _require_nonnegative_integer(
                      admitted_frame_start,
                      name="admitted_frame_start",
                  )
              )
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('preview removal marker changed')
          text = text.replace(old, new, 1)

          marker = '''def write_observation_factor_stream(
              stream: ObservationFactorStreamV1,
              path: str | Path,
          ) -> Path:
          '''
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines())
          helper = '''@contextmanager
          def _exclusive_stream_writer(output: Path) -> Iterator[None]:
              lock = output.with_name(f".{output.name}.lock")
              try:
                  descriptor = os.open(
                      lock,
                      os.O_CREAT | os.O_EXCL | os.O_WRONLY,
                      0o600,
                  )
              except FileExistsError as error:
                  raise FileExistsError(
                      f"observation-factor stream is being written: {output}"
                  ) from error
              try:
                  with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                      handle.write(f"pid={os.getpid()}\\n")
                      handle.flush()
                      os.fsync(handle.fileno())
                  yield
              finally:
                  lock.unlink(missing_ok=True)


          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          if marker not in text:
              raise SystemExit('writer helper marker changed')
          text = text.replace(marker, helper + marker, 1)

          start = text.index('def write_observation_factor_stream(')
          end = text.index('\n\ndef load_observation_factor_stream(', start)
          old_writer = text[start:end]
          new_writer = '''def write_observation_factor_stream(
              stream: ObservationFactorStreamV1,
              path: str | Path,
          ) -> Path:
              """Atomically persist an idempotent append-only stream manifest."""

              output = Path(path)
              output.parent.mkdir(parents=True, exist_ok=True)
              serialized = (
                  json.dumps(
                      stream.to_record(),
                      indent=2,
                      sort_keys=True,
                      allow_nan=False,
                  )
                  + "\\n"
              )
              with _exclusive_stream_writer(output):
                  if output.exists():
                      existing = load_observation_factor_stream(
                          output,
                          validate_bundles=False,
                      )
                      _require_append_only_rewrite(existing, stream)

                  descriptor, temporary_name = tempfile.mkstemp(
                      prefix=f".{output.name}.",
                      suffix=".tmp",
                      dir=output.parent,
                      text=True,
                  )
                  temporary = Path(temporary_name)
                  try:
                      with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                          handle.write(serialized)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temporary, output)
                  finally:
                      temporary.unlink(missing_ok=True)
              return output
          '''
          new_writer = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_writer.splitlines())
          text = text[:start] + new_writer + text[end:]
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/test_observation_factor_stream_strict.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_rejects_duplicate_json_keys(tmp_path: Path) -> None:\n'
          addition = '''def test_persistence_fails_closed_when_writer_lock_exists(
              tmp_path: Path,
          ) -> None:
              path = tmp_path / "stream.json"
              lock = tmp_path / ".stream.json.lock"
              lock.write_text("busy\\n", encoding="utf-8")

              with pytest.raises(FileExistsError, match="being written"):
                  write_observation_factor_stream(_stream(), path)

              assert not path.exists()
              assert lock.read_text(encoding="utf-8") == "busy\\n"


          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          if marker not in text:
              raise SystemExit('lock test insertion marker changed')
          text = text.replace(marker, addition + marker, 1)
          tests.write_text(text, encoding='utf-8')

          docs = Path('docs/observation-factor-stream.md')
          text = docs.read_text(encoding='utf-8')
          old = '''`write_observation_factor_stream` uses a unique temporary file, flushes and
          synchronizes the complete bytes, and atomically replaces the manifest. When a
          manifest already exists, the replacement must be either byte-semantically
          idempotent or a strict extension of the existing update chain. Rewriting a
          persisted stream with changed identifiers or metadata, truncating updates, or
          forking any existing update is rejected.
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''Bundle manifests and NPZ payloads are read once and validated from a private
          exact-byte snapshot, so retained hashes describe the bytes actually parsed.
          `write_observation_factor_stream` serializes writers with an exclusive
          same-directory lock, uses a unique temporary file, flushes the complete bytes,
          and atomically replaces the manifest. When a manifest already exists, the
          replacement must be either byte-semantically idempotent or a strict extension
          of the existing update chain. Rewriting a persisted stream with changed
          identifiers or metadata, truncating updates, or forking any existing update is
          rejected.
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('documentation marker changed')
          docs.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m ruff check \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m mypy src/prob4d/observation_factor_stream.py
          python -m pytest -q \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py \
            tests/test_observation_factor_stream.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/observation-factor-stream.md \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          git commit -m 'Serialize stream persistence and bind exact bytes'
          git push origin HEAD:agent/harden-factor-stream-contract
