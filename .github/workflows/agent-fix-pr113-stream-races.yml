name: Agent fix PR 113 stream races

on:
  push:
    branches:
      - agent/harden-factor-stream-contract
    paths:
      - .github/workflows/agent-fix-pr113-stream-races.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-factor-stream-contract
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Bind bundle bytes and serialize stream writers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).lstrip("\n")

          def replace_once(text: str, old: str, new: str, *, marker: str) -> str:
              if old not in text:
                  raise SystemExit(f"repair marker changed: {marker}")
              return text.replace(old, new, 1)

          source = Path("src/prob4d/observation_factor_stream.py")
          text = source.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "import tempfile\nfrom collections.abc import Mapping\n",
              "import tempfile\nfrom collections.abc import Iterator, Mapping\n"
              "from contextlib import contextmanager\n",
              marker="imports",
          )

          helper_marker = block(
              '''
              def _require_nonnegative_integer(value: object, *, name: str) -> int:
                  return require_exact_integer(value, name=name, minimum=0)
              '''
          )
          helper = block(
              '''
              def _load_json_object_bytes(content: bytes, *, name: str) -> dict[str, Any]:
                  def object_pairs(pairs: list[tuple[str, Any]]) -> dict[str, Any]:
                      result: dict[str, Any] = {}
                      for key, item in pairs:
                          if key in result:
                              raise ValueError(
                                  f"{name} contains duplicate JSON object key {key!r}"
                              )
                          result[key] = item
                      return result

                  def reject_constant(token: str) -> Any:
                      raise ValueError(
                          f"{name} contains non-finite JSON number {token!r}"
                      )

                  try:
                      value = json.loads(
                          content.decode("utf-8"),
                          object_pairs_hook=object_pairs,
                          parse_constant=reject_constant,
                      )
                  except UnicodeDecodeError as error:
                      raise ValueError(
                          f"{name} must contain valid UTF-8 JSON"
                      ) from error
                  except json.JSONDecodeError as error:
                      raise ValueError(f"{name} must contain valid JSON") from error
                  if not isinstance(value, dict):
                      raise ValueError(f"{name} must contain one JSON object")
                  return value


              '''
          )
          text = replace_once(
              text,
              helper_marker,
              helper + helper_marker,
              marker="strict JSON helper",
          )
          text = replace_once(
              text,
              "    admitted_frame_start: int,\n",
              "    admitted_frame_start: int | None,\n",
              marker="optional admitted start",
          )
          text = replace_once(
              text,
              '    record = load_json_object(\n'
              '        manifest, name="observation-factor bundle manifest"\n'
              '    )\n',
              block(
                  '''
                      try:
                          manifest_bytes = manifest.read_bytes()
                      except OSError as error:
                          raise ValueError(
                              "cannot read observation-factor bundle manifest"
                          ) from error
                      manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
                      record = _load_json_object_bytes(
                          manifest_bytes,
                          name="observation-factor bundle manifest",
                      )
                  '''
              ),
              marker="manifest exact bytes",
          )
          text = replace_once(
              text,
              block(
                  '''
                      if _sha256_file(payload_path) != payload_sha:
                          raise ValueError("observation-factor payload checksum mismatch")

                      bundle = load_observation_factor_bundle(manifest)
                      frame_indices = [factor.frame_index for factor in bundle.factors]
                  '''
              ),
              block(
                  '''
                      try:
                          payload_bytes = payload_path.read_bytes()
                      except OSError as error:
                          raise ValueError(
                              "cannot read observation-factor payload"
                          ) from error
                      if hashlib.sha256(payload_bytes).hexdigest() != payload_sha:
                          raise ValueError("observation-factor payload checksum mismatch")

                      with tempfile.TemporaryDirectory(
                          prefix="prob4d-factor-bundle-snapshot-"
                      ) as snapshot_name:
                          snapshot_root = Path(snapshot_name)
                          snapshot_manifest = snapshot_root / manifest.name
                          snapshot_payload = snapshot_root / Path(
                              *PurePosixPath(payload_relative).parts
                          )
                          snapshot_payload.parent.mkdir(parents=True, exist_ok=True)
                          snapshot_manifest.write_bytes(manifest_bytes)
                          snapshot_payload.write_bytes(payload_bytes)
                          bundle = load_observation_factor_bundle(snapshot_manifest)
                      frame_indices = [factor.frame_index for factor in bundle.factors]
                  '''
              ),
              marker="payload exact bytes",
          )
          text = replace_once(
              text,
              block(
                  '''
                      if not frame_indices:
                          raise ValueError("stream updates require at least one factor")
                      if min(frame_indices) < admitted_frame_start:
                          raise ValueError("stream update reintroduces an already admitted frame")
                  '''
              ),
              block(
                  '''
                      if not frame_indices:
                          raise ValueError("stream updates require at least one factor")
                      effective_start = (
                          min(frame_indices)
                          if admitted_frame_start is None
                          else admitted_frame_start
                      )
                      if min(frame_indices) < effective_start:
                          raise ValueError("stream update reintroduces an already admitted frame")
                  '''
              ),
              marker="effective first interval start",
          )
          text = replace_once(
              text,
              "        admitted_frame_start=admitted_frame_start,\n",
              "        admitted_frame_start=effective_start,\n",
              marker="retained admitted start",
          )
          text = replace_once(
              text,
              "        bundle_manifest_sha256=_sha256_file(manifest),\n",
              "        bundle_manifest_sha256=manifest_sha,\n",
              marker="retained manifest hash",
          )
          text = replace_once(
              text,
              block(
                  '''
                      if stream is None:
                          update_index = 0
                          previous_update_id = None
                          if admitted_frame_start is None:
                              preview = load_observation_factor_bundle(manifest)
                              admitted_start = min(factor.frame_index for factor in preview.factors)
                          else:
                              admitted_start = _require_nonnegative_integer(
                                  admitted_frame_start,
                                  name="admitted_frame_start",
                              )
                  '''
              ),
              block(
                  '''
                      if stream is None:
                          update_index = 0
                          previous_update_id = None
                          admitted_start = (
                              None
                              if admitted_frame_start is None
                              else _require_nonnegative_integer(
                                  admitted_frame_start,
                                  name="admitted_frame_start",
                              )
                          )
                  '''
              ),
              marker="remove preview reopen",
          )

          writer_start = text.index("def write_observation_factor_stream(")
          writer_end = text.index("\n\ndef load_observation_factor_stream(", writer_start)
          lock_helper = block(
              '''
              @contextmanager
              def _exclusive_stream_writer(output: Path) -> Iterator[None]:
                  lock = output.with_name(f".{output.name}.lock")
                  try:
                      descriptor = os.open(
                          lock,
                          os.O_CREAT | os.O_EXCL | os.O_WRONLY,
                          0o600,
                      )
                  except FileExistsError as error:
                      raise FileExistsError(
                          f"observation-factor stream is being written: {output}"
                      ) from error
                  try:
                      with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                          handle.write(f"pid={os.getpid()}\\n")
                          handle.flush()
                          os.fsync(handle.fileno())
                      yield
                  finally:
                      lock.unlink(missing_ok=True)


              '''
          )
          writer = block(
              '''
              def write_observation_factor_stream(
                  stream: ObservationFactorStreamV1,
                  path: str | Path,
              ) -> Path:
                  """Atomically persist an idempotent append-only stream manifest."""

                  output = Path(path)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  serialized = (
                      json.dumps(
                          stream.to_record(),
                          indent=2,
                          sort_keys=True,
                          allow_nan=False,
                      )
                      + "\\n"
                  )
                  with _exclusive_stream_writer(output):
                      if output.exists():
                          existing = load_observation_factor_stream(
                              output,
                              validate_bundles=False,
                          )
                          _require_append_only_rewrite(existing, stream)

                      descriptor, temporary_name = tempfile.mkstemp(
                          prefix=f".{output.name}.",
                          suffix=".tmp",
                          dir=output.parent,
                          text=True,
                      )
                      temporary = Path(temporary_name)
                      try:
                          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                              handle.write(serialized)
                              handle.flush()
                              os.fsync(handle.fileno())
                          os.replace(temporary, output)
                      finally:
                          temporary.unlink(missing_ok=True)
                  return output
              '''
          )
          text = text[:writer_start] + lock_helper + writer + text[writer_end:]
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/test_observation_factor_stream_strict.py")
          test_text = tests.read_text(encoding="utf-8")
          test_marker = "def test_rejects_duplicate_json_keys(tmp_path: Path) -> None:\n"
          lock_test = block(
              '''
              def test_persistence_fails_closed_when_writer_lock_exists(
                  tmp_path: Path,
              ) -> None:
                  path = tmp_path / "stream.json"
                  lock = tmp_path / ".stream.json.lock"
                  lock.write_text("busy\\n", encoding="utf-8")

                  with pytest.raises(FileExistsError, match="being written"):
                      write_observation_factor_stream(_stream(), path)

                  assert not path.exists()
                  assert lock.read_text(encoding="utf-8") == "busy\\n"


              '''
          )
          test_text = replace_once(
              test_text,
              test_marker,
              lock_test + test_marker,
              marker="writer lock regression",
          )
          tests.write_text(test_text, encoding="utf-8")
          PY
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m ruff check \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m mypy src/prob4d/observation_factor_stream.py
          python -m pytest -q \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py \
            tests/test_observation_factor_stream.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          git commit -m 'Serialize stream persistence and bind exact bytes'
          git push origin HEAD:agent/harden-factor-stream-contract
