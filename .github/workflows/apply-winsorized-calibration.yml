name: Apply winsorized calibration semantics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-winsorized-calibration.yml"
      - ".github/patches/winsorized-calibration.patch.gz.b64"
  push:
    branches:
      - agent/name-winsorized-calibration-semantics

permissions:
  contents: write

concurrency:
  group: apply-winsorized-calibration-semantics
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/name-winsorized-calibration-semantics
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '827d432b053aa14c2e5bfa3aadcf18ff16f4c5ecf38994e87537528ffea78175  .github/patches/winsorized-calibration.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode .github/patches/winsorized-calibration.patch.gz.b64 \
            | gzip --decompress > /tmp/winsorized-calibration.patch
          echo '29a755cb76e6c26d595d1ae04d2d64b1daf9925c176fe7a6dc6a93eec3c319ee  /tmp/winsorized-calibration.patch' \
            | sha256sum --check --strict
          patch --dry-run -p1 < /tmp/winsorized-calibration.patch
          patch -p1 < /tmp/winsorized-calibration.patch

      - name: Remove one-shot staging files
        shell: bash
        run: |
          rm .github/patches/winsorized-calibration.patch.gz.b64
          rm .github/workflows/apply-winsorized-calibration.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Install development environment
        run: python -m pip install -e '.[dev]'

      - name: Normalize and validate changed Python files
        shell: bash
        run: |
          set -euo pipefail
          changed=(
            src/prob4d/__init__.py
            src/prob4d/_gauge_calibration.py
            src/prob4d/_point_calibration.py
            src/prob4d/calibration.py
            src/prob4d/calibration_aggregation.py
            src/prob4d/gauge.py
            src/prob4d/group_balanced_point_calibration.py
            src/prob4d/uncertainty.py
            tests/test_calibration_aggregation.py
            tests/test_group_balanced_point_calibration.py
            tests/test_uncertainty.py
          )
          python -m ruff check --fix "${changed[@]}"
          python -m ruff check "${changed[@]}"
          python -m pytest

      - name: Commit and push implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Name winsorized calibration semantics explicitly'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/name-winsorized-calibration-semantics
