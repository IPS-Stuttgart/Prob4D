name: Retry repair PR 94

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/retry-repair-pr94.yml]

permissions:
  contents: write

concurrency:
  group: repair-pr94
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-tracklet-association-contracts'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-tracklet-association-contracts
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Configure repair identity and refresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Execute reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/hosted-repair-pr94.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '          PY\n      - name: Validate focused contracts'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, str(workflow_path), 'exec'))

          source_path = Path('src/prob4d/causal_tracklets.py')
          source = source_path.read_text(encoding='utf-8')
          replacements = (
              (
                  '        expected_tracks = np.arange(len(unique_tracks), dtype=np.int64)\n',
                  '        expected_tracks: IntArray = np.arange(\n'
                  '            len(unique_tracks), dtype=np.int64\n'
                  '        )\n',
              ),
              (
                  '        result = np.ones(self.observation_count, dtype=np.float64)\n',
                  '        result: FloatArray = np.ones(\n'
                  '            self.observation_count, dtype=np.float64\n'
                  '        )\n',
              ),
              (
                  '            link_logs = np.full(len(links), -np.inf, dtype=np.float64)\n',
                  '            link_logs: FloatArray = np.full(\n'
                  '                len(links), -np.inf, dtype=np.float64\n'
                  '            )\n',
              ),
              (
                  '        reliability_grid = np.ones(tracklets.source_shape, dtype=np.float64)\n',
                  '        reliability_grid: FloatArray = np.ones(\n'
                  '            tracklets.source_shape, dtype=np.float64\n'
                  '        )\n',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(
                      f'expected one typed repair target, found {source.count(old)}: {old!r}'
                  )
              source = source.replace(old, new)
          source_path.write_text(source, encoding='utf-8')
          PY
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m mypy \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m pytest -q \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Publish ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/causal-tracklets.md \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --cached --check
          git commit -m 'Harden tracklet seeds and add length-neutral support'
          git push origin HEAD:agent/harden-tracklet-association-contracts
