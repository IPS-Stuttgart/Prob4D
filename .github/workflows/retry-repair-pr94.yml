name: Retry repair PR 94

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/retry-repair-pr94.yml"
      - ".github/scripts/repair_pr94_source.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr94
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/harden-tracklet-association-contracts')
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-tracklet-association-contracts
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Configure repair identity and refresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply reviewed source repair
        run: python .github/scripts/repair_pr94_source.py
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            .github/scripts/repair_pr94_source.py \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m ruff format --check \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m mypy \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m pytest -q \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Publish ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/causal-tracklets.md \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --cached --check
          git commit -m 'Harden tracklet seeds and add length-neutral support'
          git push origin HEAD:agent/harden-tracklet-association-contracts
