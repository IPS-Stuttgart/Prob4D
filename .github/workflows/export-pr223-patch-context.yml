name: Apply PR 223 capsule v2 compatibility fix

on:
  push:
    branches:
      - release/prob4d-0.5.0-cleanup
    paths:
      - ".github/workflows/export-pr223-patch-context.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/prob4d-0.5.0-cleanup
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Align capsule validator and fixtures with manifest v2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/ci/build_ecosystem_release_capsule.py")
          text = script_path.read_text(encoding="utf-8")
          start = text.index(
              "def _validate_public_api_manifest(value: Any) -> dict[str, Any]:\n"
          )
          end = text.index(
              "\n\ndef _validate_run_manifest(value: Any) -> dict[str, Any]:\n",
              start,
          )
          replacement = '''def _validate_public_api_manifest(value: Any) -> dict[str, Any]:
              manifest = _strict_mapping(value, name="public API manifest")
              _exact_keys(
                  manifest,
                  {"schema", "schema_version", "package", "surfaces", "claim_boundary", "manifest_id"},
                  name="public API manifest",
              )
              if _strict_string(manifest["schema"], name="public API schema") != _PUBLIC_API_SCHEMA:
                  raise ValueError("public API manifest schema changed")
              if (
                  _strict_integer(
                      manifest["schema_version"],
                      name="public API schema_version",
                      minimum=1,
                  )
                  != 2
              ):
                  raise ValueError("public API manifest schema changed")
              if manifest["claim_boundary"] != _PUBLIC_API_CLAIM_BOUNDARY:
                  raise ValueError("public API manifest claim boundary changed")

              package = _strict_mapping(manifest["package"], name="public API package")
              _exact_keys(package, {"name", "version", "project_id"}, name="public API package")
              if _strict_string(package["name"], name="public API package name") != "prob4d":
                  raise ValueError("public API manifest package identity changed")
              if (
                  _strict_string(
                      package["project_id"],
                      name="public API project identity",
                  )
                  != _PUBLIC_API_PROJECT_ID
              ):
                  raise ValueError("public API manifest package identity changed")
              _strict_string(package["version"], name="public API package version")

              surfaces = _strict_mapping(manifest["surfaces"], name="public API surfaces")
              _exact_keys(surfaces, {"package_root", "api_v2"}, name="public API surfaces")
              package_root = _strict_mapping(surfaces["package_root"], name="package root")
              api2 = _strict_mapping(surfaces["api_v2"], name="api_v2")
              _exact_keys(
                  package_root,
                  {"module", "surface_version", "loading", "exports"},
                  name="package root",
              )
              _exact_keys(
                  api2,
                  {
                      "module",
                      "api_version",
                      "provider_api_version",
                      "provider_factor_api_version",
                      "lifecycle",
                      "exports",
                  },
                  name="api_v2",
              )
              if (
                  _strict_string(package_root.get("module"), name="package root module") != "prob4d"
                  or _strict_integer(
                      package_root.get("surface_version"),
                      name="package root surface_version",
                      minimum=1,
                  )
                  != 2
                  or _strict_string(
                      package_root.get("loading"),
                      name="package root loading",
                  )
                  != "minimal-version-root-v1"
                  or package_root.get("exports") != ["__version__"]
              ):
                  raise ValueError("public API package-root semantics changed")
              if (
                  _strict_string(api2.get("module"), name="api_v2 module") != "prob4d.api.v2"
                  or _strict_integer(api2.get("api_version"), name="api_v2 version", minimum=1)
                  != 2
                  or _strict_string(api2.get("lifecycle"), name="api_v2 lifecycle") != "current"
              ):
                  raise ValueError("public API v2 semantics changed")
              if (
                  _strict_integer(
                      api2.get("provider_api_version"),
                      name="api_v2 provider version",
                      minimum=1,
                  )
                  != 2
                  or _strict_integer(
                      api2.get("provider_factor_api_version"),
                      name="api_v2 provider-factor version",
                      minimum=1,
                  )
                  != 2
              ):
                  raise ValueError("public API v2 provider versions changed")

              for surface_name, surface in surfaces.items():
                  exports = surface.get("exports")
                  if (
                      type(exports) is not list
                      or exports != sorted(exports)
                      or len(exports) != len(set(exports))
                  ):
                      raise ValueError(f"{surface_name} export inventory is not canonical")
                  if not exports or any(type(item) is not str or not item for item in exports):
                      raise ValueError(f"{surface_name} export inventory is invalid")
              _content_id(manifest, id_field="manifest_id", newline=True)
              return json.loads(_canonical_json(manifest, newline=False))
          '''
          replacement = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in replacement.splitlines()
          ) + "\n"
          script_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test_path = Path("tests/test_ecosystem_release_capsule.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace('"prob4d": "0.4.1",', '"prob4d": "0.5.0",')
          test = test.replace('"causal4d": "0.4.1",', '"causal4d": "0.5.0",')
          test = test.replace(
              "prob4d-0.4.1-py3-none-any.whl",
              "prob4d-0.5.0-py3-none-any.whl",
          )
          test = test.replace(
              "causal4d-0.4.1-py3-none-any.whl",
              "causal4d-0.5.0-py3-none-any.whl",
          )
          start = test.index("def _public_api_manifest() -> dict[str, Any]:\n")
          end = test.index(
              "\n\ndef _write_json(path: Path, payload: dict[str, Any]) -> None:\n",
              start,
          )
          fixture = '''def _public_api_manifest() -> dict[str, Any]:
              descriptor = {
                  "schema": "prob4d.public-api-manifest",
                  "schema_version": 2,
                  "package": {
                      "name": "prob4d",
                      "version": _PACKAGE_VERSIONS["prob4d"],
                      "project_id": "github-repository-id:1295794737",
                  },
                  "surfaces": {
                      "package_root": {
                          "module": "prob4d",
                          "surface_version": 2,
                          "loading": "minimal-version-root-v1",
                          "exports": ["__version__"],
                      },
                      "api_v2": {
                          "module": "prob4d.api.v2",
                          "api_version": 2,
                          "provider_api_version": 2,
                          "provider_factor_api_version": 2,
                          "lifecycle": "current",
                          "exports": ["API_VERSION"],
                      },
                  },
                  "claim_boundary": MODULE._PUBLIC_API_CLAIM_BOUNDARY,
              }
              return _content_addressed(descriptor, id_field="manifest_id", newline=True)
          '''
          fixture = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in fixture.splitlines()
          ) + "\n"
          test_path.write_text(test[:start] + fixture + test[end:], encoding="utf-8")
          PY

      - name: Validate the exact patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest ruff
          python -m ruff format \
            scripts/ci/build_ecosystem_release_capsule.py \
            tests/test_ecosystem_release_capsule.py
          python -m ruff check \
            scripts/ci/build_ecosystem_release_capsule.py \
            tests/test_ecosystem_release_capsule.py
          python -m pytest -q tests/test_ecosystem_release_capsule.py
          python -m py_compile scripts/ci/build_ecosystem_release_capsule.py

      - name: Commit the validated fix and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/export-pr223-patch-context.yml
          git add \
            scripts/ci/build_ecosystem_release_capsule.py \
            tests/test_ecosystem_release_capsule.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align ecosystem capsule with public API manifest v2"
          git push origin HEAD:release/prob4d-0.5.0-cleanup
