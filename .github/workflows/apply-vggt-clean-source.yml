name: Apply VGGT clean-source hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/patches/vggt-clean-source/**"
      - ".github/workflows/apply-vggt-clean-source.yml"

permissions:
  contents: write

concurrency:
  group: apply-vggt-clean-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply, format, and validate source hardening
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/vggt-provider-neutral-v1'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Isolate Python and install development tools
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-vggt-clean-source-venv"
          python -m venv --clear "$environment"
          "$environment/bin/python" -m ensurepip --upgrade
          "$environment/bin/python" -m pip install --upgrade pip
          echo "$environment/bin" >> "$GITHUB_PATH"

      - name: Apply the exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/vggt-clean-source/apply.py

      - name: Format and validate the modified boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          files=(
            src/prob4d/vggt_baseline.py
            tests/test_vggt_baseline.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m mypy --python-version 3.12 src/prob4d/vggt_baseline.py
          python -m pytest -q \
            tests/test_vggt_baseline.py \
            tests/test_vggt_provider_adapter.py
          python -m compileall -q src/prob4d
          git diff --check

      - name: Publish the validated hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/vggt_baseline.py \
            tests/test_vggt_baseline.py \
            docs/provider-neutral-predictions.md \
            .github/patches/vggt-clean-source/apply.py
          git diff --cached --check
          git commit -m "Require clean VGGT source and make resume verification lightweight"
          git push origin HEAD:agent/vggt-provider-neutral-v1
