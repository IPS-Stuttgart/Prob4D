name: One-shot PR 273 typing fix

on:
  push:
    branches:
      - agent/cut3r-source-competence-aggregation
    paths:
      - .github/workflows/pr-273-typing-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'Bootstrap PR #273 typing fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the exact type annotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/cut3r_source_competence.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "def _normalize_record(value: Any, *, index: int) -> dict[str, Any]:\n"
              "    record = _strict_mapping(value, name=f\"records[{index}]\")\n"
              "    _exact_keys(record, _RECORD_FIELDS, name=f\"records[{index}]\")\n"
              "    normalized = {\n"
          )
          new = old[:-len("normalized = {\n")] + "normalized: dict[str, Any] = {\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one _normalize_record dictionary declaration")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m compileall -q src/prob4d/cut3r_source_competence.py
          git diff --check
      - name: Commit the fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/prob4d/cut3r_source_competence.py
          git commit -m "Fix CUT3R source competence typing"
          git push origin HEAD:agent/cut3r-source-competence-aggregation
