name: Apply release formatting

on:
  push:
    branches:
      - release/prob4d-0.5.0-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply canonical formatting
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.16.2'
          python -m ruff format src/prob4d/command_registry.py scripts/ci/check_sdist.py

      - name: Commit formatted release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_release_format.yml
          git add src/prob4d/command_registry.py scripts/ci/check_sdist.py
          git commit -m "Apply canonical release formatting"
          git push origin HEAD:release/prob4d-0.5.0-cleanup
