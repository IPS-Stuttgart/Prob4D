name: Apply marginalized fixed-lag smoothing

on:
  push:
    branches: [agent/marginalized-fixed-lag]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-marginalized-fixed-lag
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/marginalized-fixed-lag
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Materialize and integrate the reviewed implementation
        shell: bash
        run: |
          cat .github/agent-staging/marginalized_gauge.b64.* | base64 --decode > marginalized_gauge.py.tmp
          echo "74bcbd44ff2e7859afa03ded8c5801982fefe077c49bcbcf5e94415336edd9c3  marginalized_gauge.py.tmp" | sha256sum --check
          mv marginalized_gauge.py.tmp src/prob4d/marginalized_gauge.py
          python .github/agent-staging/apply_marginalized_fixed_lag.py
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests 2>&1 | tee ruff-output.txt
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: marginalized-fixed-lag-ruff
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail on Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Type-check stable provider interfaces
        run: >-
          python -m mypy
          src/prob4d/cli.py
          src/prob4d/provider_manifest.py
          src/prob4d/provider_manifest_cli.py
          src/prob4d/provider_v1.py
      - name: Run fixed-lag tests
        run: >-
          python -m pytest
          tests/test_marginalized_fixed_lag.py
          tests/test_marginalized_fixed_lag_validation.py
          tests/test_observation_export.py
          tests/test_provider_v1.py
          --tb=short
      - name: Run complete suite
        run: python -m pytest --tb=short
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Publish the validated implementation and remove staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -r .github/agent-staging .github/workflows/agent-apply-marginalized-fixed-lag.yml
          git commit -m "Preserve fixed-lag boundary uncertainty by marginalization"
          git push origin HEAD:agent/marginalized-fixed-lag
