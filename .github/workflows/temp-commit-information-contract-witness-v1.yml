name: Temporary commit information-contract witness v1

on:
  push:
    branches: [science/information-contract-falsification-witness-v1]
    paths:
      - "tools/tmp/information-contract-witness-v1.commit.json"

permissions:
  contents: write

concurrency:
  group: commit-information-contract-witness-v1
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact carrier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and extract reviewed carrier
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/information-contract-witness-v1"
          rm -rf "${work}"
          mkdir -p "${work}/extract"
          cat tools/tmp/information-contract-witness-v1.part-* \
            | base64 --decode > "${work}/payload.tar.gz"
          echo "3b42cdbcbd752f9c0f55d2470fffcccd2d06f15d26ddce48ac49d736a2f1c0fe  ${work}/payload.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${work}/payload.tar.gz" -C "${work}/extract"
          (
            cd "${work}/extract"
            sha256sum --check --strict SHA256SUMS
          )
          cp "${work}/extract/payload/benchmarks/information_contract_v1/STATUS.md" \
            benchmarks/information_contract_v1/STATUS.md
          cp "${work}/extract/payload/docs/information-contract-falsification-witnesses.md" \
            docs/information-contract-falsification-witnesses.md
          cp "${work}/extract/payload/src/prob4d/information_contract_witness.py" \
            src/prob4d/information_contract_witness.py
          cp "${work}/extract/payload/src/prob4d/information_contract_witness_smoke.py" \
            src/prob4d/information_contract_witness_smoke.py
          cp "${work}/extract/payload/tests/test_information_contract_witness.py" \
            tests/test_information_contract_witness.py

      - name: Validate and normalize the durable source files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            src/prob4d/information_contract_witness.py
            src/prob4d/information_contract_witness_smoke.py
            tests/test_information_contract_witness.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m pytest -q \
            tests/test_information_contract_benchmark.py \
            tests/test_information_contract_sealed.py \
            tests/test_information_contract_witness.py
          root="${RUNNER_TEMP}/witness-control"
          python -m prob4d.information_contract_witness smoke "${root}"
          ROOT="${root}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          witness = json.loads((root / "witness.json").read_text())
          result = json.loads((root / "result.json").read_text())
          assert witness["query_vector"] == [1.0, 0.0, 0.0]
          assert witness["source_max_normalized_error_ratio"] == 10.0
          assert witness["held_outcomes_opened_during_selection"] is False
          assert result["target_query_reselection"] is False
          assert result["rankings"][
              "point_vs_query_calibration_ranking_reversal"
          ] is True
          PY

      - name: Commit only non-workflow durable files
        shell: bash
        run: |
          set -euo pipefail
          git add \
            benchmarks/information_contract_v1/STATUS.md \
            docs/information-contract-falsification-witnesses.md \
            src/prob4d/information_contract_witness.py \
            src/prob4d/information_contract_witness_smoke.py \
            tests/test_information_contract_witness.py
          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          expected=(
            benchmarks/information_contract_v1/STATUS.md
            docs/information-contract-falsification-witnesses.md
            src/prob4d/information_contract_witness.py
            src/prob4d/information_contract_witness_smoke.py
            tests/test_information_contract_witness.py
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${staged[$index]}" = "${expected[$index]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add source-selected information-contract witnesses"
          git push origin "HEAD:${GITHUB_REF_NAME}"
