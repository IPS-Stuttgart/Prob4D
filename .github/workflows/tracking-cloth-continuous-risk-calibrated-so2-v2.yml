name: Tracking Cloth continuous risk-calibrated SO2 v2

on:
  push:
    branches:
      - science/tracking-cloth-continuous-risk-calibrated-so2-v2
    paths:
      - ".github/workflows/tracking-cloth-continuous-risk-calibrated-so2-v2.yml"
      - "protocols/tracking-cloth-continuous-risk-calibrated-so2-v2.json"
      - "protocols/execution_requests/tracking_cloth_continuous_risk_calibrated_so2_v2.json"
      - "src/prob4d/group_advantage_calibration.py"
      - "scripts/science/run_tracking_cloth_continuous_risk_calibrated_so2_v2.py"
      - "tests/test_group_advantage_calibration.py"
      - "tests/test_tracking_cloth_continuous_risk_calibrated_so2_v2.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
      - "docs/continuous-axial-decision-risk-calibration.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-cloth-continuous-risk-calibrated-so2-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  PROTOCOL_PATH: protocols/tracking-cloth-continuous-risk-calibrated-so2-v2.json
  REQUEST_PATH: protocols/execution_requests/tracking_cloth_continuous_risk_calibrated_so2_v2.json
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  preflight:
    name: Validate continuous decision-risk capsule
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate immutable request and protocol identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return (
                  json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  )
                  + "\n"
              ).encode()

          protocol = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text())
          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          unsigned = dict(protocol)
          protocol_id = unsigned.pop("protocol_id")
          assert hashlib.sha256(canonical(unsigned)).hexdigest() == protocol_id
          assert protocol_id == "1e9d0a308417b0da1d0d6b9fc95e0f66caf99d37d4d9ef1e2f9f9c674417f040"
          assert request["schema"] == "prob4d.self-hosted-experiment-request.v1"
          assert request["protocol_id"] == protocol_id
          assert request["branch"] == "science/tracking-cloth-continuous-risk-calibrated-so2-v2"
          assert request["runner_labels"] == [
              "self-hosted",
              "Linux",
              "X64",
              "gpuserver4090",
          ]
          assert request["dataset_root"] == os.environ["DATASET_ROOT"]
          assert request["target_is_previously_opened_by_related_finite_orbit_study"] is True
          assert request["independent_confirmation"] is False
          assert request["target_side_threshold_tuning_allowed"] is False
          assert request["raw_data_publication_authorized"] is False
          assert request["learned_provider_promotion_authorized"] is False
          PY

      - name: Install pinned development package
        run: |
          python -m pip install "numpy==2.3.5"
          python -m pip install -e ".[dev]"

      - name: Focused tests, typing, lint, and compilation
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_axial_query_certificate.py \
            tests/test_continuous_axial_support.py \
            tests/test_group_advantage_calibration.py \
            tests/test_tracking_cloth_continuous_risk_calibrated_so2_v2.py
          python -m mypy src/prob4d/group_advantage_calibration.py
          python -m ruff check \
            src/prob4d/group_advantage_calibration.py \
            scripts/science/run_tracking_cloth_continuous_risk_calibrated_so2_v2.py \
            tests/test_group_advantage_calibration.py \
            tests/test_tracking_cloth_continuous_risk_calibrated_so2_v2.py
          python -m compileall -q \
            src/prob4d/group_advantage_calibration.py \
            scripts/science/run_tracking_cloth_continuous_risk_calibrated_so2_v2.py

  evaluate:
    name: Evaluate continuous decision risk on gpuserver4090
    needs: preflight
    if: >-
      github.actor == 'FlorianPfaff' &&
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref_name == 'science/tracking-cloth-continuous-risk-calibrated-so2-v2'
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Bind runner and complete dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -d "$DATASET_ROOT"
          count=$(find "$DATASET_ROOT" -type f -iname '*.csv' -printf '.' | wc -c)
          test "$count" -eq 120

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated pinned runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/tracking-cloth-continuous-risk-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf -- "$root"
          mkdir -p "$root"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install \
            --disable-pip-version-check "numpy==2.3.5"
          "$root/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps -e .
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "python=$root/venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Execute source-sealed collision-shift study
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.runtime.outputs.root }}"
          set +e
          PYTHONPATH=src "${{ steps.runtime.outputs.python }}" \
            scripts/science/run_tracking_cloth_continuous_risk_calibrated_so2_v2.py \
              --dataset-root "$DATASET_ROOT" \
              --protocol "$PROTOCOL_PATH" \
              --output-dir "$root/evidence" \
              --source-revision "$GITHUB_SHA" \
              > "$root/stdout.txt" 2> "$root/stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/process-exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reject accidental raw-data output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${{ steps.runtime.outputs.root }}/evidence"
          if find "$evidence" -type f \( -iname '*.csv' -o -iname '*.zip' \) \
            -print -quit | grep -q .; then
            echo "Raw dataset payload appeared in evidence" >&2
            exit 3
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-continuous-risk-calibrated-so2-v2-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime.outputs.root }}/evidence
            ${{ steps.runtime.outputs.root }}/stdout.txt
            ${{ steps.runtime.outputs.root }}/stderr.txt
            ${{ steps.runtime.outputs.root }}/process-exit-code.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish scientific summary
        if: always()
        shell: bash
        run: |
          summary="${{ steps.runtime.outputs.root }}/evidence/summary.md"
          if test -f "$summary"; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce terminal evidence and fail-closed invariants
        shell: bash
        env:
          RESULT_PATH: ${{ steps.runtime.outputs.root }}/evidence/result.json
          PROCESS_EXIT: ${{ steps.experiment.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$PROCESS_EXIT" = "0"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text())
          assert result["status"] in {
              "evaluated-continuous-risk-calibrated-so2-positive",
              "evaluated-continuous-risk-calibrated-so2-negative",
              "dataset-support-negative",
          }
          if result["status"] != "dataset-support-negative":
              assert result["evaluation_count"] == 224
              assert result["information_order"]["target_side_threshold_tuning_allowed"] is False
              assert result["information_order"]["independent_confirmation"] is False
              for row in result["aggregate"]["by_horizon"].values():
                  assert row["risk_exact_fallback_fraction"]["mean"] == 1.0
                  assert row["full_circle_acceptance"]["mean"] == 0.0
          PY
