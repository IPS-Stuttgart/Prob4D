name: Preflight retained CUT3R source comparison

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut3r-source-comparison-preflight.yml"
      - "CHANGELOG.d/cut3r-source-comparison-preflight.md"
      - "docs/cut3r-source-comparison-preflight.md"
      - "protocols/execution_requests/cut3r_deform360_source_comparison_preflight_v1.json"
      - "scripts/science/build_cut3r_source_comparison_preflight.py"
      - "tests/test_cut3r_source_comparison_preflight.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/cut3r_deform360_source_comparison_preflight_v1.json"

permissions:
  contents: read

concurrency:
  group: cut3r-source-comparison-preflight-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  REQUEST_PATH: protocols/execution_requests/cut3r_deform360_source_comparison_preflight_v1.json

jobs:
  contract:
    name: Hosted preflight contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate preflight implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            scripts/science/build_cut3r_source_comparison_preflight.py \
            tests/test_cut3r_source_comparison_preflight.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format --check \
            scripts/science/build_cut3r_source_comparison_preflight.py \
            tests/test_cut3r_source_comparison_preflight.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_source_comparison_preflight.py \
            tests/test_trusted_self_hosted_validation_policy.py \
            tests/test_github_action_pins.py
          python -m compileall -q \
            scripts/science/build_cut3r_source_comparison_preflight.py

  execute:
    name: Resolve retained source cases without opening outcomes
    if: github.event_name == 'push'
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.summary.outputs.artifact_name }}
      artifact_id: ${{ steps.summary.outputs.artifact_id }}
      decision: ${{ steps.summary.outputs.decision }}
      resolved_case_count: ${{ steps.summary.outputs.resolved_case_count }}
      resolved_group_count: ${{ steps.summary.outputs.resolved_group_count }}
      failure_count: ${{ steps.summary.outputs.failure_count }}
    steps:
      - name: Initialize isolated preflight workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-cut3r-source-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected="${RUNNER_TEMP}/prob4d-cut3r-source-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p "$root/evidence"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify retained inputs and run outcome-blind preflight
        id: preflight
        shell: bash
        env:
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: ${{ vars.DEFORM360_PROCESSED_ROOT }}
        run: |
          set -euo pipefail
          for name in CUT3R_CHECKOUT CUT3R_CHECKPOINT DEFORM360_PROCESSED_ROOT
          do
            value=${!name:-}
            if [[ -z "$value" ]]; then
              echo "Required retained-runner variable $name is unset" >&2
              exit 2
            fi
          done
          test -d "$CUT3R_CHECKOUT/.git"
          test -f "$CUT3R_CHECKPOINT"
          test -d "$DEFORM360_PROCESSED_ROOT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          output="${{ steps.workspace.outputs.root }}/evidence/preflight.json"
          set +e
          /usr/bin/python3 scripts/science/build_cut3r_source_comparison_preflight.py \
            --repository . \
            --request "$REQUEST_PATH" \
            --processed-root "$DEFORM360_PROCESSED_ROOT" \
            --cut3r-checkout "$CUT3R_CHECKOUT" \
            --checkpoint "$CUT3R_CHECKPOINT" \
            --output "$output" \
            > "${{ steps.workspace.outputs.root }}/preflight.stdout" \
            2> "${{ steps.workspace.outputs.root }}/preflight.stderr"
          status=$?
          set -e
          if [[ $status -ne 0 && $status -ne 3 ]]; then
            cat "${{ steps.workspace.outputs.root }}/preflight.stderr" >&2
            exit "$status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate and summarize retained preflight report
        id: summary
        shell: bash
        env:
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: ${{ vars.DEFORM360_PROCESSED_ROOT }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          REPORT="$root/evidence/preflight.json" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          false_fields = (
              "source_rgb_frames_decoded",
              "cut3r_inference_executed",
              "source_prediction_payloads_opened",
              "source_residuals_or_truth_opened",
              "candidate_reference_file_contents_opened",
              "target_payloads_opened",
              "target_outcomes_opened",
              "comparison_execution_authorized",
          )
          if any(report.get(name) is not False for name in false_fields):
              raise SystemExit("preflight exceeded its outcome-blind boundary")
          decision = report.get("decision")
          if decision not in {
              "source-comparison-preflight-ready",
              "technical-preflight-failure",
          }:
              raise SystemExit("preflight decision changed")
          if report.get("source_group_count") is not None:
              raise SystemExit("unexpected mutable source_group_count field")
          artifact_id = str(report.get("artifact_id", ""))
          if len(artifact_id) != 64:
              raise SystemExit("preflight artifact ID is invalid")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"artifact_id={artifact_id}\n")
              stream.write(f"decision={decision}\n")
              stream.write(
                  f"resolved_case_count={report['resolved_case_count']}\n"
              )
              stream.write(
                  f"resolved_group_count={report['resolved_group_count']}\n"
              )
              stream.write(f"failure_count={len(report['failures'])}\n")
              stream.write(
                  "artifact_name="
                  f"cut3r-source-comparison-preflight-{artifact_id[:12]}-"
                  f"{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}\n"
              )
          rows = []
          for path in sorted(report_path.parent.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(
                      f"{digest}  {path.relative_to(report_path.parent).as_posix()}"
                  )
          (report_path.parent / "SHA256SUMS").write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8",
          )
          PY
          grep -Fq '<CUT3R_CHECKOUT>' "$root/evidence/preflight.json" || true
          ! grep -Fq "$CUT3R_CHECKOUT" "$root/evidence/preflight.json"
          ! grep -Fq "$CUT3R_CHECKPOINT" "$root/evidence/preflight.json"
          ! grep -Fq "$DEFORM360_PROCESSED_ROOT" "$root/evidence/preflight.json"

      - name: Upload outcome-blind preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.summary.outputs.artifact_name }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated preflight workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          expected="${RUNNER_TEMP}/prob4d-cut3r-source-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/git reset --hard HEAD
          /usr/bin/git clean -ffdx

  report:
    name: Publish source-comparison preflight receipt
    if: always() && github.event_name == 'push'
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment retained preflight result on issue 49
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.execute.result }}
          DECISION: ${{ needs.execute.outputs.decision }}
          ARTIFACT_ID: ${{ needs.execute.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.execute.outputs.artifact_name }}
          CASES: ${{ needs.execute.outputs.resolved_case_count }}
          GROUPS: ${{ needs.execute.outputs.resolved_group_count }}
          FAILURES: ${{ needs.execute.outputs.failure_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          body = "\n".join(
              (
                  "## Retained CUT3R source-comparison preflight receipt",
                  "",
                  f"- workflow result: `{os.environ.get('RESULT') or 'unknown'}`",
                  f"- decision: `{os.environ.get('DECISION') or 'not-produced'}`",
                  f"- resolved cases: `{os.environ.get('CASES') or 'not-produced'}`",
                  f"- resolved groups: `{os.environ.get('GROUPS') or 'not-produced'}`",
                  f"- technical failures: `{os.environ.get('FAILURES') or 'not-produced'}`",
                  f"- artifact ID: `{os.environ.get('ARTIFACT_ID') or 'not-produced'}`",
                  f"- Actions artifact: `{os.environ.get('ARTIFACT_NAME') or 'not-produced'}`",
                  f"- workflow run: {os.environ['RUN_URL']}",
                  "",
                  "The preflight decodes no RGB frame, executes no CUT3R inference, "
                  "and opens no source residual/truth or confirmation/target value.",
              )
          )
          request = urllib.request.Request(
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/issues/49/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
