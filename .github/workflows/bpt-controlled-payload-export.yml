name: Export Prob4D decisive-study PR source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bpt-controlled-payload-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpt-controlled-payload-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Export files required for the repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prob4d-pr-export"
          tar -czf "${RUNNER_TEMP}/prob4d-pr-export/source.tar.gz" \
            .github/workflows/bpt-controlled-decisive-v1.yml \
            tests/test_bpt_controlled_decisive_execution_workflow.py \
            docs/bpt-controlled-decisive-execution.md
          sha256sum "${RUNNER_TEMP}/prob4d-pr-export/source.tar.gz" \
            > "${RUNNER_TEMP}/prob4d-pr-export/SHA256SUMS"

      - name: Upload exact pull-request files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-decisive-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prob4d-pr-export
          if-no-files-found: error
          retention-days: 1
