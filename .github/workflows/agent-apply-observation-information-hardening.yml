name: Apply observation information hardening

on:
  push:
    branches:
      - agent/observation-information-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-observation-information-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/observation-information-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/observation-information-hardening
          fetch-depth: 0
      - name: Merge the current main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Normalize the documentation insertion marker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/observation-belief-export.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "64-character Prob4D commit. It also fails closed when that revision "
              "cannot be\nobtained from the checkout and is not provided explicitly.\n"
          )
          new = (
              "64-character Prob4D commit.\nThe export fails when that revision "
              "cannot be\nobtained from the checkout and is not provided explicitly.\n"
          )
          if text.count(old) != 1:
              raise SystemExit("documentation insertion marker changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply deterministic source transformations
        id: patch
        continue-on-error: true
        run: python .github/agent-patches/apply_observation_information_hardening.py 2>patch-error.txt
      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: observation-hardening-patch-error
          path: patch-error.txt
          if-no-files-found: error
          retention-days: 2
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -q -e ".[dev]"
      - name: Format changed Python
        run: |
          python -m ruff format \
            src/prob4d/observation_export.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_v1.py \
            tests/test_provider_manifest.py \
            tests/test_fusion.py
      - name: Run Ruff
        run: |
          python -m ruff check --fix \
            src/prob4d/observation_export.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_v1.py \
            tests/test_provider_manifest.py \
            tests/test_fusion.py
          python -m ruff check \
            src/prob4d/observation_export.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_v1.py \
            tests/test_provider_manifest.py \
            tests/test_fusion.py
      - name: Run mypy on stable provider surface
        run: |
          python -m mypy \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_observation_export.py \
            tests/test_fusion.py \
            tests/test_provider_manifest.py \
            tests/test_provider_v1.py \
            tests/test_cli.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit applied patch
        run: |
          git add -A
          git commit -m "Harden observation information semantics"
          git push origin HEAD:agent/observation-information-hardening
