name: Temporary patch DOT predecessor-attempt guard

on:
  push:
    branches: [fix/dot-r04-r10-predecessor-attempt-v1]
    paths:
      - ".github/workflows/temporary-patch-dot-predecessor-attempt.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-predecessor-attempt-v1
          persist-credentials: false
          clean: true
      - name: Patch only the stale attempt-number assertion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patched/.github/workflows"
          cp .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml \
            "$RUNNER_TEMP/patched/.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml"
          TARGET="$RUNNER_TEMP/patched/.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml" \
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text(encoding='utf-8')
          old = '''          if run["run_attempt"] != 2:\n              raise SystemExit("queued predecessor attempt changed")\n'''
          new = '''          if int(run["run_attempt"]) < 2:\n              raise SystemExit("queued predecessor attempt regressed")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale predecessor-attempt assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          diff -u .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml \
            "$RUNNER_TEMP/patched/.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml" || test $? -eq 1
      - name: Upload exact patched workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-dot-confirmation-workflow
          path: ${{ runner.temp }}/patched/.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          if-no-files-found: error
          retention-days: 1
