name: Temporary patch DOT predecessor-attempt guard

on:
  push:
    branches: [fix/dot-r04-r10-predecessor-attempt-v1]
    paths:
      - ".github/workflows/temporary-patch-dot-predecessor-attempt.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-predecessor-attempt-v1
          persist-credentials: true
          clean: true
      - name: Stage the exact patched workflow as an ordinary repository blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml \
            tmp/patched-dot-rope-cut3r-heldout-confirmation-v1.yml
          TARGET=tmp/patched-dot-rope-cut3r-heldout-confirmation-v1.yml python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text(encoding='utf-8')
          old = '''          if run["run_attempt"] != 2:\n              raise SystemExit("queued predecessor attempt changed")\n'''
          new = '''          if int(run["run_attempt"]) < 2:\n              raise SystemExit("queued predecessor attempt regressed")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale predecessor-attempt assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --no-index --check \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml \
            tmp/patched-dot-rope-cut3r-heldout-confirmation-v1.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/patched-dot-rope-cut3r-heldout-confirmation-v1.yml
          git commit -m 'Stage patched DOT confirmation workflow blob'
          git push origin HEAD:fix/dot-r04-r10-predecessor-attempt-v1
