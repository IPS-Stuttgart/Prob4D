name: Query-message overlap controlled study v1

on:
  pull_request:
    paths:
      - ".github/workflows/query-message-overlap-study-v1.yml"
      - "src/prob4d/query_message.py"
      - "scripts/science/run_query_message_overlap_study_v1.py"
      - "protocols/query-message-overlap-study-v1.json"
      - "tests/test_query_message.py"
      - "tests/test_query_message_overlap_study_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/query-message-overlap-study-v1.yml"
      - "src/prob4d/query_message.py"
      - "scripts/science/run_query_message_overlap_study_v1.py"
      - "protocols/query-message-overlap-study-v1.json"
      - "tests/test_query_message.py"
      - "tests/test_query_message_overlap_study_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-message-overlap-study-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  controlled-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the tested package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate the registered implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/prob4d/query_message.py \
            scripts/science/run_query_message_overlap_study_v1.py \
            tests/test_query_message.py \
            tests/test_query_message_overlap_study_v1.py
          python -m ruff format --check \
            src/prob4d/query_message.py \
            scripts/science/run_query_message_overlap_study_v1.py \
            tests/test_query_message.py \
            tests/test_query_message_overlap_study_v1.py
          python -m pytest -q \
            tests/test_query_message.py \
            tests/test_query_message_overlap_study_v1.py

      - name: Execute twice and require byte-identical evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/query-message-overlap-v1
          mkdir -p build/query-message-overlap-v1
          python scripts/science/run_query_message_overlap_study_v1.py \
            --protocol protocols/query-message-overlap-study-v1.json \
            --output-dir build/query-message-overlap-v1/first
          python scripts/science/run_query_message_overlap_study_v1.py \
            --protocol protocols/query-message-overlap-study-v1.json \
            --output-dir build/query-message-overlap-v1/second
          cmp \
            build/query-message-overlap-v1/first/result.json \
            build/query-message-overlap-v1/second/result.json
          cmp \
            build/query-message-overlap-v1/first/summary.json \
            build/query-message-overlap-v1/second/summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/query-message-overlap-v1/first/result.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if value["decision"] != "controlled-overlap-passed":
              raise SystemExit("controlled overlap study did not pass")
          if not all(value["checks"].values()):
              raise SystemExit("one or more registered checks failed")
          print(json.dumps(value["summary"], indent=2, sort_keys=True))
          print(f"result_id={value['result_id']}")
          PY
          sha256sum build/query-message-overlap-v1/first/*.json

      - name: Upload immutable controlled evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: query-message-overlap-study-v1-${{ github.sha }}
          path: |
            build/query-message-overlap-v1/first/result.json
            build/query-message-overlap-v1/first/summary.json
            protocols/query-message-overlap-study-v1.json
          if-no-files-found: error
          retention-days: 30
