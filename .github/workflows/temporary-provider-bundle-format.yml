name: Temporary provider bundle formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-provider-bundle-format.yml"
      - "src/prob4d/provider_bundle.py"
      - "src/prob4d/cli.py"
      - "tests/test_provider_bundle.py"

permissions:
  contents: write

concurrency:
  group: temporary-provider-bundle-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/generic-provider-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/generic-provider-bundle
          fetch-depth: 0
          persist-credentials: false
      - name: Install formatter
        run: python -m pip install "ruff==0.16.1"
      - name: Harden revalidation and format focused files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/provider_bundle.py")
          source = path.read_text(encoding="utf-8")
          start_marker = (
              "    root = Path(payload_root)\n"
              "    total_bytes = 0\n"
              "    for record in bundle.windows:\n"
          )
          old_marker = "        payload = _resolve_payload_member(\n"
          new_marker = "        actual = _record_from_payload(\n"
          end_marker = "        total_bytes += record.payload_byte_count\n"
          replacement = "\n".join(
              [
                  "    root = Path(payload_root)",
                  "    total_bytes = 0",
                  "    for record in bundle.windows:",
                  "        actual = _record_from_payload(",
                  "            _IngestWindowSpec(",
                  "                window_id=record.window_id,",
                  "                relative_path=record.relative_path,",
                  "                source_frame_start=record.source_frame_start,",
                  "                source_frame_stop_exclusive=(",
                  "                    record.source_frame_stop_exclusive",
                  "                ),",
                  "            ),",
                  "            payload_root=root,",
                  "            allow_legacy_window_archives=(",
                  "                record.archive_schema == LEGACY_ARCHIVE_SCHEMA",
                  "            ),",
                  "        )",
                  "        if actual.payload_byte_count != record.payload_byte_count:",
                  "            raise ValueError(",
                  "                f\"payload byte count mismatch for {record.window_id!r}\"",
                  "            )",
                  "        if actual.payload_sha256 != record.payload_sha256:",
                  "            raise ValueError(",
                  "                f\"payload SHA-256 mismatch for {record.window_id!r}\"",
                  "            )",
                  "        if actual != record:",
                  "            raise ValueError(",
                  "                f\"payload contract mismatch for {record.window_id!r}\"",
                  "            )",
                  "        total_bytes += record.payload_byte_count",
                  "",
              ]
          )
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("provider verification start marker is missing")
          if new_marker not in source[start : start + 700]:
              if old_marker not in source[start : start + 700]:
                  raise SystemExit("provider verification block has unexpected contents")
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit("provider verification end marker is missing")
              end += len(end_marker)
              source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding="utf-8")
          PY
          python -m ruff format \
            src/prob4d/provider_bundle.py \
            src/prob4d/cli.py \
            tests/test_provider_bundle.py \
            tests/test_cli.py
          python -m py_compile src/prob4d/provider_bundle.py src/prob4d/cli.py
      - name: Commit and push exact source repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/prob4d/provider_bundle.py \
            src/prob4d/cli.py \
            tests/test_provider_bundle.py \
            tests/test_cli.py; then
            echo "source already matches Ruff 0.16.1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/provider_bundle.py \
            src/prob4d/cli.py \
            tests/test_provider_bundle.py \
            tests/test_cli.py
          git commit -m "Format and harden provider bundle surface"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/agent/generic-provider-bundle
