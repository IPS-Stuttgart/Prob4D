name: Apply group-robust feature audit

on:
  push:
    branches:
      - agent/group-robust-cycle-guard
    paths:
      - ".github/group-robust-feature-audit-trigger.txt"

permissions:
  contents: write

concurrency:
  group: apply-group-robust-feature-audit
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/group-robust-cycle-guard
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record transform-dependent feature behavior
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/prob4d/cycle_guard_group_robust_monte_carlo.py")
          text = source.read_text(encoding="utf-8")
          old = '''            feature = cycle_source_uncertainty_feature(normalized_audit)
          np.testing.assert_allclose(
              feature,
              clean_feature,
              rtol=0.0,
              atol=1e-14,
          )
          raw_audit = _run_raw_audit(
          '''
          new = '''            feature = cycle_source_uncertainty_feature(normalized_audit)
          feature_shift_from_injection = feature - clean_feature
          raw_audit = _run_raw_audit(
          '''
          if text.count(old) != 1:
              raise RuntimeError("feature-invariance assertion changed unexpectedly")
          text = text.replace(old, new, 1)
          old = '''                        "source_uncertainty_feature": feature,
                          "observable_source_stratum": stratum_id,
                          "maximum_raw_cycle_displacement": float(
          '''
          new = '''                        "source_uncertainty_feature": feature,
                          "source_uncertainty_feature_without_injection": (
                              clean_feature
                          ),
                          "source_uncertainty_feature_shift_from_injection": (
                              feature_shift_from_injection
                          ),
                          "observable_source_stratum": stratum_id,
                          "maximum_raw_cycle_displacement": float(
          '''
          if text.count(old) != 1:
              raise RuntimeError("target feature record changed unexpectedly")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          protocol = Path("protocols/cycle-guard-group-robust-v1.json")
          payload = protocol.read_text(encoding="utf-8")
          old = '''    "observable_source_feature_changed_by_translation_injection": false
          '''
          new = '''    "observable_source_feature_may_change_under_translation_injection": true,
              "primary_threshold_depends_on_target_stratum_assignment": false
          '''
          if payload.count(old) != 1:
              raise RuntimeError("protocol outlier feature declaration changed unexpectedly")
          protocol.write_text(payload.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate corrected pre-target implementation
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/prob4d/cycle_guard_group_robust.py \
            src/prob4d/cycle_guard_group_robust_monte_carlo.py \
            tests/test_cycle_guard_group_robust.py \
            tests/test_cycle_guard_group_robust_monte_carlo.py
          python -m pytest -q \
            tests/test_cycle_guard_group_robust.py \
            tests/test_cycle_guard_group_robust_monte_carlo.py
      - name: Commit correction and remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/apply-group-robust-feature-audit.yml
          rm .github/group-robust-feature-audit-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cycle_guard_group_robust_monte_carlo.py \
            protocols/cycle-guard-group-robust-v1.json \
            .github/workflows/apply-group-robust-feature-audit.yml \
            .github/group-robust-feature-audit-trigger.txt
          git diff --cached --check
          git commit -m "Audit transform-dependent source strata"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/group-robust-cycle-guard
