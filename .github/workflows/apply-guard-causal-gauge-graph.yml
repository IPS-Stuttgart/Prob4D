name: Apply guarded gauge graph rebase

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-guard-causal-gauge-graph.yml"

permissions:
  contents: write

concurrency:
  group: apply-guard-causal-gauge-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Replay reviewed files on current main
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/guard-causal-gauge-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/guard-causal-gauge-graph
          fetch-depth: 0
          persist-credentials: true
      - name: Replay reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          backup_ref=agent/guard-causal-gauge-graph-backup
          expected_backup=02df08ddc0c065b1d749fba9a01ece08efa142de
          git fetch origin "${backup_ref}:refs/remotes/origin/${backup_ref}"
          actual_backup=$(git rev-parse "refs/remotes/origin/${backup_ref}")
          test "${actual_backup}" = "${expected_backup}"

          git checkout "refs/remotes/origin/${backup_ref}" -- \
            CHANGELOG.md \
            docs/causal-gauge-graph.md \
            docs/experiment-protocol.md \
            src/prob4d/__init__.py \
            src/prob4d/causal_gauge_graph_ablation.py \
            src/prob4d/cli.py \
            src/prob4d/guarded_causal_gauge_graph.py \
            tests/test_causal_gauge_graph.py \
            tests/test_causal_gauge_graph_ablation.py \
            tests/test_causal_gauge_graph_cli.py

          git rm .github/workflows/apply-guard-causal-gauge-graph.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/causal-gauge-graph.md \
            docs/experiment-protocol.md \
            src/prob4d/__init__.py \
            src/prob4d/causal_gauge_graph_ablation.py \
            src/prob4d/cli.py \
            src/prob4d/guarded_causal_gauge_graph.py \
            tests/test_causal_gauge_graph.py \
            tests/test_causal_gauge_graph_ablation.py \
            tests/test_causal_gauge_graph_cli.py
          git diff --cached --check
          git commit -m "Guard causal gauge graph with source-only cycle fallback"
          git push origin HEAD:agent/guard-causal-gauge-graph
