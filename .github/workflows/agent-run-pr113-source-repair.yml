name: Run PR 113 source-only repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-run-pr113-source-repair.yml

permissions:
  contents: write

# Second revision triggers the registered source-only executor.
concurrency:
  group: run-pr113-source-only-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-factor-stream-contract
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the reviewed source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path(".github/workflows/agent-execute-pr113-repair.yml").read_text(
                  encoding="utf-8"
              )
          )
          patch = next(
              step["run"]
              for step in workflow["jobs"]["repair"]["steps"]
              if step.get("name") == "Apply exact-byte and concurrent-writer hardening"
          )
          marker = "if old_initial not in source and new_initial not in source:\n"
          if marker not in patch:
              raise SystemExit("stream marker hook not found")
          correction = (
              "old_initial = ''.join(\n"
              "    f'    {line}' if line.strip() else line\n"
              "    for line in old_initial.splitlines(keepends=True)\n"
              ")\n"
              "new_initial = ''.join(\n"
              "    f'    {line}' if line.strip() else line\n"
              "    for line in new_initial.splitlines(keepends=True)\n"
              ")\n"
          )
          patch = patch.replace(marker, correction + marker, 1)
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", patch],
              check=True,
          )
          PY

      - name: Validate and publish source files only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m ruff check \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py
          python -m pytest -q \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          git commit -m "Bind stream updates to exact bytes and serialize writers"
          git push origin HEAD:agent/harden-factor-stream-contract
