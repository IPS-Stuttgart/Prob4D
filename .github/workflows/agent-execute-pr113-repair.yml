name: Apply reviewed PR 113 stream-integrity repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-execute-pr113-repair.yml

permissions:
  contents: write

concurrency:
  group: apply-reviewed-pr113-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-factor-stream-contract
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply exact-byte and concurrent-writer hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/prob4d/observation_factor_stream.py")
          source = source_path.read_text(encoding="utf-8")
          source = source.replace(
              "import tempfile\nfrom collections.abc import Mapping\n",
              "import tempfile\nfrom collections.abc import Iterator, Mapping\n"
              "from contextlib import contextmanager\n",
              1,
          )

          helper_start = source.index("def _sha256_file(")
          helper_end = source.index("\n\ndef _require_nonnegative_integer", helper_start)
          helpers = dedent(
              '''
              def _sha256_file(path: Path) -> str:
                  return _sha256_bytes(_read_bytes(path, name="stream member"))


              def _sha256_bytes(payload: bytes) -> str:
                  return hashlib.sha256(payload).hexdigest()


              def _read_bytes(path: Path, *, name: str) -> bytes:
                  try:
                      return path.read_bytes()
                  except OSError as error:
                      raise ValueError(f"cannot read {name} {path.name!r}") from error


              def _load_json_bytes(payload: bytes, *, name: str) -> dict[str, Any]:
                  def object_pairs(pairs: list[tuple[str, Any]]) -> dict[str, Any]:
                      result: dict[str, Any] = {}
                      for key, item in pairs:
                          if key in result:
                              raise ValueError(
                                  f"{name} contains duplicate JSON object key {key!r}"
                              )
                          result[key] = item
                      return result

                  def reject_constant(token: str) -> Any:
                      raise ValueError(
                          f"{name} contains non-finite JSON number {token!r}"
                      )

                  try:
                      value = json.loads(
                          payload.decode("utf-8"),
                          object_pairs_hook=object_pairs,
                          parse_constant=reject_constant,
                      )
                  except UnicodeDecodeError as error:
                      raise ValueError(f"{name} must contain UTF-8 JSON") from error
                  except json.JSONDecodeError as error:
                      raise ValueError(f"{name} must contain valid JSON") from error
                  if not isinstance(value, dict):
                      raise ValueError(f"{name} must contain one JSON object")
                  return value


              @contextmanager
              def _exclusive_stream_lock(path: Path) -> Iterator[None]:
                  lock = path.with_name(f".{path.name}.lock")
                  try:
                      descriptor = os.open(
                          lock,
                          os.O_CREAT | os.O_EXCL | os.O_WRONLY,
                          0o600,
                      )
                  except FileExistsError as error:
                      raise FileExistsError(
                          f"observation-factor stream is already being written: {path}"
                      ) from error
                  try:
                      with os.fdopen(descriptor, "w", encoding="ascii") as handle:
                          handle.write(f"{os.getpid()}\\n")
                          handle.flush()
                          os.fsync(handle.fileno())
                      yield
                  finally:
                      lock.unlink(missing_ok=True)
              '''
          ).lstrip()
          source = source[:helper_start] + helpers + source[helper_end:]

          bundle_start = source.index("def _bundle_update(")
          bundle_end = source.index("\n\ndef append_observation_factor_bundle", bundle_start)
          bundle_function = dedent(
              '''
              def _bundle_update(
                  bundle_manifest_path: Path,
                  *,
                  stream_directory: Path,
                  update_index: int,
                  admitted_frame_start: int | None,
                  previous_update_id: str | None,
              ) -> ObservationFactorStreamUpdateV1:
                  manifest = bundle_manifest_path.resolve()
                  relative_manifest = _relative_member(
                      manifest,
                      root=stream_directory,
                      name="bundle_manifest_path",
                  )
                  manifest_bytes = _read_bytes(
                      manifest,
                      name="observation-factor bundle manifest",
                  )
                  manifest_sha = _sha256_bytes(manifest_bytes)
                  record = _load_json_bytes(
                      manifest_bytes,
                      name="observation-factor bundle manifest",
                  )
                  if record.get("schema") != OBSERVATION_FACTOR_SCHEMA:
                      raise ValueError("stream updates require an observation-factor bundle")
                  schema_version = require_exact_integer(
                      record.get("schema_version"),
                      name="observation-factor schema_version",
                      minimum=1,
                  )
                  if schema_version != OBSERVATION_FACTOR_SCHEMA_VERSION:
                      raise ValueError("stream updates require observation-factor schema v4")
                  covariance = require_mapping(
                      record.get("gauge_covariance"),
                      name="gauge_covariance",
                  )
                  require_exact_fields(
                      covariance,
                      _GAUGE_COVARIANCE_FIELDS,
                      name="gauge_covariance",
                  )
                  if (
                      covariance.get("semantics") != "joint-cross-window"
                      or covariance.get("cross_window_covariance_preserved") is not True
                      or covariance.get("diagonal_blocks_match_gauge_marginals") is not True
                  ):
                      raise ValueError(
                          "stream updates require joint cross-window gauge covariance"
                      )
                  require_nonempty_string(
                      covariance.get("joint_covariance_key"),
                      name="joint_covariance_key",
                  )
                  require_string_sequence(
                      covariance.get("ordered_gauge_ids"),
                      name="ordered_gauge_ids",
                  )

                  payload_record = require_mapping(
                      record.get("payload"),
                      name="observation-factor bundle payload record",
                  )
                  require_exact_fields(
                      payload_record,
                      _PAYLOAD_FIELDS,
                      name="payload record",
                  )
                  if payload_record.get("allow_pickle") is not False:
                      raise ValueError("observation-factor payload must disable pickle")
                  payload_relative = _safe_relative_path(
                      payload_record.get("path"),
                      name="observation-factor payload path",
                  )
                  payload_path = _resolved_member(
                      manifest.parent,
                      payload_relative,
                      name="observation-factor payload path",
                  )
                  payload_sha = require_sha256(
                      payload_record.get("sha256"),
                      name="observation-factor payload SHA-256",
                  )
                  payload_bytes = _read_bytes(
                      payload_path,
                      name="observation-factor payload",
                  )
                  if _sha256_bytes(payload_bytes) != payload_sha:
                      raise ValueError("observation-factor payload checksum mismatch")

                  with tempfile.TemporaryDirectory(
                      prefix="prob4d-stream-bundle-"
                  ) as temporary:
                      snapshot_manifest = Path(temporary) / manifest.name
                      snapshot_manifest.write_bytes(manifest_bytes)
                      snapshot_payload = snapshot_manifest.parent / Path(
                          *PurePosixPath(payload_relative).parts
                      )
                      snapshot_payload.parent.mkdir(parents=True, exist_ok=True)
                      snapshot_payload.write_bytes(payload_bytes)
                      bundle = load_observation_factor_bundle(snapshot_manifest)

                  frame_indices = [factor.frame_index for factor in bundle.factors]
                  if not frame_indices:
                      raise ValueError("stream updates require at least one factor")
                  effective_start = (
                      min(frame_indices)
                      if admitted_frame_start is None
                      else _require_nonnegative_integer(
                          admitted_frame_start,
                          name="admitted_frame_start",
                      )
                  )
                  if min(frame_indices) < effective_start:
                      raise ValueError(
                          "stream update reintroduces an already admitted frame"
                      )
                  if max(frame_indices) >= bundle.causal_frame_stop:
                      raise ValueError(
                          "stream update crosses its exclusive causal frame stop"
                      )
                  persistent_count, observation_count, identity_sha = (
                      _observation_identity_summary(bundle)
                  )
                  case_id = bundle.case_id
                  stream_id = bundle.stream_id
                  if case_id is None or stream_id is None:
                      raise RuntimeError(
                          "validated observation-factor bundle lost case or stream ID"
                      )

                  return ObservationFactorStreamUpdateV1(
                      update_index=update_index,
                      admitted_frame_start=effective_start,
                      causal_frame_stop=bundle.causal_frame_stop,
                      bundle_manifest_path=relative_manifest,
                      bundle_manifest_sha256=manifest_sha,
                      bundle_payload_sha256=payload_sha,
                      bundle_sequence_id=bundle.sequence_id,
                      case_id=case_id,
                      stream_id=stream_id,
                      source_repository=bundle.source_repository,
                      source_revision=bundle.source_revision,
                      factor_count=len(bundle.factors),
                      observation_count=observation_count,
                      persistent_identity_count=persistent_count,
                      observation_identity_sha256=identity_sha,
                      gauge_ids=tuple(gauge.window_id for gauge in bundle.gauges),
                      previous_update_id=previous_update_id,
                  )
              '''
          ).lstrip()
          source = source[:bundle_start] + bundle_function + source[bundle_end:]

          old_initial = dedent(
              '''
                  if stream is None:
                      update_index = 0
                      previous_update_id = None
                      if admitted_frame_start is None:
                          preview = load_observation_factor_bundle(manifest)
                          admitted_start = min(factor.frame_index for factor in preview.factors)
                      else:
                          admitted_start = _require_nonnegative_integer(
                              admitted_frame_start,
                              name="admitted_frame_start",
                          )
              '''
          ).lstrip()
          new_initial = dedent(
              '''
                  if stream is None:
                      update_index = 0
                      previous_update_id = None
                      admitted_start = (
                          None
                          if admitted_frame_start is None
                          else _require_nonnegative_integer(
                              admitted_frame_start,
                              name="admitted_frame_start",
                          )
                      )
              '''
          ).lstrip()
          if old_initial not in source and new_initial not in source:
              raise SystemExit("initial stream marker not found")
          source = source.replace(old_initial, new_initial, 1)

          writer_start = source.index("def write_observation_factor_stream(")
          writer_end = source.index("\n\ndef load_observation_factor_stream", writer_start)
          writer = dedent(
              '''
              def write_observation_factor_stream(
                  stream: ObservationFactorStreamV1,
                  path: str | Path,
              ) -> Path:
                  """Persist an idempotent append-only stream under an exclusive lock."""

                  output = Path(path)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with _exclusive_stream_lock(output):
                      existing_bytes: bytes | None = None
                      if output.exists():
                          existing_bytes = _read_bytes(
                              output,
                              name="observation-factor stream manifest",
                          )
                          existing = load_observation_factor_stream(
                              output,
                              validate_bundles=False,
                          )
                          _require_append_only_rewrite(existing, stream)

                      serialized = (
                          json.dumps(
                              stream.to_record(),
                              indent=2,
                              sort_keys=True,
                              allow_nan=False,
                          )
                          + "\\n"
                      )
                      descriptor, temporary_name = tempfile.mkstemp(
                          prefix=f".{output.name}.",
                          suffix=".tmp",
                          dir=output.parent,
                          text=True,
                      )
                      temporary = Path(temporary_name)
                      try:
                          with os.fdopen(
                              descriptor,
                              "w",
                              encoding="utf-8",
                          ) as handle:
                              handle.write(serialized)
                              handle.flush()
                              os.fsync(handle.fileno())
                          if existing_bytes is None:
                              os.link(temporary, output)
                          else:
                              current_bytes = _read_bytes(
                                  output,
                                  name="observation-factor stream manifest",
                              )
                              if current_bytes != existing_bytes:
                                  raise RuntimeError(
                                      "observation-factor stream changed during publication"
                                  )
                              os.replace(temporary, output)
                      finally:
                          temporary.unlink(missing_ok=True)
                  return output
              '''
          ).lstrip()
          source = source[:writer_start] + writer + source[writer_end:]
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_observation_factor_stream_strict.py")
          tests = test_path.read_text(encoding="utf-8")
          module_import = "import prob4d.observation_factor_stream as stream_module\n"
          if module_import not in tests:
              tests = tests.replace(
                  "import pytest\n\n",
                  "import pytest\n\n" + module_import + "\n",
                  1,
              )
          if "test_writer_lock_rejects_a_concurrent_library_writer" not in tests:
              tests = tests.rstrip() + dedent(
                  '''


                  def test_writer_lock_rejects_a_concurrent_library_writer(
                      tmp_path: Path,
                  ) -> None:
                      path = tmp_path / "stream.json"
                      lock = path.with_name(f".{path.name}.lock")
                      lock.write_text("competing writer\\n", encoding="utf-8")

                      with pytest.raises(FileExistsError, match="already being written"):
                          write_observation_factor_stream(_stream(), path)

                      assert not path.exists()
                      assert lock.read_text(encoding="utf-8") == "competing writer\\n"


                  def test_first_publication_never_overwrites_a_racing_destination(
                      tmp_path: Path,
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      path = tmp_path / "stream.json"
                      original_link = stream_module.os.link

                      def racing_link(source: object, destination: object) -> None:
                          Path(destination).write_text(
                              "competing writer\\n",
                              encoding="utf-8",
                          )
                          original_link(source, destination)

                      monkeypatch.setattr(stream_module.os, "link", racing_link)
                      with pytest.raises(FileExistsError):
                          write_observation_factor_stream(_stream(), path)

                      assert path.read_text(encoding="utf-8") == "competing writer\\n"
                  '''
              ) + "\n"
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate and publish repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m ruff check \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py
          python -m mypy src/prob4d/observation_factor_stream.py
          python -m pytest -q \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py
          rm -f .github/workflows/agent-execute-pr113-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind stream updates to exact bytes and serialize writers"
          git push origin HEAD:agent/harden-factor-stream-contract
