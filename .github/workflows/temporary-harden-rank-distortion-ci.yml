name: Temporary rank-distortion CI hardening

on:
  push:
    branches:
      - research/query-rank-distortion-frontier-v1
    paths:
      - .github/workflows/temporary-harden-rank-distortion-ci.yml

permissions:
  contents: write

concurrency:
  group: temporary-rank-distortion-ci-hardening
  cancel-in-progress: false

jobs:
  harden:
    name: Pin tools, format sources, and push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/query-rank-distortion-frontier-v1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Pin the permanent focused workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/posterior-rank-distortion.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
'''
          new = '''          python -m pip install -r requirements/ci/quality.txt
          python -m pip install --no-deps -e .
'''
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Focused workflow install block did not match either known state')
          PY

      - name: Apply the formatter used by the original focused run
        run: |
          python -m pip install "ruff==0.16.5"
          python -m ruff format \
            src/prob4d/posterior_rank_distortion.py \
            tests/test_posterior_rank_distortion.py
          git diff --check

      - name: Commit hardening changes
        run: |
          if git diff --quiet -- \
            .github/workflows/posterior-rank-distortion.yml \
            src/prob4d/posterior_rank_distortion.py \
            tests/test_posterior_rank_distortion.py; then
            echo "Focused workflow and files already match the hardened state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/posterior-rank-distortion.yml \
            src/prob4d/posterior_rank_distortion.py \
            tests/test_posterior_rank_distortion.py
          git commit -m "Harden posterior rank-distortion CI"
          git push origin HEAD:research/query-rank-distortion-frontier-v1
