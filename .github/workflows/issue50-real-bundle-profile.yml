name: Frozen real-bundle eager versus mmap profile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue50-real-bundle-profile.yml"
      - "protocols/issue50-real-bundle-profile-v1.json"
      - "scripts/ci/profile_real_prediction_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue50-real-bundle-profile-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  profile:
    name: Frozen real bundle on workstation2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve immutable paths and scope
        shell: bash
        run: |
          set -euo pipefail
          lock="protocols/issue50-real-bundle-profile-v1.json"
          lock_id="$(python scripts/ci/profile_real_prediction_bundle.py verify-lock --lock "${lock}")"
          root="/mnt/lexar4tb/prob4d/issue50-real-bundle-profile-v1"
          run_root="${root}/${lock_id}"
          profile="${RUNNER_TEMP}/issue50-real-profile"
          evidence="${profile}/evidence"
          rm -rf "${profile}"
          mkdir -p "${evidence}"
          {
            echo "PROFILE_LOCK=${lock}"
            echo "PROFILE_LOCK_ID=${lock_id}"
            echo "PROFILE_ROOT=${root}"
            echo "PROFILE_RUN_ROOT=${run_root}"
            echo "PROFILE_UPSTREAM=${root}/MotionCrafter-9cb4e9679f5f34e249945544052464ef46324bc2"
            echo "PROFILE_ENVIRONMENT=${root}/env-bfe1b1b8-py312-torch211-cu128"
            echo "PROFILE_BUNDLE=${run_root}/prediction-bundle"
            echo "PROFILE_STORE=${run_root}/prediction-store-float32"
            echo "PROFILE_WORK=${profile}"
            echo "PROFILE_EVIDENCE=${evidence}"
          } >> "${GITHUB_ENV}"
          cp "${lock}" "${evidence}/profile-lock.json"
          printf '%s\n' "${lock_id}" > "${evidence}/profile-lock-id.txt"
          git rev-parse HEAD > "${evidence}/execution-revision.txt"
          git rev-parse bfe1b1b87323751fe9013f8d667fa0bb5f605a69 \
            > "${evidence}/estimator-base-revision.txt"
          git diff --exit-code \
            bfe1b1b87323751fe9013f8d667fa0bb5f605a69 HEAD -- \
            src/prob4d pyproject.toml \
            environments/motioncrafter-inference.txt \
            scripts/bootstrap_motioncrafter_env.sh
          git diff --name-only \
            bfe1b1b87323751fe9013f8d667fa0bb5f605a69 HEAD \
            | LC_ALL=C sort > "${evidence}/reviewed-paths.txt"
          python -m py_compile scripts/ci/profile_real_prediction_bundle.py

      - name: Verify frozen source and cached model layouts
        shell: bash
        run: |
          set -euo pipefail
          python - "${PROFILE_LOCK}" "${PROFILE_EVIDENCE}/input-verification.json" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          lock = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          output = Path(sys.argv[2])

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          source = Path(lock["source_video"]["path"])
          stat = source.stat()
          if source.is_symlink() or not source.is_file():
              raise SystemExit("frozen source is not a regular file")
          if stat.st_size != lock["source_video"]["bytes"]:
              raise SystemExit("frozen source byte count changed")
          if sha256(source) != lock["source_video"]["sha256"]:
              raise SystemExit("frozen source SHA-256 changed")
          forbidden = (
              "adaptive-confirmation", "heldout", "holdout",
              "prospective", "reserved", "/target/",
          )
          if any(token in str(source).lower() for token in forbidden):
              raise SystemExit("frozen source entered a protected path")
          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error", "-select_streams", "v:0",
                  "-show_entries",
                  "stream=codec_name,width,height,avg_frame_rate,nb_frames:format=duration",
                  "-of", "json", str(source),
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          raw = json.loads(probe.stdout)
          stream = raw["streams"][0]
          observed = {
              "codec_name": stream["codec_name"],
              "width": int(stream["width"]),
              "height": int(stream["height"]),
              "avg_frame_rate": stream["avg_frame_rate"],
              "frame_count": int(stream["nb_frames"]),
              "duration_seconds": float(raw["format"]["duration"]),
          }
          if observed != lock["source_video"]["container"]:
              raise SystemExit(f"source container changed: {observed!r}")

          models = {}
          for role, expected in lock["model_cache"]["models"].items():
              snapshot = Path(expected["snapshot_path"])
              if snapshot.is_symlink() or not snapshot.is_dir():
                  raise SystemExit(f"{role} snapshot unavailable")
              digest = hashlib.sha256()
              logical_bytes = 0
              file_count = 0
              for member in sorted(
                  snapshot.rglob("*"),
                  key=lambda value: value.relative_to(snapshot).as_posix(),
              ):
                  if member.is_dir():
                      continue
                  relative = member.relative_to(snapshot).as_posix()
                  member_stat = member.stat()
                  target = os.readlink(member) if member.is_symlink() else ""
                  digest.update(relative.encode() + b"\0")
                  digest.update(str(member_stat.st_size).encode() + b"\0")
                  digest.update(target.encode() + b"\0")
                  logical_bytes += member_stat.st_size
                  file_count += 1
              if digest.hexdigest() != expected["layout_sha256"]:
                  raise SystemExit(f"{role} snapshot layout changed")
              if logical_bytes != expected["logical_bytes"]:
                  raise SystemExit(f"{role} snapshot logical bytes changed")
              models[role] = {
                  "revision": expected["revision"],
                  "path": str(snapshot),
                  "layout_sha256": digest.hexdigest(),
                  "logical_bytes": logical_bytes,
                  "file_count": file_count,
                  "model_tensor_bytes_opened": False,
              }
          report = {
              "schema": "prob4d.issue50-frozen-input-verification",
              "version": 1,
              "source_video": {
                  "path": str(source),
                  "sha256": lock["source_video"]["sha256"],
                  "bytes": stat.st_size,
                  "container": observed,
              },
              "models": models,
              "information_boundary": {
                  "source_video_bytes_hashed": True,
                  "source_video_frames_decoded": False,
                  "model_tensor_bytes_opened": False,
                  "truth_or_target_outcomes_opened": False,
              },
          }
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          nvidia-smi --query-gpu=name,uuid,memory.total,driver_version \
            --format=csv,noheader,nounits \
            | tee "${PROFILE_EVIDENCE}/gpu.csv"

      - name: Prepare exact MotionCrafter checkout and uv environment
        shell: bash
        run: |
          set -euo pipefail
          revision="9cb4e9679f5f34e249945544052464ef46324bc2"
          if [[ ! -d "${PROFILE_UPSTREAM}/.git" ]]; then
            rm -rf "${PROFILE_UPSTREAM}"
            git clone https://github.com/TencentARC/MotionCrafter.git \
              "${PROFILE_UPSTREAM}"
          fi
          if ! git -C "${PROFILE_UPSTREAM}" cat-file -e "${revision}^{commit}" \
              2>/dev/null; then
            git -C "${PROFILE_UPSTREAM}" fetch origin "${revision}"
          fi
          git -C "${PROFILE_UPSTREAM}" checkout --detach "${revision}"
          git -C "${PROFILE_UPSTREAM}" reset --hard "${revision}"
          git -C "${PROFILE_UPSTREAM}" clean -ffdx
          test "$(git -C "${PROFILE_UPSTREAM}" rev-parse HEAD)" = "${revision}"
          test -z "$(git -C "${PROFILE_UPSTREAM}" status --porcelain=v1 --untracked-files=all)"
          origin="$(git -C "${PROFILE_UPSTREAM}" remote get-url origin)"
          case "${origin}" in
            https://github.com/TencentARC/MotionCrafter.git|https://github.com/TencentARC/MotionCrafter) ;;
            *) echo "unexpected MotionCrafter origin: ${origin}" >&2; exit 1 ;;
          esac
          printf 'revision=%s\norigin=%s\nclean=true\n' \
            "${revision}" "${origin}" \
            > "${PROFILE_EVIDENCE}/motioncrafter-checkout.txt"

          bash scripts/bootstrap_motioncrafter_env.sh \
            "${PROFILE_UPSTREAM}" "${PROFILE_ENVIRONMENT}" \
            2>&1 | tee "${PROFILE_EVIDENCE}/environment-bootstrap.log"
          uv_bin="$(command -v uv || true)"
          if [[ -z "${uv_bin}" ]]; then
            uv_bin="${HOME}/.local/bin/uv"
          fi
          test -x "${uv_bin}"
          "${uv_bin}" pip check --python "${PROFILE_ENVIRONMENT}/bin/python"
          PYTHONPATH="${PROFILE_UPSTREAM}" \
            "${PROFILE_ENVIRONMENT}/bin/python" - <<'PY'
          import torch
          import motioncrafter
          import prob4d

          assert torch.cuda.is_available()
          assert torch.__version__ == "2.11.0+cu128"
          print("torch", torch.__version__)
          print("cuda", torch.version.cuda)
          print("device_count", torch.cuda.device_count())
          PY
          "${uv_bin}" pip freeze --python "${PROFILE_ENVIRONMENT}/bin/python" \
            | LC_ALL=C sort > "${PROFILE_EVIDENCE}/environment-freeze.txt"
          "${PROFILE_ENVIRONMENT}/bin/python" -VV \
            > "${PROFILE_EVIDENCE}/python-version.txt" 2>&1
          echo "${PROFILE_ENVIRONMENT}/bin" >> "${GITHUB_PATH}"
          {
            echo "HF_HUB_OFFLINE=1"
            echo "TRANSFORMERS_OFFLINE=1"
            echo "DIFFUSERS_OFFLINE=1"
            echo "CUDA_VISIBLE_DEVICES=0"
          } >> "${GITHUB_ENV}"

      - name: Generate or resume exact prediction bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROFILE_RUN_ROOT}" "${PROFILE_BUNDLE}"
          mapfile -t entries < <(
            find "${PROFILE_BUNDLE}" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )
          resume=()
          if [[ -f "${PROFILE_BUNDLE}/predictions.json" ]]; then
            prob4d-motioncrafter --output-dir "${PROFILE_BUNDLE}" --verify-only \
              | tee "${PROFILE_EVIDENCE}/generation-verify-before.json"
          elif [[ -f "${PROFILE_BUNDLE}/progress.json" ]]; then
            resume+=(--resume)
          elif (( ${#entries[@]} )); then
            printf 'unexpected incomplete members:\n%s\n' "${entries[*]}" >&2
            exit 1
          fi
          started="$(date +%s)"
          if [[ ! -f "${PROFILE_BUNDLE}/predictions.json" ]]; then
            prob4d-motioncrafter \
              "/mnt/lexar4tb/datasets/deform360/contact-trust-calibration-v1/002-rope-silk-ep0008/episode_0000/brics-odroid-007_cam0/undistorted.mp4" \
              --upstream-root "${PROFILE_UPSTREAM}" \
              --output-dir "${PROFILE_BUNDLE}" \
              --model-type determ \
              --unet-path TencentARC/MotionCrafter \
              --unet-revision fc7b18d5657184607bf4501b02d64ada7540b4e3 \
              --vae-path TencentARC/MotionCrafter \
              --vae-revision fc7b18d5657184607bf4501b02d64ada7540b4e3 \
              --image-vae-path stable-diffusion-v1-5/stable-diffusion-v1-5 \
              --image-vae-revision 451f4fe16113bff5a5d2269ed5ad43b0592e9a14 \
              --base-pipeline-path stabilityai/stable-video-diffusion-img2vid-xt \
              --base-pipeline-revision 9e43909513c6714f1bc78bcb44d96e733cd242aa \
              --cache-dir /home/github-runner/.cache/huggingface/hub \
              --height 320 --width 640 \
              --window-size 25 --overlap 8 \
              --num-inference-steps 5 --guidance-scale 1.0 \
              --decode-chunk-size 25 \
              --seed 20260806 --seed-policy derived-per-call \
              --frame-start 0 --frame-stop 59 --frame-stride 1 \
              "${resume[@]}" \
              2>&1 | tee "${PROFILE_EVIDENCE}/generation.log"
          fi
          stopped="$(date +%s)"
          printf 'wall_seconds=%s\n' "$((stopped - started))" \
            > "${PROFILE_EVIDENCE}/generation-time.txt"
          prob4d-motioncrafter --output-dir "${PROFILE_BUNDLE}" --verify-only \
            | tee "${PROFILE_EVIDENCE}/generation-verification.json"
          cp "${PROFILE_BUNDLE}/predictions.json" \
            "${PROFILE_EVIDENCE}/prediction-manifest.json"
          if [[ -f "${PROFILE_BUNDLE}/progress.json" ]]; then
            cp "${PROFILE_BUNDLE}/progress.json" \
              "${PROFILE_EVIDENCE}/prediction-progress.json"
          fi

      - name: Materialize or verify mmap store
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e "${PROFILE_STORE}" ]]; then
            /usr/bin/time -v \
              -o "${PROFILE_EVIDENCE}/store-materialization-time.txt" \
              prob4d storage materialize \
                "${PROFILE_BUNDLE}/predictions.json" "${PROFILE_STORE}" \
                --dense-storage-dtype float32 \
              > "${PROFILE_EVIDENCE}/store-materialization.json"
          fi
          prob4d storage validate "${PROFILE_STORE}" \
            | tee "${PROFILE_EVIDENCE}/store-summary.json"
          mkdir -p "${PROFILE_EVIDENCE}/store-manifests"
          while IFS= read -r -d '' manifest; do
            relative="${manifest#${PROFILE_STORE}/}"
            destination="${PROFILE_EVIDENCE}/store-manifests/${relative}"
            mkdir -p "$(dirname "${destination}")"
            cp "${manifest}" "${destination}"
          done < <(find "${PROFILE_STORE}" -name manifest.json -type f -print0)

      - name: Run fresh eager arm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROFILE_WORK}/eager"
          /usr/bin/time -v \
            -o "${PROFILE_EVIDENCE}/eager-process-time.txt" \
            python scripts/ci/profile_real_prediction_bundle.py arm \
              --backend eager_npz \
              --input "${PROFILE_BUNDLE}/predictions.json" \
              --lock "${PROFILE_LOCK}" \
              --output "${PROFILE_WORK}/eager" \
            2>&1 | tee "${PROFILE_EVIDENCE}/eager-arm.log"
          cp "${PROFILE_WORK}/eager/arm-report.json" \
            "${PROFILE_EVIDENCE}/eager-arm-report.json"

      - name: Run fresh mmap arm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROFILE_WORK}/mmap"
          /usr/bin/time -v \
            -o "${PROFILE_EVIDENCE}/mmap-process-time.txt" \
            python scripts/ci/profile_real_prediction_bundle.py arm \
              --backend mmap_npy \
              --input "${PROFILE_STORE}" \
              --lock "${PROFILE_LOCK}" \
              --output "${PROFILE_WORK}/mmap" \
            2>&1 | tee "${PROFILE_EVIDENCE}/mmap-arm.log"
          cp "${PROFILE_WORK}/mmap/arm-report.json" \
            "${PROFILE_EVIDENCE}/mmap-arm-report.json"

      - name: Compare frozen semantic outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/profile_real_prediction_bundle.py compare \
            --lock "${PROFILE_LOCK}" \
            --eager-report "${PROFILE_WORK}/eager/arm-report.json" \
            --mmap-report "${PROFILE_WORK}/mmap/arm-report.json" \
            --output "${PROFILE_EVIDENCE}/comparison.json" \
            --markdown "${PROFILE_EVIDENCE}/SUMMARY.md" \
            2>&1 | tee "${PROFILE_EVIDENCE}/comparison.log"
          cat "${PROFILE_EVIDENCE}/SUMMARY.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Seal compact evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "execution_revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo
            uname -a
            echo
            lscpu
            echo
            free -b
            echo
            nvidia-smi
            echo
            df -T \
              "/mnt/lexar4tb/datasets/deform360/contact-trust-calibration-v1/002-rope-silk-ep0008/episode_0000/brics-odroid-007_cam0/undistorted.mp4" \
              "${PROFILE_RUN_ROOT}"
            echo
            findmnt -T "${PROFILE_RUN_ROOT}"
          } > "${PROFILE_EVIDENCE}/host-and-filesystem.txt" 2>&1
          python - <<'PY' > "${PROFILE_EVIDENCE}/numpy-config.txt" 2>&1
          import numpy
          print("numpy", numpy.__version__)
          numpy.show_config()
          PY
          (
            cd "${PROFILE_EVIDENCE}" || exit 0
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload compact real-profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: issue50-frozen-real-bundle-profile
          path: ${{ runner.temp }}/issue50-real-profile/evidence
          if-no-files-found: error
          retention-days: 90
