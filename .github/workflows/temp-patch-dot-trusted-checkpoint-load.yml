name: Temporary patch DOT trusted checkpoint loading

on:
  push:
    branches: [fix/dot-trusted-checkpoint-load]
    paths:
      - ".github/workflows/temp-patch-dot-trusted-checkpoint-load.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-trusted-checkpoint-load
          fetch-depth: 0
          persist-credentials: true
      - name: Add SHA-bound legacy checkpoint authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/science/run_dot_rope_cut3r_native_provider.py')
          text = path.read_text(encoding='utf-8')
          constant_anchor = 'SCHEMA_VERSION = 1\n'
          constant_addition = constant_anchor + (
              'TRUSTED_CUT3R_CHECKPOINT_SHA256 = '
              '"45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103"\n'
          )
          if text.count(constant_anchor) != 1:
              raise SystemExit('schema constant anchor changed')
          text = text.replace(constant_anchor, constant_addition, 1)

          helper_anchor = '\ndef _sha256_bytes(value: bytes) -> str:\n'
          helper = '''\ndef _authorize_trusted_legacy_checkpoint_load(checkpoint: Path) -> None:
              """Restore legacy torch.load only for the checksum-pinned official checkpoint."""

              if _sha256(checkpoint) != TRUSTED_CUT3R_CHECKPOINT_SHA256:
                  raise ValueError("legacy loading is restricted to the trusted CUT3R checkpoint")
              os.environ["TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD"] = "1"


          def _sha256_bytes(value: bytes) -> str:
          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit('hash helper anchor changed')
          text = text.replace(helper_anchor, '\n' + helper, 1)

          constructor_anchor = (
              '        self.device = device\n'
              '        _prepend_cut3r_import_paths(self.checkout)\n'
          )
          constructor_replacement = (
              '        self.device = device\n'
              '        _authorize_trusted_legacy_checkpoint_load(self.checkpoint)\n'
              '        _prepend_cut3r_import_paths(self.checkout)\n'
          )
          if text.count(constructor_anchor) != 1:
              raise SystemExit('runtime constructor anchor changed')
          text = text.replace(constructor_anchor, constructor_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check --quiet -e '.[dev]'
          python -m ruff check \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            tests/test_dot_cut3r_trusted_checkpoint_load.py
          python -m ruff format \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            tests/test_dot_cut3r_trusted_checkpoint_load.py
          python -m pytest -q tests/test_dot_cut3r_trusted_checkpoint_load.py
          python -m compileall -q scripts/science/run_dot_rope_cut3r_native_provider.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            tests/test_dot_cut3r_trusted_checkpoint_load.py
          git commit -m 'Authorize SHA-pinned legacy CUT3R checkpoint load'
          git push origin HEAD:fix/dot-trusted-checkpoint-load
