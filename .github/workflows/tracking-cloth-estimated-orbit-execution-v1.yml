name: Tracking Cloth estimated-orbit scientific execution v1

on:
  push:
    branches:
      - research/tracking-cloth-estimated-orbit-robustness-v1
    paths:
      - ".github/workflows/tracking-cloth-estimated-orbit-execution-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ZENODO_URL: https://zenodo.org/records/14644526/files/tracking_dataset.zip?download=1
  ZENODO_MD5: b4868b702f8a42b2ea1069d0f1a3b8f6
  PROTOCOL_PATH: protocols/tracking-cloth-finite-orbit-robustness-v1.json
  OUTPUT_DIR: outputs/tracking-cloth-finite-orbit-robustness-v1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  execute:
    name: Source-calibrated noisy-axis robustness on 15 recordings
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact robustness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact numerical runtime and validate frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" "pytest==8.4.2"
          python -m pip check
          python -m py_compile \
            scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py
          python scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            validate-protocol --protocol "$PROTOCOL_PATH"
          python scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            self-test --protocol "$PROTOCOL_PATH"
          python -m pytest -q \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py

      - name: Initialize isolated workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tracking-cloth-estimated-orbit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$root" "$OUTPUT_DIR"
          mkdir -p "$root/data"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Download and verify official public release
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          archive="$root/tracking_dataset.zip"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output "$archive" "$ZENODO_URL"
          printf '%s  %s\n' "$ZENODO_MD5" "$archive" | md5sum --check --strict
          unzip -q "$archive" -d "$root/data"
          count=$(find "$root/data" -type f -iname '*.csv' -printf '.' | wc -c)
          test "$count" -eq 120
          echo "root=$root/data" >> "$GITHUB_OUTPUT"

      - name: Execute source calibration then target robustness curve
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            evaluate \
            --protocol "$PROTOCOL_PATH" \
            --dataset-root "${{ steps.dataset.outputs.root }}" \
            --output-dir "$OUTPUT_DIR" \
            --repository-revision "$(git rev-parse HEAD)"

      - name: Remove raw data and verify bounded result
        if: always()
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          rm -rf -- "$root/data" "$root/tracking_dataset.zip"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          if (output / "technical-failure.json").is_file():
              raise SystemExit((output / "technical-failure.json").read_text())
          result = json.loads((output / "result.json").read_text())
          source = json.loads((output / "source_seal.json").read_text())
          assert result["schema"] == "prob4d.tracking-cloth-finite-orbit-robustness-result.v1"
          assert result["protocol_id"] == "tracking-cloth-finite-orbit-robustness-v1"
          assert source["source_group_count"] == 24
          assert source["target_recording_headers_opened"] is False
          assert source["target_trajectory_values_opened"] is False
          assert result["cohort"]["target_groups"] == 15
          assert result["cohort"]["target_cases"] >= 1000
          assert len(result["curves"]) == 28
          assert result["claim_boundary"]["fresh_target_holdout"] is False
          assert result["claim_boundary"]["posthoc_secondary_analysis"] is True
          assert result["claim_boundary"]["learned_provider"] is False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"result_id={result['result_id']}\n")
              stream.write(
                  "criteria_passed="
                  f"{str(result['all_registered_secondary_criteria_passed']).lower()}\n"
              )
          print({
              "result_id": result["result_id"],
              "selected_threshold_fraction_of_span": result[
                  "selected_threshold_fraction_of_span"
              ],
              "all_registered_secondary_criteria_passed": result[
                  "all_registered_secondary_criteria_passed"
              ],
              "criteria": result["criteria"],
          })
          PY

      - name: Publish summary and post result receipt to core PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Estimated-orbit secondary robustness result"
            echo
            echo "Revision: \`$(git rev-parse HEAD)\`"
            echo
            cat "$OUTPUT_DIR/summary.md"
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/pr-comment.md"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/458/comments" \
            -f "body=$(cat "$RUNNER_TEMP/pr-comment.md")"

      - name: Upload compact derived evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-estimated-orbit-robustness-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/tracking-cloth-finite-orbit-robustness-v1/
          if-no-files-found: error
          retention-days: 90
