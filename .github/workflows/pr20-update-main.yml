name: PR 20 update from main

on:
  push:
    branches:
      - agent/content-addressed-covariance-calibration

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/content-addressed-covariance-calibration
          fetch-depth: 0
      - name: Merge current main or record conflicts
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:agent/content-addressed-covariance-calibration
            exit 0
          fi
          git status --short > /tmp/merge-conflicts.txt
          git merge --abort
          {
            echo "Merge of origin/main failed. Conflicting paths were:"
            cat /tmp/merge-conflicts.txt
          } > PR20_MERGE_CONFLICTS.txt
          git add PR20_MERGE_CONFLICTS.txt
          git commit -m "Record PR 20 merge conflicts"
          git push origin HEAD:agent/content-addressed-covariance-calibration
          exit 1
