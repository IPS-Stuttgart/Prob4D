name: One-shot PR 274 repair
# Trigger the already-reviewed one-shot workflow after its bootstrap commit.

on:
  push:
    branches:
      - agent/cut3r-deform360-source-freeze
    paths:
      - .github/workflows/pr-274-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Bootstrap PR #274 repair'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cut3r-deform360-source-freeze
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and repair the PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(text: str, old: str, new: str, *, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one match, found {count}")
              return text.replace(old, new)


          script_path = Path("scripts/science/build_cut3r_deform360_source_freeze.py")
          script = script_path.read_text(encoding="utf-8")
          script = replace_once(
              script,
              """                (\n                    f\"{hash_seed}\\0{record['object_id']}\\0{record['episode_id']}\"\n                ).encode(\"utf-8\")\n""",
              """                (\n                    f\"{hash_seed}\\0{record['object_id']}\\0{record['episode_id']}\"\n                ).encode()\n""",
              name="Ruff UP012 repair",
          )
          script_path.write_text(script, encoding="utf-8")

          hosted_path = Path(".github/workflows/cut3r-deform360-source-freeze.yml")
          hosted = hosted_path.read_text(encoding="utf-8")
          hosted = replace_once(
              hosted,
              "name: Freeze CUT3R Deform360 source comparison\n",
              "name: Validate CUT3R Deform360 source freeze\n",
              name="hosted workflow name",
          )
          hosted = replace_once(
              hosted,
              '      - ".github/workflows/cut3r-deform360-source-freeze.yml"\n',
              '      - ".github/workflows/cut3r-deform360-source-freeze.yml"\n'
              '      - ".github/workflows/trusted-self-hosted-validation.yml"\n'
              '      - "tests/test_trusted_self_hosted_validation_policy.py"\n',
              name="hosted workflow paths",
          )
          hosted = replace_once(
              hosted,
              "          python -m pytest -q tests/test_cut3r_deform360_source_freeze.py\n",
              "          python -m pytest -q \\\n"
              "            tests/test_cut3r_deform360_source_freeze.py \\\n"
              "            tests/test_trusted_self_hosted_validation_policy.py\n",
              name="hosted workflow tests",
          )
          if "\n  freeze:\n" not in hosted:
              raise SystemExit("hosted workflow has no removable self-hosted freeze job")
          hosted = hosted.split("\n  freeze:\n", 1)[0].rstrip() + "\n"
          hosted_path.write_text(hosted, encoding="utf-8")

          trusted_path = Path(".github/workflows/trusted-self-hosted-validation.yml")
          trusted = trusted_path.read_text(encoding="utf-8")
          trusted = replace_once(
              trusted,
              """          - full-validation\n          - production-memory\n""",
              """          - full-validation\n          - production-memory\n          - cut3r-deform360-source-freeze\n""",
              name="trusted profile choice",
          )
          expression = "$" + "{{"
          profile_block = """
      - name: Run target-closed CUT3R Deform360 source freeze
        if: inputs.profile == 'cut3r-deform360-source-freeze'
        shell: bash
        env:
          BPT_CHECKOUT: __EXPR__ vars.BPT_CHECKOUT }}
          CUT3R_CHECKOUT: __EXPR__ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: __EXPR__ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: __EXPR__ vars.DEFORM360_PROCESSED_ROOT }}
        run: |
          set -euo pipefail
          for name in \\
            BPT_CHECKOUT \\
            CUT3R_CHECKOUT \\
            CUT3R_CHECKPOINT \\
            DEFORM360_PROCESSED_ROOT
          do
            value=${!name:-}
            if [[ -z "$value" ]]; then
              echo "Required protected repository variable $name is unset" >&2
              exit 2
            fi
          done
          test -d "$BPT_CHECKOUT/.git"
          test -d "$CUT3R_CHECKOUT/.git"
          test -f "$CUT3R_CHECKPOINT"
          test -d "$DEFORM360_PROCESSED_ROOT"

          root="__EXPR__ steps.workspace.outputs.root }}"
          build_python="$root/venv/bin/python"
          wheel_dir="$root/cut3r-freeze-dist"
          run_venv="$root/cut3r-freeze-run-venv"
          output="$root/evidence/cut3r-deform360-source-freeze"
          raw_log="$root/tmp/cut3r-deform360-source-freeze.log"
          sanitized_log="$output/freeze.log"
          /usr/bin/rm -rf -- "$wheel_dir" "$run_venv" "$output" "$raw_log"
          /usr/bin/mkdir -p "$wheel_dir" "$output"

          "$build_python" -m build --wheel --outdir "$wheel_dir"
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' | sort)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one built Prob4D wheel" >&2
            exit 2
          fi
          python -m venv "$run_venv"
          "$run_venv/bin/python" -m pip install "pip==25.2"
          "$run_venv/bin/python" -m pip install "${wheels[0]}"
          "$run_venv/bin/python" -m pip check

          selection="$BPT_CHECKOUT/protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
          test -f "$selection"
          set +e
          "$run_venv/bin/python" scripts/science/build_cut3r_deform360_source_freeze.py \\
            --repository . \\
            --protocol protocols/cut3r_deform360_source_v1.json \\
            --selection "$selection" \\
            --processed-root "$DEFORM360_PROCESSED_ROOT" \\
            --cut3r-checkout "$CUT3R_CHECKOUT" \\
            --checkpoint "$CUT3R_CHECKPOINT" \\
            --prob4d-wheel "${wheels[0]}" \\
            --output-dir "$output" \\
            > "$raw_log" 2>&1
          status=$?
          set -e

          RAW_LOG="$raw_log" SANITIZED_LOG="$sanitized_log" \\
            "$build_python" - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          text = Path(os.environ["RAW_LOG"]).read_text(encoding="utf-8", errors="replace")
          replacements: dict[str, str] = {}
          for name in (
              "BPT_CHECKOUT",
              "CUT3R_CHECKOUT",
              "CUT3R_CHECKPOINT",
              "DEFORM360_PROCESSED_ROOT",
          ):
              value = os.environ.get(name, "")
              if not value:
                  continue
              replacements[value] = f"<{name}>"
              try:
                  replacements[str(Path(value).resolve())] = f"<{name}>"
              except OSError:
                  pass
          for value in sorted(replacements, key=len, reverse=True):
              text = text.replace(value, replacements[value])
          Path(os.environ["SANITIZED_LOG"]).write_text(text, encoding="utf-8")
          PY
          cat "$sanitized_log"
          printf '%s\n' "$status" > "$output/exit-status.txt"
          /usr/bin/rm -f -- "$raw_log"
          if [[ $status -ne 0 && $status -ne 3 ]]; then
            exit "$status"
          fi

          if [[ $status -eq 0 ]]; then
            "$run_venv/bin/prob4d" prediction cut3r-comparison build \\
              "$output/cut3r-comparison-spec.json" \\
              --output "$output/cut3r-comparison-lock.json"
            "$run_venv/bin/prob4d" prediction cut3r-comparison verify \\
              "$output/cut3r-comparison-lock.json"
            "$run_venv/bin/prob4d" prediction cut3r-comparison summarize \\
              "$output/cut3r-comparison-lock.json" \\
              --json \\
              > "$output/cut3r-comparison-summary.json"
          fi

          STATUS="$status" OUTPUT_DIR="$output" \\
            "$run_venv/bin/python" - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          status = int(os.environ["STATUS"])
          freeze_path = output / "cut3r-deform360-source-freeze.json"
          freeze = json.loads(freeze_path.read_text(encoding="utf-8"))
          boundary = freeze["information_boundary"]
          forbidden_true = (
              "source_rgb_frames_decoded",
              "source_prediction_payloads_opened",
              "source_residuals_or_truth_opened",
              "source_future_geometry_opened",
              "target_payloads_opened",
              "target_outcomes_opened",
              "downstream_physical_innovations_opened",
          )
          if any(boundary[name] is not False for name in forbidden_true):
              raise SystemExit("source-freeze information boundary was exceeded")
          if freeze["source_group_count"] != 10:
              raise SystemExit("source freeze does not contain exactly ten groups")
          if freeze["forbidden_target_group_count"] != 12:
              raise SystemExit("source freeze does not retain all twelve forbidden targets")

          specification = output / "cut3r-comparison-spec.json"
          lock = output / "cut3r-comparison-lock.json"
          if status == 0:
              if freeze["decision"] != "source-support-freeze-ready":
                  raise SystemExit("successful source freeze has the wrong decision")
              if not specification.is_file() or not lock.is_file():
                  raise SystemExit("successful source freeze lacks canonical comparison outputs")
          elif status == 3:
              if freeze["decision"] != "insufficient-common-camera-support":
                  raise SystemExit("support-negative source freeze has the wrong decision")
              if specification.exists() or lock.exists():
                  raise SystemExit("support-negative source freeze published comparison outputs")
          else:
              raise SystemExit("unexpected source-freeze exit status")
          PY

          /usr/bin/git restore --worktree -- src/prob4d.egg-info
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)"

""".replace("__EXPR__", expression)
          trusted = replace_once(
              trusted,
              "      - name: Record exact validation evidence\n",
              profile_block + "      - name: Record exact validation evidence\n",
              name="trusted source-freeze profile",
          )
          trusted_path.write_text(trusted, encoding="utf-8")

          policy_path = Path("tests/test_trusted_self_hosted_validation_policy.py")
          policy = policy_path.read_text(encoding="utf-8")
          policy = replace_once(
              policy,
              """    assert \"full-validation\" in text\n    assert \"production-memory\" in text\n""",
              """    assert \"full-validation\" in text\n    assert \"production-memory\" in text\n    assert \"cut3r-deform360-source-freeze\" in text\n    assert \"build_cut3r_deform360_source_freeze.py\" in text\n    assert \"DEFORM360_PROCESSED_ROOT\" in text\n    assert \"status -ne 0 && $status -ne 3\" in text\n""",
              name="trusted profile policy assertions",
          )
          policy_path.write_text(policy, encoding="utf-8")

          docs_path = Path("docs/cut3r-deform360-source-freeze.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(
              docs,
              """The manual workflow uses the protected\n`trusted-self-hosted-validation` environment and requires these repository\nvariables on the self-hosted runner:\n""",
              """The `cut3r-deform360-source-freeze` profile of the repository's single\n`Trusted exact-head validation` workflow uses the protected\n`trusted-self-hosted-validation` environment and requires these repository\nvariables on the self-hosted runner:\n""",
              name="trusted workflow documentation",
          )
          old_order = """1. Merge the protocol, builder, tests, documentation, and manual workflow.\n2. Dispatch `Freeze CUT3R Deform360 source comparison` from the reviewed `main`\n   revision and approve the protected environment independently.\n3. Retain the uploaded artifact. For a support-positive result, commit the exact\n   generated source-freeze and comparison-lock JSON under `protocols/locks/` in\n   a separate review.\n4. Only after those exact locks are merged, execute the three causal arms:\n   `native-continuous`, `restarted-newest`, and\n   `restarted-prob4d-fused` on the frozen source inputs.\n5. Stop at the first negative ordered gate. Do not open a confirmation object or\n   add a new covariance/provider method unless the source result explicitly\n   localizes that missing capability.\n"""
          new_order = """1. Merge the protocol, builder, tests, documentation, hosted contract workflow,\n   and the fixed protected-runner profile.\n2. Create a dedicated same-repository execution/lock pull request from that\n   merged `main` revision. Keep the scientific inputs unchanged.\n3. From `main`, dispatch `Trusted exact-head validation` with that open pull\n   request number, its exact reviewed head SHA, and profile\n   `cut3r-deform360-source-freeze`; approve the protected environment\n   independently.\n4. Retain the uploaded artifact. For a support-positive result, commit the exact\n   generated source-freeze and comparison-lock JSON under `protocols/locks/` to\n   the execution/lock pull request.\n5. Only after those exact locks are merged, execute the three causal arms:\n   `native-continuous`, `restarted-newest`, and\n   `restarted-prob4d-fused` on the frozen source inputs.\n6. Stop at the first negative ordered gate. Do not open a confirmation object or\n   add a new covariance/provider method unless the source result explicitly\n   localizes that missing capability.\n"""
          docs = replace_once(
              docs,
              old_order,
              new_order,
              name="two-stage publication order",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: Validate the repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m compileall -q \
            scripts/science/build_cut3r_deform360_source_freeze.py
          git diff --check

      - name: Commit and push the repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/cut3r-deform360-source-freeze.yml \
            .github/workflows/trusted-self-hosted-validation.yml \
            docs/cut3r-deform360-source-freeze.md \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          git commit -m "Repair CUT3R source-freeze validation architecture"
          git push origin HEAD:agent/cut3r-deform360-source-freeze
