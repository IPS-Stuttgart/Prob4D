name: Normalize observation information-hardening diff

on:
  push:
    branches:
      - agent/observation-information-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-cleanup-observation-information-hardening
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name == 'push' || github.head_ref == 'agent/observation-information-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/observation-information-hardening
          fetch-depth: 0
      - name: Restore changed files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            docs/experiment-protocol.md \
            docs/observation-belief-export.md \
            src/prob4d/fusion.py \
            src/prob4d/observation_export.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/provider_v1.py \
            tests/test_fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_manifest.py \
            tests/test_provider_v1.py
          rm -f patch-error.txt
      - name: Normalize consolidated documentation marker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/observation-belief-export.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "64-character Prob4D commit. It also fails closed when that revision "
              "cannot be\nobtained from the checkout and is not provided explicitly.\n"
          )
          new = (
              "64-character Prob4D commit.\nThe export fails when that revision "
              "cannot be\nobtained from the checkout and is not provided explicitly.\n"
          )
          if text.count(old) != 1:
              raise SystemExit("documentation insertion marker changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Reapply semantic-only patch
        run: |
          git show 03228603ae6a278dca69699ecb4d39a2d5b6661b:.github/agent-patches/apply_observation_information_hardening.py > /tmp/apply_observation_information_hardening.py
          python /tmp/apply_observation_information_hardening.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -q -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          python -m ruff check --fix \
            src/prob4d/observation_export.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_v1.py \
            tests/test_provider_manifest.py \
            tests/test_fusion.py \
            >ruff-output.txt 2>&1
          python -m ruff check \
            src/prob4d/observation_export.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/fusion.py \
            tests/test_observation_export.py \
            tests/test_provider_v1.py \
            tests/test_provider_manifest.py \
            tests/test_fusion.py \
            >>ruff-output.txt 2>&1
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: observation-hardening-ruff-diagnostics
          path: ruff-output.txt
          retention-days: 2
          if-no-files-found: error
      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          python -m mypy \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_manifest.py \
            >mypy-output.txt 2>&1
      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: observation-hardening-mypy-diagnostics
          path: mypy-output.txt
          retention-days: 2
          if-no-files-found: error
      - name: Stop on static-analysis failure
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_observation_export.py \
            tests/test_fusion.py \
            tests/test_provider_manifest.py \
            tests/test_provider_v1.py \
            tests/test_cli.py
      - name: Finalize normalized source commit
        run: |
          rm -f .github/workflows/agent-cleanup-observation-information-hardening.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize observation information-hardening implementation"
          git push origin HEAD:agent/observation-information-hardening
