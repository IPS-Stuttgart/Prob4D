name: Temporary format bounded-orbit robustness v1

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-format-bounded-orbit-robustness-v1.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply exact Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          files=(
            src/prob4d/bounded_axial_orbit.py
            scripts/science/run_tracking_cloth_bounded_orbit_robustness_v1.py
            tests/test_bounded_axial_orbit.py
            tests/test_tracking_cloth_bounded_orbit_robustness_v1.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          mkdir -p formatted/src/prob4d formatted/scripts/science formatted/tests
          cp src/prob4d/bounded_axial_orbit.py formatted/src/prob4d/
          cp scripts/science/run_tracking_cloth_bounded_orbit_robustness_v1.py \
            formatted/scripts/science/
          cp tests/test_bounded_axial_orbit.py formatted/tests/
          cp tests/test_tracking_cloth_bounded_orbit_robustness_v1.py formatted/tests/
      - name: Upload exact formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-bounded-orbit-robustness-v1-${{ github.run_id }}
          path: formatted/
          if-no-files-found: error
          retention-days: 1
