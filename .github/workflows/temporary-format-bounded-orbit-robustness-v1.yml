name: Temporary format bounded-orbit robustness v1

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-format-bounded-orbit-robustness-v1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply exact Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/run_tracking_cloth_bounded_orbit_robustness_v1.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '    paths = sorted(path for path in free_hanging.glob("*.csv") if SOURCE_PATTERN.fullmatch(path.name))': (
                  '    paths = sorted(\n'
                  '        path\n'
                  '        for path in free_hanging.glob("*.csv")\n'
                  '        if SOURCE_PATTERN.fullmatch(path.name)\n'
                  '    )'
              ),
              '            raise ValueError(f"target group produced no perturbation cases: {metadata[\'relative_path\']}")': (
                  '            raise ValueError(\n'
                  '                "target group produced no perturbation cases: "\n'
                  '                f"{metadata[\'relative_path\']}"\n'
                  '            )'
              ),
              '        "This secondary study perturbs both anchors and the probe within exact Euclidean error balls on the 15 already evaluated public real-trajectory recordings.",': (
                  '        (\n'
                  '            "This secondary study perturbs both anchors and the probe within "\n'
                  '            "exact Euclidean error balls on the 15 already evaluated public "\n'
                  '            "real-trajectory recordings."\n'
                  '        ),'
              ),
              '        "| point error / anchor span | plug-in containment | outer containment | outer width / true width | q50 plug-in false accept | q50 outer false accept | q50 outer false reject |",': (
                  '        (\n'
                  '            "| point error / anchor span | plug-in containment | outer "\n'
                  '            "containment | outer width / true width | q50 plug-in false "\n'
                  '            "accept | q50 outer false accept | q50 outer false reject |"\n'
                  '        ),'
              ),
              '        "The outer certificate is conditionally exact only when the declared point-error balls contain the true points. Width inflation quantifies its conservatism; it is not a learned-provider accuracy result.",': (
                  '        (\n'
                  '            "The outer certificate is conditionally exact only when the "\n'
                  '            "declared point-error balls contain the true points. Width "\n'
                  '            "inflation quantifies its conservatism; it is not a learned-"\n'
                  '            "provider accuracy result."\n'
                  '        ),'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source text not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          files=(
            src/prob4d/bounded_axial_orbit.py
            scripts/science/run_tracking_cloth_bounded_orbit_robustness_v1.py
            tests/test_bounded_axial_orbit.py
            tests/test_tracking_cloth_bounded_orbit_robustness_v1.py
          )
          python -m ruff check --fix --exit-zero "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/bounded_axial_orbit.py \
            scripts/science/run_tracking_cloth_bounded_orbit_robustness_v1.py \
            tests/test_bounded_axial_orbit.py \
            tests/test_tracking_cloth_bounded_orbit_robustness_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply exact Ruff formatting to bounded-orbit robustness"
          git push origin HEAD:repair/tracking-cloth-finite-orbit-motive-parser-v1
