name: Temporary harden DOT archive-recovery Python v1

on:
  push:
    branches: [ops/dot-r04-r10-archive-recovery-v1]
    paths:
      - "tools/requests/harden_dot_archive_recovery_python_v1.json"

permissions:
  contents: write

jobs:
  patch:
    name: Provision pinned Python in recovery controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Insert pinned controller Python
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/recover-dot-r04-r10-archive-cache-v1.yml")
          text = path.read_text(encoding="utf-8")
          marker = "      - name: Wait for the target attempt and authorize only pre-provider-seal recovery\n"
          insertion = (
              "      - name: Set up controller Python 3.12\n"
              "        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0\n"
              "        with:\n"
              "          python-version: \"3.12\"\n"
              "\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("controller-Python insertion point changed")
          if insertion in text:
              raise SystemExit("controller Python is already provisioned")
          path.write_text(text.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY

      - name: Validate bounded diff and action pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = ".github/workflows/recover-dot-r04-r10-archive-cache-v1.yml"
          grep -F 'uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0' \
            .github/workflows/recover-dot-r04-r10-archive-cache-v1.yml
          /usr/bin/python3 - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/test_trusted_self_hosted_validation_policy.py")
          namespace["test_only_reviewed_protected_workflows_can_use_self_hosted_runners"]()
          PY

      - name: Commit the bounded recovery hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/recover-dot-r04-r10-archive-cache-v1.yml
          git commit -m "Provision pinned Python in DOT archive recovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
