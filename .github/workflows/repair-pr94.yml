name: Repair PR 94

on:
  push:
    branches: [agent/harden-tracklet-association-contracts]
    paths: [.github/workflows/repair-pr94.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Rebase branch content and apply repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prob4d/cross_window_tracklets.py')
          text = path.read_text(encoding='utf-8')
          old = 'zip(result, result[1:])):'
          new = 'zip(result, result[1:], strict=False)):'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one repair target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/repair-pr94.yml').unlink()
          PY
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m mypy \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m pytest -q \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prob4d/cross_window_tracklets.py .github/workflows/repair-pr94.yml
          git commit -m 'Fix strict zip validation and refresh main'
          git push origin HEAD:agent/harden-tracklet-association-contracts
