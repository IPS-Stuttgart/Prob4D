name: Recursive visual-bias streams

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recursive-visual-bias.yml"
      - "docs/recursive-visual-bias.md"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/cli.py"
      - "src/prob4d/visual_bias.py"
      - "src/prob4d/visual_bias_stream.py"
      - "tests/test_cli.py"
      - "tests/test_visual_bias.py"
      - "tests/test_visual_bias_stream.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-visual-bias-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Shared prior, append-only lineage, and portable payload
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Isolate the self-hosted Python environment
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-recursive-visual-bias"
          python -m venv --clear "$environment"
          "$environment/bin/python" -m ensurepip --upgrade
          "$environment/bin/python" -m pip install --upgrade pip
          echo "$environment/bin" >> "$GITHUB_PATH"

      - name: Install the lightweight development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          python -m ruff format --check \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          python -m mypy src/prob4d/visual_bias_stream.py

      - name: Run focused and adjacent regressions
        run: |
          python -m pytest -q \
            tests/test_visual_bias_stream.py \
            tests/test_visual_bias.py \
            tests/test_cli.py \
            tests/test_observation_factor_stream.py
          python -m compileall -q src/prob4d

      - name: Smoke-test the installed command surface
        run: |
          prob4d observation visual-bias-stream --help
