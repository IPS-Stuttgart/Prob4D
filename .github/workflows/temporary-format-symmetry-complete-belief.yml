name: Materialize symmetry-complete belief formatting

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-format-symmetry-complete-belief.yml
      - src/prob4d/_symmetry_complete*.py
      - src/prob4d/symmetry_complete_belief.py
      - src/prob4d/symmetry_complete_belief_study.py
      - tests/test_symmetry_complete_belief*.py

permissions:
  contents: write

jobs:
  format:
    name: Materialize and commit canonical Ruff output
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact formatter
        run: python -m pip install "ruff==0.16.5"
      - name: Materialize canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/prob4d/_symmetry_complete*.py
            src/prob4d/symmetry_complete_belief.py
            src/prob4d/symmetry_complete_belief_study.py
            tests/test_symmetry_complete_belief*.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
      - name: Commit canonical bytes when needed
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            src/prob4d/_symmetry_complete*.py \
            src/prob4d/symmetry_complete_belief.py \
            src/prob4d/symmetry_complete_belief_study.py \
            tests/test_symmetry_complete_belief*.py
          if git diff --cached --quiet; then
            echo "Canonical formatting is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply canonical symmetry-complete belief formatting"
          git push origin "HEAD:${HEAD_REF}"
