name: Apply covariance validation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Apply patch
        run: |
          git apply --check .github/agent-patches/fail-closed-covariance.patch
          git apply .github/agent-patches/fail-closed-covariance.patch
          rm .github/agent-patches/fail-closed-covariance.patch
          rm .github/workflows/agent-apply-covariance-validation.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate and format
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/prob4d/covariance.py \
            src/prob4d/fusion.py \
            src/prob4d/metrics.py \
            tests/test_covariance_validation.py
          python -m ruff check src tests
          python -m pytest -q \
            tests/test_covariance_validation.py \
            tests/test_fusion.py \
            tests/test_metrics.py \
            tests/test_evaluation_modes.py
      - name: Commit applied patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fail closed on invalid covariance matrices'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
