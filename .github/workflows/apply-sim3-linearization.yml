name: Apply Sim3 linearization adequacy implementation

on:
  push:
    branches:
      - agent/sim3-linearization-adequacy
    paths:
      - ".github/workflows/apply-sim3-linearization.yml"

permissions:
  contents: write

concurrency:
  group: apply-sim3-linearization-adequacy
  cancel-in-progress: false

jobs:
  apply:
    name: Verify, apply, test, and remove transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          set -euo pipefail
          transport_root=".github/.sim3-linearization-payload"
          mapfile -t parts < <(find "${transport_root}" -maxdepth 1 -type f -name 'part-*' | LC_ALL=C sort)
          test "${#parts[@]}" -eq 9
          cat "${parts[@]}" > /tmp/sim3-linearization-payload.tar.gz.b64
          test "$(wc -c < /tmp/sim3-linearization-payload.tar.gz.b64)" -eq 14520
          echo "8c361c02d8578b37dfa3d1e5ba563845e66e1dd07df8733802a9c3e23c5491a6  /tmp/sim3-linearization-payload.tar.gz.b64" | sha256sum --check -
          base64 --decode /tmp/sim3-linearization-payload.tar.gz.b64 > /tmp/sim3-linearization-payload.tar.gz
          echo "07f7fd38cf07292bc66b4ec5738628261bd1091f7547cc0a83bf39f93c64ad73  /tmp/sim3-linearization-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/sim3-linearization-payload.tar.gz -C .
          rm -rf -- "${transport_root}" ".github/workflows/apply-sim3-linearization.yml"

      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/prob4d/diagnostics/__init__.py
            src/prob4d/diagnostics/sim3_linearization.py
            tests/test_sim3_linearization.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m pytest -q tests/test_sim3_linearization.py
          python -m compileall -q src/prob4d/diagnostics tests/test_sim3_linearization.py

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Sim3 linearization adequacy certificate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
