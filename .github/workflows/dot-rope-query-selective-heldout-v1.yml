name: DOT rope query-selective held-out CUT3R v1

on:
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/dot_rope_query_selective_heldout_v1.json"

permissions:
  contents: read

concurrency:
  group: dot-rope-query-selective-heldout-v1-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/dot_rope_query_selective_heldout_v1.json
  PROTOCOL_PATH: protocols/dot-rope-query-selective-heldout-v1.json
  R11_ARCHIVE: R11-20.zip
  R11_MD5: 23ce3e7067465d3edabe20b4c7cfa388
  R21_ARCHIVE: R21-30.zip
  R21_MD5: 8aee77f79d1aff6e1f3fd21886b251a0
  DATASET_API: https://dataverse.orc.gmu.edu/api/datasets/:persistentId/?persistentId=doi:10.13021/ORC2020/XXLVXM
  DATAFILE_API_ROOT: https://dataverse.orc.gmu.edu/api/access/datafile
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  CUT3R_CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  CUT3R_CHECKPOINT_GDRIVE_ID: 1Asz-ZB3FfpzZYwunhQvNPZEUA8XUNAYD
  RUNTIME_CACHE_ROOT: /home/github-runner/.cache/prob4d/dot-r11-r30-cut3r-gpuserver6000-v1
  RETAINED_CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
  RETAINED_CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
  RETAINED_CUT3R_PYTHON: ${{ vars.CUT3R_PYTHON }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  authorize:
    name: Authorize one immutable strong-prerequisite request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      protocol_git_blob_sha: ${{ steps.request.outputs.protocol_git_blob_sha }}
      prerequisite_run_id: ${{ steps.request.outputs.prerequisite_run_id }}
      prerequisite_artifact_id: ${{ steps.request.outputs.prerequisite_artifact_id }}
      prerequisite_artifact_name: ${{ steps.request.outputs.prerequisite_artifact_name }}
      prerequisite_artifact_digest: ${{ steps.request.outputs.prerequisite_artifact_digest }}
      prerequisite_evaluation_id: ${{ steps.request.outputs.prerequisite_evaluation_id }}
      prerequisite_marker_support_id: ${{ steps.request.outputs.prerequisite_marker_support_id }}
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exactly one non-forced request-file change
        id: request
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = "refs/heads/main"
          test "$EVENT_AFTER" = "$(git rev-parse HEAD)"
          test "$EVENT_FORCED" = "false"
          test "$EVENT_DELETED" = "false"
          test "$EVENT_BEFORE" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" | sort)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$REQUEST_PATH" ]]; then
            printf 'Expected only %s; changed paths were:\n' "$REQUEST_PATH" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 2
          fi
          protocol_blob=$(git rev-parse "$EVENT_AFTER:$PROTOCOL_PATH")
          python -m pip install -e .
          validation=$(
            python scripts/science/run_dot_rope_query_selective_heldout.py \
              validate-request \
              --request "$REQUEST_PATH" \
              --protocol "$PROTOCOL_PATH" \
              --protocol-git-blob-sha "$protocol_blob"
          )
          VALIDATION="$validation" REQUEST_PATH="$REQUEST_PATH" \
            PROTOCOL_BLOB="$protocol_blob" EVENT_AFTER="$EVENT_AFTER" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(os.environ["VALIDATION"])
          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          prerequisite = request["prerequisite"]
          outputs = {
              "request_id": value["request_id"],
              "head_sha": os.environ["EVENT_AFTER"],
              "protocol_git_blob_sha": os.environ["PROTOCOL_BLOB"],
              "prerequisite_run_id": prerequisite["run_id"],
              "prerequisite_artifact_id": prerequisite["artifact_id"],
              "prerequisite_artifact_name": prerequisite["artifact_name"],
              "prerequisite_artifact_digest": prerequisite["artifact_digest"],
              "prerequisite_evaluation_id": prerequisite["evaluation_id"],
              "prerequisite_marker_support_id": prerequisite["marker_support_id"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, item in outputs.items():
                  output.write(f"{key}={item}\n")
          PY

  prerequisite:
    name: Verify exact R04-R10 strong-positive prerequisite
    if: github.event_name == 'push'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.verify.outputs.decision }}
      result_id: ${{ steps.verify.outputs.result_id }}
    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact prerequisite artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.authorize.outputs.prerequisite_artifact_id }}
          EXPECTED_NAME: ${{ needs.authorize.outputs.prerequisite_artifact_name }}
          EXPECTED_DIGEST: ${{ needs.authorize.outputs.prerequisite_artifact_digest }}
          EXPECTED_RUN_ID: ${{ needs.authorize.outputs.prerequisite_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/artifacts/{os.environ['ARTIFACT_ID']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "Prob4D-DOT-query-selective/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              value = json.load(response)
          if int(value["id"]) != int(os.environ["ARTIFACT_ID"]):
              raise SystemExit("prerequisite artifact ID changed")
          if value["name"] != os.environ["EXPECTED_NAME"]:
              raise SystemExit("prerequisite artifact name changed")
          if value.get("digest") != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("prerequisite artifact digest changed")
          if value.get("expired") is not False:
              raise SystemExit("prerequisite artifact expired")
          workflow = value.get("workflow_run") or {}
          if int(workflow.get("id", -1)) != int(os.environ["EXPECTED_RUN_ID"]):
              raise SystemExit("prerequisite workflow run changed")
          PY
      - name: Download exact prerequisite evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize.outputs.prerequisite_artifact_name }}
          path: ${{ runner.temp }}/dot-prerequisite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize.outputs.prerequisite_run_id }}
      - name: Independently verify scientific decision and identities
        id: verify
        shell: bash
        env:
          EXPECTED_EVALUATION_ID: ${{ needs.authorize.outputs.prerequisite_evaluation_id }}
          EXPECTED_SUPPORT_ID: ${{ needs.authorize.outputs.prerequisite_marker_support_id }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/dot-prerequisite/result/result.json"
          support="$RUNNER_TEMP/dot-prerequisite/result/marker-support.json"
          test -f "$result"
          test -f "$support"
          verification=$(
            python scripts/science/verify_dot_rope_cut3r_heldout_result.py \
              "$result" --marker-support "$support"
          )
          VERIFICATION="$verification" EXPECTED_EVALUATION_ID="$EXPECTED_EVALUATION_ID" \
            EXPECTED_SUPPORT_ID="$EXPECTED_SUPPORT_ID" SUPPORT="$support" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          verified = json.loads(os.environ["VERIFICATION"])
          support = json.loads(Path(os.environ["SUPPORT"]).read_text(encoding="utf-8"))
          if verified["decision"] != "heldout-strong-positive":
              raise SystemExit("R04-R10 prerequisite is not strong-positive")
          if verified["result_id"] != os.environ["EXPECTED_EVALUATION_ID"]:
              raise SystemExit("prerequisite evaluation identity changed")
          if support["support_id"] != os.environ["EXPECTED_SUPPORT_ID"]:
              raise SystemExit("prerequisite marker-support identity changed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={verified['decision']}\n")
              output.write(f"result_id={verified['result_id']}\n")
          PY

  provider:
    name: Seal marker-free R11-R30 CUT3R point maps on gpuserver6000
    if: github.event_name == 'push'
    needs: [authorize, prerequisite]
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 720
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      provider_bundle_id: ${{ steps.result.outputs.provider_bundle_id }}
    steps:
      - name: Bind the intended GPU runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v nvidia-smi >/dev/null 2>&1
          command -v c++ >/dev/null 2>&1
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader

      - name: Initialize isolated prediction workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-dot-r11-r30-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected="${RUNNER_TEMP}/prob4d-dot-r11-r30-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p \
            "$root/home" \
            "$root/cache" \
            "$root/tmp" \
            "$root/evidence" \
            "$root/provider"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "PIP_CACHE_DIR=$root/cache/pip"
            echo "HF_HOME=$root/cache/huggingface"
            echo "TMPDIR=$root/tmp"
            echo "TORCH_EXTENSIONS_DIR=$root/cache/torch-extensions"
            echo "WANDB_MODE=disabled"
            echo "WANDB_DISABLED=true"
          } >> "$GITHUB_ENV"

      - name: Check out exact authorized Prob4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify clean exact Prob4D checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/git rev-parse HEAD:$PROTOCOL_PATH)" = \
            "${{ needs.authorize.outputs.protocol_git_blob_sha }}"

      - name: Check out exact public CUT3R revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CUT3R/CUT3R
          ref: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
          path: external/CUT3R
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up bootstrap Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Select or bootstrap a CUDA CUT3R interpreter
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          candidates=("")
          add_candidate() {
            local candidate="${1:-}"
            [[ -n "$candidate" ]] || return 0
            local existing
            for existing in "${candidates[@]}"; do
              [[ "$existing" != "$candidate" ]] || return 0
            done
            candidates+=("$candidate")
          }
          add_candidate "${RETAINED_CUT3R_PYTHON:-}"
          if [[ -n "${RETAINED_CUT3R_CHECKOUT:-}" ]]; then
            add_candidate "$RETAINED_CUT3R_CHECKOUT/.venv/bin/python"
          fi
          add_candidate /home/florianpfaff/conda_envs/cut3r/bin/python
          add_candidate /home/florianpfaff/miniconda3/envs/cut3r/bin/python
          add_candidate /home/florianpfaff/anaconda3/envs/cut3r/bin/python
          add_candidate /home/github-runner/.conda/envs/cut3r/bin/python
          add_candidate /home/github-runner/miniconda3/envs/cut3r/bin/python
          add_candidate /home/github-runner/anaconda3/envs/cut3r/bin/python
          add_candidate /opt/conda/envs/cut3r/bin/python

          usable=""
          for candidate in "${candidates[@]}"; do
            [[ -x "$candidate" ]] || continue
            echo "::group::CUT3R interpreter candidate $candidate"
            if "$candidate" - <<'PY'
          import accelerate
          import cv2
          import einops
          import h5py
          import hydra
          import lpips
          import numpy
          import PIL
          import roma
          import scipy
          import sklearn
          import torch
          import torchvision
          import transformers

          print("python-ready")
          print("torch", torch.__version__)
          print("torch_cuda", torch.version.cuda)
          print("cuda_available", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit(1)
          print("gpu", torch.cuda.get_device_name(0))
          PY
            then
              usable="$candidate"
              echo "Selected $candidate"
              echo "::endgroup::"
              break
            fi
            echo "Rejected $candidate"
            echo "::endgroup::"
          done

          if [[ -z "$usable" ]]; then
            venv="$root/venv"
            python -m venv "$venv"
            usable="$venv/bin/python"
            "$usable" -m pip install \
              "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
            "$usable" -m pip install \
              torch==2.11.0 torchvision==0.26.0 \
              --index-url https://download.pytorch.org/whl/cu126
            filtered="$root/cut3r-requirements.txt"
            python - external/CUT3R/requirements.txt "$filtered" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          kept = []
          for line in source:
              stripped = line.strip()
              if re.match(r"^(torch|torchvision)(?:\s|[<>=!~].*)?$", stripped, flags=re.I):
                  continue
              kept.append(line)
          Path(sys.argv[2]).write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
            "$usable" -m pip install -r "$filtered" gdown==5.2.0
            "$usable" -m pip check
          fi

          "$usable" - <<'PY'
          import torch
          print("selected_python_cuda", torch.cuda.is_available())
          print("selected_gpu", torch.cuda.get_device_name(0))
          if not torch.cuda.is_available():
              raise SystemExit("selected CUT3R Python has no CUDA device")
          PY
          echo "python=$usable" >> "$GITHUB_OUTPUT"

      - name: Acquire exact CUT3R checkpoint without opening DOT
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/mkdir -p "$RUNTIME_CACHE_ROOT"
          selected=""
          if [[ -n "${RETAINED_CUT3R_CHECKPOINT:-}" && -f "$RETAINED_CUT3R_CHECKPOINT" ]]; then
            measured=$(sha256sum "$RETAINED_CUT3R_CHECKPOINT" | awk '{print $1}')
            if [[ "$measured" = "$CUT3R_CHECKPOINT_SHA256" ]]; then
              selected="$RETAINED_CUT3R_CHECKPOINT"
            fi
          fi
          if [[ -z "$selected" ]]; then
            selected="$RUNTIME_CACHE_ROOT/cut3r_512_dpt_4_64.pth"
            valid=false
            if [[ -f "$selected" ]]; then
              measured=$(sha256sum "$selected" | awk '{print $1}')
              [[ "$measured" = "$CUT3R_CHECKPOINT_SHA256" ]] && valid=true
            fi
            if [[ "$valid" != true ]]; then
              part="$selected.part-${GITHUB_RUN_ID}"
              /usr/bin/rm -f -- "$part"
              python -m pip install gdown==5.2.0
              PART="$part" python - <<'PY'
          import os
          import gdown

          result = gdown.download(
              id=os.environ["CUT3R_CHECKPOINT_GDRIVE_ID"],
              output=os.environ["PART"],
              quiet=False,
          )
          if result is None:
              raise SystemExit("gdown did not produce the frozen CUT3R checkpoint")
          PY
              test "$(sha256sum "$part" | awk '{print $1}')" = \
                "$CUT3R_CHECKPOINT_SHA256"
              /usr/bin/mv -- "$part" "$selected"
            fi
          fi
          test "$(sha256sum "$selected" | awk '{print $1}')" = \
            "$CUT3R_CHECKPOINT_SHA256"
          echo "path=$selected" >> "$GITHUB_OUTPUT"
          stat -c 'checkpoint_bytes=%s' "$selected"

      - name: Resolve, download, and verify official R11-R30 archives
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          cache="$RUNTIME_CACHE_ROOT/dot-v29"
          /usr/bin/mkdir -p "$cache"
          ARCHIVE_TABLE="$root/tmp/archives.tsv" \
            RECEIPT="$root/evidence/official-archives.json" \
            python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          expected = {
              os.environ["R11_ARCHIVE"]: os.environ["R11_MD5"],
              os.environ["R21_ARCHIVE"]: os.environ["R21_MD5"],
          }
          request = urllib.request.Request(
              os.environ["DATASET_API"],
              headers={"User-Agent": "Prob4D-DOT-R11-R30-provider/1"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)
          if metadata.get("status") != "OK":
              raise SystemExit("Dataverse metadata request did not return OK")
          files = metadata["data"]["latestVersion"]["files"]
          by_name = {entry["dataFile"]["filename"]: entry["dataFile"] for entry in files}
          rows = []
          receipt = {}
          for name, md5 in expected.items():
              data_file = by_name.get(name)
              if data_file is None:
                  raise SystemExit(f"official DOT metadata lacks {name}")
              checksum = data_file.get("checksum") or {}
              if checksum.get("type") != "MD5" or checksum.get("value", "").lower() != md5:
                  raise SystemExit(f"official checksum changed for {name}")
              item = {
                  "datafile_id": int(data_file["id"]),
                  "byte_count": int(data_file["filesize"]),
                  "checksum": checksum,
              }
              receipt[name] = item
              rows.append((name, item["datafile_id"], item["byte_count"], md5))
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(os.environ["ARCHIVE_TABLE"]).write_text(
              "".join(f"{name}\t{file_id}\t{size}\t{md5}\n" for name, file_id, size, md5 in rows),
              encoding="utf-8",
          )
          PY

          while IFS=$'\t' read -r name file_id bytes md5; do
            archive="$cache/$name"
            valid=false
            if [[ -f "$archive" && "$(stat -c %s "$archive")" = "$bytes" ]]; then
              measured=$(md5sum "$archive" | awk '{print $1}')
              [[ "$measured" = "$md5" ]] && valid=true
            fi
            if [[ "$valid" != true ]]; then
              part="$archive.partial"
              if [[ -f "$part" ]]; then
                part_bytes=$(stat -c %s "$part")
                if (( part_bytes > bytes )); then
                  /usr/bin/rm -f -- "$part"
                fi
              fi
              curl --fail --location --retry 8 --retry-all-errors \
                --connect-timeout 30 --continue-at - \
                --output "$part" "$DATAFILE_API_ROOT/$file_id"
              test "$(stat -c %s "$part")" = "$bytes"
              printf '%s  %s\n' "$md5" "$part" | md5sum --check --strict
              /usr/bin/mv -- "$part" "$archive"
            fi
            test "$(stat -c %s "$archive")" = "$bytes"
            printf '%s  %s\n' "$md5" "$archive" | md5sum --check --strict
          done < "$root/tmp/archives.tsv"
          echo "root=$cache" >> "$GITHUB_OUTPUT"

      - name: Build and attest native CUT3R RoPE in an isolated checkout
        id: rope
        shell: bash
        env:
          RUNTIME_PYTHON: ${{ steps.runtime.outputs.python }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          checkout="$root/CUT3R"
          /usr/bin/mkdir -p "$checkout"
          /usr/bin/cp -a external/CUT3R/. "$checkout/"
          test "$(/usr/bin/git -C "$checkout" rev-parse HEAD)" = "$CUT3R_REVISION"
          /usr/bin/find "$checkout/src/croco/models/curope" \
            -maxdepth 1 -type f -name '*.so' -delete
          /usr/bin/rm -rf -- "$checkout/src/croco/models/curope/build"

          nvcc=""
          for candidate in \
            "$(command -v nvcc || true)" \
            /usr/local/cuda/bin/nvcc \
            /usr/local/cuda-12.6/bin/nvcc \
            /usr/local/cuda-12.8/bin/nvcc
          do
            if [[ -x "$candidate" ]]; then
              nvcc="$candidate"
              break
            fi
          done
          test -n "$nvcc" || {
            echo "native RoPE requires an available nvcc compiler" >&2
            exit 2
          }
          cuda_home=$(/usr/bin/dirname "$(/usr/bin/dirname "$nvcc")")
          arch=$(
            "$RUNTIME_PYTHON" - <<'PY'
          import torch
          major, minor = torch.cuda.get_device_capability(0)
          print(f"{major}.{minor}")
          PY
          )
          "$nvcc" --version
          CUDA_HOME="$cuda_home" \
            TORCH_CUDA_ARCH_LIST="$arch" \
            MAX_JOBS=4 \
            PYTHONPATH="$GITHUB_WORKSPACE/src:$checkout:$checkout/src" \
            "$RUNTIME_PYTHON" \
            scripts/science/prepare_cut3r_runtime.py \
              --cut3r-checkout "$checkout" \
              --build \
              --output "$root/evidence/runtime-receipt.json"
          echo "checkout=$checkout" >> "$GITHUB_OUTPUT"

      - name: Enable the hash-pinned legacy checkpoint loader
        shell: bash
        env:
          CHECKPOINT_PATH: ${{ steps.checkpoint.outputs.path }}
          CUT3R_CHECKOUT: ${{ steps.rope.outputs.checkout }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          checkout = Path(os.environ["CUT3R_CHECKOUT"]).resolve(strict=True)
          checkpoint = Path(os.environ["CHECKPOINT_PATH"]).resolve(strict=True)
          if hashlib.sha256(checkpoint.read_bytes()).hexdigest() != os.environ["CUT3R_CHECKPOINT_SHA256"]:
              raise SystemExit("checkpoint digest changed before compatibility patch")
          path = checkout / "src/dust3r/model.py"
          source = path.read_bytes()
          framed = f"blob {len(source)}\0".encode("ascii") + source
          blob = hashlib.sha1(framed, usedforsecurity=False).hexdigest()
          if blob != "7ed9f6106fb063686990c874ede99876ebc939ab":
              raise SystemExit("CUT3R model source blob changed")
          original = '    ckpt = torch.load(model_path, map_location="cpu")\n'
          replacement = (
              '    ckpt = torch.load(model_path, map_location="cpu", '
              'weights_only=False)\n'
          )
          text = source.decode("utf-8")
          if text.count(original) != 1 or replacement in text:
              raise SystemExit("CUT3R checkpoint loader shape changed")
          patched = text.replace(original, replacement, 1).encode("utf-8")
          path.write_bytes(patched)
          receipt = {
              "schema": "prob4d.dot-r11-r30-checkpoint-compatibility",
              "schema_version": 1,
              "cut3r_revision": os.environ["CUT3R_REVISION"],
              "checkpoint_sha256": os.environ["CUT3R_CHECKPOINT_SHA256"],
              "source_git_blob_sha1": blob,
              "source_sha256": hashlib.sha256(source).hexdigest(),
              "patched_sha256": hashlib.sha256(patched).hexdigest(),
              "torch_load_policy": "weights_only=False only at the pinned loader",
          }
          encoded = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["artifact_id"] = hashlib.sha256(encoded).hexdigest()
          output = Path("${{ steps.workspace.outputs.root }}/evidence/checkpoint-load-compatibility.json")
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Predict R11-R30 from normal-view images only
        id: execute
        continue-on-error: true
        shell: bash
        env:
          RUNTIME_PYTHON: ${{ steps.runtime.outputs.python }}
          CHECKPOINT_PATH: ${{ steps.checkpoint.outputs.path }}
          DATASET_ROOT: ${{ steps.dataset.outputs.root }}
          CUT3R_CHECKOUT: ${{ steps.rope.outputs.checkout }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science:$CUT3R_CHECKOUT:$CUT3R_CHECKOUT/src" \
            "$RUNTIME_PYTHON" \
            scripts/science/run_dot_rope_query_selective_heldout.py \
              predict \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$DATASET_ROOT" \
              --cut3r-checkout "$CUT3R_CHECKOUT" \
              --checkpoint "$CHECKPOINT_PATH" \
              --runtime-receipt "$root/evidence/runtime-receipt.json" \
              --output-dir "$root/provider/bundle"

      - name: Read sealed provider result
        id: result
        if: always()
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          manifest="$root/provider/bundle/manifest.json"
          if [[ "$EXECUTION_OUTCOME" != "success" || ! -f "$manifest" ]]; then
            ROOT="$root/provider" OUTCOME="${EXECUTION_OUTCOME:-not-run}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          (root / "technical-failure.json").write_text(
              json.dumps(
                  {
                      "decision": "technical-failure",
                      "execution_outcome": os.environ["OUTCOME"],
                      "marker_payloads_opened": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            echo "decision=technical-failure" >> "$GITHUB_OUTPUT"
            echo "provider_bundle_id=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MANIFEST="$manifest" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          if value.get("decision") != "sealed-r11-r30-provider-predictions":
              raise SystemExit("R11-R30 provider did not seal predictions")
          bundle_id = value.get("provider_bundle_id", "")
          if re.fullmatch(r"[0-9a-f]{64}", bundle_id) is None:
              raise SystemExit("R11-R30 provider bundle identity is invalid")
          boundary = value.get("information_boundary") or {}
          if boundary.get("two_dimensional_markers_opened") is not False:
              raise SystemExit("provider opened 2-D markers")
          if boundary.get("three_dimensional_markers_opened") is not False:
              raise SystemExit("provider opened 3-D markers")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("decision=sealed-r11-r30-provider-predictions\n")
              output.write(f"provider_bundle_id={bundle_id}\n")
          PY
          /usr/bin/chmod -R a-w "$root/provider"

      - name: Upload immutable R11-R30 provider bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dot-rope-query-selective-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider/
          if-no-files-found: error
          retention-days: 30

      - name: Upload bounded gpuserver6000 runtime receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dot-rope-query-selective-runtime-gpuserver6000-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Require sealed provider predictions
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          test "$DECISION" = "sealed-r11-r30-provider-predictions"

      - name: Remove isolated provider workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          expected="${RUNNER_TEMP}/prob4d-dot-r11-r30-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/chmod -R u+w "$root" 2>/dev/null || true
          /usr/bin/rm -rf -- "$root"

  seal:
    name: Seal factors and query decisions from 2-D markers only
    if: github.event_name == 'push'
    needs: [authorize, provider]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      seal_id: ${{ steps.result.outputs.seal_id }}
      supported_sequences: ${{ steps.result.outputs.supported_sequences }}
    steps:
      - name: Initialize isolated factor-seal workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prob4d-dot-query-seal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$root"
          mkdir -p "$root/provider" "$root/dataset" "$root/seal"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          clean: true
      - name: Set up scientific Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact repository package
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Download exact provider bundle from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dot-rope-query-selective-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider
      - name: Resolve official R11-20 and R21-30 identities
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.workspace.outputs.root }}" python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          expected = {
              os.environ["R11_ARCHIVE"]: os.environ["R11_MD5"],
              os.environ["R21_ARCHIVE"]: os.environ["R21_MD5"],
          }
          request = urllib.request.Request(
              os.environ["DATASET_API"],
              headers={"User-Agent": "Prob4D-DOT-query-selective/1"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)
          files = metadata["data"]["latestVersion"]["files"]
          by_name = {entry["dataFile"]["filename"]: entry["dataFile"] for entry in files}
          receipt = {}
          outputs = {}
          for index, (name, md5) in enumerate(expected.items(), start=1):
              data_file = by_name.get(name)
              if data_file is None:
                  raise SystemExit(f"official DOT metadata lacks {name}")
              checksum = data_file.get("checksum", {})
              if checksum.get("type") != "MD5" or checksum.get("value", "").lower() != md5:
                  raise SystemExit(f"official checksum changed for {name}")
              receipt[name] = {
                  "datafile_id": int(data_file["id"]),
                  "byte_count": int(data_file["filesize"]),
                  "checksum": checksum,
              }
              outputs[f"archive_{index}_id"] = int(data_file["id"])
              outputs[f"archive_{index}_bytes"] = int(data_file["filesize"])
          Path(os.environ["ROOT"], "seal", "official-archives.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Download and verify official target archives
        shell: bash
        env:
          ARCHIVE_1_ID: ${{ steps.archives.outputs.archive_1_id }}
          ARCHIVE_1_BYTES: ${{ steps.archives.outputs.archive_1_bytes }}
          ARCHIVE_2_ID: ${{ steps.archives.outputs.archive_2_id }}
          ARCHIVE_2_BYTES: ${{ steps.archives.outputs.archive_2_bytes }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}/dataset"
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 \
            --output "$root/$R11_ARCHIVE" "$DATAFILE_API_ROOT/$ARCHIVE_1_ID"
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 \
            --output "$root/$R21_ARCHIVE" "$DATAFILE_API_ROOT/$ARCHIVE_2_ID"
          test "$(stat -c %s "$root/$R11_ARCHIVE")" = "$ARCHIVE_1_BYTES"
          test "$(stat -c %s "$root/$R21_ARCHIVE")" = "$ARCHIVE_2_BYTES"
          printf '%s  %s\n' "$R11_MD5" "$root/$R11_ARCHIVE" | md5sum --check --strict
          printf '%s  %s\n' "$R21_MD5" "$root/$R21_ARCHIVE" | md5sum --check --strict
      - name: Seal factor fits, admission, and predictions without 3-D access
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            python scripts/science/run_dot_rope_query_selective_heldout.py \
              seal \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$root/dataset" \
              --provider-bundle "$root/provider/bundle" \
              --output-dir "$root/seal/predictions"
      - name: Validate immutable prediction seal
        id: result
        shell: bash
        run: |
          set -euo pipefail
          seal="${{ steps.workspace.outputs.root }}/seal/predictions/prediction-seal.json"
          SEAL="$seal" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SEAL"])
          value = json.loads(path.read_text(encoding="utf-8"))
          supplied = value["seal_id"]
          unsigned = dict(value)
          unsigned.pop("seal_id")
          canonical = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(canonical).hexdigest() != supplied:
              raise SystemExit("prediction seal identity mismatch")
          if re.fullmatch(r"[0-9a-f]{64}", supplied) is None:
              raise SystemExit("prediction seal ID is invalid")
          boundary = value.get("information_boundary") or {}
          if boundary.get("three_dimensional_markers_opened") is not False:
              raise SystemExit("factor stage opened 3-D markers")
          if boundary.get("predictions_and_admission_complete") is not True:
              raise SystemExit("factor stage did not complete predictions")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"seal_id={supplied}\n")
              output.write(f"supported_sequences={len(value['supported_sequences'])}\n")
          PY
          chmod a-w "$seal"
      - name: Upload content-addressed prediction seal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-rope-query-selective-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/seal/
          if-no-files-found: error
          retention-days: 30

  evaluate:
    name: Open R11-R30 3-D outcomes and score the frozen predictions once
    if: github.event_name == 'push'
    needs: [authorize, provider, seal]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      result_id: ${{ steps.result.outputs.result_id }}
    steps:
      - name: Initialize isolated outcome workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prob4d-dot-query-evaluate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$root"
          mkdir -p "$root/provider" "$root/seal" "$root/dataset" "$root/evidence"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          clean: true
      - name: Set up scientific Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact repository package
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Download exact provider and prediction seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dot-rope-query-selective-*
          path: ${{ steps.workspace.outputs.root }}/artifacts
          merge-multiple: false
      - name: Stage exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          cp -a "$root/artifacts/dot-rope-query-selective-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/." "$root/provider/"
          cp -a "$root/artifacts/dot-rope-query-selective-seal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/." "$root/seal/"
          test -f "$root/provider/bundle/manifest.json"
          test -f "$root/seal/predictions/prediction-seal.json"
      - name: Resolve, download, and verify official target archives
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}/dataset"
          ROOT="$root" python - <<'PY' > "$RUNNER_TEMP/dot-query-archives.tsv"
          import json
          import os
          import urllib.request

          expected = {
              os.environ["R11_ARCHIVE"]: os.environ["R11_MD5"],
              os.environ["R21_ARCHIVE"]: os.environ["R21_MD5"],
          }
          request = urllib.request.Request(
              os.environ["DATASET_API"],
              headers={"User-Agent": "Prob4D-DOT-query-selective/1"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)
          files = metadata["data"]["latestVersion"]["files"]
          by_name = {entry["dataFile"]["filename"]: entry["dataFile"] for entry in files}
          for name, md5 in expected.items():
              data_file = by_name.get(name)
              checksum = (data_file or {}).get("checksum", {})
              if checksum.get("type") != "MD5" or checksum.get("value", "").lower() != md5:
                  raise SystemExit(f"official archive identity changed for {name}")
              print(name, int(data_file["id"]), int(data_file["filesize"]), md5, sep="\t")
          PY
          while IFS=$'\t' read -r name file_id bytes md5; do
            curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 \
              --output "$root/$name" "$DATAFILE_API_ROOT/$file_id"
            test "$(stat -c %s "$root/$name")" = "$bytes"
            printf '%s  %s\n' "$md5" "$root/$name" | md5sum --check --strict
          done < "$RUNNER_TEMP/dot-query-archives.tsv"
      - name: Score the already sealed predictions against 3-D outcomes
        id: execute
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            python scripts/science/run_dot_rope_query_selective_heldout.py \
              evaluate \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$root/dataset" \
              --provider-bundle "$root/provider/bundle" \
              --prediction-seal "$root/seal/predictions/prediction-seal.json" \
              --output-dir "$root/evidence/result"
      - name: Read bounded terminal outcome
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}/evidence/result"
          ROOT="$root" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          complete = root / "result.json"
          failed = root / "failure.json"
          if complete.is_file():
              value = json.loads(complete.read_text(encoding="utf-8"))
              decision = value["decision"]
              result_id = value["result_id"]
          elif failed.is_file():
              value = json.loads(failed.read_text(encoding="utf-8"))
              decision = value["decision"]
              result_id = value["result_id"]
          else:
              raise SystemExit("query-selective evaluation emitted no bounded result")
          allowed = {
              "query-selective-strong-positive",
              "query-selective-bounded-positive",
              "query-selective-mixed-negative-or-insufficient-support",
              "technical-failure",
          }
          if decision not in allowed:
              raise SystemExit("query-selective decision is unsupported")
          if re.fullmatch(r"[0-9a-f]{64}", result_id) is None:
              raise SystemExit("query-selective result identity is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={decision}\n")
              output.write(f"result_id={result_id}\n")
          PY
      - name: Upload content-addressed terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-rope-query-selective-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require a scientific terminal result
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          case "$DECISION" in
            query-selective-strong-positive|query-selective-bounded-positive|query-selective-mixed-negative-or-insufficient-support)
              ;;
            *)
              exit 2
              ;;
          esac

  publish:
    name: Publish frozen R11-R30 terminal decision
    if: always() && github.event_name == 'push'
    needs: [prerequisite, provider, seal, evaluate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write run summary
        shell: bash
        env:
          PREREQUISITE_DECISION: ${{ needs.prerequisite.outputs.decision }}
          PROVIDER_RESULT: ${{ needs.provider.result }}
          PROVIDER_DECISION: ${{ needs.provider.outputs.decision }}
          SEAL_ID: ${{ needs.seal.outputs.seal_id }}
          SUPPORTED: ${{ needs.seal.outputs.supported_sequences }}
          EVALUATION_RESULT: ${{ needs.evaluate.result }}
          DECISION: ${{ needs.evaluate.outputs.decision }}
          RESULT_ID: ${{ needs.evaluate.outputs.result_id }}
        run: |
          {
            echo "## DOT R11-R30 query-selective CUT3R experiment"
            echo
            echo "- R04-R10 prerequisite: \`$PREREQUISITE_DECISION\`"
            echo "- provider job: \`$PROVIDER_RESULT\`"
            echo "- provider decision: \`$PROVIDER_DECISION\`"
            echo "- prediction seal: \`$SEAL_ID\`"
            echo "- supported sequences at seal: \`$SUPPORTED/20\`"
            echo "- evaluation job: \`$EVALUATION_RESULT\`"
            echo "- terminal decision: \`$DECISION\`"
            echo "- result ID: \`$RESULT_ID\`"
            echo
            echo "R31-R70 remained unopened. No target-side tuning, BayesianPhysTwin, or Causal4D execution was authorized."
          } >> "$GITHUB_STEP_SUMMARY"
