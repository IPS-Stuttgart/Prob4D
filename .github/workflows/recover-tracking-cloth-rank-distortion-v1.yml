name: Recover Tracking Cloth rank-distortion capsule

on:
  push:
    branches:
      - science/tracking-cloth-rank-distortion-frontier-v1
    paths:
      - ".github/workflows/recover-tracking-cloth-rank-distortion-v1.yml"

permissions:
  contents: write

jobs:
  recover:
    if: >-
      github.actor == 'FlorianPfaff' &&
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref_name == 'science/tracking-cloth-rank-distortion-frontier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out empirical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-rank-distortion-frontier-v1
          persist-credentials: true
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Recover preregistered payloads from bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import textwrap
          from pathlib import Path

          bootstrap = Path(
              ".github/workflows/bootstrap-tracking-cloth-rank-distortion-v1.yml"
          ).read_text(encoding="utf-8")
          start = bootstrap.index("          payloads = {")
          end = bootstrap.index(
              "\n          for relative, payload in payloads.items():", start
          )
          namespace: dict[str, object] = {}
          exec(textwrap.dedent(bootstrap[start:end]), {}, namespace)
          payloads = namespace["payloads"]
          if not isinstance(payloads, dict) or len(payloads) != 5:
              raise RuntimeError("bootstrap payload registry is malformed")
          for relative, payload in payloads.items():
              if not isinstance(relative, str) or not isinstance(payload, str):
                  raise RuntimeError("bootstrap payload entry is malformed")
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Install development environment
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply deterministic source-quality fixes
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/science/run_tracking_cloth_rank_distortion_frontier_v1.py
          test=tests/test_tracking_cloth_rank_distortion_frontier_v1.py
          python -m ruff format "$script" "$test"
          python -m ruff check --fix "$script" "$test"
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/science/run_tracking_cloth_rank_distortion_frontier_v1.py"
          )
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one source-quality replacement, found {count}: {old!r}"
                  )
              text = text.replace(old, new)

          replace_once(
              '''        f"- Accepted recordings: {result['inventory']['accepted_recording_count']} / {result['inventory']['csv_file_count']}",''',
              '''        "".join(
              (
                  "- Accepted recordings: ",
                  str(result["inventory"]["accepted_recording_count"]),
                  " / ",
                  str(result["inventory"]["csv_file_count"]),
              )
          ),''',
          )
          replace_once(
              '''        f"- Maximum independent frontier-identity error: {aggregate['maximum_identity_relative_error']:.3e}",''',
              '''        "".join(
              (
                  "- Maximum independent frontier-identity error: ",
                  f"{aggregate['maximum_identity_relative_error']:.3e}",
              )
          ),''',
          )
          replace_once(
              '''        f"## Primary average trace budget: {primary['trace_budget_per_query_dimension']:.3f} per query dimension",''',
              '''        "".join(
              (
                  "## Primary average trace budget: ",
                  f"{primary['trace_budget_per_query_dimension']:.3f}",
                  " per query dimension",
              )
          ),''',
          )
          replace_once(
              '''        f"- Strict rank savings versus response SVD: {primary['strict_rank_savings_vs_response_svd_count']} / {primary['case_count']}",''',
              '''        "".join(
              (
                  "- Strict rank savings versus response SVD: ",
                  str(primary["strict_rank_savings_vs_response_svd_count"]),
                  " / ",
                  str(primary["case_count"]),
              )
          ),''',
          )
          replace_once(
              '''        f"- Strict rank savings versus factor PCA: {primary['strict_rank_savings_vs_factor_pca_count']} / {primary['case_count']}",''',
              '''        "".join(
              (
                  "- Strict rank savings versus factor PCA: ",
                  str(primary["strict_rank_savings_vs_factor_pca_count"]),
                  " / ",
                  str(primary["case_count"]),
              )
          ),''',
          )
          replace_once(
              '''        "| Size | Query markers | Q dim | Original rank | Exact rank | Optimal rank | Response-SVD rank | Factor-PCA rank |",''',
              '''        "".join(
              (
                  "| Size | Query markers | Q dim | Original rank | Exact rank | ",
                  "Optimal rank | Response-SVD rank | Factor-PCA rank |",
              )
          ),''',
          )
          replace_once(
              '''            "| {size} | {count} | {qdim} | {original} | {exact:.2f} | {optimal:.2f} | {svd:.2f} | {pca:.2f} |".format(''',
              '''            "".join(
                  (
                      "| {size} | {count} | {qdim} | {original} | {exact:.2f} | ",
                      "{optimal:.2f} | {svd:.2f} | {pca:.2f} |",
                  )
              ).format(''',
          )
          replace_once(
              '''        "Observed RMSE, NEES, coverage, and NLL are diagnostics rather than enforced superiority claims. All same-rank methods have identical factor/projection scalar counts.",''',
              '''        "".join(
              (
                  "Observed RMSE, NEES, coverage, and NLL are diagnostics rather ",
                  "than enforced superiority claims. All same-rank methods have ",
                  "identical factor/projection scalar counts.",
              )
          ),''',
          )
          replace_once(
              '''        "This pilot does not preserve observation likelihood, establish recursive exactness, validate a learned 4D provider, or demonstrate BayesianPhysTwin/Causal4D control benefit.",''',
              '''        "".join(
              (
                  "This pilot does not preserve observation likelihood, establish ",
                  "recursive exactness, validate a learned 4D provider, or ",
                  "demonstrate BayesianPhysTwin/Causal4D control benefit.",
              )
          ),''',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format "$script" "$test"
          python -m ruff check "$script" "$test"

      - name: Validate theorem and empirical controls
        run: |
          python -m pytest -q \
            tests/test_posterior_rank_distortion.py \
            tests/test_tracking_cloth_query_portfolio_v1.py \
            tests/test_tracking_cloth_rank_distortion_frontier_v1.py \
            -k 'not self_hosted_workflow_is_push_only_and_fail_closed'
          python -m compileall -q \
            scripts/science/run_tracking_cloth_rank_distortion_frontier_v1.py

      - name: Commit validated empirical capsule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_tracking_cloth_rank_distortion_frontier_v1.py \
            tests/test_tracking_cloth_rank_distortion_frontier_v1.py \
            protocols/tracking-cloth-rank-distortion-frontier-v1.json \
            protocols/execution_requests/tracking_cloth_rank_distortion_frontier_v1.json \
            docs/tracking-cloth-rank-distortion-frontier-v1.md
          git commit -m "Add recording-disjoint rank-distortion study"
          git push origin HEAD:science/tracking-cloth-rank-distortion-frontier-v1
