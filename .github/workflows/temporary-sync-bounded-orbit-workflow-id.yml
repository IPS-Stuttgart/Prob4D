name: Temporary sync bounded-orbit workflow identity

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-sync-bounded-orbit-workflow-id.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          clean: true
      - name: Patch workflow protocol identity and trigger execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".github/workflows/temporary-tracking-cloth-bounded-orbit-robustness-v1.yml"
          )
          text = path.read_text(encoding="utf-8")
          old = "5034c1affda01d93c475078a52126113d6c938973692f544abb665b473a5861c"
          new = "6b372b78329a809aee508a68ffd51abeb945fc941c0db29ca996459ddf52f711"
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(
              "# Corrected parent-protocol provenance binding.\n" + text,
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-tracking-cloth-bounded-orbit-robustness-v1.yml
          git commit -m "Run corrected bounded-orbit robustness protocol"
          git push origin HEAD:repair/tracking-cloth-finite-orbit-motive-parser-v1
