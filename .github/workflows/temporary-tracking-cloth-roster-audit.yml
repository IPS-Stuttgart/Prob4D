name: Temporary Tracking Cloth roster audit

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-tracking-cloth-roster-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZENODO_URL: https://zenodo.org/records/14644526/files/tracking_dataset.zip?download=1
  ZENODO_MD5: b4868b702f8a42b2ea1069d0f1a3b8f6

jobs:
  audit-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Download verified archive and inspect filenames only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tracking-cloth-roster-audit"
          rm -rf -- "$root"
          mkdir -p "$root"
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --output "$root/tracking_dataset.zip" "$ZENODO_URL"
          printf '%s  %s\n' "$ZENODO_MD5" "$root/tracking_dataset.zip" \
            | md5sum --check --strict
          ROOT="$root" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          archive = root / "tracking_dataset.zip"
          with zipfile.ZipFile(archive) as stream:
              names = sorted(
                  name for name in stream.namelist()
                  if name.lower().endswith(".csv") and not name.endswith("/")
              )
          if len(names) != 120:
              raise SystemExit(f"expected 120 CSVs, found {len(names)}")

          def tokens(name: str):
              return [value for value in re.split(r"[^a-z0-9]+", name.lower()) if value]

          rows = []
          counts = Counter()
          for name in names:
              values = tokens(name)
              material = next(
                  (value for value in ("cotton", "denim", "wool", "polyester") if value in values),
                  "unknown",
              )
              size = next((value.upper() for value in ("a2", "a3") if value in values), "unknown")
              phase = (
                  "source"
                  if any(value in values for value in ("shake", "shaking", "twist", "twisting"))
                  else "target"
              )
              support_mode = (
                  "hands" if "hands" in values else "hanger" if "hanger" in values else "other"
              )
              counts[(phase, material, size, support_mode)] += 1
              rows.append({
                  "recording_id": hashlib.sha256(name.encode()).hexdigest()[:16],
                  "name": name,
                  "phase": phase,
                  "material": material,
                  "size": size,
                  "support_mode": support_mode,
              })
          summary = [
              {
                  "phase": key[0],
                  "material": key[1],
                  "size": key[2],
                  "support_mode": key[3],
                  "count": value,
              }
              for key, value in sorted(counts.items())
          ]
          eligible = [
              row for row in rows
              if row["material"] in {"cotton", "denim", "wool"}
          ]
          result = {
              "schema": "prob4d.tracking-cloth-roster-audit.v1",
              "archive_md5": os.environ["ZENODO_MD5"],
              "csv_count": len(rows),
              "rows": rows,
              "counts": summary,
              "canonical_label_materials": ["cotton", "denim", "wool"],
              "canonical_source_count": sum(row["phase"] == "source" for row in eligible),
              "canonical_target_count": sum(row["phase"] == "target" for row in eligible),
              "target_trajectory_values_opened": False,
              "archive_members_opened": False,
          }
          (root / "roster.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          archive.unlink()
          PY
      - name: Upload filename-only roster evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-roster-${{ github.run_id }}
          path: ${{ runner.temp }}/tracking-cloth-roster-audit/roster.json
          if-no-files-found: error
          retention-days: 7
