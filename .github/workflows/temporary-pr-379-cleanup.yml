name: Temporary PR 379 cleanup

on:
  push:
    branches:
      - science/deform360-query-pilot-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: science/deform360-query-pilot-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply mechanical quality cleanup
        shell: bash
        run: |
          python -m pip install ruff==0.16.1
          files=(
            scripts/science/audit_deform360_query_carriers_v1.py
            scripts/science/evaluate_deform360_finite_orbit_v1.py
            scripts/science/evaluate_deform360_finite_orbit_v2.py
            scripts/science/materialize_deform360_trajectory_archives_v2.py
          )
          python -m ruff check --fix -- "${files[@]}" || true
          python -m ruff format -- "${files[@]}"
          python -m ruff check --add-noqa -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          rm .github/workflows/deform360-finite-orbit-real-data-v2.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/science
          git add -u .github/workflows/deform360-finite-orbit-real-data-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix PR 379 Ruff hygiene and retire completed self-hosted workflow'
          git push origin HEAD:science/deform360-query-pilot-v1
