name: Format cross-provider files canonically

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/format-cross-provider-files.yml"

permissions:
  contents: write

concurrency:
  group: format-cross-provider-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format and verify only the new Python files
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-cross-provider-format-venv"
          python -m venv --clear "$environment"
          "$environment/bin/python" -m pip install "ruff==0.16.1"
          files=(
            src/prob4d/cross_provider_guard.py
            tests/test_cross_provider_guard.py
          )
          "$environment/bin/python" -m ruff format -- "${files[@]}"
          "$environment/bin/python" -m ruff check -- "${files[@]}"
          "$environment/bin/python" -m ruff format --check --diff -- "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Format cross-provider guard files"
          git push origin HEAD:agent/cross-provider-guard-v1
