name: Replayable selection evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/selection-evidence.yml"
      - "docs/selection-evidence.md"
      - "src/prob4d/_selection_evidence_common.py"
      - "src/prob4d/_selection_evidence_records.py"
      - "src/prob4d/_selection_evidence_replay.py"
      - "src/prob4d/selection_evidence.py"
      - "tests/test_selection_evidence.py"
      - "tests/test_selection_evidence_claim_boundary.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selection-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  focused-contract:
    name: Target-blind selection and exact fallback contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py \
            tests/test_selection_evidence_claim_boundary.py
          python -m mypy \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
      - name: Run replay and tamper regressions
        run: |
          python -m pytest -q \
            tests/test_selection_evidence.py \
            tests/test_selection_evidence_claim_boundary.py
      - name: Verify installed public module
        run: |
          python - <<'PY'
          from prob4d.selection_evidence import (
              SELECTION_CLAIM_BOUNDARY,
              SELECTION_EVIDENCE_VERSION,
              SelectionEvidenceBundleV2,
          )

          assert SELECTION_EVIDENCE_VERSION == 2
          assert "frozen target analysis" in SELECTION_CLAIM_BOUNDARY
          assert SelectionEvidenceBundleV2.__name__.endswith("V2")
          PY
