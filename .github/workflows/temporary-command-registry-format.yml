name: Temporary command-registry formatter

on:
  push:
    branches:
      - agent/command-registry-v1
    paths:
      - .github/workflows/temporary-command-registry-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/command-registry-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply and verify formatter output
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          python -m ruff format \
            src/prob4d/_anchor_common_bias_study_impl.py \
            tests/test_anchor_common_bias_study.py
          python -m ruff check \
            src/prob4d/_anchor_common_bias_study_impl.py \
            tests/test_anchor_common_bias_study.py
          python -m ruff format --check \
            src/prob4d/_anchor_common_bias_study_impl.py \
            tests/test_anchor_common_bias_study.py
      - name: Commit formatting-only changes
        run: |
          set -euo pipefail
          git add \
            src/prob4d/_anchor_common_bias_study_impl.py \
            tests/test_anchor_common_bias_study.py
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format anchor common-bias sources'
          git push origin HEAD:agent/command-registry-v1
