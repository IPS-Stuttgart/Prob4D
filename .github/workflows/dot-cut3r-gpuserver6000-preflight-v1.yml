name: DOT CUT3R gpuserver6000 preflight v1

on:
  push:
    branches:
      - ops/dot-cut3r-gpuserver6000-preflight-v1
    paths:
      - ".github/workflows/dot-cut3r-gpuserver6000-preflight-v1.yml"

permissions:
  contents: read

concurrency:
  group: dot-cut3r-gpuserver6000-preflight-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_RUNNER_NAME: workstation2
  EXPECTED_CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  EXPECTED_CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  ARCHIVE_NAME: R01-10.zip
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  inventory:
    name: Inventory held-out execution assets on gpuserver6000
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/ops/dot-cut3r-gpuserver6000-preflight-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 45
    steps:
      - name: Initialize bounded evidence directory
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/dot-cut3r-gpuserver6000-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Inventory runner, dataset mounts, runtime, and CUDA
        shell: bash
        env:
          OUTPUT: ${{ steps.workspace.outputs.root }}/preflight.json
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          from typing import Any

          expected_runner = os.environ["EXPECTED_RUNNER_NAME"]
          expected_revision = os.environ["EXPECTED_CUT3R_REVISION"]
          expected_checkpoint = os.environ["EXPECTED_CHECKPOINT_SHA256"]
          archive_name = os.environ["ARCHIVE_NAME"]

          def run(command: list[str], *, timeout: int = 30) -> dict[str, Any]:
              try:
                  completed = subprocess.run(
                      command,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                  )
                  return {
                      "command": command,
                      "returncode": completed.returncode,
                      "stdout": completed.stdout.strip()[-4000:],
                      "stderr": completed.stderr.strip()[-4000:],
                  }
              except Exception as error:
                  return {"command": command, "error": f"{type(error).__name__}: {error}"}

          candidate_roots = [
              "/mnt/seagate10tb/florianpfaff/datasets/dot",
              "/mnt/seagate10tb/florianpfaff/datasets/dot-rope",
              "/mnt/lexar4tb/datasets/dot",
              "/mnt/lexar4tb/datasets/dot-rope",
              "/home/florianpfaff/datasets/dot-rope",
              "/home/github-runner/.cache/workflows/dot-rope",
              "/home/github-runner/.cache/datasets/dot",
          ]
          candidate_roots.extend(glob.glob("/mnt/*/florianpfaff/datasets/dot*"))
          candidate_roots.extend(glob.glob("/mnt/*/datasets/dot*"))
          candidate_roots = sorted(dict.fromkeys(candidate_roots))

          datasets: list[dict[str, Any]] = []
          for raw in candidate_roots:
              path = pathlib.Path(raw)
              resolved = None
              try:
                  resolved = str(path.resolve(strict=True))
              except Exception:
                  pass
              archive = path / archive_name
              record: dict[str, Any] = {
                  "requested": raw,
                  "resolved": resolved,
                  "exists": path.exists(),
                  "is_dir": path.is_dir(),
                  "is_symlink": path.is_symlink(),
                  "archive_exists": archive.is_file(),
                  "archive_readable": os.access(archive, os.R_OK),
              }
              if archive.is_file():
                  stat = archive.stat()
                  record["archive_size_bytes"] = stat.st_size
                  record["archive_mtime_ns"] = stat.st_mtime_ns
              datasets.append(record)

          runtime_roots = [
              pathlib.Path("/home/github-runner/.cache/prob4d/cut3r-runtime-v1"),
          ]
          for pattern in (
              "/home/github-runner/.cache/**/cut3r-runtime*",
              "/mnt/*/**/cut3r-runtime*",
          ):
              for value in glob.glob(pattern, recursive=True):
                  path = pathlib.Path(value)
                  if len(path.parts) <= 9:
                      runtime_roots.append(path)
          runtime_roots = list(dict.fromkeys(runtime_roots))

          runtimes: list[dict[str, Any]] = []
          for root in runtime_roots:
              checkout = root / "CUT3R"
              python = root / "venv/bin/python"
              checkpoint = root / "cut3r_512_dpt_4_64.pth"
              manifest = root / "bootstrap-manifest.json"
              record: dict[str, Any] = {
                  "root": str(root),
                  "root_exists": root.is_dir(),
                  "checkout_exists": (checkout / ".git").is_dir(),
                  "python_executable": python.is_file() and os.access(python, os.X_OK),
                  "checkpoint_exists": checkpoint.is_file(),
                  "manifest_exists": manifest.is_file(),
              }
              if (checkout / ".git").is_dir():
                  git_result = run(["git", "-C", str(checkout), "rev-parse", "HEAD"])
                  record["git"] = git_result
                  record["revision_matches"] = git_result.get("stdout") == expected_revision
              if python.is_file() and os.access(python, os.X_OK):
                  probe = run([
                      str(python),
                      "-c",
                      (
                          "import json,sys; import numpy; import torch; "
                          "print(json.dumps({'python':sys.version.split()[0],"
                          "'numpy':numpy.__version__,'torch':torch.__version__,"
                          "'torch_cuda':torch.version.cuda,'cuda_available':torch.cuda.is_available(),"
                          "'gpu':torch.cuda.get_device_name(0) if torch.cuda.is_available() else None}))"
                      ),
                  ])
                  record["python_probe"] = probe
              if checkpoint.is_file():
                  digest = hashlib.sha256()
                  with checkpoint.open("rb") as stream:
                      for block in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                          digest.update(block)
                  measured = digest.hexdigest()
                  record["checkpoint_size_bytes"] = checkpoint.stat().st_size
                  record["checkpoint_sha256"] = measured
                  record["checkpoint_matches"] = measured == expected_checkpoint
              if manifest.is_file():
                  try:
                      value = json.loads(manifest.read_text(encoding="utf-8"))
                      record["manifest"] = {
                          key: value.get(key)
                          for key in (
                              "schema",
                              "schema_version",
                              "cut3r_revision",
                              "runtime_python",
                              "torch_version",
                              "torch_cuda_version",
                              "cuda_available",
                              "dot_dataset_accessed",
                              "native_rope_artifact_id",
                          )
                      }
                  except Exception as error:
                      record["manifest_error"] = f"{type(error).__name__}: {error}"
              runtimes.append(record)

          nvcc_candidates: list[str] = []
          path_nvcc = shutil.which("nvcc")
          if path_nvcc:
              nvcc_candidates.append(path_nvcc)
          for pattern in (
              "/usr/local/cuda*/bin/nvcc",
              "/usr/local/cuda/bin/nvcc",
              "/opt/cuda*/bin/nvcc",
              "/opt/nvidia/cuda*/bin/nvcc",
              "/usr/lib/cuda*/bin/nvcc",
              "/home/github-runner/**/bin/nvcc",
          ):
              nvcc_candidates.extend(glob.glob(pattern, recursive=True))
          nvcc_candidates = sorted(dict.fromkeys(nvcc_candidates))

          cuda_toolkits: list[dict[str, Any]] = []
          for raw in nvcc_candidates:
              path = pathlib.Path(raw)
              try:
                  resolved = path.resolve(strict=True)
              except Exception:
                  resolved = path
              version = run([str(path), "--version"])
              output = f"{version.get('stdout', '')}\n{version.get('stderr', '')}"
              root = resolved.parent.parent
              cuda_toolkits.append(
                  {
                      "nvcc": str(path),
                      "resolved_nvcc": str(resolved),
                      "cuda_root": str(root),
                      "is_executable": path.is_file() and os.access(path, os.X_OK),
                      "version": version,
                      "release_12_6": "release 12.6" in output,
                      "include_cuda_h": (root / "include/cuda.h").is_file(),
                      "lib64_exists": (root / "lib64").is_dir(),
                  }
              )

          nvidia = run([
              "nvidia-smi",
              "--query-gpu=name,driver_version,memory.total,memory.used,utilization.gpu",
              "--format=csv,noheader",
          ]) if shutil.which("nvidia-smi") else {"error": "nvidia-smi unavailable"}
          filesystem = run([
              "df",
              "-h",
              "/home/github-runner",
              "/home/github-runner/.cache",
              "/mnt",
          ])
          mounts = run(["findmnt", "-rn", "-o", "TARGET,SOURCE,FSTYPE,OPTIONS"])
          compiler = run(["c++", "--version"]) if shutil.which("c++") else {"error": "c++ unavailable"}

          dataset_ready = any(
              item["archive_exists"] and item["archive_readable"] for item in datasets
          )
          runtime_ready = any(
              item.get("revision_matches") is True
              and item.get("checkpoint_matches") is True
              and item.get("python_probe", {}).get("returncode") == 0
              and '"cuda_available": true' in item.get("python_probe", {}).get("stdout", "").lower()
              for item in runtimes
          )
          cuda_12_6_ready = any(
              item["is_executable"] and item["release_12_6"] for item in cuda_toolkits
          )

          result = {
              "schema": "prob4d.dot-cut3r-gpuserver6000-preflight",
              "schema_version": 2,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "runner": {
                  "name": os.environ.get("RUNNER_NAME"),
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "name_matches": os.environ.get("RUNNER_NAME") == expected_runner,
              },
              "expected": {
                  "cut3r_revision": expected_revision,
                  "checkpoint_sha256": expected_checkpoint,
              },
              "nvidia_smi": nvidia,
              "compiler": compiler,
              "filesystem": filesystem,
              "mounts": mounts,
              "cuda_toolkits": cuda_toolkits,
              "cuda_12_6_ready": cuda_12_6_ready,
              "datasets": datasets,
              "runtimes": runtimes,
              "decision": (
                  "ready-for-identical-heldout-provider"
                  if dataset_ready and runtime_ready
                  else (
                      "bootstrap-assets-with-local-cuda-12.6"
                      if cuda_12_6_ready
                      else "cuda-12.6-toolkit-required"
                  )
              ),
              "dataset_ready": dataset_ready,
              "runtime_ready": runtime_ready,
              "information_boundary": {
                  "dataset_payload_bytes_opened": False,
                  "archive_metadata_only": True,
                  "normal_view_images_opened": False,
                  "marker_payloads_opened": False,
                  "r04_r10_predictions_executed": False,
                  "r11_r70_opened": False,
              },
          }
          encoded = json.dumps(result, indent=2, sort_keys=True) + "\n"
          pathlib.Path(os.environ["OUTPUT"]).write_text(encoded, encoding="utf-8")
          print(encoded)
          PY

      - name: Publish preflight summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.workspace.outputs.root }}/preflight.json
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          print("## DOT/CUT3R gpuserver6000 preflight")
          print()
          print(f"- decision: `{value['decision']}`")
          print(f"- runner: `{value['runner']['name']}`")
          print(f"- dataset ready: `{value['dataset_ready']}`")
          print(f"- exact CUT3R runtime ready: `{value['runtime_ready']}`")
          print(f"- local CUDA 12.6 toolkit ready: `{value['cuda_12_6_ready']}`")
          print()
          print("No DOT archive member, image, marker payload, or held-out prediction was opened.")
          PY

      - name: Upload bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-cut3r-gpuserver6000-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/preflight.json
          if-no-files-found: error
          retention-days: 14
