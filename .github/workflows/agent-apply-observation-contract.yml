name: Publish observation contract consolidation

on:
  push:
    branches:
      - agent/observation-contract-conformance

permissions:
  contents: write

concurrency:
  group: observation-contract-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/observation-contract-conformance
          fetch-depth: 1
          show-progress: false
      - name: Materialize source consolidation
        run: |
          set -euo pipefail
          python .github/agent-patches/apply_observation_contract.py
          rm .github/agent-patches/apply_observation_contract.py
          rm .github/workflows/agent-apply-observation-contract.yml
          rm -f .github/workflows/observation-contract-conformance.yml
      - name: Commit generated source for normal PR validation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize observation-belief contract consolidation'
          git push origin HEAD:agent/observation-contract-conformance
