name: Temporary PR 376 repair

on:
  push:
    branches:
      - science/deform360-rope-query-pilot-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: science/deform360-rope-query-pilot-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply mechanical repair
        shell: bash
        run: |
          python -m pip install ruff==0.16.1
          python -m ruff check --fix -- scripts/science/run_deform360_rope_query_pilot.py || true
          python -m ruff format -- scripts/science/run_deform360_rope_query_pilot.py
          python -m ruff check -- scripts/science/run_deform360_rope_query_pilot.py
          rm .github/workflows/deform360-rope-query-pilot.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/science/run_deform360_rope_query_pilot.py
          git add -u .github/workflows/deform360-rope-query-pilot.yml
          git commit -m 'Fix PR 376 hygiene and remove completed self-hosted workflow'
          git push origin HEAD:science/deform360-rope-query-pilot-v1
