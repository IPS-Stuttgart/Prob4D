name: Assemble fused sequence source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Assemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent/fusion.py.part00 \
            .agent/fusion.py.part01 \
            .agent/fusion.py.part02 \
            > src/prob4d/fusion.py
          for part in \
            .agent/fusion.py.part03.b64 \
            .agent/fusion.py.part04.b64 \
            .agent/fusion.py.part05.b64 \
            .agent/fusion.py.part06.b64
          do
            base64 --decode "$part" >> src/prob4d/fusion.py
          done
          echo \
            '95900274d5c8dda562b059a6e7f1bfbbf82f6b5389c939eeca4cf81fdba0592c  src/prob4d/fusion.py' \
            | sha256sum --check --strict
          python -m compileall -q src/prob4d/fusion.py
          rm -rf .agent
          rm .github/workflows/export-agent-tree.yml
          git diff --check
      - name: Commit assembled contract
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden fused sequence contract'
          git push origin "HEAD:${HEAD_REF}"
