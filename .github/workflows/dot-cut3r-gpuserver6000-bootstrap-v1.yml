name: DOT CUT3R gpuserver6000 bootstrap v1

on:
  push:
    branches:
      - ops/dot-cut3r-gpuserver6000-preflight-v1
    paths:
      - ".github/workflows/dot-cut3r-gpuserver6000-bootstrap-v1.yml"

permissions:
  contents: read

concurrency:
  group: dot-cut3r-gpuserver6000-bootstrap-v1
  cancel-in-progress: false

env:
  RUNTIME_ROOT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1
  RUNTIME_PYTHON: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python
  DATASET_ROOT: /home/github-runner/.cache/datasets/dot
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  CHECKPOINT_NAME: cut3r_512_dpt_4_64.pth
  CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  CHECKPOINT_BYTES: "3173761006"
  CHECKPOINT_GDRIVE_ID: 1Asz-ZB3FfpzZYwunhQvNPZEUA8XUNAYD
  ARCHIVE_NAME: R01-10.zip
  ARCHIVE_DATAFILE_ID: "2343"
  ARCHIVE_BYTES: "1705947395"
  ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
  DATAFILE_API_ROOT: https://dataverse.orc.gmu.edu/api/access/datafile
  CUDA_HOME: /usr/local/cuda
  TORCH_CUDA_ARCH_LIST: "8.9"
  MAX_JOBS: "4"
  COMPATIBILITY_PATCH: .github/patches/cut3r-curope-torch211-cu126.patch
  EXPECTED_CUROPE_KERNELS_BLOB: 7156cd1bb935cb1f0be45e58add53f9c21505c20
  EXPECTED_CUROPE_SETUP_BLOB: 02ddb0912370a67a49fd2bb91164cf2f1da8648e
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  bootstrap:
    name: Stage exact held-out assets on gpuserver6000
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/ops/dot-cut3r-gpuserver6000-preflight-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 300
    steps:
      - name: Require intended runner and CUDA 12.6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v git >/dev/null
          command -v c++ >/dev/null
          command -v nvidia-smi >/dev/null
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep -F 'release 12.6'
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.used,utilization.gpu \
            --format=csv,noheader
          df -h /home/github-runner /home/github-runner/.cache || true

      - name: Check out exact operational source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify clean exact checkout and frozen patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f "$COMPATIBILITY_PATCH"
          git apply --numstat "$COMPATIBILITY_PATCH"
          grep -F 'tokens.scalar_type()' "$COMPATIBILITY_PATCH"
          grep -F 'arch=compute_89,code=sm_89' "$COMPATIBILITY_PATCH"

      - name: Provision bootstrap Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Stage exact CUT3R source
        shell: bash
        run: |
          set -euo pipefail
          checkout="$RUNTIME_ROOT/CUT3R"
          mkdir -p "$RUNTIME_ROOT"
          if [[ ! -d "$checkout/.git" ]]; then
            rm -rf "$checkout"
            git clone --filter=blob:none --no-checkout https://github.com/CUT3R/CUT3R.git "$checkout"
          fi
          git -C "$checkout" fetch --force --no-tags origin "$CUT3R_REVISION"
          git -C "$checkout" checkout --detach --force "$CUT3R_REVISION"
          git -C "$checkout" reset --hard "$CUT3R_REVISION"
          git -C "$checkout" clean -fdx
          test "$(git -C "$checkout" rev-parse HEAD)" = "$CUT3R_REVISION"
          test -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)"

      - name: Build isolated CUDA-12.6 CUT3R runtime
        shell: bash
        run: |
          set -euo pipefail
          checkout="$RUNTIME_ROOT/CUT3R"
          staging="$RUNTIME_ROOT/venv.staging-${GITHUB_RUN_ID}"
          filtered="$RUNTIME_ROOT/requirements.runtime.txt"
          constraints="$RUNTIME_ROOT/constraints.runtime.txt"
          rm -rf "$staging"
          python -m venv "$staging"
          py="$staging/bin/python"
          "$py" -m pip install --no-cache-dir \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
          "$py" -m pip install --no-cache-dir \
            torch==2.11.0 torchvision==0.26.0 \
            --index-url https://download.pytorch.org/whl/cu126
          python - "$checkout/requirements.txt" "$filtered" "$constraints" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          kept = []
          for raw in source:
              stripped = raw.strip()
              if re.match(r"^(torch|torchvision)(?:\s|[<>=!~].*)?$", stripped, flags=re.I):
                  continue
              kept.append(raw)
          Path(sys.argv[2]).write_text("\n".join(kept) + "\n", encoding="utf-8")
          Path(sys.argv[3]).write_text(
              "torch==2.11.0\n"
              "torchvision==0.26.0\n"
              "numpy==1.26.4\n"
              "pillow==10.3.0\n",
              encoding="utf-8",
          )
          PY
          "$py" -m pip install --no-cache-dir \
            --constraint "$constraints" \
            -r "$filtered" \
            gdown
          "$py" - <<'PY'
          import numpy
          import PIL
          import torch
          import torchvision

          print(f"python_torch={torch.__version__}")
          print(f"python_torchvision={torchvision.__version__}")
          print(f"python_cuda={torch.version.cuda}")
          print(f"python_numpy={numpy.__version__}")
          print(f"python_pillow={PIL.__version__}")
          print(f"cuda_available={torch.cuda.is_available()}")
          if not torch.__version__.startswith("2.11.0"):
              raise SystemExit(torch.__version__)
          if not torchvision.__version__.startswith("0.26.0"):
              raise SystemExit(torchvision.__version__)
          if torch.version.cuda != "12.6":
              raise SystemExit(str(torch.version.cuda))
          if numpy.__version__ != "1.26.4":
              raise SystemExit(numpy.__version__)
          if PIL.__version__ != "10.3.0":
              raise SystemExit(PIL.__version__)
          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable")
          print(f"cuda_device={torch.cuda.get_device_name(0)}")
          PY
          rm -rf "$RUNTIME_ROOT/venv.previous"
          if [[ -d "$RUNTIME_ROOT/venv" ]]; then
            mv "$RUNTIME_ROOT/venv" "$RUNTIME_ROOT/venv.previous"
          fi
          mv "$staging" "$RUNTIME_ROOT/venv"
          rm -rf "$RUNTIME_ROOT/venv.previous"
          test -x "$RUNTIME_PYTHON"

      - name: Acquire and verify exact CUT3R checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="$RUNTIME_ROOT/$CHECKPOINT_NAME"
          part="$checkpoint.part-${GITHUB_RUN_ID}"
          valid=false
          if [[ -f "$checkpoint" ]]; then
            measured=$(sha256sum "$checkpoint" | awk '{print $1}')
            if [[ "$measured" = "$CHECKPOINT_SHA256" ]]; then
              valid=true
            fi
          fi
          if [[ "$valid" != true ]]; then
            rm -f "$part"
            CHECKPOINT_GDRIVE_ID="$CHECKPOINT_GDRIVE_ID" PART="$part" \
              "$RUNTIME_PYTHON" - <<'PY'
          import os
          import gdown

          result = gdown.download(
              id=os.environ["CHECKPOINT_GDRIVE_ID"],
              output=os.environ["PART"],
              quiet=False,
          )
          if result is None:
              raise SystemExit("gdown did not produce the frozen CUT3R checkpoint")
          PY
            test -f "$part"
            test "$(stat -c '%s' "$part")" = "$CHECKPOINT_BYTES"
            test "$(sha256sum "$part" | awk '{print $1}')" = "$CHECKPOINT_SHA256"
            mv "$part" "$checkpoint"
          fi
          test "$(stat -c '%s' "$checkpoint")" = "$CHECKPOINT_BYTES"
          test "$(sha256sum "$checkpoint" | awk '{print $1}')" = "$CHECKPOINT_SHA256"

      - name: Apply source-bound PyTorch 2.11 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          checkout="$RUNTIME_ROOT/CUT3R"
          patch="$GITHUB_WORKSPACE/$COMPATIBILITY_PATCH"
          kernels=src/croco/models/curope/kernels.cu
          setup=src/croco/models/curope/setup.py
          test "$(git -C "$checkout" hash-object "$kernels")" = "$EXPECTED_CUROPE_KERNELS_BLOB"
          test "$(git -C "$checkout" hash-object "$setup")" = "$EXPECTED_CUROPE_SETUP_BLOB"
          git -C "$checkout" apply --check "$patch"
          git -C "$checkout" apply "$patch"
          git -C "$checkout" diff --check
          modified=$(git -C "$checkout" diff --name-only | sort)
          expected=$(printf '%s\n%s' "$kernels" "$setup")
          test "$modified" = "$expected"
          grep -F 'tokens.scalar_type()' "$checkout/$kernels"
          grep -F 'arch=compute_89,code=sm_89' "$checkout/$setup"
          patch_sha256=$(sha256sum "$patch" | awk '{print $1}')
          kernels_post_blob=$(git -C "$checkout" hash-object "$kernels")
          setup_post_blob=$(git -C "$checkout" hash-object "$setup")
          PATCH_PATH="$COMPATIBILITY_PATCH" \
            PATCH_SHA256="$patch_sha256" \
            CUT3R_REVISION="$CUT3R_REVISION" \
            KERNELS_PRE_BLOB="$EXPECTED_CUROPE_KERNELS_BLOB" \
            KERNELS_POST_BLOB="$kernels_post_blob" \
            SETUP_PRE_BLOB="$EXPECTED_CUROPE_SETUP_BLOB" \
            SETUP_POST_BLOB="$setup_post_blob" \
            RUNTIME_ROOT="$RUNTIME_ROOT" \
            "$RUNTIME_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "prob4d.cut3r-curope-runtime-compatibility-patch",
              "schema_version": 1,
              "upstream_revision": os.environ["CUT3R_REVISION"],
              "patch_path": os.environ["PATCH_PATH"],
              "patch_sha256": os.environ["PATCH_SHA256"],
              "changes": {
                  "src/croco/models/curope/kernels.cu": {
                      "pre_git_blob": os.environ["KERNELS_PRE_BLOB"],
                      "post_git_blob": os.environ["KERNELS_POST_BLOB"],
                      "semantic_change": "PyTorch dispatch type() to scalar_type()",
                  },
                  "src/croco/models/curope/setup.py": {
                      "pre_git_blob": os.environ["SETUP_PRE_BLOB"],
                      "post_git_blob": os.environ["SETUP_POST_BLOB"],
                      "semantic_change": "compile registered SM 89 kernel",
                  },
              },
              "model_weights_changed": False,
              "provider_equations_changed": False,
              "dot_dataset_accessed": False,
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          payload["patch_id"] = hashlib.sha256(canonical).hexdigest()
          path = Path(os.environ["RUNTIME_ROOT"]) / "compatibility-patch-receipt.json"
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile and attest native CUT3R RoPE
        shell: bash
        run: |
          set -euo pipefail
          checkout="$RUNTIME_ROOT/CUT3R"
          receipt="$RUNTIME_ROOT/runtime-receipt.json"
          rm -f "$receipt"
          PATH="$CUDA_HOME/bin:$PATH" \
            CUDA_HOME="$CUDA_HOME" \
            TORCH_CUDA_ARCH_LIST="$TORCH_CUDA_ARCH_LIST" \
            MAX_JOBS="$MAX_JOBS" \
            PYTHONPATH="$GITHUB_WORKSPACE/src:$checkout:$checkout/src" \
            "$RUNTIME_PYTHON" \
            scripts/science/prepare_cut3r_runtime.py \
              --cut3r-checkout "$checkout" \
              --build \
              --output "$receipt"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$checkout:$checkout/src" \
            "$RUNTIME_PYTHON" - <<'PY'
          import torch
          from dust3r.model import ARCroco3DStereo

          print(f"model_import={ARCroco3DStereo.__name__}")
          print(f"torch={torch.__version__}")
          print(f"torch_cuda={torch.version.cuda}")
          print(f"cuda_available={torch.cuda.is_available()}")
          if torch.version.cuda != "12.6" or not torch.cuda.is_available():
              raise SystemExit("runtime CUDA contract failed")
          PY

      - name: Seal schema-v4 runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNTIME_ROOT" \
            RUNTIME_PYTHON="$RUNTIME_PYTHON" \
            CUT3R_REVISION="$CUT3R_REVISION" \
            CHECKPOINT_NAME="$CHECKPOINT_NAME" \
            CHECKPOINT_SHA256="$CHECKPOINT_SHA256" \
            "$RUNTIME_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          import numpy
          import PIL
          import torch
          import torchvision

          root = Path(os.environ["RUNTIME_ROOT"])
          receipt = json.loads((root / "runtime-receipt.json").read_text(encoding="utf-8"))
          patch = json.loads(
              (root / "compatibility-patch-receipt.json").read_text(encoding="utf-8")
          )
          deps = json.loads(subprocess.run(
              [os.environ["RUNTIME_PYTHON"], "-m", "pip", "list", "--format", "json"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout)
          payload = {
              "schema": "prob4d.dot-cut3r-gpuserver4090-runtime-bootstrap",
              "schema_version": 4,
              "cut3r_revision": os.environ["CUT3R_REVISION"],
              "compatibility_patch": patch,
              "checkpoint": {
                  "filename": os.environ["CHECKPOINT_NAME"],
                  "sha256": os.environ["CHECKPOINT_SHA256"],
                  "byte_count": (root / os.environ["CHECKPOINT_NAME"]).stat().st_size,
              },
              "runtime_python": os.environ["RUNTIME_PYTHON"],
              "python_version": platform.python_version(),
              "torch_version": torch.__version__,
              "torchvision_version": torchvision.__version__,
              "torch_cuda_version": torch.version.cuda,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "numpy_version": numpy.__version__,
              "pillow_version": PIL.__version__,
              "dependencies": deps,
              "native_rope_artifact_id": receipt["artifact_id"],
              "dot_dataset_accessed": False,
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          payload["bootstrap_id"] = hashlib.sha256(canonical).hexdigest()
          (root / "bootstrap-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "bootstrap_id": payload["bootstrap_id"],
              "native_rope_artifact_id": payload["native_rope_artifact_id"],
              "checkpoint_sha256": payload["checkpoint"]["sha256"],
              "torch_version": payload["torch_version"],
              "torch_cuda_version": payload["torch_cuda_version"],
              "cuda_device": payload["cuda_device"],
          }, sort_keys=True))
          PY

      - name: Stage and checksum-verify official DOT R01-10 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATASET_ROOT"
          archive="$DATASET_ROOT/$ARCHIVE_NAME"
          part="$archive.part-${GITHUB_RUN_ID}"
          valid=false
          if [[ -f "$archive" ]]; then
            measured=$(md5sum "$archive" | awk '{print $1}')
            if [[ "$measured" = "$ARCHIVE_MD5" ]]; then
              valid=true
            fi
          fi
          if [[ "$valid" != true ]]; then
            rm -f "$part"
            curl --fail --location --retry 6 --retry-all-errors \
              --connect-timeout 30 --output "$part" \
              "$DATAFILE_API_ROOT/$ARCHIVE_DATAFILE_ID"
            test "$(stat -c '%s' "$part")" = "$ARCHIVE_BYTES"
            printf '%s  %s\n' "$ARCHIVE_MD5" "$part" | md5sum --check --strict
            mv "$part" "$archive"
          fi
          test "$(stat -c '%s' "$archive")" = "$ARCHIVE_BYTES"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$archive" | md5sum --check --strict
          test -z "$(find "$DATASET_ROOT" -mindepth 1 -maxdepth 1 -type f ! -name "$ARCHIVE_NAME" -print -quit)"

      - name: Write bounded bootstrap evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dot-cut3r-gpuserver6000-bootstrap-${GITHUB_RUN_ID}.json"
          OUTPUT="$output" RUNTIME_ROOT="$RUNTIME_ROOT" DATASET_ROOT="$DATASET_ROOT" \
            "$RUNTIME_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNTIME_ROOT"])
          manifest = json.loads((root / "bootstrap-manifest.json").read_text(encoding="utf-8"))
          payload = {
              "schema": "prob4d.dot-cut3r-gpuserver6000-bootstrap",
              "schema_version": 1,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runtime_root": str(root),
              "runtime_bootstrap_id": manifest["bootstrap_id"],
              "native_rope_artifact_id": manifest["native_rope_artifact_id"],
              "checkpoint_sha256": manifest["checkpoint"]["sha256"],
              "dataset_root": os.environ["DATASET_ROOT"],
              "archive_name": "R01-10.zip",
              "archive_md5": "ca546ff5f22c0279123ccb18509858ee",
              "decision": "ready-for-identical-heldout-provider",
              "information_boundary": {
                  "archive_members_opened": False,
                  "normal_view_images_opened": False,
                  "marker_payloads_opened": False,
                  "r04_r10_predictions_executed": False,
                  "r11_r70_opened": False,
              },
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          payload["evidence_id"] = hashlib.sha256(canonical).hexdigest()
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Upload compact bootstrap receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-cut3r-gpuserver6000-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/runtime-receipt.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/compatibility-patch-receipt.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/bootstrap-manifest.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/requirements.runtime.txt
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/constraints.runtime.txt
            ${{ steps.evidence.outputs.output }}
          if-no-files-found: error
          retention-days: 30
