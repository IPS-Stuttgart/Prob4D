name: DEFORM DLO4/DLO5 source-only observability audit

on:
  push:
    branches:
      - science/deform-dlo45-query-observability-real-v1
    paths:
      - protocols/execution_requests/deform_dlo45_observability_source_v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-observability-source-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/deform_dlo45_observability_source_v1.json
  OUTPUT_DIR: outputs/deform-dlo45-observability-source-v1
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-audit:
    name: Audit DLO4/DLO5 training geometry on gpuserver4090
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 120
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact clean checkout and source-only mount
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$DATASET_ROOT" = "/mnt/seagate10tb/florianpfaff/datasets/deform/data_set"
          test -d "$DATASET_ROOT/DLO4/train"
          test -d "$DATASET_ROOT/DLO5/train"
          test -f "$REQUEST_PATH"

      - name: Select a retained NumPy and pandas interpreter
        id: python
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /home/florianpfaff/miniconda3/bin/python
            /home/florianpfaff/anaconda3/bin/python
            /home/florianpfaff/conda/bin/python
            /home/github-runner/miniconda3/bin/python
            /home/github-runner/anaconda3/bin/python
            /opt/conda/bin/python
          )
          roots=(
            /home/florianpfaff/conda_envs
            /home/florianpfaff/miniconda3/envs
            /home/florianpfaff/anaconda3/envs
            /home/florian/conda_envs
            /home/florian/miniconda3/envs
            /home/florian/anaconda3/envs
            /home/github-runner/.conda/envs
            /home/github-runner/miniconda3/envs
            /home/github-runner/anaconda3/envs
            /mnt/seagate10tb/florianpfaff/conda_envs
            /opt/conda/envs
          )
          for root in "${roots[@]}"; do
            if [[ -d "$root" ]]; then
              while IFS= read -r candidate; do
                candidates+=("$candidate")
              done < <(find "$root" -mindepth 3 -maxdepth 3 -path '*/bin/python' -executable -print 2>/dev/null | sort)
            fi
          done
          candidates+=("$(command -v python3 || true)" "$(command -v python || true)")
          selected=""
          for candidate in "${candidates[@]}"; do
            [[ -x "$candidate" ]] || continue
            echo "::group::Interpreter candidate $candidate"
            if "$candidate" - <<'PY'
          import sys
          import numpy
          import pandas
          print("python", sys.version.split()[0])
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          PY
            then
              selected="$candidate"
              echo "Selected $candidate"
              echo "::endgroup::"
              break
            fi
            echo "Rejected $candidate"
            echo "::endgroup::"
          done
          test -n "$selected" || {
            echo "No retained interpreter with NumPy and pandas was found" >&2
            exit 2
          }
          echo "python=$selected" >> "$GITHUB_OUTPUT"
          "$selected" -m py_compile scripts/science/audit_deform_dlo45_observability_v1.py

      - name: Run source-only real-geometry audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$OUTPUT_DIR"
          "${{ steps.python.outputs.python }}" \
            scripts/science/audit_deform_dlo45_observability_v1.py \
            --request "$REQUEST_PATH" \
            --output-dir "$OUTPUT_DIR"

      - name: Validate retained information boundary
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.python.outputs.python }}" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("outputs/deform-dlo45-observability-source-v1/result.json").read_text())
          assert result["stage"] == "source-audit"
          assert result["dataset"]["opened_split"] == "train"
          assert result["dataset"]["manifest"]["file_count"] == 112
          boundary = result["information_boundary"]
          assert boundary["opened_split"] == "train"
          assert boundary["evaluation_file_contents_opened"] is False
          assert boundary["provider_predictions_opened"] is False
          assert boundary["bayesian_phystwin_outcomes_opened"] is False
          assert boundary["causal4d_outcomes_opened"] is False
          print(result["result_id"])
          PY
          cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform-dlo45-observability-source-${{ github.sha }}
          path: |
            outputs/deform-dlo45-observability-source-v1/
            protocols/execution_requests/deform_dlo45_observability_source_v1.json
          if-no-files-found: warn
          retention-days: 30
