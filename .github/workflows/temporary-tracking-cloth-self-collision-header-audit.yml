name: Temporary Tracking Cloth self-collision header audit

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-tracking-cloth-self-collision-header-audit.yml"

permissions:
  contents: read

concurrency:
  group: temporary-tracking-cloth-self-collision-header-audit
  cancel-in-progress: false

env:
  ZENODO_URL: https://zenodo.org/records/14644526/files/tracking_dataset.zip?download=1
  ZENODO_MD5: b4868b702f8a42b2ea1069d0f1a3b8f6
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact lightweight runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Download and verify official release
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tracking-cloth-self-collision-header-$GITHUB_RUN_ID"
          rm -rf -- "$root"
          mkdir -p "$root/data" "$root/evidence"
          archive="$root/tracking_dataset.zip"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 \
            --output "$archive" "$ZENODO_URL"
          printf '%s  %s\n' "$ZENODO_MD5" "$archive" | md5sum --check --strict
          unzip -q "$archive" -d "$root/data"
          count=$(find "$root/data" -type f -iname '*.csv' -printf '.' | wc -c)
          test "$count" -eq 120
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "data=$root/data" >> "$GITHUB_OUTPUT"

      - name: Audit marker namespaces without retaining trajectories
        shell: bash
        env:
          ROOT: ${{ steps.dataset.outputs.root }}
          DATA: ${{ steps.dataset.outputs.data }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          from prob4d.motive_csv import read_motive_layout

          root = Path(os.environ["ROOT"])
          data = Path(os.environ["DATA"])
          records = []
          for path in sorted(data.rglob("*.csv")):
              relative = path.relative_to(data).as_posix()
              if not (
                  relative.startswith("tracking_dataset/Free-hanging/")
                  or relative.startswith("tracking_dataset/Self-collisions/")
              ):
                  continue
              layout = read_motive_layout(path)
              filename = path.name
              material = filename.split("_", 1)[0]
              support_mode = (
                  "hands" if filename.endswith("_hands.csv")
                  else "hanger" if filename.endswith("_hanger.csv")
                  else "target"
              )
              phase = "target" if "/Self-collisions/" in f"/{relative}" else "source"
              prefix = path.read_bytes()[:65536]
              records.append(
                  {
                      "relative_path": relative,
                      "phase": phase,
                      "material": material,
                      "support_mode": support_mode,
                      "marker_count": len(layout.markers),
                      "marker_labels": sorted(layout.marker_labels),
                      "marker_unique_ids": sorted(marker.unique_id for marker in layout.markers),
                      "header_prefix_sha256": hashlib.sha256(prefix).hexdigest(),
                      "trajectory_values_retained": False,
                  }
              )

          sources = [row for row in records if row["phase"] == "source"]
          targets = [row for row in records if row["phase"] == "target"]

          def intersection(rows, field):
              common = None
              for row in rows:
                  values = set(row[field])
                  common = values if common is None else common & values
              return sorted(common or ())

          source_groups = {}
          for material in sorted({row["material"] for row in sources}):
              for support_mode in ("hands", "hanger"):
                  rows = [
                      row for row in sources
                      if row["material"] == material
                      and row["support_mode"] == support_mode
                      and "_A2_" in row["relative_path"]
                  ]
                  source_groups[f"{material}:A2:{support_mode}"] = {
                      "recording_count": len(rows),
                      "common_marker_labels": intersection(rows, "marker_labels"),
                      "common_marker_unique_ids": intersection(rows, "marker_unique_ids"),
                  }

          target_groups = {}
          for material in sorted({row["material"] for row in targets}):
              rows = [row for row in targets if row["material"] == material]
              target_groups[f"{material}:A2:self-collision"] = {
                  "recording_count": len(rows),
                  "common_marker_labels": intersection(rows, "marker_labels"),
                  "common_marker_unique_ids": intersection(rows, "marker_unique_ids"),
              }

          compatibility = []
          for source_name, source in source_groups.items():
              for target_name, target in target_groups.items():
                  shared_labels = sorted(
                      set(source["common_marker_labels"])
                      & set(target["common_marker_labels"])
                  )
                  shared_ids = sorted(
                      set(source["common_marker_unique_ids"])
                      & set(target["common_marker_unique_ids"])
                  )
                  compatibility.append(
                      {
                          "source_group": source_name,
                          "target_group": target_name,
                          "shared_label_count": len(shared_labels),
                          "shared_marker_labels": shared_labels,
                          "shared_unique_id_count": len(shared_ids),
                          "shared_marker_unique_ids": shared_ids,
                      }
                  )

          value = {
              "schema": "prob4d.tracking-cloth-self-collision-header-audit.v1",
              "source_recording_count": len(sources),
              "target_recording_count": len(targets),
              "target_trajectory_values_parsed": False,
              "target_trajectory_values_retained": False,
              "source_groups": source_groups,
              "target_groups": target_groups,
              "compatibility": compatibility,
              "records": records,
          }
          encoded = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
          value["audit_id"] = hashlib.sha256(encoded).hexdigest()
          output = root / "evidence" / "self-collision-header-audit.json"
          output.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "audit_id": value["audit_id"],
              "source_groups": source_groups,
              "target_groups": target_groups,
              "compatible_pairs": [
                  row for row in compatibility
                  if row["shared_label_count"] >= 3 or row["shared_unique_id_count"] >= 3
              ],
          }, indent=2, sort_keys=True))
          PY
          rm -rf -- "$DATA" "$ROOT/tracking_dataset.zip"

      - name: Upload bounded header-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-self-collision-header-${{ github.run_id }}
          path: ${{ steps.dataset.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 7
