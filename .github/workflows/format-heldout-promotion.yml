name: Format held-out promotion sources

on:
  push:
    branches: [agent/format-heldout-promotion-v1]
    paths:
      - ".github/workflows/format-heldout-promotion.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-heldout-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-heldout-promotion
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-heldout-promotion-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install compatible development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py
          python -m ruff check \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py
          python -m ruff format --check \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py

      - name: Validate promotion contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py
          python -m pytest -q \
            tests/test_heldout_promotion.py \
            tests/test_heldout_promotion_diagnosis.py \
            tests/test_promotion_evidence.py \
            tests/test_material_identity_cli.py
          python -m compileall -q src/prob4d

      - name: Publish ordinary formatting commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-heldout-promotion.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py \
            .github/workflows/format-heldout-promotion.yml
          git diff --cached --check
          git commit -m "Format held-out promotion contracts"
          git push --force-with-lease origin HEAD:agent/format-heldout-promotion-v1
