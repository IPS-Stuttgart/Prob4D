name: Format held-out promotion sources

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-heldout-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-heldout-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install compatible development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py
          python -m ruff check \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py
          python -m ruff format --check \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py \
            tests/test_promotion_evidence.py

      - name: Validate promotion contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy \
            src/prob4d/heldout_promotion.py \
            src/prob4d/promotion_evidence.py
          python -m pytest -q \
            tests/test_heldout_promotion.py \
            tests/test_heldout_promotion_diagnosis.py \
            tests/test_promotion_evidence.py \
            tests/test_material_identity_cli.py
          python -m compileall -q src/prob4d

      - name: Stage exact formatted product
        shell: bash
        run: |
          set -euo pipefail
          product="${RUNNER_TEMP}/formatted-heldout-promotion"
          mkdir -p \
            "${product}/src/prob4d" \
            "${product}/tests"
          cp src/prob4d/heldout_promotion.py "${product}/src/prob4d/"
          cp src/prob4d/promotion_evidence.py "${product}/src/prob4d/"
          cp tests/test_promotion_evidence.py "${product}/tests/"
          (
            cd "${product}"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload validated formatted product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-heldout-promotion
          path: ${{ runner.temp }}/formatted-heldout-promotion
          if-no-files-found: error
          retention-days: 14
