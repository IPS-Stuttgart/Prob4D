name: Prepare Prob4D 0.4.0 boundary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-release-040-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.head_ref == 'agent/release-0.4.0-boundary' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-0.4.0-boundary
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact release transformation
        run: python scripts/ci/prepare_release_040.py
      - name: Validate release synchronization
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check \
            tests/test_release_040_boundary.py \
            scripts/ci/prepare_release_040.py
          python -m pytest -q \
            tests/test_release_metadata.py \
            tests/test_provider_manifest.py \
            tests/test_release_040_boundary.py \
            tests/test_ecosystem_release_capsule.py
          python -m build
          python -m twine check dist/*
          git diff --check
      - name: Remove one-use transformer and publish branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/prepare-release-040.yml \
            scripts/ci/prepare_release_040.py
          git add \
            CHANGELOG.md \
            .github/workflows/tests.yml \
            src/prob4d/__init__.py \
            src/prob4d/provider_manifest.py \
            tests/test_release_metadata.py \
            tests/test_provider_manifest.py \
            tests/test_ecosystem_release_capsule.py
          git diff --cached --check
          git commit -m "Synchronize the Prob4D 0.4.0 release boundary"
          git push origin HEAD:agent/release-0.4.0-boundary
