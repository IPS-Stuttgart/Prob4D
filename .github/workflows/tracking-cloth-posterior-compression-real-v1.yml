name: Tracking Cloth posterior compression real trajectories v1

on:
  push:
    branches:
      - science/tracking-cloth-posterior-compression-real-v1
    paths:
      - protocols/execution_requests/tracking_cloth_posterior_compression_real_v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-cloth-posterior-compression-real-v1
  cancel-in-progress: true

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  PROTOCOL_PATH: protocols/tracking-cloth-posterior-compression-real-v1.json
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  hosted-preflight:
    name: Validate protocol and focused implementation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate immutable request boundary
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(
              "protocols/execution_requests/"
              "tracking_cloth_posterior_compression_real_v1.json"
          ).read_text(encoding="utf-8"))
          protocol = json.loads(Path(
              "protocols/tracking-cloth-posterior-compression-real-v1.json"
          ).read_text(encoding="utf-8"))
          assert os.environ["EVENT_REPOSITORY"] == "IPS-Stuttgart/Prob4D"
          assert os.environ["EVENT_ACTOR"] == "FlorianPfaff"
          assert len(os.environ["EVENT_SHA"]) == 40
          assert request["schema"] == "prob4d.self-hosted-experiment-request.v1"
          assert request["request_id"] == (
              "tracking-cloth-posterior-compression-real-v1"
          )
          assert request["branch"] == (
              "science/tracking-cloth-posterior-compression-real-v1"
          )
          assert request["runner_labels"] == ["self-hosted", "gpuserver4090"]
          assert request["dataset_root"] == (
              "/home/github-runner/.cache/datasets/"
              "tracking-cloth-deformation-v1-zenodo-14644526"
          )
          assert request["expected_recording_count"] == 120
          assert request["raw_data_publication_authorized"] is False
          assert request["provider_promotion_authorized"] is False
          assert protocol["schema"] == (
              "prob4d.tracking-cloth-posterior-compression-real.v1"
          )
          assert protocol["dataset"]["dataset_state"] == (
              "verified-complete-extracted"
          )
          assert protocol["query"]["dimension"] == 3
          assert protocol["claim_boundary"]["learned_4d_provider_evaluated"] is False
          PY
      - name: Install development package
        run: python -m pip install -e ".[dev]"
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_posterior_preserving_compression.py
          tests/test_tracking_cloth_posterior_compression.py
      - name: Lint the new surfaces
        run: >-
          python -m ruff check
          scripts/science/run_tracking_cloth_posterior_compression.py
          tests/test_tracking_cloth_posterior_compression.py
      - name: Normalize formatting in hosted workspace
        run: >-
          python -m ruff format
          scripts/science/run_tracking_cloth_posterior_compression.py
          tests/test_tracking_cloth_posterior_compression.py

  evaluate:
    name: Evaluate 120 verified cloth recordings on gpuserver4090
    needs: hosted-preflight
    if: >-
      github.actor == 'FlorianPfaff' &&
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == 'science/tracking-cloth-posterior-compression-real-v1')
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Record and validate selected runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          test -d "$DATASET_ROOT"
          test -r "$DATASET_ROOT"
          csv_count=$(find "$DATASET_ROOT" -type f -iname '*.csv' | wc -l)
          test "$csv_count" -eq 120
          printf 'csv_count=%s\n' "$csv_count"
      - name: Check out exact preflighted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Initialize isolated evidence workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-tracking-cloth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$root"
          mkdir -p "$root"
          printf '125\n' > "$root/process-exit-code.txt"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Select a retained NumPy interpreter
        id: python
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          log="$root/interpreter-selection.txt"
          candidates=("")
          add_candidate() {
            local candidate="${1:-}"
            [[ -n "$candidate" ]] || return 0
            local existing
            for existing in "${candidates[@]}"; do
              [[ "$existing" != "$candidate" ]] || return 0
            done
            candidates+=("$candidate")
          }

          add_candidate "/home/florianpfaff/conda_envs/cut3r/bin/python"
          add_candidate "/home/florianpfaff/miniconda3/envs/cut3r/bin/python"
          add_candidate "/home/florianpfaff/anaconda3/envs/cut3r/bin/python"
          add_candidate "/home/florian/conda_envs/cut3r/bin/python"
          add_candidate "/home/florian/miniconda3/envs/cut3r/bin/python"
          add_candidate "/home/florian/anaconda3/envs/cut3r/bin/python"
          add_candidate "/home/github-runner/.conda/envs/cut3r/bin/python"
          add_candidate "/home/github-runner/miniconda3/envs/cut3r/bin/python"
          add_candidate "/home/github-runner/anaconda3/envs/cut3r/bin/python"
          add_candidate "/mnt/seagate10tb/florianpfaff/conda_envs/cut3r/bin/python"
          add_candidate "/opt/conda/envs/cut3r/bin/python"

          roots=(
            "/home/florianpfaff/conda_envs"
            "/home/florianpfaff/miniconda3/envs"
            "/home/florianpfaff/anaconda3/envs"
            "/home/florian/conda_envs"
            "/home/florian/miniconda3/envs"
            "/home/florian/anaconda3/envs"
            "/home/github-runner/.conda/envs"
            "/home/github-runner/miniconda3/envs"
            "/home/github-runner/anaconda3/envs"
            "/mnt/seagate10tb/florianpfaff/conda_envs"
            "/opt/conda/envs"
          )
          for env_root in "${roots[@]}"; do
            if [[ -d "$env_root" ]]; then
              while IFS= read -r candidate; do
                add_candidate "$candidate"
              done < <(
                find "$env_root" -mindepth 3 -maxdepth 3 \
                  -path '*/bin/python' -executable -print 2>/dev/null | sort
              )
            fi
          done
          add_candidate "$(command -v python3 || true)"
          add_candidate "$(command -v python || true)"

          selected=""
          for candidate in "${candidates[@]}"; do
            [[ -x "$candidate" ]] || continue
            {
              printf 'candidate=%s\n' "$candidate"
              "$candidate" - <<'PY'
          import sys
          import numpy

          print(f"python={sys.version.split()[0]}")
          print(f"numpy={numpy.__version__}")
          if sys.version_info < (3, 10):
              raise SystemExit(2)
          PY
            } >> "$log" 2>&1 || continue
            selected="$candidate"
            break
          done
          if [[ -z "$selected" ]]; then
            cat "$log" >&2 || true
            echo "No retained Python >=3.10 with NumPy is available" >&2
            exit 2
          fi
          printf 'selected=%s\n' "$selected" >> "$log"
          cat "$log"
          echo "python=$selected" >> "$GITHUB_OUTPUT"
      - name: Execute recording-disjoint real-trajectory evaluation
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          output="$root/evidence"
          rm -rf -- "$output"
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/src" "${{ steps.python.outputs.python }}" \
            scripts/science/run_tracking_cloth_posterior_compression.py \
              --dataset-root "$DATASET_ROOT" \
              --protocol "$PROTOCOL_PATH" \
              --output-dir "$output" \
              --source-revision "$GITHUB_SHA"
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/process-exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compact derived evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-posterior-compression-real-v1-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="${{ steps.workspace.outputs.root }}/evidence"
          if test -f "$output/summary.md"; then
            cat "$output/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce real-data evaluation and posterior parity
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          output="$root/evidence"
          test "$(cat "$root/process-exit-code.txt")" = "0"
          test -f "$output/result.json"
          /usr/bin/python3 - "$output/result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result["status"] != "evaluated-real-trajectories":
              raise SystemExit(
                  "real trajectory evaluation did not complete: "
                  + result.get("reason", result["status"])
              )
          aggregate = result["aggregate"]
          if aggregate["maximum_relative_gain_error"] > 1e-7:
              raise SystemExit("full/compressed gain parity failed")
          if aggregate["maximum_relative_posterior_covariance_error"] > 1e-7:
              raise SystemExit("full/compressed covariance parity failed")
          if result["inventory"]["accepted_recording_count"] < 32:
              raise SystemExit("too few real recordings were admitted")
          PY
