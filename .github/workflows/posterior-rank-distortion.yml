name: Posterior rank-distortion frontier

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/posterior-rank-distortion.yml"
      - "src/prob4d/posterior_rank_distortion.py"
      - "src/prob4d/posterior_preserving_compression.py"
      - "tests/test_posterior_rank_distortion.py"
      - "protocols/posterior-rank-distortion-controlled-v1.json"
      - "scripts/science/run_posterior_rank_distortion_study.py"
      - "docs/posterior-rank-distortion*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posterior-rank-distortion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theorem:
    name: Generalized-eigen theorem and dense controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"

      - name: Check focused source quality
        run: |
          python -m ruff format --check src/prob4d/posterior_rank_distortion.py tests/test_posterior_rank_distortion.py
          python -m ruff check src/prob4d/posterior_rank_distortion.py tests/test_posterior_rank_distortion.py
          python -m mypy src/prob4d/posterior_rank_distortion.py

      - name: Run independent dense theorem tests
        run: python -m pytest -q tests/test_posterior_rank_distortion.py
