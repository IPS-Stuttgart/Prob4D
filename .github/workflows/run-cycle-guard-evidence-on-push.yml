name: Run cycle-guard evidence on push

on:
  push:
    branches:
      - agent/normalize-cycle-guard

permissions:
  contents: write

concurrency:
  group: run-cycle-guard-evidence-on-push
  cancel-in-progress: false

jobs:
  study-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/normalize-cycle-guard
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Validate implementation
        run: |
          set -euo pipefail
          python -m ruff check \
            src/prob4d/uncertainty_normalized_cycles.py \
            src/prob4d/uncertainty_guarded_causal_gauge_graph.py \
            src/prob4d/cycle_guard_monte_carlo.py \
            src/prob4d/cli.py \
            tests/test_uncertainty_normalized_cycle_guard.py \
            tests/test_cycle_guard_monte_carlo.py
          python -m pytest -q \
            tests/test_causal_gauge_graph.py \
            tests/test_uncertainty_normalized_cycle_guard.py \
            tests/test_cycle_guard_monte_carlo.py
      - name: Run frozen calibration and target study
        id: experiment
        shell: bash
        run: |
          set +e
          prob4d diagnostic cycle-guard-monte-carlo \
            --output-dir outputs/cycle-guard-normalization \
            --calibration-trials 48 \
            --target-trials-per-scenario 128 \
            --calibration-seed 80260804 \
            --target-seed 271260804 \
            --threshold-quantile 0.95 \
            --representative-radius 1.0 \
            --minimum-uncertainty-scale 1e-12 \
            --num-frames 28 \
            --height 4 \
            --width 6 \
            --window-size 11 \
            --overlap 7 \
            --bootstrap-resamples 2000 \
            --source-revision "${SOURCE_REVISION}"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
            exit "$status"
          fi
          echo "decision_exit_code=$status" >> "$GITHUB_OUTPUT"
          cp protocols/cycle-guard-normalization-v1.json \
            outputs/cycle-guard-normalization/protocol.json
          (
            cd outputs/cycle-guard-normalization
            sha256sum protocol.json >> SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Verify protocol and create retained result summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          protocol_path = Path('protocols/cycle-guard-normalization-v1.json')
          report_path = Path(
              'outputs/cycle-guard-normalization/cycle_guard_monte_carlo.json'
          )
          protocol = json.loads(protocol_path.read_text(encoding='utf-8'))
          report = json.loads(report_path.read_text(encoding='utf-8'))
          configuration = report['configuration']
          calibration = protocol['calibration']
          target = protocol['target']
          geometry = protocol['synthetic_geometry']
          bootstrap = protocol['bootstrap']
          acceptance = protocol['acceptance_criteria']

          assert configuration['calibration_trials'] == calibration['trial_count']
          assert configuration['calibration_seed'] == calibration['seed_start']
          assert configuration['threshold_quantile'] == calibration['threshold_quantile']
          assert configuration['target_trials_per_scenario'] == target['trials_per_scenario']
          assert configuration['target_seed'] == target['seed_start']
          assert configuration['minimum_uncertainty_scale'] == protocol[
              'primary_candidate'
          ]['minimum_uncertainty_scale']
          assert configuration['representative_radius'] == geometry['representative_radius']
          for name in ('num_frames', 'height', 'width', 'window_size', 'overlap'):
              assert configuration[name] == geometry[name]
          assert configuration['bootstrap_resamples'] == bootstrap['resamples']
          assert configuration['scenarios'] == protocol['scenarios']
          assert {row['method_id'] for row in report['aggregate']} == set(
              protocol['methods']
          )

          criteria = report['decision']['criteria']
          normalized = report['decision']['uncertainty_normalized_guard']
          raw = report['decision']['raw_guard']
          assert criteria['strong_detection_at_least_0_95'] == (
              normalized['strong_outlier_detection_rate']
              >= acceptance['strong_detection_at_least']
          )
          assert criteria['strong_detection_noninferior_to_raw_by_0_05'] == (
              normalized['strong_outlier_detection_rate']
              >= raw['strong_outlier_detection_rate']
              - acceptance['strong_detection_noninferiority_margin_vs_raw']
          )
          assert criteria['mild_detection_at_least_0_90'] == (
              normalized['mild_outlier_detection_rate']
              >= acceptance['mild_detection_at_least']
          )
          assert criteria['mild_detection_noninferior_to_raw_by_0_05'] == (
              normalized['mild_outlier_detection_rate']
              >= raw['mild_outlier_detection_rate']
              - acceptance['mild_detection_noninferiority_margin_vs_raw']
          )
          assert criteria['worst_clean_false_fallback_at_most_0_10'] == (
              normalized['worst_clean_false_fallback_rate']
              <= acceptance['worst_clean_false_fallback_at_most']
          )
          assert criteria['worst_clean_false_fallback_halved'] == (
              normalized['worst_clean_false_fallback_rate']
              <= acceptance[
                  'worst_clean_false_fallback_relative_to_raw_at_most'
              ] * raw['worst_clean_false_fallback_rate']
          )
          assert report['decision']['overall_passed'] == all(criteria.values())
          assert report['claim_boundary'] == protocol['claim_boundary']

          selected = []
          for row in report['aggregate']:
              selected.append(
                  {
                      'scenario_id': row['scenario_id'],
                      'method_id': row['method_id'],
                      'trial_count': row['trial_count'],
                      'outlier_injected_count': row['outlier_injected_count'],
                      'fallback_rate': row['fallback_rate'],
                      'outlier_detection_rate': row['outlier_detection_rate'],
                      'clean_false_fallback_rate': row['clean_false_fallback_rate'],
                      'endpoint_displacement_rmse': row['metrics'][
                          'endpoint_displacement_rmse'
                      ],
                      'coverage_95': row['metrics']['coverage_95'],
                      'mean_normalized_nees': row['metrics'][
                          'mean_normalized_nees'
                      ],
                      'paired_endpoint_delta_vs_tree': row[
                          'paired_endpoint_delta_vs_tree'
                      ],
                  }
              )

          evidence = Path('evidence/cycle-guard-normalization-v1')
          evidence.mkdir(parents=True, exist_ok=True)
          summary = {
              'schema_name': 'prob4d.cycle-guard-normalization-summary',
              'schema_version': 1,
              'report_id': report['report_id'],
              'executed_source_revision': report['source_revision'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'protocol_sha256': hashlib.sha256(protocol_path.read_bytes()).hexdigest(),
              'configuration': configuration,
              'calibration_thresholds': {
                  'raw_cycle_threshold': report['calibration']['raw_cycle_threshold'],
                  'uncertainty_normalized_cycle_threshold': report['calibration'][
                      'uncertainty_normalized_cycle_threshold'
                  ],
              },
              'decision': report['decision'],
              'aggregate': selected,
              'claim_boundary': report['claim_boundary'],
          }
          (evidence / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          attestation = {
              'schema_name': 'prob4d.cycle-guard-normalization-rebuild',
              'schema_version': 1,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'executed_source_revision': report['source_revision'],
              'report_id': report['report_id'],
              'protocol_sha256': summary['protocol_sha256'],
              'decision_exit_code': int(os.environ.get('DECISION_EXIT_CODE', '0')),
          }
          (evidence / 'rebuild-attestation.json').write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          def rate(value: object) -> str:
              return f"{float(value):.3f}"

          lines = [
              '# Uncertainty-normalized cycle-guard results v1',
              '',
              'Frozen protocol: `prob4d-cycle-guard-normalization-v1`.',
              '',
              f"Report ID: `{report['report_id']}`.",
              f"Executed source revision: `{report['source_revision']}`.",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`.",
              '',
              '## Preregistered decision',
              '',
              f"Overall result: **{'PASS' if report['decision']['overall_passed'] else 'FAIL'}**.",
              '',
              '| Guard | Strong detection | Mild detection | Worst clean fallback |',
              '| --- | ---: | ---: | ---: |',
              (
                  '| Raw displacement | '
                  + rate(raw['strong_outlier_detection_rate'])
                  + ' | '
                  + rate(raw['mild_outlier_detection_rate'])
                  + ' | '
                  + rate(raw['worst_clean_false_fallback_rate'])
                  + ' |'
              ),
              (
                  '| Uncertainty-normalized | '
                  + rate(normalized['strong_outlier_detection_rate'])
                  + ' | '
                  + rate(normalized['mild_outlier_detection_rate'])
                  + ' | '
                  + rate(normalized['worst_clean_false_fallback_rate'])
                  + ' |'
              ),
              '',
              'Registered criteria:',
          ]
          for name, passed in sorted(criteria.items()):
              lines.append(f"- `{name}`: **{'PASS' if passed else 'FAIL'}**")
          lines.extend(
              [
                  '',
                  '## Method boundary',
                  '',
                  'The normalized guard remains experimental. Exact fallback returns '
                  'the complete production spanning-tree posterior; this study does '
                  'not promote the multi-edge graph or alter provider-v2 admission.',
                  '',
                  '## Claim boundary',
                  '',
                  report['claim_boundary'],
                  '',
              ]
          )
          Path('docs/cycle-guard-normalization-results-v1.md').write_text(
              '\n'.join(lines), encoding='utf-8'
          )
          PY
        env:
          DECISION_EXIT_CODE: ${{ steps.experiment.outputs.decision_exit_code }}
      - name: Publish study summary
        if: always()
        run: |
          summary=outputs/cycle-guard-normalization/cycle_guard_monte_carlo.md
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Decision exit code: ${{ steps.experiment.outputs.decision_exit_code }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cycle-guard-normalization-${{ github.run_id }}
          path: outputs/cycle-guard-normalization/
          if-no-files-found: error
          retention-days: 90
      - name: Commit compact evidence and remove one-shot workflow
        if: always() && steps.experiment.outputs.decision_exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/run-cycle-guard-evidence-on-push.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/cycle-guard-normalization-results-v1.md \
            evidence/cycle-guard-normalization-v1 \
            .github/workflows/run-cycle-guard-evidence-on-push.yml
          git diff --cached --check
          git commit -m 'Record uncertainty-normalized cycle guard study'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/normalize-cycle-guard
