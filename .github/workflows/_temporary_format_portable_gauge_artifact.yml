name: Temporary portable gauge-artifact formatter

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_format_portable_gauge_artifact.yml"
      - "src/prob4d/_gauge_tree_artifact_common.py"
      - "src/prob4d/command_registry.py"
      - "src/prob4d/gauge_tree_prior_artifact.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-portable-gauge-artifact-formatter-172
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.event.pull_request.number == 172 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/portable-gauge-tree-prior-artifact-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned formatter
        run: python -m pip install "ruff==0.16.2"

      - name: Apply and verify canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/prob4d/_gauge_tree_artifact_common.py
            src/prob4d/command_registry.py
            src/prob4d/gauge_tree_prior_artifact.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -W error::SyntaxWarning -m py_compile "${files[@]}"
          git diff --check

      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/prob4d/_gauge_tree_artifact_common.py
            src/prob4d/command_registry.py
            src/prob4d/gauge_tree_prior_artifact.py
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Portable gauge-artifact files already use canonical formatting."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m "Apply canonical formatting to sparse artifact files"
          git push origin HEAD:agent/portable-gauge-tree-prior-artifact-v1
