name: Temporary patch sealed case paths v2

on:
  push:
    branches:
      - science/information-contract-benchmark-sealed-v1
    paths:
      - tools/requests/patch_sealed_case_path_v2.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Replace basename with relative payload path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/information_contract_sealed.py")
          text = path.read_text(encoding="utf-8")
          old = '"payload": merged_payload.name,'
          new = '"payload": merged_payload.relative_to(temporary_root).as_posix(),'
          if text.count(old) != 1:
              raise SystemExit(f"expected one replacement point, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile src/prob4d/information_contract_sealed.py
          test "$(git diff --name-only)" = "src/prob4d/information_contract_sealed.py"
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prob4d/information_contract_sealed.py
          git commit -m "Fix sealed benchmark nested case payload paths"
          git push origin "HEAD:${GITHUB_REF_NAME}"
