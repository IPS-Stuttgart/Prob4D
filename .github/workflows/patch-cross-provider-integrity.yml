name: Patch cross-provider integrity follow-up

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/patch-cross-provider-integrity.yml"

permissions:
  contents: write

concurrency:
  group: patch-cross-provider-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply reviewed integrity patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/integrity.patch.gz.b64" <<'PATCH'
          
          PATCH
          base64 --decode "$RUNNER_TEMP/integrity.patch.gz.b64" \
            | gzip --decompress > "$RUNNER_TEMP/integrity.patch"
          echo "4cca72ef67ff1250ffca05d73370f222c0b6242c7765fce3958575a1f3eb3958  $RUNNER_TEMP/integrity.patch" \
            | sha256sum --check
          git apply --check "$RUNNER_TEMP/integrity.patch"
          git apply "$RUNNER_TEMP/integrity.patch"
          python3 -m py_compile \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/cross-provider-guard.md \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git commit -m "Bind cross-provider score semantics and row lineage"
          git push origin HEAD:agent/cross-provider-guard-v1
