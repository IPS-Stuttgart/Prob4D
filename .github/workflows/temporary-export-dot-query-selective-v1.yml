name: Export DOT R11-R30 gpuserver6000 control plane

on:
  push:
    branches:
      - science/dot-query-selective-r11-r30-gpuserver6000-v2
    paths:
      - ".github/workflows/temporary-export-dot-query-selective-v1.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.actor == 'FlorianPfaff' && github.repository == 'IPS-Stuttgart/Prob4D'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          clean: true
      - name: Apply and validate deterministic routing transformation
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/finalize-dot-r11.py"
          for fragment in .github/tmp/dot-r11-finalize-0{0,1,2,3}.py; do
            cat "$fragment" >> "$RUNNER_TEMP/finalize-dot-r11.py"
            printf '\n' >> "$RUNNER_TEMP/finalize-dot-r11.py"
          done
          python "$RUNNER_TEMP/finalize-dot-r11.py"
          git diff --check
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dot-rope-query-selective-heldout-v1.yml').read_text()
          test = Path('tests/test_dot_rope_query_selective_heldout_workflow.py').read_text()
          assert 'runs-on: [self-hosted, gpuserver6000]' in workflow
          assert 'test "$RUNNER_NAME" = "workstation2"' in workflow
          assert 'Resolve, download, and verify official R11-R30 archives' in workflow
          assert '--continue-at -' in workflow
          assert 'R31-R70 remained unopened' in workflow
          assert 'runs-on: [self-hosted, Linux, X64, gpuserver4090]' not in workflow
          assert 'selector = "runs-on: [self-hosted, gpuserver6000]"' in test
          assert not Path('protocols/execution_requests/dot_rope_query_selective_heldout_v1.json').exists()
          PY
          mkdir -p "$RUNNER_TEMP/export/tests"
          cp .github/workflows/dot-rope-query-selective-heldout-v1.yml \
            "$RUNNER_TEMP/export/generated-dot-rope-query-selective-heldout-v1.yml"
          cp tests/test_dot_rope_query_selective_heldout_workflow.py \
            "$RUNNER_TEMP/export/tests/"
          git diff -- \
            .github/workflows/dot-rope-query-selective-heldout-v1.yml \
            tests/test_dot_rope_query_selective_heldout_workflow.py \
            > "$RUNNER_TEMP/export/routing.patch"
          (cd "$RUNNER_TEMP/export" && sha256sum \
            generated-dot-rope-query-selective-heldout-v1.yml \
            tests/test_dot_rope_query_selective_heldout_workflow.py \
            routing.patch > SHA256SUMS)
      - name: Upload exact generated review files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dot-r11-r30-gpuserver6000-routing-${{ github.run_id }}
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 7
