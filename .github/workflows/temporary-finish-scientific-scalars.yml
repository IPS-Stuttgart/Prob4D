name: Temporary finish scientific scalar hardening

on:
  push:
    branches:
      - agent/harden-scientific-scalar-validation
    paths:
      - ".github/workflows/temporary-finish-scientific-scalars.yml"
      - ".github/scripts/finish_scientific_scalars.py"

permissions:
  contents: write

concurrency:
  group: temporary-finish-scientific-scalars
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  finish:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-scientific-scalar-validation
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Apply and format the hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finish_scientific_scalars.py
          python -m ruff check --fix \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m ruff format \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m ruff check \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m mypy src/prob4d/_scientific_scalars.py
          git diff --check
      - name: Run regressions and package audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_scientific_scalar_validation.py \
            tests/test_alignment.py \
            tests/test_cross_fitted_disagreement.py \
            tests/test_uncertainty.py \
            tests/test_group_balanced_point_calibration.py
          python -m pytest -q
          python -m build
          python -m twine check dist/*
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "${archive}"
          python scripts/ci/check_sdist.py "${archive}"
      - name: Remove temporary validation machinery and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/finish_scientific_scalars.py \
            .github/workflows/scientific-scalar-one-shot.yml \
            .github/workflows/temporary-finish-scientific-scalars.yml
          git add -A -- \
            .github/scripts/finish_scientific_scalars.py \
            .github/workflows/scientific-scalar-one-shot.yml \
            .github/workflows/temporary-finish-scientific-scalars.yml \
            CHANGELOG.md \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish scientific scalar hardening"
          git push origin HEAD:agent/harden-scientific-scalar-validation
