name: Temporary finish scientific scalar hardening

on:
  push:
    branches:
      - agent/harden-scientific-scalar-validation
    paths:
      - ".github/workflows/temporary-finish-scientific-scalars.yml"

permissions:
  contents: write

concurrency:
  group: temporary-finish-scientific-scalars
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-scientific-scalar-validation
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Reject noncanonical group identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/prob4d/uncertainty.py")
          text = source.read_text(encoding="utf-8")
          old = "        group_ids = tuple(map(str, self.group_ids))\n"
          new = (
              "        if not isinstance(self.group_ids, tuple) or any(\n"
              "            type(value) is not str for value in self.group_ids\n"
              "        ):\n"
              "            raise TypeError(\n"
              "                \"group_ids must be a canonical tuple of strings\"\n"
              "            )\n"
              "        group_ids = self.group_ids\n"
          )
          if text.count(old) != 1:
              raise SystemExit("group_ids normalization anchor changed")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_scientific_scalar_validation.py")
          text = tests.read_text(encoding="utf-8")
          anchor = (
              "def test_group_report_rejects_fractional_group_count_without_truncation() -> None:\n"
              "    with pytest.raises(TypeError, match=r\"group_counts\\[0\\].*genuine integer\"):\n"
              "        _group_report(group_counts=(1.5, 1))\n\n\n"
          )
          addition = anchor + (
              "@pytest.mark.parametrize(\n"
              "    \"group_ids\",\n"
              "    (\n"
              "        (1, \"b\"),\n"
              "        [\"a\", \"b\"],\n"
              "        {\"a\", \"b\"},\n"
              "        \"ab\",\n"
              "    ),\n"
              ")\n"
              "def test_group_report_rejects_noncanonical_group_ids(\n"
              "    group_ids: object,\n"
              ") -> None:\n"
              "    with pytest.raises(TypeError, match=\"canonical tuple of strings\"):\n"
              "        _group_report(group_ids=group_ids)\n\n\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("group-id test insertion anchor changed")
          tests.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY

      - name: Format and validate changed source
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m ruff format \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m ruff check \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          python -m mypy src/prob4d/_scientific_scalars.py
          git diff --check

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_scientific_scalar_validation.py \
            tests/test_alignment.py \
            tests/test_cross_fitted_disagreement.py \
            tests/test_uncertainty.py \
            tests/test_group_balanced_point_calibration.py
          python -m pytest -q

      - name: Build and audit distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "${archive}"
          python scripts/ci/check_sdist.py "${archive}"

      - name: Remove diagnostic workflows and publish ordinary source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/scientific-scalar-one-shot.yml \
            .github/workflows/temporary-finish-scientific-scalars.yml
          git add -A -- \
            .github/workflows/scientific-scalar-one-shot.yml \
            .github/workflows/temporary-finish-scientific-scalars.yml \
            CHANGELOG.md \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py
          git diff --cached --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish scientific scalar hardening"
          git push origin HEAD:agent/harden-scientific-scalar-validation
