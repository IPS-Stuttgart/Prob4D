name: Ruff diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check src tests > ruff-output.txt 2>&1
          status=$?
          echo "ruff_exit_code=$status" >> ruff-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
          if-no-files-found: error
