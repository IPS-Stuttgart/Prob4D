name: Cancel superseded slow DOT R11-R20 run

on:
  push:
    branches: [science/dot-r11-r20-camera-routing-source-v1]
    paths:
      - ".github/workflows/cancel-superseded-dot-r11-r20-gpuserver6000.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded run if still active
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "33551220643"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base=f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"prob4d-cancel-superseded-dot-source",
          }
          run_id=int(os.environ["RUN_ID"])
          def call(path, method="GET"):
              request=urllib.request.Request(
                  f"{base}{path}", method=method,
                  data=b"" if method=="POST" else None,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail=error.read().decode("utf-8",errors="replace")
                  raise RuntimeError(f"{method} {path}: {error.code} {detail}") from error
          _,run=call(f"/actions/runs/{run_id}")
          if run["name"]!="DOT R11-R20 camera-routing provider-rank v1":
              raise SystemExit("run identity changed")
          if run["status"] in {"queued","in_progress"}:
              status,_=call(f"/actions/runs/{run_id}/cancel",method="POST")
              if status not in {202,204}:
                  raise SystemExit(f"unexpected cancel status {status}")
              print(json.dumps({"run_id":run_id,"action":"cancel-requested"}))
          else:
              print(json.dumps({"run_id":run_id,"action":"already-terminal","conclusion":run.get("conclusion")}))
          PY
