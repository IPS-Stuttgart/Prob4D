name: Apply group-robust static fix

on:
  push:
    branches:
      - agent/group-robust-cycle-guard
    paths:
      - ".github/group-robust-static-fix-trigger.txt"

permissions:
  contents: write

concurrency:
  group: apply-group-robust-static-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/group-robust-cycle-guard
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply exact pre-outcome source correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/cycle_guard_group_robust_monte_carlo.py")
          text = path.read_text(encoding="utf-8")
          needle = "import math\n"
          if text.count(needle) != 1:
              raise RuntimeError("expected exactly one unused math import")
          path.write_text(text.replace(needle, "", 1), encoding="utf-8")
          PY
      - name: Validate focused implementation
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/prob4d/cycle_guard_group_robust.py \
            src/prob4d/cycle_guard_group_robust_monte_carlo.py \
            src/prob4d/cli.py \
            tests/test_cycle_guard_group_robust.py \
            tests/test_cycle_guard_group_robust_monte_carlo.py
          python -m pytest -q \
            tests/test_cycle_guard_group_robust.py \
            tests/test_cycle_guard_group_robust_monte_carlo.py
      - name: Commit correction and remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/apply-group-robust-static-fix.yml
          rm .github/group-robust-static-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cycle_guard_group_robust_monte_carlo.py \
            .github/workflows/apply-group-robust-static-fix.yml \
            .github/group-robust-static-fix-trigger.txt
          git diff --cached --check
          git commit -m "Fix group-robust study static check"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/group-robust-cycle-guard
