name: DOT held-out gpuserver6000 payload-free preflight v1

on:
  push:
    branches: [science/dot-heldout-gpuserver6000-preflight-v1]
    paths:
      - ".github/workflows/dot-heldout-gpuserver6000-preflight-v1.yml"

permissions:
  contents: read

concurrency:
  group: dot-heldout-gpuserver6000-preflight-v1
  cancel-in-progress: false

jobs:
  preflight:
    name: Inventory alternate DOT/CUT3R host without payload access
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 20
    steps:
      - name: Require registered alternate runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Inventory metadata-only alternate route
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dot-heldout-gpuserver6000-preflight.json"
          OUT="$out" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          archive_candidates = [
              Path("/mnt/seagate10tb/florianpfaff/datasets/dot/R01-10.zip"),
              Path("/mnt/seagate10tb/florianpfaff/datasets/dot-rope/R01-10.zip"),
              Path("/mnt/lexar4tb/datasets/dot/R01-10.zip"),
              Path("/mnt/lexar4tb/datasets/dot-rope/R01-10.zip"),
              Path("/home/github-runner/.cache/workflows/dot-rope/R01-10.zip"),
          ]
          runtime_candidates = [
              Path("/home/github-runner/.cache/prob4d/cut3r-runtime-v1"),
              Path("/home/florianpfaff/.cache/prob4d/cut3r-runtime-v1"),
          ]
          python_candidates = [
              Path("/home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python"),
              Path("/home/github-runner/.cache/datasets/venvs/hdetrackv2/bin/python"),
              Path("/home/florianpfaff/.cache/prob4d/cut3r-runtime-v1/venv/bin/python"),
          ]

          def metadata(path: Path):
              try:
                  stat = path.lstat()
              except FileNotFoundError:
                  return {"path": str(path), "exists": False, "status": "not-found"}
              except PermissionError:
                  return {
                      "path": str(path),
                      "exists": None,
                      "status": "permission-denied",
                  }
              is_symlink = path.is_symlink()
              try:
                  is_file = path.is_file() if not is_symlink else False
                  is_dir = path.is_dir() if not is_symlink else False
              except PermissionError:
                  is_file = None
                  is_dir = None
              return {
                  "path": str(path),
                  "exists": True,
                  "status": "metadata-readable",
                  "is_file": is_file,
                  "is_dir": is_dir,
                  "is_symlink": is_symlink,
                  "size_bytes": int(stat.st_size),
                  "mode": oct(stat.st_mode & 0o7777),
              }

          record = {
              "schema": "prob4d.dot-heldout-gpuserver6000-payload-free-preflight",
              "schema_version": 1,
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "archive_candidates": [metadata(path) for path in archive_candidates],
              "runtime_candidates": [metadata(path) for path in runtime_candidates],
              "python_candidates": [metadata(path) for path in python_candidates],
              "normal_view_images_opened": False,
              "marker_payloads_opened": False,
              "zip_members_opened": False,
              "r04_r10_outcomes_opened": False,
              "purpose": "Determine whether gpuserver6000 can serve as an alternate execution host without opening the frozen confirmation cohort.",
          }
          Path(os.environ["OUT"]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Upload bounded preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-heldout-gpuserver6000-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/dot-heldout-gpuserver6000-preflight.json
          if-no-files-found: error
          retention-days: 14
