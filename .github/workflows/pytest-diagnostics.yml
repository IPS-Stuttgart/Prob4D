name: Pytest diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.txt 2>&1
          status=$?
          echo "pytest_exit_code=$status" >> pytest-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
