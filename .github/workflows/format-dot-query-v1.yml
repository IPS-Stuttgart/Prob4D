name: Canonically format DOT query experiment

on:
  push:
    branches: [science/dot-query-selective-r11-r30-v1]
    paths:
      - ".github/workflows/format-dot-query-v1.yml"

permissions:
  contents: write

concurrency:
  group: format-dot-query-v1
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/science/dot-query-selective-r11-r30-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact formatting revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
          clean: true
      - name: Run the authoritative formatter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a146b63c0ff40faa2208a3c9f55b252f0c5a000"
          python3 -m pip install --disable-pip-version-check --no-input "ruff==0.16.5"
          python3 -m ruff format \
            scripts/science/run_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout_workflow.py
          python3 -m ruff check \
            scripts/science/run_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout_workflow.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python3 -m ruff format --check \
            scripts/science/run_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout_workflow.py \
            tests/test_trusted_self_hosted_validation_policy.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/run_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout.py \
            tests/test_dot_rope_query_selective_heldout_workflow.py
          git commit -m "Apply canonical Ruff formatting [skip ci]"
          git push origin HEAD:science/dot-query-selective-r11-r30-v1
