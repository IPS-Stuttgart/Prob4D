name: Fix DOT CUT3R bootstrap path

on:
  push:
    branches: [research/dot-rope-cut3r-native-runtime-v1]
    paths:
      - ".github/requests/fix-bootstrap-dot-rope-cut3r-v1.json"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/research/dot-rope-cut3r-native-runtime-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact correction revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Require the exact correction request
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$EVENT_FORCED" = "false"
          test "$EVENT_AFTER" = "$(git rev-parse HEAD)"
          mapfile -t changed < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/requests/fix-bootstrap-dot-rope-cut3r-v1.json"
      - name: Correct, verify, self-delete, and push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/bootstrap-dot-rope-cut3r-native-provider-v1.yml
          sed -i \
            's#tests/test_dot_rope-cut3r-native-provider.py#tests/test_dot_rope_cut3r_native_provider.py#' \
            "$workflow"
          grep -Fx '            tests/test_dot_rope_cut3r_native_provider.py \' "$workflow"
          ! grep -F 'test_dot_rope-cut3r-native-provider.py' "$workflow"
          git rm \
            .github/requests/fix-bootstrap-dot-rope-cut3r-v1.json \
            .github/workflows/fix-bootstrap-dot-rope-cut3r-v1.yml
          git add "$workflow"
          git diff --check
          git config user.name "Florian Pfaff"
          git config user.email "6773539+FlorianPfaff@users.noreply.github.com"
          git commit -m "Correct DOT CUT3R bootstrap test path"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:research/dot-rope-cut3r-native-runtime-v1
