name: Temporary fix DLO45 dataset-root attestation

on:
  push:
    branches: [science/deform-dlo45-source-calibrated-covariance-v1]
    paths:
      - ".github/workflows/temporary-fix-dlo45-dataset-root-attestation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-source-calibrated-covariance-v1
          fetch-depth: 0
      - name: Separate lexical request binding from physical root resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '''    root = Path(args.dataset_root).resolve(strict=True)
              if root != Path(request["dataset_root"]):
                  raise ValueError("dataset root changed")
          '''
          new = '''    supplied_root = Path(args.dataset_root)
              if supplied_root != Path(request["dataset_root"]):
                  raise ValueError("dataset root changed")
              root = supplied_root.resolve(strict=True)
          '''
          if text.count(old) != 2:
              raise SystemExit(f"expected two dataset-root checks, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check 'ruff==0.16.5'
          python -m ruff check --fix \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m ruff format \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m ruff check \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m py_compile \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          git commit -m 'Fix lexical DLO dataset-root attestation'
          git push origin HEAD:science/deform-dlo45-source-calibrated-covariance-v1
