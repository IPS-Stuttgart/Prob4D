name: Apply validated fail-closed quality patch

on:
  push:
    branches: [agent/fail-closed-quality-final]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-fail-closed-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fail-closed-quality-final
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply validated ordinary-file patch
        run: |
          gzip -dc scripts/ci/fail-closed-quality-ordinary.patch.gz | \
            git apply --index --exclude=CHANGELOG.md -
          git diff --cached --check
      - name: Install validation environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
      - name: Validate quality and stable typing
        run: |
          python -m ruff check src tests scripts/ci
          python -m mypy \
            src/prob4d/cli.py \
            src/prob4d/calibration_compatibility.py \
            src/prob4d/composition_jacobian.py \
            src/prob4d/covariance_root.py \
            src/prob4d/observation_factor_stream.py \
            src/prob4d/prediction_store.py \
            src/prob4d/prediction_store_benchmark.py \
            src/prob4d/prediction_store_cli.py \
            src/prob4d/project_identity.py \
            src/prob4d/provider_attestation.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/provider_manifest_cli.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_v2.py \
            src/prob4d/provider_v2_cli.py \
            src/prob4d/provider_v2_factor_bundle.py \
            src/prob4d/provider_v2_loading.py \
            src/prob4d/runtime_revision.py \
            src/prob4d/source_diagnostics.py
      - name: Run complete test suite
        run: python -m pytest
      - name: Commit and push validated ordinary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make quality checks fail closed'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/fail-closed-quality-final
