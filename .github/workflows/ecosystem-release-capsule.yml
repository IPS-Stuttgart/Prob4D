name: Ecosystem installed-wheel release capsule

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-release-capsule.yml"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "scripts/ci/build_ecosystem_release_capsule.py"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/observation_contract.py"
      - "src/prob4d/observation_factor_stream.py"
      - "src/prob4d/observation_factors.py"
      - "src/prob4d/provider_v1.py"
      - "src/prob4d/provider_v2.py"
      - "tests/test_ecosystem_release_capsule.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-release-capsule.yml"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "scripts/ci/build_ecosystem_release_capsule.py"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/observation_contract.py"
      - "src/prob4d/observation_factor_stream.py"
      - "src/prob4d/observation_factors.py"
      - "src/prob4d/provider_v1.py"
      - "src/prob4d/provider_v2.py"
      - "tests/test_ecosystem_release_capsule.py"
  workflow_dispatch:
    inputs:
      bayesian_phystwin_ref:
        description: BayesianPhysTwin branch, tag, or commit to validate
        required: false
        default: main
      causal4d_ref:
        description: Causal4D branch, tag, or commit to validate
        required: false
        default: main
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    ecosystem-release-capsule-${{ github.workflow }}-${{ github.ref }}-
    ${{ inputs.bayesian_phystwin_ref || 'main' }}-
    ${{ inputs.causal4d_ref || 'main' }}
  cancel-in-progress: true

env:
  BAYESIAN_PHYSTWIN_REF: ${{ inputs.bayesian_phystwin_ref || 'main' }}
  CAUSAL4D_REF: ${{ inputs.causal4d_ref || 'main' }}

jobs:
  capsule:
    name: Build, install, verify, and seal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact Prob4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ env.BAYESIAN_PHYSTWIN_REF }}
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_REF }}
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            prob4d/pyproject.toml
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Validate capsule tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q prob4d/tests/test_ecosystem_release_capsule.py
          python -m py_compile \
            prob4d/scripts/ci/build_ecosystem_release_capsule.py

      - name: Run the installed-wheel three-repository golden path
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin \
            prob4d \
            causal4d \
            2>&1 | tee ecosystem-golden-path.log

      - name: Build and verify the content-addressed capsule
        shell: bash
        run: |
          set -euo pipefail
          prob4d_revision="$(git -C prob4d rev-parse --verify 'HEAD^{commit}')"
          bayesian_phystwin_revision="$(
            git -C bayesian-phystwin rev-parse --verify 'HEAD^{commit}'
          )"
          causal4d_revision="$(git -C causal4d rev-parse --verify 'HEAD^{commit}')"
          python_version="$(python -c 'import platform; print(platform.python_version())')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          python prob4d/scripts/ci/build_ecosystem_release_capsule.py build \
            --golden-path-log ecosystem-golden-path.log \
            --prob4d-revision "${prob4d_revision}" \
            --bayesian-phystwin-revision "${bayesian_phystwin_revision}" \
            --causal4d-revision "${causal4d_revision}" \
            --python-version "${python_version}" \
            --runner-os "${RUNNER_OS}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "${run_url}" \
            --output ecosystem-release-capsule.json

          capsule_id="$(
            python prob4d/scripts/ci/build_ecosystem_release_capsule.py verify \
              ecosystem-release-capsule.json
          )"
          {
            echo "### Ecosystem installed-wheel release capsule"
            echo
            echo "- Capsule ID: \`${capsule_id}\`"
            echo "- Prob4D: \`${prob4d_revision}\`"
            echo "- BayesianPhysTwin: \`${bayesian_phystwin_revision}\`"
            echo "- Causal4D: \`${causal4d_revision}\`"
            echo
            echo "This is interoperability and provenance evidence, not scientific promotion."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload capsule and execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecosystem-release-capsule
          path: |
            ecosystem-release-capsule.json
            ecosystem-golden-path.log
          if-no-files-found: warn
          retention-days: 30
