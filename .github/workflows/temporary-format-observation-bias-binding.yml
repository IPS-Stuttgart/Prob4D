name: Temporary observation-bias binding formatter

on:
  push:
    branches: [agent/bind-observation-bias-streams]

permissions:
  contents: write

concurrency:
  group: temporary-observation-bias-binding-formatter
  cancel-in-progress: true

jobs:
  format-test-and-push:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bind-observation-bias-streams
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-observation-bias-binding-format"
          python -m venv --clear "$environment"
          "$environment/bin/python" -m ensurepip --upgrade
          "$environment/bin/python" -m pip install --upgrade pip
          echo "$environment/bin" >> "$GITHUB_PATH"

      - name: Install quality tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Apply deterministic formatting
        run: |
          python -m ruff check --fix \
            src/prob4d/cli.py \
            src/prob4d/observation_bias_binding.py \
            tests/test_cli.py \
            tests/test_observation_bias_binding.py
          python -m ruff format \
            src/prob4d/cli.py \
            src/prob4d/observation_bias_binding.py \
            tests/test_cli.py \
            tests/test_observation_bias_binding.py

      - name: Validate formatted source
        run: |
          python -m ruff check \
            src/prob4d/cli.py \
            src/prob4d/observation_bias_binding.py \
            tests/test_cli.py \
            tests/test_observation_bias_binding.py
          python -m ruff format --check \
            src/prob4d/cli.py \
            src/prob4d/observation_bias_binding.py \
            tests/test_cli.py \
            tests/test_observation_bias_binding.py
          python -m mypy src/prob4d/observation_bias_binding.py
          python -m pytest -q \
            tests/test_observation_bias_binding.py \
            tests/test_observation_factor_stream.py \
            tests/test_visual_bias_stream.py \
            tests/test_cli.py

      - name: Commit validated formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cli.py \
            src/prob4d/observation_bias_binding.py \
            tests/test_cli.py \
            tests/test_observation_bias_binding.py
          git commit -m "Format observation-bias binding"
          git push origin HEAD:agent/bind-observation-bias-streams
