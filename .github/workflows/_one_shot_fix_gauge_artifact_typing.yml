name: One-shot sparse-artifact typing repair

on:
  push:
    branches: [agent/portable-gauge-tree-prior-artifact-v1]
    paths:
      - ".github/workflows/_one_shot_fix_gauge_artifact_typing.yml"
      - "scripts/_one_shot_fix_gauge_artifact_typing.py"

permissions:
  contents: write

concurrency:
  group: one-shot-sparse-artifact-typing-repair
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/portable-gauge-tree-prior-artifact-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact reviewed source repair
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_gauge_artifact_typing.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]" "numpy>=1.24,<2.3"
          python -m pip check

      - name: Validate source and contracts
        run: |
          set -euo pipefail
          files=(
            src/prob4d/_gauge_tree_artifact_common.py
            src/prob4d/_gauge_tree_artifact_io.py
            tests/test_gauge_tree_prior_artifact.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/prob4d/__init__.py \
            src/prob4d/_gauge_tree_artifact_common.py \
            src/prob4d/_gauge_tree_artifact_io.py \
            src/prob4d/command_registry.py \
            src/prob4d/gauge_tree_prior.py \
            src/prob4d/gauge_tree_prior_artifact.py \
            src/prob4d/gauge_tree_prior_io.py
          python -m pytest -q \
            tests/test_gauge_tree_prior_artifact.py \
            tests/test_gauge_tree_contract.py \
            tests/test_gauge_tree_observation.py \
            tests/test_gauge_tree_prior.py \
            tests/test_sparse_observation_factors.py \
            tests/test_cli.py \
            tests/test_command_registry.py
          python -m compileall -q src/prob4d tests

      - name: Remove temporary transport and verify final scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_one_shot_fix_gauge_artifact_typing.yml \
            scripts/_one_shot_fix_gauge_artifact_typing.py
          git diff --check
          unexpected="$(git diff --name-only 2e40b5ebbaffcb6dde152c39175b8687bef59647 -- | grep -E '^(.github/workflows/_one_shot|scripts/_one_shot)' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Temporary paths remain:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix sparse-artifact typing without weakening bounds'
          git push origin HEAD:agent/portable-gauge-tree-prior-artifact-v1
