name: Fix PR 96 replay lint

on:
  push:
    branches:
      - agent/replayable-selection-evidence
    paths:
      - .github/workflows/fix-pr96-replay-lint.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/replayable-selection-evidence
          persist-credentials: true
      - name: Bind the per-candidate replay cache and canonicalize imports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prob4d/_selection_evidence_replay.py')
          text = path.read_text(encoding='utf-8')
          old = '''        def aggregate(
              metric_name: str,
              aggregation: Aggregation,
              *,
              candidate_id: str = candidate.candidate_id,
          ) -> float:
              key = (metric_name, aggregation)
              if key not in aggregate_cache:
                  values: list[float] = []
                  for group_id in groups:
                      row = by_key[(group_id, candidate_id)]
                      if metric_name not in row.metrics:
                          raise ValueError(
                              f"row {(group_id, candidate_id)!r} lacks "
                              f"required metric {metric_name!r}"
                          )
                      values.append(float(row.metrics[metric_name]))
                  aggregate_cache[key] = _aggregate(values, aggregation)
              return aggregate_cache[key]
          '''
          new = '''        def aggregate(
              metric_name: str,
              aggregation: Aggregation,
              *,
              candidate_id: str = candidate.candidate_id,
              cache: dict[tuple[str, Aggregation], float] = aggregate_cache,
          ) -> float:
              key = (metric_name, aggregation)
              if key not in cache:
                  values: list[float] = []
                  for group_id in groups:
                      row = by_key[(group_id, candidate_id)]
                      if metric_name not in row.metrics:
                          raise ValueError(
                              f"row {(group_id, candidate_id)!r} lacks "
                              f"required metric {metric_name!r}"
                          )
                      values.append(float(row.metrics[metric_name]))
                  cache[key] = _aggregate(values, aggregation)
              return cache[key]
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one replay-cache repair target')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m ruff check --fix \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          python -m ruff format \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          python -m ruff check \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          git rm .github/workflows/fix-pr96-replay-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          git diff --cached --check
          git commit -m 'Fix replay cache binding and import order'
          git push origin HEAD:agent/replayable-selection-evidence
