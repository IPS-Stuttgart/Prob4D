name: Fix PR 96 replay lint

on:
  push:
    branches:
      - agent/replayable-selection-evidence
    paths:
      - .github/workflows/fix-pr96-replay-lint.yml

permissions:
  contents: write

concurrency:
  group: fix-pr96-replay-lint
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/replayable-selection-evidence
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Canonicalize and validate replay evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check --fix \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m ruff format \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m ruff check \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m mypy \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          python -m pytest -q tests/test_selection_evidence.py
          git diff --check
      - name: Publish clean source-only branch
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/fix-pr96-replay-lint.yml \
            .github/workflows/hosted-repair-pr96.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          git diff --cached --check
          git commit -m 'Canonicalize replayable selection evidence'
          git push origin HEAD:agent/replayable-selection-evidence
