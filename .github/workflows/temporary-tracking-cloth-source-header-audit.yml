name: Temporary Tracking Cloth source-header audit

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-tracking-cloth-source-header-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-tracking-cloth-source-header-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  ZENODO_URL: https://zenodo.org/records/14644526/files/tracking_dataset.zip?download=1
  ZENODO_MD5: b4868b702f8a42b2ea1069d0f1a3b8f6

jobs:
  inspect-source-header:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Download verified public release and audit source headers only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tracking-cloth-header-audit"
          rm -rf -- "$root"
          mkdir -p "$root"
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --output "$root/tracking_dataset.zip" "$ZENODO_URL"
          printf '%s  %s\n' "$ZENODO_MD5" "$root/tracking_dataset.zip" \
            | md5sum --check --strict
          ROOT="$root" python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import zipfile
          from pathlib import Path

          SOURCE_TOKENS = ("shake", "shaking", "twist", "twisting")

          def layout(raw: bytes):
              text = raw.decode("utf-8-sig", errors="strict")
              sample = text[:65536]
              try:
                  delimiter = csv.Sniffer().sniff(sample, delimiters=",;\t").delimiter
              except csv.Error:
                  delimiter = max((",", ";", "\t"), key=sample.count)
              rows = list(csv.reader(io.StringIO(sample), delimiter=delimiter))
              first_numeric = None
              for index, row in enumerate(rows):
                  try:
                      float(row[0])
                      float(row[1])
                  except (IndexError, ValueError):
                      continue
                  first_numeric = index
                  break
              if first_numeric is None or first_numeric < 7:
                  raise RuntimeError("Motive header or first numeric row was not identified")
              header = rows[:first_numeric]
              axis_index = next(
                  index
                  for index in range(first_numeric - 1, -1, -1)
                  if len(header[index]) >= 5
                  and header[index][0].strip().lower().startswith("frame")
                  and "time" in header[index][1].strip().lower()
              )
              type_index = next(
                  index
                  for index, row in enumerate(header[:axis_index])
                  if sum(cell.strip().lower() == "marker" for cell in row) >= 3
              )
              label_index = type_index + 1
              id_index = type_index + 2
              position_index = axis_index - 1
              width = min(
                  len(header[type_index]),
                  len(header[label_index]),
                  len(header[id_index]),
                  len(header[position_index]),
                  len(header[axis_index]),
              )
              markers = []
              for start in range(2, width - 2, 3):
                  if [
                      header[type_index][start + offset].strip().lower()
                      for offset in range(3)
                  ] != ["marker", "marker", "marker"]:
                      continue
                  if [
                      header[position_index][start + offset].strip().lower()
                      for offset in range(3)
                  ] != ["position", "position", "position"]:
                      continue
                  if [
                      header[axis_index][start + offset].strip().upper()
                      for offset in range(3)
                  ] != ["X", "Y", "Z"]:
                      continue
                  labels = {
                      header[label_index][start + offset].strip()
                      for offset in range(3)
                  }
                  ids = {
                      header[id_index][start + offset].strip()
                      for offset in range(3)
                  }
                  if len(labels) != 1 or len(ids) != 1:
                      raise RuntimeError("Motive marker triple has inconsistent identity")
                  label = next(iter(labels))
                  unique_id = next(iter(ids))
                  if not label or not unique_id:
                      raise RuntimeError("Motive marker identity is empty")
                  markers.append({
                      "label": label,
                      "unique_id": unique_id,
                      "columns_zero_based": [start, start + 1, start + 2],
                  })
              if len(markers) < 3:
                  raise RuntimeError("fewer than three marker triples were decoded")
              units = None
              if header and "Length Units" in header[0]:
                  position = header[0].index("Length Units")
                  if position + 1 < len(header[0]):
                      units = header[0][position + 1]
              return delimiter, first_numeric, header, markers, units

          root = Path(os.environ["ROOT"])
          archive_path = root / "tracking_dataset.zip"
          records = []
          with zipfile.ZipFile(archive_path) as archive:
              csv_names = sorted(
                  name for name in archive.namelist()
                  if name.lower().endswith(".csv") and not name.endswith("/")
              )
              if len(csv_names) != 120:
                  raise SystemExit(f"expected 120 CSVs, found {len(csv_names)}")
              source_names = [
                  name for name in csv_names
                  if any(token in name.lower() for token in SOURCE_TOKENS)
              ]
              if len(source_names) != 64:
                  raise SystemExit(f"expected 64 source CSVs, found {len(source_names)}")
              for name in source_names:
                  with archive.open(name) as stream:
                      raw = stream.read(65536)
                  delimiter, first_numeric, header, markers, units = layout(raw)
                  records.append({
                      "recording_id": hashlib.sha256(name.encode()).hexdigest()[:16],
                      "recording_name": name,
                      "source_prefix_sha256": hashlib.sha256(raw).hexdigest(),
                      "delimiter": "tab" if delimiter == "\t" else delimiter,
                      "first_numeric_row_zero_based": first_numeric,
                      "length_units": units,
                      "marker_count": len(markers),
                      "marker_labels": sorted(marker["label"] for marker in markers),
                      "marker_unique_ids": sorted(marker["unique_id"] for marker in markers),
                      "markers": markers,
                      "header_rows": header if name == source_names[0] else None,
                  })
          label_sets = [set(record["marker_labels"]) for record in records]
          id_sets = [set(record["marker_unique_ids"]) for record in records]
          common_labels = sorted(set.intersection(*label_sets), key=lambda value: (len(value), value))
          common_ids = sorted(set.intersection(*id_sets))
          evidence = {
              "schema": "prob4d.tracking-cloth-source-header-audit.v2",
              "archive_md5": os.environ["ZENODO_MD5"],
              "csv_count": 120,
              "source_recording_count": len(records),
              "source_recording_ids": [record["recording_id"] for record in records],
              "source_marker_count_distribution": sorted({record["marker_count"] for record in records}),
              "common_marker_labels": common_labels,
              "common_marker_label_count": len(common_labels),
              "common_marker_unique_ids": common_ids,
              "common_marker_unique_id_count": len(common_ids),
              "records": records,
              "target_header_or_trajectory_opened": False,
              "source_trajectory_values_retained": False,
          }
          (root / "source-header.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          archive_path.unlink()
          PY
      - name: Upload bounded source-header evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-source-header-${{ github.run_id }}
          path: ${{ runner.temp }}/tracking-cloth-header-audit/source-header.json
          if-no-files-found: error
          retention-days: 7
