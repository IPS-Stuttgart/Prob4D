name: Trigger PR 110 atomic repair

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: trigger-pr110-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/self-hosted-prob4d-storage-evidence'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/self-hosted-prob4d-storage-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Execute reviewed embedded repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'DRIVER'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              ".github/workflows/fail-closed-quality.yml"
          ).read_text(encoding="utf-8")
          start_marker = "/usr/bin/python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1:
              raise SystemExit("embedded repair start marker changed")
          payload = workflow.split(start_marker, 1)[1]
          if payload.count(end_marker) != 1:
              raise SystemExit("embedded repair end marker changed")
          source = dedent(payload.split(end_marker, 1)[0])
          exec(compile(source, "<pr110-repair>", "exec"), {})
          DRIVER
          rm -f .github/workflows/trigger-pr110-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix content-bound diagnostics and exclusive publication"
          git push origin HEAD:ci/self-hosted-prob4d-storage-evidence
