name: Temporary switch DOT R04 archive recovery to hosted relay v1

on:
  push:
    branches: [ops/switch-dot-r04-to-hosted-relay-v1]
    paths:
      - "ops/requests/switch_dot_r04_to_hosted_relay_v1.json"

permissions:
  contents: read
  actions: write

jobs:
  switch:
    name: Cancel only the active archive-only direct recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Require exactly one controller request change
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
          REQUEST_PATH: ops/requests/switch_dot_r04_to_hosted_relay_v1.json
        run: |
          set -euo pipefail
          test "$EVENT_REF" = "refs/heads/ops/switch-dot-r04-to-hosted-relay-v1"
          test "$EVENT_AFTER" = "$(git rev-parse HEAD)"
          test "$EVENT_FORCED" = "false"
          test "$EVENT_DELETED" = "false"
          test "$EVENT_BEFORE" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" | sort)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$REQUEST_PATH" ]]; then
            printf 'Expected only %s; changed paths were:\n' "$REQUEST_PATH" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 2
          fi

      - name: Verify exact pre-payload state, cancel, and prove terminal cancellation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: "33442397966"
          RECOVERY_HEAD_SHA: ef2daea9484edb17917f328812a458813f692cd6
          RECOVERY_WORKFLOW_PATH: .github/workflows/recover-dot-r04-r10-archive-cache-v2.yml
          RECOVERY_JOB_ID: "99653502112"
          RECOVERY_JOB_NAME: Recover exact official archive on gpuserver6000
          ARCHIVE_STEP_NAME: Reuse, salvage, or reacquire publisher-verified archive
          RECEIPT_STEP_NAME: Upload bounded recovery receipt
          TARGET_RUN_ID: "33434695566"
          TARGET_HEAD_SHA: 9e1b77b2e70685881db7f188a95a3a91443275e8
          TARGET_JOB_ID: "99628289885"
          PROVIDER_ARTIFACT_PREFIX: dot-rope-cut3r-heldout-provider-gpuserver6000-
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from typing import Any

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "Prob4D-switch-DOT-recovery-to-hosted-relay/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(method: str, path: str) -> tuple[int, Any]:
              request = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  method=method,
                  data=b"" if method == "POST" else None,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed with {error.code}: {detail}"
                  ) from error

          def get(path: str) -> Any:
              return call("GET", path)[1]

          recovery_run_id = int(os.environ["RECOVERY_RUN_ID"])
          recovery = get(f"/actions/runs/{recovery_run_id}")
          if recovery["head_sha"] != os.environ["RECOVERY_HEAD_SHA"]:
              raise SystemExit("direct recovery head changed")
          if recovery["path"] != os.environ["RECOVERY_WORKFLOW_PATH"]:
              raise SystemExit("direct recovery workflow changed")
          if int(recovery.get("run_attempt", 0)) != 1:
              raise SystemExit("direct recovery attempt changed")
          if recovery["status"] != "in_progress" or recovery.get("conclusion") is not None:
              raise SystemExit(
                  f"direct recovery is not the exact live controller: "
                  f"{recovery['status']}/{recovery.get('conclusion')}"
              )

          artifacts = get(f"/actions/runs/{recovery_run_id}/artifacts?per_page=100")
          if int(artifacts.get("total_count", 0)) != 0:
              raise SystemExit("direct recovery already emitted an artifact")

          jobs = get(f"/actions/runs/{recovery_run_id}/jobs?per_page=100")["jobs"]
          matches = [
              job
              for job in jobs
              if int(job["id"]) == int(os.environ["RECOVERY_JOB_ID"])
              and job.get("name") == os.environ["RECOVERY_JOB_NAME"]
          ]
          if len(matches) != 1:
              raise SystemExit("exact direct recovery job is unavailable")
          job = matches[0]
          if job["status"] != "in_progress" or job.get("conclusion") is not None:
              raise SystemExit("direct recovery job is not live")
          if job.get("runner_name") != "workstation2":
              raise SystemExit("direct recovery runner changed")
          steps = {step.get("name"): step for step in job.get("steps") or []}
          required_success = {
              "Bind intended runner and tools",
              "Prove failure remained before provider prediction and sealing",
          }
          for name in required_success:
              if (steps.get(name) or {}).get("conclusion") != "success":
                  raise SystemExit(f"direct recovery precondition did not pass: {name}")
          archive_step = steps.get(os.environ["ARCHIVE_STEP_NAME"]) or {}
          if archive_step.get("status") != "in_progress" or archive_step.get("conclusion") is not None:
              raise SystemExit("direct recovery is no longer confined to archive acquisition")
          receipt_step = steps.get(os.environ["RECEIPT_STEP_NAME"]) or {}
          if receipt_step.get("status") not in {"pending", "queued"}:
              raise SystemExit("direct recovery advanced to receipt publication")
          if receipt_step.get("conclusion") is not None:
              raise SystemExit("direct recovery receipt step has a conclusion")

          target_run_id = int(os.environ["TARGET_RUN_ID"])
          target = get(f"/actions/runs/{target_run_id}")
          if target["head_sha"] != os.environ["TARGET_HEAD_SHA"]:
              raise SystemExit("frozen target head changed")
          if target["status"] != "completed" or target.get("conclusion") != "failure":
              raise SystemExit("frozen target is no longer the pre-inference failure")
          target_artifacts = get(f"/actions/runs/{target_run_id}/artifacts?per_page=100")
          if any(
              item.get("name", "").startswith(os.environ["PROVIDER_ARTIFACT_PREFIX"])
              for item in target_artifacts.get("artifacts", [])
          ):
              raise SystemExit("frozen target already has a provider seal")
          target_jobs = get(f"/actions/runs/{target_run_id}/jobs?per_page=100")["jobs"]
          target_matches = [
              item
              for item in target_jobs
              if int(item["id"]) == int(os.environ["TARGET_JOB_ID"])
          ]
          if len(target_matches) != 1 or target_matches[0].get("conclusion") != "failure":
              raise SystemExit("exact frozen failed provider job is unavailable")

          status, _ = call("POST", f"/actions/runs/{recovery_run_id}/cancel")
          if status not in {202, 204}:
              raise SystemExit(f"unexpected cancellation response: {status}")

          deadline = time.monotonic() + 180.0
          final = None
          while time.monotonic() < deadline:
              final = get(f"/actions/runs/{recovery_run_id}")
              if final["status"] == "completed":
                  break
              time.sleep(2)
          if final is None or final["status"] != "completed":
              raise SystemExit("direct recovery did not reach a terminal state")
          if final.get("conclusion") != "cancelled":
              raise SystemExit(
                  f"direct recovery completed unexpectedly as {final.get('conclusion')}"
              )

          artifacts_after = get(
              f"/actions/runs/{recovery_run_id}/artifacts?per_page=100"
          )
          if int(artifacts_after.get("total_count", 0)) != 0:
              raise SystemExit("cancelled direct recovery emitted an artifact")
          target_after = get(f"/actions/runs/{target_run_id}")
          if target_after["status"] != "completed" or target_after.get("conclusion") != "failure":
              raise SystemExit("frozen target changed during transport switch")

          receipt = {
              "schema": "prob4d.dot-r04-transport-switch-receipt",
              "schema_version": 1,
              "cancelled_direct_recovery_run_id": recovery_run_id,
              "cancelled_conclusion": final["conclusion"],
              "cancelled_artifact_count": 0,
              "target_run_id": target_run_id,
              "target_job_id": int(os.environ["TARGET_JOB_ID"]),
              "target_still_pre_inference_failure": True,
              "provider_seal_present": False,
              "archive_payload_opened_by_controller": False,
              "marker_payload_opened_by_controller": False,
              "scientific_inputs_changed": False,
              "next_authorized_lane": "hosted-archive-relay-v1",
          }
          print(json.dumps(receipt, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## DOT R04 transport switch\n\n")
              output.write("```json\n")
              output.write(json.dumps(receipt, indent=2, sort_keys=True))
              output.write("\n```\n")
          PY
