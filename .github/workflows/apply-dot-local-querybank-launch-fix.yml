name: Apply local DOT query-bank launch fix

on:
  push:
    branches:
      - run/dot-measured-querybank-gpuserver4090-20260901-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact launch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: run/dot-measured-querybank-gpuserver4090-20260901-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply and validate the policy-only correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_dot_local_querybank_launch_fix.py
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pytest -q \
            tests/test_github_action_pins.py \
            tests/test_dot_rope_cut3r_measured_querybank_v1.py
          git diff --check

      - name: Commit validated workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/run-dot-measured-querybank-gpuserver4090-20260901-v1.yml
          git diff --cached --check
          git commit -m "Annotate pinned Actions in local DOT evaluation"
          git push origin HEAD:run/dot-measured-querybank-gpuserver4090-20260901-v1
