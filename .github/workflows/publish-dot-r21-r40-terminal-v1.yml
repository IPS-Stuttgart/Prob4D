name: Publish prospective DOT R21-R40 terminal result v1

on:
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/publish_dot_r21_r40_terminal_v1.trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-dot-r21-r40-terminal-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact triggering main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Wait for the prospective target workflow and terminal artifact
        id: terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dot-r21-r40-terminal"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "Prob4D-DOT-R21-R40-terminal/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          run = None
          for _ in range(1320):
              url = (
                  f"{api}/repos/{repo}/actions/workflows/"
                  "dot-rope-r21-r40-confirmation-v1.yml/runs"
                  "?branch=main&event=push&per_page=20"
              )
              try:
                  payload = get(url)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      time.sleep(15)
                      continue
                  raise
              candidates = [
                  item
                  for item in payload.get("workflow_runs", [])
                  if item.get("head_branch") == "main"
                  and item.get("event") == "push"
              ]
              if candidates:
                  candidates.sort(key=lambda item: int(item["id"]), reverse=True)
                  candidate = candidates[0]
                  if candidate.get("status") == "completed":
                      run = candidate
                      break
              time.sleep(15)
          if run is None:
              raise SystemExit("R21-R40 target workflow did not become terminal")

          run_id = int(run["id"])
          artifacts = get(
              f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          ).get("artifacts", [])
          matches = [
              item
              for item in artifacts
              if item.get("expired") is False
              and "evaluation" in item.get("name", "").lower()
              and "provider" not in item.get("name", "").lower()
              and "runtime" not in item.get("name", "").lower()
          ]
          if not matches:
              raise SystemExit("R21-R40 run produced no terminal evaluation artifact")
          matches.sort(key=lambda item: int(item["id"]), reverse=True)
          artifact = matches[0]
          digest = artifact.get("digest", "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("target evaluation artifact digest is invalid")
          value = {
              "run_id": run_id,
              "run_conclusion": run.get("conclusion"),
              "run_head_sha": run.get("head_sha"),
              "artifact_id": int(artifact["id"]),
              "artifact_name": artifact["name"],
              "artifact_digest": digest,
              "download_url": artifact["archive_download_url"],
          }
          Path(os.environ["RUNNER_TEMP"], "dot-r21-r40-run.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, item in value.items():
                  output.write(f"{key}={item}\n")
          print(json.dumps(value, indent=2, sort_keys=True))
          PY
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNNER_TEMP/dot-r21-r40-terminal.zip" \
            "${{ steps.terminal.outputs.download_url }}"
          unzip -q "$RUNNER_TEMP/dot-r21-r40-terminal.zip" \
            -d "$RUNNER_TEMP/dot-r21-r40-terminal"

      - name: Verify and materialize a content-addressed terminal publication
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "dot-r21-r40-terminal"
          results = sorted(root.rglob("result.json"))
          failures = sorted(root.rglob("failure.json")) + sorted(
              root.rglob("technical-failure.json")
          )
          verifications = sorted(root.rglob("independent-verification.json"))
          if len(results) == 1:
              payload_path = results[0]
          elif len(failures) == 1:
              payload_path = failures[0]
          else:
              raise SystemExit("target terminal payload is unavailable or ambiguous")
          if len(verifications) != 1:
              raise SystemExit("target independent verification is unavailable")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          verification = json.loads(
              verifications[0].read_text(encoding="utf-8")
          )
          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dot-r21-r40-run.json").read_text(
                  encoding="utf-8"
              )
          )
          decision = payload.get("decision", "unknown")
          result_id = (
              payload.get("evaluation_id")
              or payload.get("result_id")
              or payload.get("technical_result_id")
          )
          if verification.get("decision") != decision:
              raise SystemExit("independent verification decision disagrees")
          verified_id = verification.get("result_id")
          if verified_id is not None and verified_id != result_id:
              raise SystemExit("independent verification result identity disagrees")
          if not isinstance(result_id, str) or len(result_id) != 64:
              raise SystemExit("target result identity is invalid")

          publication = {
              "schema": "prob4d.dot-r21-r40-terminal-publication",
              "schema_version": 1,
              "decision": decision,
              "result_id": result_id,
              "target_sequences": [f"R{index:02d}" for index in range(21, 41)],
              "reserved_sequences": "R41-R70",
              "workflow_run": run,
              "payload_filename": payload_path.name,
              "payload": payload,
              "independent_verification": verification,
              "post_open_retuning_permitted": False,
              "bayesian_phystwin_executed": False,
              "causal4d_executed": False,
          }
          encoded = json.dumps(
              publication,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          ).encode("utf-8")
          publication["publication_id"] = hashlib.sha256(encoded).hexdigest()
          destination = Path("evidence/dot-r21-r40-confirmation-v1")
          destination.mkdir(parents=True, exist_ok=True)
          (destination / "terminal.json").write_text(
              json.dumps(
                  publication,
                  indent=2,
                  sort_keys=True,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
              newline="\n",
          )

          lines = [
              "# DOT R21-R40 prospective confirmation",
              "",
              f"- Decision: **{decision}**",
              f"- Result ID: `{result_id}`",
              f"- Publication ID: `{publication['publication_id']}`",
              f"- Workflow run: `{run['run_id']}`",
              f"- Artifact ID: `{run['artifact_id']}`",
              f"- Artifact digest: `{run['artifact_digest']}`",
              "- R41-R70 remained reserved.",
              "- Post-open target retuning is prohibited.",
              "",
          ]
          criteria = payload.get("criteria")
          if isinstance(criteria, dict):
              lines.extend(["## Registered criteria", ""])
              for name, passed in criteria.items():
                  lines.append(f"- {'PASS' if passed else 'FAIL'} — {name}")
              lines.append("")
          accounting = payload.get("accounting")
          if isinstance(accounting, dict):
              lines.extend(["## Accounting", "", "```json"])
              lines.append(json.dumps(accounting, indent=2, sort_keys=True))
              lines.extend(["```", ""])
          aggregate = payload.get("aggregate_equal_sequence_results")
          if isinstance(aggregate, dict):
              lines.extend(["## Aggregate results", "", "```json"])
              lines.append(json.dumps(aggregate, indent=2, sort_keys=True))
              lines.extend(["```", ""])
          (destination / "SUMMARY.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps({"decision": decision, "result_id": result_id}))
          PY

      - name: Commit immutable terminal evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/dot-r21-r40-confirmation-v1/
          git commit -m "Record prospective DOT R21-R40 terminal result"
          git pull --rebase origin main
          git push origin HEAD:main
