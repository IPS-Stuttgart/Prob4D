name: Joint-gauge tracklet evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/joint-gauge-tracklet-evidence.yml"
      - "docs/cross-window-tracklet-evidence.md"
      - "src/prob4d/cross_window_tracklet_evidence.py"
      - "src/prob4d/cross_window_tracklets.py"
      - "src/prob4d/causal_tracklets.py"
      - "src/prob4d/observation_factors.py"
      - "src/prob4d/sim3.py"
      - "tests/test_cross_window_tracklet_evidence.py"
      - "tests/test_cross_window_tracklets.py"
      - "tests/test_causal_tracklets.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joint-gauge-tracklet-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  focused-contract:
    name: Provenance, ranking, and dependence contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compatible development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/cross_window_tracklet_evidence.py \
            tests/test_cross_window_tracklet_evidence.py
          python -m ruff format --check \
            src/prob4d/cross_window_tracklet_evidence.py \
            tests/test_cross_window_tracklet_evidence.py
          python -m mypy src/prob4d/cross_window_tracklet_evidence.py
      - name: Run association and producer regressions
        run: >-
          python -m pytest -q
          tests/test_cross_window_tracklet_evidence.py
          tests/test_cross_window_tracklets.py
          tests/test_causal_tracklets.py
      - name: Verify installed public module
        run: |
          python - <<'PY'
          from prob4d.cross_window_tracklet_evidence import (
              CONDITIONAL_POINT_CROSS_COVARIANCE_SEMANTICS,
              DEPENDENCE_SEMANTICS,
              JOINT_GAUGE_ASSOCIATION_SCHEMA,
              RANKING_SEMANTICS,
              TRACKLET_ARTIFACT_SCHEMA,
          )

          assert DEPENDENCE_SEMANTICS == "joint-cross-window-gauge-v1"
          assert RANKING_SEMANTICS == (
              "isotropic-geometric-mutual-best-joint-gauge-diagnostic-v1"
          )
          assert CONDITIONAL_POINT_CROSS_COVARIANCE_SEMANTICS == (
              "assumed-zero-unavailable-v1"
          )
          assert JOINT_GAUGE_ASSOCIATION_SCHEMA.startswith("prob4d.")
          assert TRACKLET_ARTIFACT_SCHEMA.startswith("prob4d.")
          PY
