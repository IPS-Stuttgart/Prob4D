name: Fix provider-neutral source branch

on:
  push:
    branches:
      - agent/provider-neutral-windowed-4d-source
    paths:
      - .github/workflows/fix-provider-neutral-source.yml

permissions:
  contents: write

concurrency:
  group: fix-provider-neutral-windowed-4d-source
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/provider-neutral-windowed-4d-source
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase and remove the exact lint defect
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_source.py")
          text = path.read_text(encoding="utf-8")
          needle = "    Windowed4DSourceManifestV1,\n"
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one unused source-manifest import")
          path.write_text(text.replace(needle, ""), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-provider-neutral-source.yml
          git diff --check

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --clear "${RUNNER_TEMP}/prob4d-source-venv"
          "${RUNNER_TEMP}/prob4d-source-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/prob4d-source-venv/bin/python" -m pip install --no-cache-dir -e ".[dev]"
          python="${RUNNER_TEMP}/prob4d-source-venv/bin/python"
          "${python}" -m ruff check \
            src/prob4d/contracts.py \
            src/prob4d/source.py \
            tests/test_source.py \
            tests/test_stable_facades.py
          "${python}" -m ruff format --check \
            src/prob4d/contracts.py \
            src/prob4d/source.py \
            tests/test_source.py \
            tests/test_stable_facades.py
          "${python}" -m mypy src/prob4d/contracts.py src/prob4d/source.py
          "${python}" -m pytest -q tests/test_source.py tests/test_stable_facades.py

      - name: Publish repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix provider-neutral source lint and rebase"
          git push --force-with-lease origin "HEAD:agent/provider-neutral-windowed-4d-source"
