name: Apply DOT provider output directory fix

on:
  push:
    branches:
      - fix/dot-r04-r10-provider-output-v1
    paths:
      - ".github/workflows/apply-dot-provider-output-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-provider-output-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply bounded non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/apply_dot_provider_output_fix.py

      - name: Validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff format \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff check \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff format --check \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m pytest -q \
            tests/test_dot_rope_cut3r_heldout_output.py \
            tests/test_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_result_verifier.py
          git diff --check

      - name: Commit only non-workflow repair files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py \
            CHANGELOG.d/dot-r04-r10-provider-output-v1.md
          git diff --cached --check
          git commit -m "Handle pre-created empty held-out provider output"
          git push origin HEAD:fix/dot-r04-r10-provider-output-v1
