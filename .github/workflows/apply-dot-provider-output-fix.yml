name: Apply DOT provider output directory fix

on:
  push:
    branches:
      - fix/dot-r04-r10-provider-output-v1
    paths:
      - ".github/workflows/apply-dot-provider-output-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-provider-output-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Patch only the held-out output handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/run_dot_rope_cut3r_heldout_confirmation.py")
          text = path.read_text(encoding="utf-8")
          anchor = "def predict(args: argparse.Namespace) -> int:\n"
          helper = '''def _prepare_exclusive_output(path: Path) -> Path:
              """Remove only a pre-created empty directory before exclusive creation."""

              if path.is_symlink():
                  raise FileExistsError(f"provider output path is a symbolic link: {path}")
              if path.exists():
                  if not path.is_dir() or any(path.iterdir()):
                      raise FileExistsError(f"provider output path is not empty: {path}")
                  path.rmdir()
              return path


          '''
          if text.count(anchor) != 1 or "def _prepare_exclusive_output" in text:
              raise SystemExit("held-out predictor shape changed")
          text = text.replace(anchor, helper + anchor, 1)

          old_adapted = "    adapted = _base_protocol(protocol)\n"
          new_adapted = (
              "    output_dir = _prepare_exclusive_output(args.output_dir)\n"
              "    adapted = _base_protocol(protocol)\n"
          )
          if text.count(old_adapted) != 1:
              raise SystemExit("held-out adapted-protocol assignment changed")
          text = text.replace(old_adapted, new_adapted, 1)

          old_output = "                output_dir=args.output_dir,\n"
          new_output = "                output_dir=output_dir,\n"
          if text.count(old_output) != 1:
              raise SystemExit("held-out provider output argument changed")
          text = text.replace(old_output, new_output, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

          test = Path("tests/test_dot_rope_cut3r_heldout_output.py")
          test.write_text(
              '''from __future__ import annotations

import importlib.util
from pathlib import Path

import pytest

ROOT = Path(__file__).resolve().parents[1]
SCRIPT = ROOT / "scripts/science/run_dot_rope_cut3r_heldout_confirmation.py"


def _load_script():
    spec = importlib.util.spec_from_file_location("dot_heldout_confirmation", SCRIPT)
    assert spec is not None and spec.loader is not None
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module


def test_precreated_empty_output_is_removed_for_exclusive_provider_creation(
    tmp_path: Path,
) -> None:
    module = _load_script()
    output = tmp_path / "provider"
    output.mkdir()

    assert module._prepare_exclusive_output(output) == output
    assert not output.exists()


def test_nonempty_or_symbolic_output_fails_closed(tmp_path: Path) -> None:
    module = _load_script()
    nonempty = tmp_path / "nonempty"
    nonempty.mkdir()
    (nonempty / "sentinel").write_text("preserve", encoding="utf-8")

    with pytest.raises(FileExistsError, match="not empty"):
        module._prepare_exclusive_output(nonempty)
    assert (nonempty / "sentinel").read_text(encoding="utf-8") == "preserve"

    target = tmp_path / "target"
    target.mkdir()
    link = tmp_path / "link"
    link.symlink_to(target, target_is_directory=True)
    with pytest.raises(FileExistsError, match="symbolic link"):
        module._prepare_exclusive_output(link)
''',
              encoding="utf-8",
              newline="\n",
          )

          changelog = Path("CHANGELOG.d/dot-r04-r10-provider-output-v1.md")
          changelog.write_text(
              "# Fixed\n\n"
              "- Permit the frozen DOT R04–R10 wrapper to remove only a pre-created "
              "empty provider directory before the hash-pinned predictor performs "
              "its exclusive creation. Nonempty, file, and symbolic-link outputs "
              "still fail closed; all scientific inputs remain unchanged.\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff format \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff check \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m ruff format --check \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py
          python -m pytest -q \
            tests/test_dot_rope_cut3r_heldout_output.py \
            tests/test_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_result_verifier.py
          git diff --check

      - name: Commit only non-workflow repair files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_dot_rope_cut3r_heldout_confirmation.py \
            tests/test_dot_rope_cut3r_heldout_output.py \
            CHANGELOG.d/dot-r04-r10-provider-output-v1.md
          git diff --cached --check
          git commit -m "Handle pre-created empty held-out provider output"
          git push origin HEAD:fix/dot-r04-r10-provider-output-v1
