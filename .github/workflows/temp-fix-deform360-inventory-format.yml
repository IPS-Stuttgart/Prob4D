name: Temporary fix for Deform360 inventory formatting

on:
  push:
    branches: [science/deform360-pcd-query-inventory-v1]
    paths:
      - ".github/workflows/temp-fix-deform360-inventory-format.yml"

permissions:
  contents: write

jobs:
  fix-and-remove:
    if: github.repository == 'IPS-Stuttgart/Prob4D'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-pcd-query-inventory-v1
          persist-credentials: true
      - name: Apply exact formatting repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/inventory_deform360_pcd_archives.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '            "Only tar headers and filesystem metadata were read. '
              'Archive payloads and arrays remained unopened.",\n'
          )
          new = (
              '            "Only tar headers and filesystem metadata were read. "\n'
              '            "Archive payloads and arrays remained unopened.",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("formatting target is not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/inventory_deform360_pcd_archives.py
          git rm .github/workflows/temp-fix-deform360-inventory-format.yml
          git commit -m "Fix Deform360 inventory formatting"
          git push origin HEAD:science/deform360-pcd-query-inventory-v1
