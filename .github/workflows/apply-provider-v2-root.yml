name: Apply provider-v2 covariance-root payload

on:
  push:
    branches: [agent/provider-v2-calibration-hardening]
    paths:
      - ".tmp/provider-v2-root/**"
      - ".github/workflows/apply-provider-v2-root.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-provider-v2-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore verified source payloads
        run: python .tmp/provider-v2-root/apply.py
      - name: Validate restored implementation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests/test_observation_export.py
          python -m pytest tests/test_observation_export.py --tb=short
      - name: Commit restored source and remove transport files
        run: |
          rm -rf .tmp/provider-v2-root
          rm .github/workflows/apply-provider-v2-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prob4d/observation_export.py tests/test_observation_export.py \
            .tmp/provider-v2-root .github/workflows/apply-provider-v2-root.yml
          git diff --cached --check
          git commit -m "Add canonical covariance-root mode"
          git push origin "HEAD:${GITHUB_REF_NAME}"
