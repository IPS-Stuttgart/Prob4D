name: DOT CUT3R gpuserver6000 runtime candidate v1

on:
  push:
    branches:
      - ops/dot-cut3r-gpuserver6000-preflight-v1
    paths:
      - "ops/requests/dot-cut3r-gpuserver6000-runtime-candidate-v1.json"

permissions:
  contents: read

concurrency:
  group: dot-cut3r-gpuserver6000-runtime-candidate-v1
  cancel-in-progress: false

env:
  REQUEST_PATH: ops/requests/dot-cut3r-gpuserver6000-runtime-candidate-v1.json
  CANDIDATE_ROOT: /home/github-runner/.conda/envs/cut3r
  CANDIDATE_PYTHON: /home/github-runner/.conda/envs/cut3r/bin/python
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  stage:
    name: Stage resolver-stable CUT3R interpreter on gpuserver6000
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/ops/dot-cut3r-gpuserver6000-preflight-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 240
    steps:
      - name: Require intended idle GPU runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v nvidia-smi >/dev/null
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.used,utilization.gpu \
            --format=csv,noheader

      - name: Check out exact operational revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Authorize one immutable runtime-only request
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUEST_PATH"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test ${#changed[@]} -eq 1
          test "${changed[0]}" = "$REQUEST_PATH"
          REQUEST="$REQUEST_PATH" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["REQUEST"]).read_text(encoding="utf-8"))
          expected = {
              "schema",
              "schema_version",
              "purpose",
              "cut3r_revision",
              "candidate_python",
              "dataset_payloads_opened",
              "heldout_predictions_executed",
              "request_id",
          }
          if set(value) != expected:
              raise SystemExit("runtime request fields changed")
          if value["schema"] != "prob4d.dot-cut3r-runtime-candidate-request":
              raise SystemExit("runtime request schema changed")
          if value["schema_version"] != 1:
              raise SystemExit("runtime request version changed")
          if value["cut3r_revision"] != os.environ["CUT3R_REVISION"]:
              raise SystemExit("runtime request revision changed")
          if value["candidate_python"] != os.environ["CANDIDATE_PYTHON"]:
              raise SystemExit("runtime candidate path changed")
          if value["dataset_payloads_opened"] is not False:
              raise SystemExit("runtime staging may not open DOT")
          if value["heldout_predictions_executed"] is not False:
              raise SystemExit("runtime staging may not run held-out inference")
          unsigned = dict(value)
          request_id = unsigned.pop("request_id")
          encoded = json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(encoded).hexdigest() != request_id:
              raise SystemExit("runtime request identity mismatch")
          print(request_id)
          PY

      - name: Check out exact public CUT3R dependency roster
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CUT3R/CUT3R
          ref: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
          path: external/CUT3R
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up bootstrap Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build resolver-stable CUDA runtime atomically
        shell: bash
        run: |
          set -euo pipefail
          staging="${CANDIDATE_ROOT}.staging-${GITHUB_RUN_ID}"
          previous="${CANDIDATE_ROOT}.previous"
          filtered="$RUNNER_TEMP/cut3r-requirements.txt"
          constraints="$RUNNER_TEMP/cut3r-constraints.txt"
          rm -rf -- "$staging"
          python -m venv "$staging"
          py="$staging/bin/python"
          "$py" -m pip install --no-cache-dir \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
          cat > "$constraints" <<'EOF'
          torch==2.11.0
          torchvision==0.26.0
          typing-extensions==4.15.0
          flit-core==3.12.0
          numpy==1.26.4
          pillow==10.3.0
          EOF
          "$py" -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            --constraint "$constraints" \
            "typing-extensions==4.15.0" "flit-core==3.12.0"
          "$py" -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cu126 \
            --extra-index-url https://pypi.org/simple \
            --constraint "$constraints" \
            torch==2.11.0 torchvision==0.26.0
          python - external/CUT3R/requirements.txt "$filtered" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          kept = []
          for line in source:
              stripped = line.strip()
              if re.match(r"^(torch|torchvision)(?:\s|[<>=!~].*)?$", stripped, flags=re.I):
                  continue
              kept.append(line)
          Path(sys.argv[2]).write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY
          "$py" -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cu126 \
            --constraint "$constraints" \
            -r "$filtered" \
            gdown==5.2.0
          "$py" -m pip check
          "$py" - <<'PY'
          import accelerate
          import cv2
          import einops
          import h5py
          import hydra
          import lpips
          import numpy
          import PIL
          import roma
          import scipy
          import sklearn
          import torch
          import torchvision
          import transformers

          print("torch", torch.__version__)
          print("torch_cuda", torch.version.cuda)
          print("numpy", numpy.__version__)
          print("pillow", PIL.__version__)
          print("cuda_available", torch.cuda.is_available())
          if not torch.__version__.startswith("2.11.0"):
              raise SystemExit(torch.__version__)
          if not torchvision.__version__.startswith("0.26.0"):
              raise SystemExit(torchvision.__version__)
          if torch.version.cuda != "12.6":
              raise SystemExit(str(torch.version.cuda))
          if numpy.__version__ != "1.26.4":
              raise SystemExit(numpy.__version__)
          if PIL.__version__ != "10.3.0":
              raise SystemExit(PIL.__version__)
          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable")
          print("gpu", torch.cuda.get_device_name(0))
          PY
          rm -rf -- "$previous"
          if [[ -d "$CANDIDATE_ROOT" ]]; then
            mv "$CANDIDATE_ROOT" "$previous"
          fi
          mkdir -p "$(dirname "$CANDIDATE_ROOT")"
          mv "$staging" "$CANDIDATE_ROOT"
          rm -rf -- "$previous"
          test -x "$CANDIDATE_PYTHON"

      - name: Seal runtime-only evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dot-cut3r-runtime-candidate-${GITHUB_RUN_ID}.json"
          OUTPUT="$output" "$CANDIDATE_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          import numpy
          import PIL
          import torch
          import torchvision

          payload = {
              "schema": "prob4d.dot-cut3r-runtime-candidate",
              "schema_version": 1,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "candidate_python": os.environ["CANDIDATE_PYTHON"],
              "cut3r_revision": os.environ["CUT3R_REVISION"],
              "python_version": platform.python_version(),
              "torch_version": torch.__version__,
              "torch_cuda_build": torch.version.cuda,
              "torchvision_version": torchvision.__version__,
              "numpy_version": numpy.__version__,
              "pillow_version": PIL.__version__,
              "cuda_available": bool(torch.cuda.is_available()),
              "gpu": torch.cuda.get_device_name(0),
              "decision": "usable-by-frozen-heldout-workflow",
              "information_boundary": {
                  "dataset_payloads_opened": False,
                  "normal_view_images_opened": False,
                  "marker_payloads_opened": False,
                  "heldout_predictions_executed": False,
              },
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["runtime_candidate_id"] = hashlib.sha256(encoded).hexdigest()
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Upload bounded runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-cut3r-runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.output }}
          if-no-files-found: error
          retention-days: 30
