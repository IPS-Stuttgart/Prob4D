name: Patch tracking-cloth rank-distortion study

on:
  push:
    branches:
      - research/tracking-cloth-rank-distortion-real-v1
    paths:
      - .github/workflows/patch-tracking-cloth-rank-distortion.yml

permissions:
  contents: write

concurrency:
  group: patch-tracking-cloth-rank-distortion-real-v1
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/tracking-cloth-rank-distortion-real-v1
          persist-credentials: true
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply deterministic transformation
        run: python scripts/science/_apply_tracking_cloth_rank_distortion_patch.py

      - name: Install focused environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pytest==9.1.1" "ruff==0.16.5" >/dev/null
          python -m pip install --disable-pip-version-check \
            --no-deps -e . >/dev/null

      - name: Format and validate transformed study
        shell: bash
        run: |
          set -o pipefail
          {
            python -m ruff format \
              scripts/science/run_tracking_cloth_rank_distortion.py \
              tests/test_tracking_cloth_rank_distortion.py
            python -m ruff check \
              scripts/science/run_tracking_cloth_rank_distortion.py \
              tests/test_tracking_cloth_rank_distortion.py
            python -m py_compile scripts/science/run_tracking_cloth_rank_distortion.py
            python -m pytest -q \
              tests/test_posterior_rank_distortion.py \
              tests/test_tracking_cloth_rank_distortion.py
          } 2>&1 | tee validation.log

      - name: Upload compact validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: tracking-cloth-rank-distortion-patch-diagnostics
          path: validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated study implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_tracking_cloth_rank_distortion.py \
            tests/test_tracking_cloth_rank_distortion.py
          if git diff --cached --quiet; then
            echo "Transformation already committed."
            exit 0
          fi
          git commit -m "Implement real-cloth posterior rank-distortion study"
          git push origin HEAD:research/tracking-cloth-rank-distortion-real-v1
