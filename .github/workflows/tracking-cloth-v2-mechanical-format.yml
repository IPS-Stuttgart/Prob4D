name: Tracking Cloth v2 mechanical formatting

on:
  push:
    branches:
      - science/tracking-cloth-taxonomy-fix-v1
    paths:
      - protocols/execution_requests/tracking_cloth_v2_mechanical_format.trigger

permissions:
  contents: write

concurrency:
  group: tracking-cloth-v2-mechanical-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-taxonomy-fix-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply pinned Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.5"
          files=(
            scripts/science/inventory_tracking_cloth_taxonomy_v1.py
            tests/test_tracking_cloth_finite_orbit_taxonomy_v2.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"

      - name: Verify formatter-only scope
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(mktemp)"
          changed="$(mktemp)"
          cat > "$allowed" <<'EOF'
          scripts/science/inventory_tracking_cloth_taxonomy_v1.py
          tests/test_tracking_cloth_finite_orbit_taxonomy_v2.py
          EOF
          git diff --name-only | LC_ALL=C sort -u > "$changed"
          LC_ALL=C sort -u -o "$allowed" "$allowed"
          diff -u "$allowed" "$changed"
          test -z "$(git diff --name-only -- protocols .github)"

      - name: Commit mechanical-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/science/inventory_tracking_cloth_taxonomy_v1.py \
            tests/test_tracking_cloth_finite_orbit_taxonomy_v2.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply mechanical Ruff formatting to Tracking Cloth taxonomy code"
          git push origin HEAD:science/tracking-cloth-taxonomy-fix-v1
