name: Report PR 20 resolver failure

on:
  push:
    branches:
      - agent/content-addressed-covariance-calibration

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Report resolver runs and failed-step log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          gh api \
            'repos/FlorianPfaff/Prob4D/actions/runs?branch=agent%2Fcontent-addressed-covariance-calibration&event=push&per_page=30' \
            --jq '.workflow_runs | map(select(.name == "Resolve PR 20 merge conflicts")) | map({id, status, conclusion, head_sha, html_url, created_at})' \
            > /tmp/resolver-runs.json
          run_id="$(jq -r '[.[] | select(.conclusion == "failure")][0].id // empty' /tmp/resolver-runs.json)"
          {
            echo '### Resolver run status'
            echo
            echo '```json'
            cat /tmp/resolver-runs.json
            echo '```'
          } > /tmp/resolver-comment.md
          if [ -n "$run_id" ]; then
            gh run view "$run_id" --repo FlorianPfaff/Prob4D --log-failed > /tmp/resolver-failure.log || true
            {
              echo
              echo '<details><summary>Latest failed-step log</summary>'
              echo
              echo '```text'
              tail -c 55000 /tmp/resolver-failure.log
              echo
              echo '```'
              echo '</details>'
            } >> /tmp/resolver-comment.md
          fi
          gh pr comment 20 --repo FlorianPfaff/Prob4D --body-file /tmp/resolver-comment.md
