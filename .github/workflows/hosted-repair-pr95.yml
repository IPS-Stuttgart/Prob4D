name: Hosted repair PR 95

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hosted-repair-pr95.yml]

permissions:
  contents: write

concurrency:
  group: hosted-repair-pr95
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/material-identity-hypothesis-stream'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/material-identity-hypothesis-stream
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Refresh main and fix strict tuple validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          source = Path('src/prob4d/material_identity_stream.py')
          text = source.read_text(encoding='utf-8')
          old = 'zip(result, result[1:])):'
          new = 'zip(result, result[1:], strict=False)):'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one strict-zip repair target, found {count}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          focused = Path('.github/workflows/material-identity-stream.yml')
          workflow = focused.read_text(encoding='utf-8')
          runner = '    runs-on: [self-hosted, Linux, X64]\n'
          if workflow.count(runner) != 1:
              raise SystemExit('focused workflow runner target is not unique')
          focused.write_text(
              workflow.replace(runner, '    runs-on: ubuntu-latest\n'),
              encoding='utf-8',
          )
          Path('.github/workflows/hosted-repair-pr95.yml').unlink()
          PY
      - name: Validate focused contract
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py
          python -m mypy src/prob4d/material_identity_stream.py
          python -m pytest -q tests/test_material_identity_stream.py
          git diff --check
      - name: Commit ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/material_identity_stream.py \
            .github/workflows/material-identity-stream.yml \
            .github/workflows/hosted-repair-pr95.yml
          git commit -m 'Fix strict material-identity tuple validation'
          git push origin HEAD:agent/material-identity-hypothesis-stream
