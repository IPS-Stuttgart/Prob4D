name: Hosted repair PR 95

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hosted-repair-pr95.yml]

permissions:
  contents: write

concurrency:
  group: hosted-repair-pr95
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/material-identity-hypothesis-stream'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/material-identity-hypothesis-stream
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Refresh main and harden validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one repair target in {path}, found {count}'
                  )
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/prob4d/material_identity_stream.py',
              'zip(result, result[1:])):',
              'zip(result, result[1:], strict=False)):',
          )
          replace_once(
              'src/prob4d/material_identity_stream.py',
              '''def _strict_string(value: Any, *, name: str) -> str:
              if type(value) is not str or not value:
                  raise ValueError(f"{name} must be a non-empty string")
              return value
          ''',
              '''def _strict_string(value: Any, *, name: str) -> str:
              if type(value) is not str or not value or value.strip() != value:
                  raise ValueError(f"{name} must be a non-empty canonical string")
              return value
          ''',
          )
          replace_once(
              'src/prob4d/material_identity_stream.py',
              '''def _integer(value: Any, *, name: str, minimum: int = 0) -> int:
          ''',
              '''def _git_sha(value: Any, *, name: str) -> str:
              revision = _strict_string(value, name=name)
              if len(revision) != 40 or any(
                  character not in "0123456789abcdef" for character in revision
              ):
                  raise ValueError(f"{name} must be a lowercase 40-character Git SHA")
              return revision


          def _integer(value: Any, *, name: str, minimum: int = 0) -> int:
          ''',
          )
          replace_once(
              'src/prob4d/material_identity_stream.py',
              '''            "source_revision": _strict_string(
                          self.source_revision,
                          name="source_revision",
                      ),
          ''',
              '''            "source_revision": _git_sha(
                          self.source_revision,
                          name="source_revision",
                      ),
          ''',
          )
          replace_once(
              'src/prob4d/material_identity_stream.py',
              '''        }
                  if type(self.updates) is not tuple or not all(
          ''',
              '''        }
                  repository = identifiers["source_repository"]
                  if (
                      repository.count("/") != 1
                      or repository.startswith("/")
                      or repository.endswith("/")
                  ):
                      raise ValueError("source_repository must have owner/name form")
                  if type(self.updates) is not tuple or not all(
          ''',
          )
          replace_once(
              'tests/test_material_identity_stream.py',
              'source_revision="2d6df37",',
              'source_revision="2d6df37" + "0" * 33,',
          )
          replace_once(
              'tests/test_material_identity_stream.py',
              '''def test_root_contract_rejects_coercion_aliases() -> None:
          ''',
              '''def test_root_contract_requires_canonical_provenance() -> None:
              with pytest.raises(ValueError, match="owner/name"):
                  create_material_identity_stream(
                      sequence_id="sequence",
                      case_id="case",
                      stream_id="camera0",
                      source_repository="Prob4D",
                      source_revision="a" * 40,
                      root_window_id="w0",
                  )
              with pytest.raises(ValueError, match="40-character Git SHA"):
                  create_material_identity_stream(
                      sequence_id="sequence",
                      case_id="case",
                      stream_id="camera0",
                      source_repository="IPS-Stuttgart/Prob4D",
                      source_revision="revision",
                      root_window_id="w0",
                  )


          def test_root_contract_rejects_coercion_aliases() -> None:
          ''',
          )
          replace_once(
              'docs/material-identity-stream.md',
              '''- exact repository revision;
          ''',
              '''- exact owner/name source repository and lowercase 40-character Git SHA;
          ''',
          )

          focused = Path('.github/workflows/material-identity-stream.yml')
          workflow = focused.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '    runs-on: [self-hosted, Linux, X64]\n',
              '    runs-on: ubuntu-latest\n',
          )
          workflow = workflow.replace(
              'source_revision="revision",',
              'source_revision="a" * 40,',
          )
          focused.write_text(workflow, encoding='utf-8')
          Path('.github/workflows/hosted-repair-pr95.yml').unlink()
          PY
      - name: Validate focused contract
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py
          python -m mypy src/prob4d/material_identity_stream.py
          python -m pytest -q tests/test_material_identity_stream.py
          git diff --check
      - name: Commit ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py \
            docs/material-identity-stream.md \
            .github/workflows/material-identity-stream.yml \
            .github/workflows/hosted-repair-pr95.yml
          git commit -m 'Harden material-identity provenance and tuple validation'
          git push origin HEAD:agent/material-identity-hypothesis-stream
