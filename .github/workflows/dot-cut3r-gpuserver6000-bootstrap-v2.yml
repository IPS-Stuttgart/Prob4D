name: DOT CUT3R gpuserver6000 bootstrap v2

on:
  push:
    branches:
      - ops/dot-cut3r-gpuserver6000-preflight-v1
    paths:
      - ".github/workflows/dot-cut3r-gpuserver6000-bootstrap-v2.yml"

permissions:
  contents: read

concurrency:
  group: dot-cut3r-gpuserver6000-bootstrap-v2
  cancel-in-progress: false

env:
  RUNTIME_ROOT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1
  RUNTIME_PYTHON: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python
  DATASET_ROOT: /home/github-runner/.cache/datasets/dot
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  CHECKPOINT_NAME: cut3r_512_dpt_4_64.pth
  CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  CHECKPOINT_GDRIVE_ID: 1Asz-ZB3FfpzZYwunhQvNPZEUA8XUNAYD
  ARCHIVE_NAME: R01-10.zip
  ARCHIVE_DATAFILE_ID: "2343"
  ARCHIVE_BYTES: "1705947395"
  ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
  DATAFILE_API_ROOT: https://dataverse.orc.gmu.edu/api/access/datafile
  CUDA_HOME: /usr/local/cuda-12.9
  TORCH_CUDA_ARCH_LIST: "8.9"
  MAX_JOBS: "4"
  COMPATIBILITY_PATCH: .github/patches/cut3r-curope-torch211-cu126.patch
  EXPECTED_CUROPE_KERNELS_BLOB: 7156cd1bb935cb1f0be45e58add53f9c21505c20
  EXPECTED_CUROPE_SETUP_BLOB: 02ddb0912370a67a49fd2bb91164cf2f1da8648e
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  bootstrap:
    name: Build exact CUT3R assets on gpuserver6000
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/ops/dot-cut3r-gpuserver6000-preflight-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 360
    steps:
      - name: Require intended runner and local CUDA 12.9
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v git >/dev/null
          command -v c++ >/dev/null
          command -v nvidia-smi >/dev/null
          test -x "$CUDA_HOME/bin/nvcc"
          "$CUDA_HOME/bin/nvcc" --version | grep -F 'release 12.9'
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.used,utilization.gpu \
            --format=csv,noheader
          df -h /home/github-runner /home/github-runner/.cache

      - name: Check out exact operational source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact source templates and compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object .github/workflows/bootstrap-dot-cut3r-gpuserver4090-runtime.yml)" = \
            "1ef19aec112a84008584256120bb11083b66cc04"
          test "$(git hash-object .github/workflows/complete-dot-cut3r-cu126-runtime.yml)" = \
            "7d0772d7fb9e85509014ccddb5e9eea6f9347609"
          test "$(git hash-object "$COMPATIBILITY_PATCH")" = \
            "9127464c77b571b9586144cabe24a4eed8667db0"

      - name: Provision bootstrap Python 3.10
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Bind bootstrap interpreter
        shell: bash
        run: |
          set -euo pipefail
          base_python=$(command -v python)
          test -x "$base_python"
          echo "BASE_PYTHON=$base_python" >> "$GITHUB_ENV"
          "$base_python" -m pip install --no-cache-dir "PyYAML==6.0.2"

      - name: Replay frozen source, runtime, checkpoint, patch, and compile steps
        shell: bash
        run: |
          set -euo pipefail
          PATH="$CUDA_HOME/bin:$PATH" \
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          selections = [
              (
                  Path(".github/workflows/bootstrap-dot-cut3r-gpuserver4090-runtime.yml"),
                  [
                      "Stage exact CUT3R source",
                      "Build isolated CUDA-12.6 CUT3R Python runtime",
                      "Acquire and verify exact CUT3R checkpoint",
                  ],
              ),
              (
                  Path(".github/workflows/complete-dot-cut3r-cu126-runtime.yml"),
                  [
                      "Apply source-bound PyTorch 2.11 compatibility patch",
                      "Compile and attest native CUT3R RoPE",
                      "Seal content-addressed runtime manifest",
                  ],
              ),
          ]

          environment = dict(os.environ)
          environment["PATH"] = f"{environment['CUDA_HOME']}/bin:{environment['PATH']}"
          for workflow_path, names in selections:
              workflow = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
              jobs = workflow.get("jobs") or {}
              steps = []
              for job in jobs.values():
                  steps.extend((job or {}).get("steps") or [])
              by_name = {
                  str(step.get("name")): str(step.get("run"))
                  for step in steps
                  if isinstance(step, dict) and step.get("name") and step.get("run")
              }
              for name in names:
                  script = by_name.get(name)
                  if not script:
                      raise SystemExit(f"missing frozen workflow step: {name}")
                  print(f"::group::{name}", flush=True)
                  subprocess.run(
                      ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", script],
                      check=True,
                      env=environment,
                  )
                  print("::endgroup::", flush=True)
          PY

      - name: Attest CUDA minor-version qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNTIME_PYTHON"
          PATH="$CUDA_HOME/bin:$PATH" \
          CUDA_HOME="$CUDA_HOME" \
          PYTHONPATH="$RUNTIME_ROOT/CUT3R:$RUNTIME_ROOT/CUT3R/src" \
            "$RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          import torch
          from dust3r.model import ARCroco3DStereo

          manifest_path = Path(os.environ["RUNTIME_ROOT"]) / "bootstrap-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          nvcc = subprocess.run(
              [str(Path(os.environ["CUDA_HOME"]) / "bin/nvcc"), "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          qualification = {
              "schema": "prob4d.dot-cut3r-runtime-minor-toolkit-qualification",
              "schema_version": 1,
              "torch_version": torch.__version__,
              "torch_cuda_build": torch.version.cuda,
              "native_toolkit": "12.9",
              "native_toolkit_output": nvcc,
              "gpu": torch.cuda.get_device_name(0),
              "compute_capability": list(torch.cuda.get_device_capability(0)),
              "model_import": ARCroco3DStereo.__name__,
              "runtime_bootstrap_id": manifest["bootstrap_id"],
              "native_rope_artifact_id": manifest["native_rope_artifact_id"],
              "scientific_inputs_changed": False,
              "heldout_payloads_opened": False,
              "source_parity_required_before_heldout": True,
          }
          path = Path(os.environ["RUNTIME_ROOT"]) / "minor-toolkit-qualification.json"
          path.write_text(json.dumps(qualification, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(qualification, sort_keys=True))
          PY

      - name: Stage checksum-verified official DOT archive without opening members
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATASET_ROOT"
          archive="$DATASET_ROOT/$ARCHIVE_NAME"
          part="$archive.part-${GITHUB_RUN_ID}"
          valid=false
          if [[ -f "$archive" ]]; then
            measured=$(md5sum "$archive" | awk '{print $1}')
            if [[ "$measured" = "$ARCHIVE_MD5" ]]; then
              valid=true
            fi
          fi
          if [[ "$valid" != true ]]; then
            rm -f "$part"
            curl --fail --location --retry 6 --retry-all-errors \
              --connect-timeout 30 --output "$part" \
              "$DATAFILE_API_ROOT/$ARCHIVE_DATAFILE_ID"
            test "$(stat -c '%s' "$part")" = "$ARCHIVE_BYTES"
            printf '%s  %s\n' "$ARCHIVE_MD5" "$part" | md5sum --check --strict
            mv "$part" "$archive"
          fi
          test "$(stat -c '%s' "$archive")" = "$ARCHIVE_BYTES"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$archive" | md5sum --check --strict

      - name: Seal bounded gpuserver6000 bootstrap evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dot-cut3r-gpuserver6000-bootstrap-${GITHUB_RUN_ID}.json"
          OUTPUT="$output" "$RUNTIME_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNTIME_ROOT"])
          manifest = json.loads((root / "bootstrap-manifest.json").read_text(encoding="utf-8"))
          qualification = json.loads(
              (root / "minor-toolkit-qualification.json").read_text(encoding="utf-8")
          )
          archive = Path(os.environ["DATASET_ROOT"]) / os.environ["ARCHIVE_NAME"]
          payload = {
              "schema": "prob4d.dot-cut3r-gpuserver6000-bootstrap",
              "schema_version": 2,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runtime_bootstrap_id": manifest["bootstrap_id"],
              "native_rope_artifact_id": manifest["native_rope_artifact_id"],
              "checkpoint_sha256": manifest["checkpoint"]["sha256"],
              "torch_cuda_build": manifest["torch_cuda_version"],
              "native_toolkit": qualification["native_toolkit"],
              "archive_size_bytes": archive.stat().st_size,
              "archive_md5": os.environ["ARCHIVE_MD5"],
              "decision": "source-parity-qualification-required",
              "information_boundary": {
                  "archive_members_opened": False,
                  "normal_view_images_opened": False,
                  "marker_payloads_opened": False,
                  "r04_r10_predictions_executed": False,
                  "r11_r70_opened": False,
              },
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          payload["evidence_id"] = hashlib.sha256(canonical).hexdigest()
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Upload compact bootstrap receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-cut3r-gpuserver6000-bootstrap-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/runtime-receipt.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/compatibility-patch-receipt.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/bootstrap-manifest.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/minor-toolkit-qualification.json
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/requirements.runtime.txt
            /home/github-runner/.cache/prob4d/cut3r-runtime-v1/constraints.runtime.txt
            ${{ steps.evidence.outputs.output }}
          if-no-files-found: warn
          retention-days: 30
