name: Information-contract DEFORM DLO4/DLO5 retrospective v1

on:
  push:
    branches:
      - main
      - science/information-contract-benchmark-public-dlo-v1
    paths:
      - ".github/workflows/information-contract-deform-dlo45-retrospective-v1.yml"
      - "benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.json"
      - "benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.py"
      - "benchmarks/information_contract_v1/challenge.schema.json"
      - "benchmarks/information_contract_v1/submission.schema.json"
      - "src/prob4d/information_contract_benchmark.py"
      - "src/prob4d/information_contract_sealed.py"
      - "src/prob4d/information_contract_sealed_smoke.py"
      - "tests/test_information_contract_benchmark.py"
      - "tests/test_information_contract_sealed.py"
      - "tests/test_information_contract_deform_dlo45_adapter.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/information-contract-deform-dlo45-retrospective-v1.yml"
      - "benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.json"
      - "benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.py"
      - "benchmarks/information_contract_v1/challenge.schema.json"
      - "benchmarks/information_contract_v1/submission.schema.json"
      - "src/prob4d/information_contract_benchmark.py"
      - "src/prob4d/information_contract_sealed.py"
      - "src/prob4d/information_contract_sealed_smoke.py"
      - "tests/test_information_contract_benchmark.py"
      - "tests/test_information_contract_sealed.py"
      - "tests/test_information_contract_deform_dlo45_adapter.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: information-contract-deform-dlo45-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  DEFORM_REPOSITORY: roahmlab/DEFORM
  DEFORM_COMMIT: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  NUMPY_VERSION: "2.2.6"
  PROTOCOL: benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.json
  ADAPTER: benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.py

jobs:
  public-data-adapter:
    name: Build and replay 532 separated public-data cases
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact benchmark revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out pinned public DEFORM trajectories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/train
            data_set/DLO4/eval
            data_set/DLO5/train
            data_set/DLO5/eval
          sparse-checkout-cone-mode: false

      - name: Set up pinned Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact numerical and test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==${NUMPY_VERSION}"
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=8,<10" "ruff>=0.6,<1"
          python -m pip check

      - name: Validate code, contracts, and anti-leakage tests
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            "${ADAPTER}" \
            tests/test_information_contract_deform_dlo45_adapter.py \
            src/prob4d/information_contract_sealed.py \
            src/prob4d/information_contract_sealed_smoke.py \
            tests/test_information_contract_sealed.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_information_contract_benchmark.py \
            tests/test_information_contract_sealed.py \
            tests/test_information_contract_deform_dlo45_adapter.py

      - name: Verify pinned public dataset inventory
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          root="${GITHUB_WORKSPACE}/upstream-DEFORM/data_set"
          for dlo in DLO4 DLO5; do
            test "$(find "${root}/${dlo}/train" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
            test "$(find "${root}/${dlo}/eval" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 14
          done
          echo "root=${root}" >> "${GITHUB_OUTPUT}"

      - name: Build separated challenge and three same-mean submissions twice
        shell: bash
        env:
          DATASET_ROOT: ${{ steps.dataset.outputs.root }}
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/deform-information-contract-first"
          second="${RUNNER_TEMP}/deform-information-contract-second"
          rm -rf "${first}" "${second}"
          python "${ADAPTER}" \
            --protocol "${PROTOCOL}" \
            --dataset-root "${DATASET_ROOT}" \
            --output-root "${first}"
          python "${ADAPTER}" \
            --protocol "${PROTOCOL}" \
            --dataset-root "${DATASET_ROOT}" \
            --output-root "${second}"
          diff -qr "${first}" "${second}"

      - name: Enforce information order and public-data result boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/deform-information-contract-first" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import numpy as np

          root = Path(os.environ["ROOT"])
          comparison = json.loads((root / "comparison.json").read_text(encoding="utf-8"))
          assert comparison["classification"] == "retrospective public-data adapter validation"
          assert comparison["case_count"] == 532
          assert comparison["independent_trajectory_count"] == 28
          assert comparison["same_prediction_mean_and_forecast_rmse"] is True
          assert comparison["accuracy_cannot_rank_same_mean_controls"] is True
          assert comparison["probabilistic_metrics_distinguish_same_mean_controls"] is True
          systems = comparison["systems"]
          assert set(systems) == {
              "full-source-fitted-low-rank",
              "same-mean-marginal-matched-diagonal",
              "same-mean-overconfident-scale-0.01",
          }
          assert len({round(value["normalized_nees"], 10) for value in systems.values()}) > 1
          assert len({round(value["gaussian_nll_per_dimension"], 10) for value in systems.values()}) > 1

          challenge = json.loads(
              (root / "challenge" / "challenge.json").read_text(encoding="utf-8")
          )
          assert len(challenge["cases"]) == 532
          for case in challenge["cases"]:
              path_fields = [
                  value for value in case.values()
                  if isinstance(value, str) and value.endswith(".npz")
              ]
              assert len(path_fields) == 1
              with np.load(root / "challenge" / path_fields[0], allow_pickle=False) as archive:
                  assert set(archive.files) == {"truth_xyz_m"}

          for directory in sorted(root.glob("submission-*")):
              manifest = json.loads(
                  (directory / "submission.json").read_text(encoding="utf-8")
              )
              assert len(manifest["cases"]) == 532
              for case in manifest["cases"]:
                  path_fields = [
                      value for value in case.values()
                      if isinstance(value, str) and value.endswith(".npz")
                  ]
                  assert len(path_fields) == 1
                  with np.load(directory / path_fields[0], allow_pickle=False) as archive:
                      assert set(archive.files) == {
                          "prediction_mean_xyz_m",
                          "conditional_covariance_m2",
                          "shared_factor_m",
                      }
                      assert "truth_xyz_m" not in archive.files
                      assert "realized_action_loss" not in archive.files

          source = json.loads((root / "source-covariance.json").read_text(encoding="utf-8"))
          assert source["target_outcomes_used_for_covariance_fit"] is False
          assert set(source["dlos"]) == {"DLO4", "DLO5"}
          for record in source["dlos"].values():
              assert record["source_window_count"] == 1064
              assert record["source_row_count"] == 212800
          PY
          (
            cd "${RUNNER_TEMP}/deform-information-contract-first"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Retain compact public-data scorecard and manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: information-contract-deform-dlo45-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deform-information-contract-first/comparison.json
            ${{ runner.temp }}/deform-information-contract-first/source-covariance.json
            ${{ runner.temp }}/deform-information-contract-first/result-*.json
            ${{ runner.temp }}/deform-information-contract-first/challenge/challenge.json
            ${{ runner.temp }}/deform-information-contract-first/submission-*/submission.json
            ${{ runner.temp }}/deform-information-contract-first/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
