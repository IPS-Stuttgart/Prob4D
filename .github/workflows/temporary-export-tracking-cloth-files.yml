name: Temporary export Tracking Cloth files

on:
  push:
    branches: [fix/tracking-cloth-target-complement-v1]
    paths:
      - ".github/workflows/temporary-export-tracking-cloth-files.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Upload the two text files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracking-cloth-lint-inputs
          path: |
            scripts/science/run_tracking_cloth_finite_orbit_real_v1.py
            tests/test_tracking_cloth_finite_orbit_real_v1.py
          if-no-files-found: error
          retention-days: 1
