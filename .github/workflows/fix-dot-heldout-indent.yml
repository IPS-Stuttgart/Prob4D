name: Fix DOT held-out recovery proof indentation

on:
  push:
    branches:
      - fix/dot-r04-r10-recovery-idempotent-v1
    paths:
      - ".github/workflows/fix-dot-heldout-indent.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-recovery-idempotent-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Repair one indentation byte and stage the final patch
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path(".github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml"); s=p.read_text(encoding="utf-8"); old="\n         run = request(f\"/actions/runs/{run_id}\")\n"; new="\n          run = request(f\"/actions/runs/{run_id}\")\n"; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1), encoding="utf-8", newline="\n")'
          grep -n '^          run = request(f"/actions/runs/{run_id}")$' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          ! grep -n '^         run = request(f"/actions/runs/{run_id}")$' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          rm .github/workflows/fix-dot-heldout-indent.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix held-out predecessor proof indentation"
          git push origin HEAD:fix/dot-r04-r10-recovery-idempotent-v1
