name: DOT rope query-selective source support v2 execute

on:
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/dot_rope_query_selective_source_support_v2.json"

permissions:
  contents: read

concurrency:
  group: dot-rope-query-selective-source-support-v2-execute
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/dot_rope_query_selective_source_support_v2.json
  PROTOCOL_PATH: protocols/dot-rope-query-selective-source-support-v2.json
  SOURCE_ARCHIVE: R11-20.zip
  SOURCE_MD5: 23ce3e7067465d3edabe20b4c7cfa388
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/dot
  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  CUT3R_CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  authorize:
    name: Authorize one immutable R11-R20 source request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      protocol_git_blob_sha: ${{ steps.request.outputs.protocol_git_blob_sha }}
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exactly one non-forced request-file change
        id: request
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = "refs/heads/main"
          test "$EVENT_AFTER" = "$(/usr/bin/git rev-parse HEAD)"
          test "$EVENT_FORCED" = "false"
          test "$EVENT_DELETED" = "false"
          test "$EVENT_BEFORE" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(
            /usr/bin/git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" | sort
          )
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$REQUEST_PATH" ]]; then
            printf 'Expected only %s; changed paths were:\n' "$REQUEST_PATH" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 2
          fi
          protocol_blob=$(/usr/bin/git rev-parse "$EVENT_AFTER:$PROTOCOL_PATH")
          python -m pip install -e .
          validation=$(
            python scripts/science/run_dot_rope_query_selective_source_support_v2.py \
              validate-request \
              --request "$REQUEST_PATH" \
              --protocol "$PROTOCOL_PATH" \
              --protocol-git-blob-sha "$protocol_blob"
          )
          VALIDATION="$validation" PROTOCOL_BLOB="$protocol_blob" \
            EVENT_AFTER="$EVENT_AFTER" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["VALIDATION"])
          outputs = {
              "request_id": value["request_id"],
              "head_sha": os.environ["EVENT_AFTER"],
              "protocol_git_blob_sha": os.environ["PROTOCOL_BLOB"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, item in outputs.items():
                  output.write(f"{key}={item}\n")
          PY

  provider:
    name: Seal marker-free R11-R20 CUT3R predictions
    needs: authorize
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 720
    permissions:
      contents: read
    outputs:
      provider_bundle_id: ${{ steps.identity.outputs.provider_bundle_id }}
    steps:
      - name: Bind intended runner and source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v nvidia-smi >/dev/null 2>&1
          command -v c++ >/dev/null 2>&1
          test -r "$DATASET_ROOT/$SOURCE_ARCHIVE"
          echo "$SOURCE_MD5  $DATASET_ROOT/$SOURCE_ARCHIVE" | md5sum -c -
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      - name: Initialize isolated provider workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/dot-r11-r20-source-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/rm -rf -- "$root"
          mkdir -p "$root/home" "$root/cache" "$root/tmp" "$root/provider"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "TMPDIR=$root/tmp"
            echo "TORCH_EXTENSIONS_DIR=$root/cache/torch-extensions"
            echo "WANDB_MODE=disabled"
            echo "WANDB_DISABLED=true"
          } >> "$GITHUB_ENV"
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify clean exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/git rev-parse HEAD:$PROTOCOL_PATH)" = \
            "${{ needs.authorize.outputs.protocol_git_blob_sha }}"
      - name: Select retained CUDA CUT3R interpreter
        id: python
        shell: bash
        env:
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_PYTHON: ${{ vars.CUT3R_PYTHON }}
        run: |
          set -euo pipefail
          test -n "${CUT3R_CHECKOUT:-}"
          test -d "$CUT3R_CHECKOUT"
          candidates=(
            "${CUT3R_PYTHON:-}"
            "$CUT3R_CHECKOUT/.venv/bin/python"
            "/home/florianpfaff/conda_envs/cut3r/bin/python"
            "/home/github-runner/.conda/envs/cut3r/bin/python"
            "/usr/bin/python3"
          )
          selected=""
          for candidate in "${candidates[@]}"; do
            [[ -n "$candidate" && -x "$candidate" ]] || continue
            if "$candidate" -c \
              'import numpy, PIL, torch; assert torch.cuda.is_available()' \
              >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "python=$selected" >> "$GITHUB_OUTPUT"
      - name: Copy and attest exact native-RoPE runtime
        shell: bash
        env:
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          test -f "$CUT3R_CHECKPOINT"
          echo "$CUT3R_CHECKPOINT_SHA256  $CUT3R_CHECKPOINT" | sha256sum -c -
          test "$(/usr/bin/git -C "$CUT3R_CHECKOUT" rev-parse HEAD)" = "$CUT3R_REVISION"
          mkdir -p "$root/CUT3R"
          cp -a "$CUT3R_CHECKOUT/." "$root/CUT3R/"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            "${{ steps.python.outputs.python }}" \
            scripts/science/prepare_cut3r_runtime.py \
              --cut3r-checkout "$root/CUT3R" \
              --build \
              --output "$root/provider/runtime-receipt.json"
      - name: Run target-closed synthetic runtime smoke
        shell: bash
        env:
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "${{ steps.python.outputs.python }}" \
            scripts/science/run_dot_rope_query_selective_source_support_v2.py \
              runtime-smoke \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --cut3r-checkout "$root/CUT3R" \
              --checkpoint "$CUT3R_CHECKPOINT" \
              --runtime-receipt "$root/provider/runtime-receipt.json" \
              --output-dir "$root/provider/smoke"
      - name: Execute marker-free R11-R20 predictions
        shell: bash
        env:
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "${{ steps.python.outputs.python }}" \
            scripts/science/run_dot_rope_query_selective_source_support_v2.py \
              predict \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$DATASET_ROOT" \
              --cut3r-checkout "$root/CUT3R" \
              --checkpoint "$CUT3R_CHECKPOINT" \
              --runtime-receipt "$root/provider/runtime-receipt.json" \
              --output-dir "$root/provider/bundle"
      - name: Read sealed source-provider identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          ROOT="$root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["ROOT"]) / "provider/bundle/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest["decision"] != "sealed-provider-predictions":
              raise SystemExit("source provider did not seal")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"provider_bundle_id={manifest['provider_bundle_id']}\n")
          PY
      - name: Upload sealed source provider
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-query-source-v2-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider/
          if-no-files-found: error
          retention-days: 30

  qualify:
    name: Select source-only support geometry
    needs: [authorize, provider]
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.identity.outputs.decision }}
      result_id: ${{ steps.identity.outputs.result_id }}
      selected_candidate: ${{ steps.identity.outputs.selected_candidate }}
    steps:
      - name: Bind intended runner and source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -r "$DATASET_ROOT/$SOURCE_ARCHIVE"
          echo "$SOURCE_MD5  $DATASET_ROOT/$SOURCE_ARCHIVE" | md5sum -c -
      - name: Initialize isolated qualification workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/dot-r11-r20-qualify-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/rm -rf -- "$root"
          mkdir -p "$root/provider" "$root/result"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
          clean: true
      - name: Download exact sealed source provider
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dot-query-source-v2-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/provider
      - name: Select retained NumPy interpreter
        id: python
        shell: bash
        env:
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_PYTHON: ${{ vars.CUT3R_PYTHON }}
        run: |
          set -euo pipefail
          candidates=(
            "${CUT3R_PYTHON:-}"
            "${CUT3R_CHECKOUT:-}/.venv/bin/python"
            "/home/florianpfaff/conda_envs/cut3r/bin/python"
            "/home/github-runner/.conda/envs/cut3r/bin/python"
            "/usr/bin/python3"
          )
          selected=""
          for candidate in "${candidates[@]}"; do
            [[ -n "$candidate" && -x "$candidate" ]] || continue
            if "$candidate" -c 'import numpy' >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "python=$selected" >> "$GITHUB_OUTPUT"
      - name: Audit source support without scoring source outcomes
        shell: bash
        env:
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/science" \
            "${{ steps.python.outputs.python }}" \
            scripts/science/run_dot_rope_query_selective_source_support_v2.py \
              qualify \
              --protocol "$PROTOCOL_PATH" \
              --request-id "$REQUEST_ID" \
              --prob4d-revision "$EXPECTED_HEAD_SHA" \
              --dataset-root "$DATASET_ROOT" \
              --provider-bundle "$root/provider/bundle" \
              --output "$root/result/result.json"
      - name: Read source-support decision
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          ROOT="$root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["ROOT"]) / "result/result.json").read_text(
                  encoding="utf-8"
              )
          )
          if result["decision"] not in {
              "source-support-qualified",
              "source-support-negative",
          }:
              raise SystemExit("source-support result is not scientific")
          selected = result["selected_support_rule"]["candidate_id"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={result['decision']}\n")
              output.write(f"result_id={result['result_id']}\n")
              output.write(f"selected_candidate={selected}\n")
          PY
      - name: Upload immutable source-support result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-query-source-v2-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/result/
          if-no-files-found: error
          retention-days: 90

  summary:
    name: Publish source-only decision summary
    if: always()
    needs: [authorize, provider, qualify]
    runs-on: ubuntu-latest
    steps:
      - name: Write immutable summary
        shell: bash
        env:
          PROVIDER_ID: ${{ needs.provider.outputs.provider_bundle_id }}
          DECISION: ${{ needs.qualify.outputs.decision }}
          RESULT_ID: ${{ needs.qualify.outputs.result_id }}
          SELECTED: ${{ needs.qualify.outputs.selected_candidate }}
        run: |
          {
            echo "## DOT query-selective source support v2"
            echo
            echo "- provider bundle: \`$PROVIDER_ID\`"
            echo "- source decision: \`$DECISION\`"
            echo "- result id: \`$RESULT_ID\`"
            echo "- selected support geometry: \`$SELECTED\`"
            echo "- confirmation payloads remain unopened"
            echo "- R31-R70 remain unopened"
            echo "- no source RMSE/NLL/proper score was used for selection"
          } >> "$GITHUB_STEP_SUMMARY"
