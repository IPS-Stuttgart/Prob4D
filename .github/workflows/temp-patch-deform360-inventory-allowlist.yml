name: Temporary patch for Deform360 inventory allowlist

on:
  push:
    branches: [science/deform360-pcd-query-inventory-v1]
    paths:
      - ".github/workflows/temp-patch-deform360-inventory-allowlist.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.repository == 'IPS-Stuttgart/Prob4D'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-pcd-query-inventory-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Add reviewed workflow to the self-hosted allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_trusted_self_hosted_validation_policy.py")
          text = path.read_text(encoding="utf-8")
          marker = (
              'DEFORM360_SOURCE_BUNDLE_AUDIT_WORKFLOW = WORKFLOW_ROOT / '
              '"deform360-source-bundle-audit.yml"\n'
          )
          addition = (
              marker
              + 'DEFORM360_PCD_QUERY_INVENTORY_WORKFLOW = WORKFLOW_ROOT / '
              + '"deform360-pcd-query-inventory.yml"\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("source-audit workflow marker is not unique")
          text = text.replace(marker, addition, 1)
          tuple_marker = "    DEFORM360_SOURCE_BUNDLE_AUDIT_WORKFLOW,\n"
          tuple_addition = tuple_marker + "    DEFORM360_PCD_QUERY_INVENTORY_WORKFLOW,\n"
          if text.count(tuple_marker) != 1:
              raise SystemExit("source-audit tuple marker is not unique")
          text = text.replace(tuple_marker, tuple_addition, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          grep -F "DEFORM360_PCD_QUERY_INVENTORY_WORKFLOW" \
            tests/test_trusted_self_hosted_validation_policy.py
      - name: Commit policy update and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_trusted_self_hosted_validation_policy.py
          git rm .github/workflows/temp-patch-deform360-inventory-allowlist.yml
          git commit -m "Authorize protected Deform360 PCD inventory workflow"
          git push origin HEAD:science/deform360-pcd-query-inventory-v1
