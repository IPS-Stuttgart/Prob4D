name: PointWorld sparse contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pointworld-sparse-contract.yml"
      - "src/prob4d/sparse_prediction_window.py"
      - "src/prob4d/pointworld_sparse_adapter.py"
      - "tests/test_sparse_prediction_window.py"
      - "tests/test_pointworld_sparse_adapter.py"
      - "docs/sparse-persistent-predictions.md"
      - "docs/pointworld-flatnfold-study.md"
      - "protocols/pointworld-flatnfold-source-qualification-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pointworld-sparse-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Sparse representation and adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/sparse_prediction_window.py \
            src/prob4d/pointworld_sparse_adapter.py \
            tests/test_sparse_prediction_window.py \
            tests/test_pointworld_sparse_adapter.py
          python -m ruff format --check \
            src/prob4d/sparse_prediction_window.py \
            src/prob4d/pointworld_sparse_adapter.py \
            tests/test_sparse_prediction_window.py \
            tests/test_pointworld_sparse_adapter.py
          python -m compileall -q \
            src/prob4d/sparse_prediction_window.py \
            src/prob4d/pointworld_sparse_adapter.py
      - name: Run sparse contract regressions
        run: >-
          python -m pytest -q
          tests/test_sparse_prediction_window.py
          tests/test_pointworld_sparse_adapter.py
