name: Fail-closed quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fail-closed-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  authoritative-quality:
    name: Authoritative Ruff, mypy, and docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci/quality.txt
      - name: Install the pinned authoritative quality environment
        run: |
          python -m pip install -r requirements/ci/quality.txt
          python -m pip install --no-deps -e .
      - name: Run Ruff over the complete maintained Python tree
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check -- src tests scripts/ci integration_tests \
            2>&1 | tee ruff-output.txt
      - name: Validate active documentation public surfaces
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci/check_documentation_surface.py \
            2>&1 | tee documentation-surface-output.txt
      - name: Generate the stable-interface mypy target set
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci/list_stable_mypy_targets.py \
            2>&1 | tee stable-mypy-targets.txt
          test -s stable-mypy-targets.txt
      - name: Run stable-interface mypy with fail-closed diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < stable-mypy-targets.txt
          test "${#files[@]}" -gt 0
          python -m mypy "${files[@]}" 2>&1 | tee mypy-output.txt
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fail-closed-quality-diagnostics
          path: |
            documentation-surface-output.txt
            ruff-output.txt
            stable-mypy-targets.txt
            mypy-output.txt
          if-no-files-found: warn
          retention-days: 14
