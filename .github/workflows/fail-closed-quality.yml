name: Fail-closed quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fail-closed-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authoritative-quality:
    name: Authoritative Ruff, mypy, and docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci/quality.txt
      - name: Install the pinned authoritative quality environment
        run: |
          python -m pip install -r requirements/ci/quality.txt
          python -m pip install --no-deps -e .
      - name: Select changed Python files
        shell: bash
        run: |
          set -euo pipefail
          base="${QUALITY_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || \
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if git rev-parse --verify "${QUALITY_HEAD_SHA}^" >/dev/null 2>&1; then
              base="${QUALITY_HEAD_SHA}^"
            else
              base="${QUALITY_HEAD_SHA}"
            fi
          fi
          git diff --name-only --diff-filter=ACMR \
            "${base}" "${QUALITY_HEAD_SHA}" -- '*.py' \
            | LC_ALL=C sort -u > changed-python.txt
          cat changed-python.txt
      - name: Run Ruff with fail-closed diagnostics
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < changed-python.txt
          if (( ${#files[@]} )); then
            python -m ruff check -- "${files[@]}" 2>&1 | tee ruff-output.txt
          else
            echo "No changed Python files require Ruff." | tee ruff-output.txt
          fi
      - name: Validate active documentation public surfaces
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci/check_documentation_surface.py \
            2>&1 | tee documentation-surface-output.txt
      - name: Verify additive compatibility and CUT3R protocol examples
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m prob4d.semantic_compatibility build \
            --output semantic-compatibility.json \
            2>&1 | tee semantic-compatibility-output.txt
          python -m prob4d.semantic_compatibility verify \
            semantic-compatibility.json \
            --require-current \
            2>&1 | tee -a semantic-compatibility-output.txt
          python -m prob4d.cut3r_comparison build \
            docs/examples/cut3r-comparison-spec.json \
            --output cut3r-comparison-lock.json \
            2>&1 | tee cut3r-comparison-output.txt
          python -m prob4d.cut3r_comparison verify \
            cut3r-comparison-lock.json \
            2>&1 | tee -a cut3r-comparison-output.txt
      - name: Run stable-interface mypy with fail-closed diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m mypy \
            src/prob4d/_version.py \
            src/prob4d/_provider_export_core.py \
            src/prob4d/_provider_evaluation_provider_neutral.py \
            src/prob4d/_provider_portfolio_model.py \
            src/prob4d/_observation_gaussian_common.py \
            src/prob4d/_observation_gaussian_tree.py \
            src/prob4d/_observation_gaussian_woodbury.py \
            src/prob4d/api/v2.py \
            src/prob4d/cli.py \
            src/prob4d/calibration_compatibility.py \
            src/prob4d/composition_jacobian.py \
            src/prob4d/covariance_root.py \
            src/prob4d/cut3r_comparison.py \
            src/prob4d/material_identity_cli.py \
            src/prob4d/material_identity_weight_calibration.py \
            src/prob4d/observation_factor_stream.py \
            src/prob4d/observation_gaussian_operator.py \
            src/prob4d/prediction_store.py \
            src/prob4d/prediction_store_benchmark.py \
            src/prob4d/prediction_store_cli.py \
            src/prob4d/project_identity.py \
            src/prob4d/provider_attestation.py \
            src/prob4d/provider_evaluation_identity.py \
            src/prob4d/provider_execution_attestation.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/provider_manifest_cli.py \
            src/prob4d/provider_portfolio.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_v2.py \
            src/prob4d/provider_v2_cli.py \
            src/prob4d/provider_v2_factor_bundle.py \
            src/prob4d/provider_v2_factors.py \
            src/prob4d/provider_v2_loading.py \
            src/prob4d/public_api_manifest.py \
            src/prob4d/runtime_revision.py \
            src/prob4d/semantic_compatibility.py \
            src/prob4d/source_diagnostics.py \
            src/prob4d/sparse_observation_factors.py \
            2>&1 | tee mypy-output.txt
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fail-closed-quality-diagnostics
          path: |
            changed-python.txt
            documentation-surface-output.txt
            ruff-output.txt
            mypy-output.txt
            semantic-compatibility.json
            semantic-compatibility-output.txt
            cut3r-comparison-lock.json
            cut3r-comparison-output.txt
          if-no-files-found: warn
          retention-days: 14
