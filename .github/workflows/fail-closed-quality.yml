name: One-shot repair Prob4D storage evidence

on:
  push:
    branches:
      - ci/self-hosted-prob4d-storage-evidence

permissions:
  contents: write

concurrency:
  group: one-shot-storage-evidence-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/self-hosted-prob4d-storage-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed race and CI repairs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(path: Path, old: str, new: str, *, marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif new not in text:
                  raise SystemExit(f"{path}: expected repair marker missing: {marker}")

          def source_block(value: str) -> str:
              return dedent(value).lstrip("\n")

          def append_once(path: Path, marker: str, addition: str) -> None:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(
                      text.rstrip() + "\n\n\n" + dedent(addition).strip() + "\n",
                      encoding="utf-8",
                  )

          joint = Path("src/prob4d/joint_covariance_metrics.py")
          replace_once(
              joint,
              "import hashlib\nimport json\nimport math\nimport os\n",
              "import hashlib\nimport io\nimport json\nimport math\nimport os\nimport tempfile\n",
              marker="joint imports",
          )
          replace_once(
              joint,
              "    with np.load(source, allow_pickle=False) as data:\n",
              "    with np.load(io.BytesIO(payload), allow_pickle=False) as data:\n",
              marker="content-bound NPZ load",
          )
          replace_once(
              joint,
              indent(source_block(r"""
                  destination = Path(output_path)
                  if destination.exists():
                      raise FileExistsError(destination)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  encoded = json.dumps(report, sort_keys=True, indent=2, allow_nan=False) + "\n"
                  temporary = destination.with_name(f".{destination.name}.tmp-{os.getpid()}")
                  try:
                      with temporary.open("x", encoding="utf-8") as stream:
                          stream.write(encoded)
                          stream.flush()
                          os.fsync(stream.fileno())
                      if destination.exists():
                          raise FileExistsError(destination)
                      os.replace(temporary, destination)
                  finally:
                      temporary.unlink(missing_ok=True)
              """), "    "),
              indent(source_block(r"""
                  destination = Path(output_path)
                  if destination.exists():
                      raise FileExistsError(destination)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  encoded = json.dumps(report, sort_keys=True, indent=2, allow_nan=False) + "\n"
                  descriptor, temporary_name = tempfile.mkstemp(
                      dir=destination.parent,
                      prefix=f".{destination.name}.tmp-",
                      text=True,
                  )
                  temporary = Path(temporary_name)
                  try:
                      with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
                          stream.write(encoded)
                          stream.flush()
                          os.fsync(stream.fileno())
                      os.link(temporary, destination)
                  finally:
                      temporary.unlink(missing_ok=True)
              """), "    "),
              marker="exclusive joint report publication",
          )

          promotion = Path("src/prob4d/promotion_evidence.py")
          replace_once(
              promotion,
              "import os\n",
              "import os\nimport tempfile\n",
              marker="promotion evidence tempfile import",
          )
          replace_once(
              promotion,
              source_block(r"""
                  def _atomic_write_text(path: Path, content: str) -> None:
                      if path.exists():
                          raise FileExistsError(path)
                      path.parent.mkdir(parents=True, exist_ok=True)
                      temporary = path.with_name(f".{path.name}.tmp-{os.getpid()}")
                      try:
                          with temporary.open("x", encoding="utf-8") as stream:
                              stream.write(content)
                              stream.flush()
                              os.fsync(stream.fileno())
                          if path.exists():
                              raise FileExistsError(path)
                          os.replace(temporary, path)
                      finally:
                          temporary.unlink(missing_ok=True)
              """),
              source_block(r"""
                  def _atomic_write_text(path: Path, content: str) -> None:
                      if path.exists():
                          raise FileExistsError(path)
                      path.parent.mkdir(parents=True, exist_ok=True)
                      descriptor, temporary_name = tempfile.mkstemp(
                          dir=path.parent,
                          prefix=f".{path.name}.tmp-",
                          text=True,
                      )
                      temporary = Path(temporary_name)
                      try:
                          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
                              stream.write(content)
                              stream.flush()
                              os.fsync(stream.fileno())
                          os.link(temporary, path)
                      finally:
                          temporary.unlink(missing_ok=True)
              """),
              marker="exclusive evidence markdown publication",
          )
          replace_once(
              promotion,
              source_block(r"""
                  from ._heldout_promotion_common import (
                      REPORT_CLAIM_BOUNDARY,
                      _SHA256,
              """),
              source_block(r"""
                  from ._heldout_promotion_common import (
                      _SHA256,
                      REPORT_CLAIM_BOUNDARY,
              """),
              marker="sorted promotion evidence imports",
          )

          diagnostics = Path("src/prob4d/source_diagnostics.py")
          diagnostic_replacements = {
              "    available = np.zeros(shape, dtype=bool)\n":
                  "    available: BoolArray = np.zeros(shape, dtype=bool)\n",
              "    relative_residual = np.zeros(shape, dtype=np.float64)\n":
                  "    relative_residual: FloatArray = np.zeros(shape, dtype=np.float64)\n",
              "    direction_disagreement = np.zeros(shape, dtype=np.float64)\n":
                  "    direction_disagreement: FloatArray = np.zeros(shape, dtype=np.float64)\n",
              "    count = np.zeros(reference.shape, dtype=np.int64)\n":
                  "    count: NDArray[np.int64] = np.zeros(reference.shape, dtype=np.int64)\n",
              "    squared_norm_sum = np.zeros(reference.shape, dtype=np.float64)\n":
                  "    squared_norm_sum: FloatArray = np.zeros(\n"
                  "        reference.shape, dtype=np.float64\n"
                  "    )\n",
          }
          source = diagnostics.read_text(encoding="utf-8")
          for old, new in diagnostic_replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(
                      f"{diagnostics}: expected annotation repair missing: {old.strip()}"
                  )
          diagnostics.write_text(source, encoding="utf-8")

          joint_tests = Path("tests/test_joint_covariance_metrics.py")
          replace_once(
              joint_tests,
              "from pathlib import Path\n\nimport numpy as np\nimport pytest\n\n"
              "from prob4d.cli import main as grouped_main\n",
              "from pathlib import Path\nfrom typing import Any\n\n"
              "import numpy as np\nimport pytest\n\n"
              "import prob4d.joint_covariance_metrics as joint_metrics\n"
              "from prob4d.cli import main as grouped_main\n",
              marker="joint test imports",
          )
          append_once(
              joint_tests,
              "def test_diagnostic_evaluates_the_exact_hashed_bytes(",
              r"""
              def test_diagnostic_evaluates_the_exact_hashed_bytes(
                  tmp_path: Path,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  source = tmp_path / "matched.npz"
                  replacement = tmp_path / "replacement.npz"
                  output = tmp_path / "report.json"
                  local = np.repeat(np.eye(3)[None], 2, axis=0)
                  factor = np.zeros((2, 3, 1))
                  np.savez(
                      source,
                      residual_xyz_m=np.zeros((2, 3)),
                      local_covariance_m2=local,
                      low_rank_factor_m=factor,
                  )
                  np.savez(
                      replacement,
                      residual_xyz_m=np.ones((2, 3)),
                      local_covariance_m2=local,
                      low_rank_factor_m=factor,
                  )
                  original_read_bytes = Path.read_bytes
                  original_payload = original_read_bytes(source)
                  replacement_payload = original_read_bytes(replacement)
                  replaced = False

                  def read_then_replace(path: Path) -> bytes:
                      nonlocal replaced
                      payload = original_read_bytes(path)
                      if path == source and not replaced:
                          source.write_bytes(replacement_payload)
                          replaced = True
                      return payload

                  monkeypatch.setattr(Path, "read_bytes", read_then_replace)
                  report = joint_metrics.run_joint_covariance_diagnostic(source, output)

                  assert report["source_sha256"] == hashlib.sha256(
                      original_payload
                  ).hexdigest()
                  assert report["evaluation"]["equal_group_mean"][
                      "normalized_nees"
                  ] == pytest.approx(0.0)


              def test_report_publication_preserves_a_concurrent_destination(
                  tmp_path: Path,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  source = tmp_path / "matched.npz"
                  output = tmp_path / "report.json"
                  np.savez(
                      source,
                      residual_xyz_m=np.zeros((1, 3)),
                      local_covariance_m2=np.eye(3)[None],
                      low_rank_factor_m=np.zeros((1, 3, 0)),
                  )
                  original_link = joint_metrics.os.link

                  def publish_competitor(
                      source_path: Any,
                      destination_path: Any,
                  ) -> None:
                      Path(destination_path).write_text(
                          "concurrent writer\n",
                          encoding="utf-8",
                      )
                      original_link(source_path, destination_path)

                  monkeypatch.setattr(joint_metrics.os, "link", publish_competitor)

                  with pytest.raises(FileExistsError):
                      joint_metrics.run_joint_covariance_diagnostic(source, output)

                  assert output.read_text(encoding="utf-8") == "concurrent writer\n"
                  assert not list(tmp_path.glob(f".{output.name}.tmp-*"))
              """,
          )

          promotion_tests = Path("tests/test_promotion_evidence.py")
          replace_once(
              promotion_tests,
              "import pytest\n\nfrom prob4d.heldout_promotion import (\n",
              "import pytest\n\n"
              "import prob4d.promotion_evidence as promotion_evidence\n"
              "from prob4d.heldout_promotion import (\n",
              marker="promotion test imports",
          )
          append_once(
              promotion_tests,
              "def test_markdown_publication_preserves_a_concurrent_destination(",
              r"""
              def test_markdown_publication_preserves_a_concurrent_destination(
                  tmp_path: Path,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  lock, report = _report_pair()
                  card = build_promotion_evidence_card(lock, report)
                  json_path = tmp_path / "evidence.json"
                  markdown_path = tmp_path / "evidence.md"
                  original_link = promotion_evidence.os.link

                  def publish_competitor(
                      source_path: Any,
                      destination_path: Any,
                  ) -> None:
                      Path(destination_path).write_text(
                          "concurrent writer\n",
                          encoding="utf-8",
                      )
                      original_link(source_path, destination_path)

                  monkeypatch.setattr(
                      promotion_evidence.os,
                      "link",
                      publish_competitor,
                  )

                  with pytest.raises(FileExistsError):
                      write_promotion_evidence_card(card, json_path, markdown_path)

                  assert markdown_path.read_text(
                      encoding="utf-8"
                  ) == "concurrent writer\n"
                  assert not json_path.exists()
                  assert not list(tmp_path.glob(f".{markdown_path.name}.tmp-*"))
              """,
          )

          final_workflow = source_block(r"""
              name: Fail-closed quality

              on:
                push:
                  branches: [main]
                pull_request:
                  branches: [main]
                workflow_dispatch:

              permissions:
                contents: read

              concurrency:
                group: fail-closed-quality-${{ github.workflow }}-${{ github.ref }}
                cancel-in-progress: true

              env:
                PIP_DISABLE_PIP_VERSION_CHECK: "1"
                PYTHONUNBUFFERED: "1"
                QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
                QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

              jobs:
                authoritative-quality:
                  name: Authoritative Ruff, mypy, and focused regressions
                  runs-on: >-
                    ${{ github.event_name == 'pull_request' &&
                        github.event.pull_request.head.repo.full_name == github.repository &&
                        startsWith(github.head_ref, 'ci/self-hosted-') &&
                        fromJSON('["self-hosted","Linux","X64","nvidia-smi"]') ||
                        'ubuntu-latest' }}
                  timeout-minutes: 30
                  steps:
                    - name: Check out repository
                      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                      with:
                        fetch-depth: 0
                        persist-credentials: false
                    - name: Set up Python 3.12
                      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                      with:
                        python-version: "3.12"
                    - name: Bootstrap isolated quality environment
                      shell: bash
                      run: |
                        set -euo pipefail
                        python -m venv --clear .quality-venv
                        echo "${PWD}/.quality-venv/bin" >> "${GITHUB_PATH}"
                    - name: Install development and compatible typing environment
                      run: |
                        python -m pip install --upgrade pip
                        python -m pip install -e ".[dev]"
                        python -m pip install "numpy>=1.24,<2.3"
                    - name: Select changed Python files
                      shell: bash
                      run: |
                        set -euo pipefail
                        base="${QUALITY_BASE_SHA}"
                        if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || \
                           ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                          if git rev-parse --verify "${QUALITY_HEAD_SHA}^" >/dev/null 2>&1; then
                            base="${QUALITY_HEAD_SHA}^"
                          else
                            base="${QUALITY_HEAD_SHA}"
                          fi
                        fi
                        git diff --name-only --diff-filter=ACMR \
                          "${base}" "${QUALITY_HEAD_SHA}" -- '*.py' \
                          | LC_ALL=C sort -u > changed-python.txt
                        cat changed-python.txt
                    - name: Run Ruff with fail-closed diagnostics
                      shell: bash
                      run: |
                        set -o pipefail
                        mapfile -t files < changed-python.txt
                        if (( ${#files[@]} )); then
                          python -m ruff check -- "${files[@]}" 2>&1 | tee ruff-output.txt
                        else
                          echo "No changed Python files require Ruff." | tee ruff-output.txt
                        fi
                    - name: Run stable-interface mypy with fail-closed diagnostics
                      if: always()
                      shell: bash
                      run: |
                        set -o pipefail
                        python -m mypy \
                          src/prob4d/cli.py \
                          src/prob4d/calibration_compatibility.py \
                          src/prob4d/composition_jacobian.py \
                          src/prob4d/covariance_root.py \
                          src/prob4d/data.py \
                          src/prob4d/heldout_promotion.py \
                          src/prob4d/joint_covariance_metrics.py \
                          src/prob4d/observation_factor_stream.py \
                          src/prob4d/prediction_store.py \
                          src/prob4d/prediction_store_benchmark.py \
                          src/prob4d/prediction_store_cli.py \
                          src/prob4d/project_identity.py \
                          src/prob4d/promotion_evidence.py \
                          src/prob4d/provider_attestation.py \
                          src/prob4d/provider_manifest.py \
                          src/prob4d/provider_manifest_cli.py \
                          src/prob4d/provider_v1.py \
                          src/prob4d/provider_v2.py \
                          src/prob4d/provider_v2_cli.py \
                          src/prob4d/provider_v2_factor_bundle.py \
                          src/prob4d/provider_v2_factors.py \
                          src/prob4d/provider_v2_loading.py \
                          src/prob4d/runtime_revision.py \
                          src/prob4d/source_diagnostics.py \
                          src/prob4d/sparse_observation_factors.py \
                          2>&1 | tee mypy-output.txt
                    - name: Run focused storage and evidence regressions
                      if: always()
                      shell: bash
                      run: |
                        set -o pipefail
                        python -m pytest -q \
                          tests/test_data_storage.py \
                          tests/test_joint_covariance_metrics.py \
                          tests/test_promotion_evidence.py \
                          2>&1 | tee pytest-output.txt
                    - name: Upload quality diagnostics
                      if: always()
                      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
                      with:
                        name: fail-closed-quality-diagnostics
                        path: |
                          changed-python.txt
                          ruff-output.txt
                          mypy-output.txt
                          pytest-output.txt
                        if-no-files-found: warn
                        retention-days: 14
          """)
          Path(".github/workflows/fail-closed-quality.yml").write_text(
              final_workflow,
              encoding="utf-8",
          )
          Path(
              ".github/workflows/one-shot-annotate-source-diagnostics.yml"
          ).unlink(missing_ok=True)
          Path(
              ".github/workflows/one-shot-sort-promotion-import.yml"
          ).unlink(missing_ok=True)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix content-bound diagnostics and exclusive publication"
          git push origin HEAD:ci/self-hosted-prob4d-storage-evidence
