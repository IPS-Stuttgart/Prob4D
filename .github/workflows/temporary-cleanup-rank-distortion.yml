name: Temporary rank-distortion cleanup

on:
  push:
    branches:
      - research/query-rank-distortion-frontier-v1
    paths:
      - .github/workflows/temporary-cleanup-rank-distortion.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove temporary branch-mutating workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Allow formatter jobs to finish
        run: sleep 90

      - name: Check out latest branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/query-rank-distortion-frontier-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary workflows
        run: |
          rm -f \
            .github/workflows/temporary-format-rank-distortion.yml \
            .github/workflows/temporary-harden-rank-distortion-ci.yml \
            .github/workflows/temporary-format-rank-distortion-study.yml \
            .github/workflows/temporary-cleanup-rank-distortion.yml
          git diff --check

      - name: Commit and push cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "Temporary workflows were already absent."
            exit 0
          fi
          git commit -m "Remove temporary rank-distortion workflows"
          for attempt in 1 2 3; do
            git pull --rebase origin research/query-rank-distortion-frontier-v1
            if git push origin HEAD:research/query-rank-distortion-frontier-v1; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Could not push cleanup after three attempts" >&2
          exit 1
