name: Apply PR 113 stream race repair

on:
  push:
    branches:
      - agent/harden-factor-stream-contract
    paths:
      - .github/workflows/agent-apply-pr113-stream-races.yml
      - .agent-trigger-pr113

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-factor-stream-contract
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Apply and validate stream persistence repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path("src/prob4d/observation_factor_stream.py")
          text = source.read_text(encoding="utf-8")
          if "from collections.abc import Iterator, Mapping" not in text:
              text = text.replace(
                  "from collections.abc import Mapping\n",
                  "from collections.abc import Iterator, Mapping\n"
                  "from contextlib import contextmanager\n",
                  1,
              )

          if "def _load_json_object_bytes(" not in text:
              marker = "def _require_nonnegative_integer(value: object, *, name: str) -> int:\n"
              helper = dedent(
                  '''
                  def _load_json_object_bytes(
                      content: bytes,
                      *,
                      name: str,
                  ) -> dict[str, Any]:
                      def object_pairs(
                          pairs: list[tuple[str, Any]],
                      ) -> dict[str, Any]:
                          result: dict[str, Any] = {}
                          for key, item in pairs:
                              if key in result:
                                  raise ValueError(
                                      f"{name} contains duplicate JSON object key {key!r}"
                                  )
                              result[key] = item
                          return result

                      def reject_constant(token: str) -> Any:
                          raise ValueError(
                              f"{name} contains non-finite JSON number {token!r}"
                          )

                      try:
                          value = json.loads(
                              content.decode("utf-8"),
                              object_pairs_hook=object_pairs,
                              parse_constant=reject_constant,
                          )
                      except UnicodeDecodeError as error:
                          raise ValueError(
                              f"{name} must contain valid UTF-8 JSON"
                          ) from error
                      except json.JSONDecodeError as error:
                          raise ValueError(f"{name} must contain valid JSON") from error
                      if not isinstance(value, dict):
                          raise ValueError(f"{name} must contain one JSON object")
                      return value


                  '''
              ).lstrip()
              text = text.replace(marker, helper + marker, 1)

          bundle_start = text.index("def _bundle_update(")
          bundle_end = text.index("\n\ndef append_observation_factor_bundle(", bundle_start)
          bundle_function = dedent(
              '''
              def _bundle_update(
                  bundle_manifest_path: Path,
                  *,
                  stream_directory: Path,
                  update_index: int,
                  admitted_frame_start: int | None,
                  previous_update_id: str | None,
              ) -> ObservationFactorStreamUpdateV1:
                  manifest = bundle_manifest_path.resolve()
                  relative_manifest = _relative_member(
                      manifest,
                      root=stream_directory,
                      name="bundle_manifest_path",
                  )
                  try:
                      manifest_bytes = manifest.read_bytes()
                  except OSError as error:
                      raise ValueError(
                          "cannot read observation-factor bundle manifest"
                      ) from error
                  manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
                  record = _load_json_object_bytes(
                      manifest_bytes,
                      name="observation-factor bundle manifest",
                  )
                  if record.get("schema") != OBSERVATION_FACTOR_SCHEMA:
                      raise ValueError(
                          "stream updates require an observation-factor bundle"
                      )
                  schema_version = require_exact_integer(
                      record.get("schema_version"),
                      name="observation-factor schema_version",
                      minimum=1,
                  )
                  if schema_version != OBSERVATION_FACTOR_SCHEMA_VERSION:
                      raise ValueError(
                          "stream updates require observation-factor schema v4"
                      )
                  covariance = require_mapping(
                      record.get("gauge_covariance"),
                      name="gauge_covariance",
                  )
                  require_exact_fields(
                      covariance,
                      _GAUGE_COVARIANCE_FIELDS,
                      name="gauge_covariance",
                  )
                  if (
                      covariance.get("semantics") != "joint-cross-window"
                      or covariance.get("cross_window_covariance_preserved") is not True
                      or covariance.get("diagonal_blocks_match_gauge_marginals") is not True
                  ):
                      raise ValueError(
                          "stream updates require joint cross-window gauge covariance"
                      )
                  require_nonempty_string(
                      covariance.get("joint_covariance_key"),
                      name="joint_covariance_key",
                  )
                  require_string_sequence(
                      covariance.get("ordered_gauge_ids"),
                      name="ordered_gauge_ids",
                  )

                  payload_record = require_mapping(
                      record.get("payload"),
                      name="observation-factor bundle payload record",
                  )
                  require_exact_fields(
                      payload_record,
                      _PAYLOAD_FIELDS,
                      name="payload record",
                  )
                  if payload_record.get("allow_pickle") is not False:
                      raise ValueError("observation-factor payload must disable pickle")
                  payload_relative = _safe_relative_path(
                      payload_record.get("path"),
                      name="observation-factor payload path",
                  )
                  payload_path = _resolved_member(
                      manifest.parent,
                      payload_relative,
                      name="observation-factor payload path",
                  )
                  payload_sha = require_sha256(
                      payload_record.get("sha256"),
                      name="observation-factor payload SHA-256",
                  )
                  try:
                      payload_bytes = payload_path.read_bytes()
                  except OSError as error:
                      raise ValueError(
                          "cannot read observation-factor payload"
                      ) from error
                  if hashlib.sha256(payload_bytes).hexdigest() != payload_sha:
                      raise ValueError("observation-factor payload checksum mismatch")

                  with tempfile.TemporaryDirectory(
                      prefix="prob4d-factor-bundle-snapshot-"
                  ) as snapshot_name:
                      snapshot_root = Path(snapshot_name)
                      snapshot_manifest = snapshot_root / manifest.name
                      snapshot_payload = snapshot_root / Path(
                          *PurePosixPath(payload_relative).parts
                      )
                      snapshot_payload.parent.mkdir(parents=True, exist_ok=True)
                      snapshot_manifest.write_bytes(manifest_bytes)
                      snapshot_payload.write_bytes(payload_bytes)
                      bundle = load_observation_factor_bundle(snapshot_manifest)

                  frame_indices = [factor.frame_index for factor in bundle.factors]
                  if not frame_indices:
                      raise ValueError("stream updates require at least one factor")
                  effective_start = (
                      min(frame_indices)
                      if admitted_frame_start is None
                      else admitted_frame_start
                  )
                  if min(frame_indices) < effective_start:
                      raise ValueError(
                          "stream update reintroduces an already admitted frame"
                      )
                  if max(frame_indices) >= bundle.causal_frame_stop:
                      raise ValueError(
                          "stream update crosses its exclusive causal frame stop"
                      )
                  persistent_count, observation_count, identity_sha = (
                      _observation_identity_summary(bundle)
                  )
                  case_id = bundle.case_id
                  stream_id = bundle.stream_id
                  if case_id is None or stream_id is None:
                      raise RuntimeError(
                          "validated observation-factor bundle lost case or stream ID"
                      )

                  return ObservationFactorStreamUpdateV1(
                      update_index=update_index,
                      admitted_frame_start=effective_start,
                      causal_frame_stop=bundle.causal_frame_stop,
                      bundle_manifest_path=relative_manifest,
                      bundle_manifest_sha256=manifest_sha,
                      bundle_payload_sha256=payload_sha,
                      bundle_sequence_id=bundle.sequence_id,
                      case_id=case_id,
                      stream_id=stream_id,
                      source_repository=bundle.source_repository,
                      source_revision=bundle.source_revision,
                      factor_count=len(bundle.factors),
                      observation_count=observation_count,
                      persistent_identity_count=persistent_count,
                      observation_identity_sha256=identity_sha,
                      gauge_ids=tuple(gauge.window_id for gauge in bundle.gauges),
                      previous_update_id=previous_update_id,
                  )
              '''
          ).lstrip()
          text = text[:bundle_start] + bundle_function + text[bundle_end:]

          append_start = text.index("def append_observation_factor_bundle(")
          append_end = text.index("\n\ndef _require_append_only_rewrite(", append_start)
          append_function = dedent(
              '''
              def append_observation_factor_bundle(
                  stream: ObservationFactorStreamV1 | None,
                  bundle_manifest_path: str | Path,
                  *,
                  stream_manifest_path: str | Path,
                  admitted_frame_start: int | None = None,
                  metadata: Mapping[str, Any] | None = None,
              ) -> ObservationFactorStreamV1:
                  """Append one schema-v4 delta bundle without reopening prior intervals."""

                  stream_path = Path(stream_manifest_path)
                  stream_directory = stream_path.resolve().parent
                  manifest = Path(bundle_manifest_path)
                  if stream is None:
                      update_index = 0
                      previous_update_id = None
                      admitted_start = (
                          None
                          if admitted_frame_start is None
                          else _require_nonnegative_integer(
                              admitted_frame_start,
                              name="admitted_frame_start",
                          )
                      )
                  else:
                      update_index = len(stream.updates)
                      previous_update_id = stream.updates[-1].update_id
                      expected_start = stream.causal_frame_stop
                      admitted_start = (
                          expected_start
                          if admitted_frame_start is None
                          else _require_nonnegative_integer(
                              admitted_frame_start,
                              name="admitted_frame_start",
                          )
                      )
                      if admitted_start != expected_start:
                          raise ValueError(
                              "the next stream interval must start at the prior causal stop"
                          )

                  update = _bundle_update(
                      manifest,
                      stream_directory=stream_directory,
                      update_index=update_index,
                      admitted_frame_start=admitted_start,
                      previous_update_id=previous_update_id,
                  )
                  if stream is None:
                      return ObservationFactorStreamV1(
                          sequence_id=update.bundle_sequence_id,
                          case_id=update.case_id,
                          stream_id=update.stream_id,
                          source_repository=update.source_repository,
                          source_revision=update.source_revision,
                          updates=(update,),
                          metadata={} if metadata is None else metadata,
                      )
                  if metadata is not None and plain_json(metadata) != plain_json(
                      stream.metadata
                  ):
                      raise ValueError("stream metadata cannot change while appending")
                  return replace(
                      stream,
                      updates=(*stream.updates, update),
                      artifact_id=None,
                  )
              '''
          ).lstrip()
          text = text[:append_start] + append_function + text[append_end:]

          writer_start = text.index("def write_observation_factor_stream(")
          writer_end = text.index("\n\ndef load_observation_factor_stream(", writer_start)
          lock_and_writer = dedent(
              '''
              @contextmanager
              def _exclusive_stream_writer(output: Path) -> Iterator[None]:
                  lock = output.with_name(f".{output.name}.lock")
                  try:
                      descriptor = os.open(
                          lock,
                          os.O_CREAT | os.O_EXCL | os.O_WRONLY,
                          0o600,
                      )
                  except FileExistsError as error:
                      raise FileExistsError(
                          f"observation-factor stream is being written: {output}"
                      ) from error
                  try:
                      with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                          handle.write(f"pid={os.getpid()}\\n")
                          handle.flush()
                          os.fsync(handle.fileno())
                      yield
                  finally:
                      lock.unlink(missing_ok=True)


              def write_observation_factor_stream(
                  stream: ObservationFactorStreamV1,
                  path: str | Path,
              ) -> Path:
                  """Atomically persist an idempotent append-only stream manifest."""

                  output = Path(path)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  serialized = (
                      json.dumps(
                          stream.to_record(),
                          indent=2,
                          sort_keys=True,
                          allow_nan=False,
                      )
                      + "\\n"
                  )
                  with _exclusive_stream_writer(output):
                      if output.exists():
                          existing = load_observation_factor_stream(
                              output,
                              validate_bundles=False,
                          )
                          _require_append_only_rewrite(existing, stream)

                      descriptor, temporary_name = tempfile.mkstemp(
                          prefix=f".{output.name}.",
                          suffix=".tmp",
                          dir=output.parent,
                          text=True,
                      )
                      temporary = Path(temporary_name)
                      try:
                          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                              handle.write(serialized)
                              handle.flush()
                              os.fsync(handle.fileno())
                          os.replace(temporary, output)
                      finally:
                          temporary.unlink(missing_ok=True)
                  return output
              '''
          ).lstrip()
          text = text[:writer_start] + lock_and_writer + text[writer_end:]
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/test_observation_factor_stream_strict.py")
          test_text = tests.read_text(encoding="utf-8")
          if "test_persistence_fails_closed_when_writer_lock_exists" not in test_text:
              marker = "def test_rejects_duplicate_json_keys(tmp_path: Path) -> None:\n"
              regression = dedent(
                  '''
                  def test_persistence_fails_closed_when_writer_lock_exists(
                      tmp_path: Path,
                  ) -> None:
                      path = tmp_path / "stream.json"
                      lock = tmp_path / ".stream.json.lock"
                      lock.write_text("busy\\n", encoding="utf-8")

                      with pytest.raises(FileExistsError, match="being written"):
                          write_observation_factor_stream(_stream(), path)

                      assert not path.exists()
                      assert lock.read_text(encoding="utf-8") == "busy\\n"


                  '''
              ).lstrip()
              test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding="utf-8")
          PY
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m ruff check \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          python -m mypy src/prob4d/observation_factor_stream.py
          python -m pytest -q \
            tests/test_observation_factor_stream_strict.py \
            tests/test_observation_factor_stream_bundle_strict.py \
            tests/test_observation_factor_stream.py
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/observation_factor_stream.py \
            tests/test_observation_factor_stream_strict.py
          git commit -m 'Serialize stream persistence and bind exact bytes'
          git push origin HEAD:agent/harden-factor-stream-contract
