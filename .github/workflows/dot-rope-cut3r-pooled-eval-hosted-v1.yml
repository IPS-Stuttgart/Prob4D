name: DOT pooled CUT3R hosted evaluation v1

on:
  push:
    branches: [science/dot-cut3r-pooled-eval-hosted-v1]
    paths:
      - ".github/workflows/dot-rope-cut3r-pooled-eval-hosted-v1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dot-pooled-cut3r-hosted-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: protocols/execution_requests/dot_rope_cut3r_pooled_evaluation_v2.json
  PROVIDER_RUN_ID: "33329701704"
  PROVIDER_ARTIFACT_NAME: dot-rope-cut3r-sealed-provider-33329701704-1
  ARCHIVE_NAME: R01-10.zip
  ARCHIVE_DATAFILE_ID: "2343"
  ARCHIVE_BYTES: "1705947395"
  ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
  DATAFILE_API_ROOT: https://dataverse.orc.gmu.edu/api/access/datafile
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  evaluate:
    name: Evaluate sealed DOT predictions with verified public archive
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/science/dot-cut3r-pooled-eval-hosted-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Initialize isolated evaluation workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prob4d-dot-pooled-hosted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p "$root/provider" "$root/dataset" "$root/evidence"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Check out exact dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
      - name: Set up bounded Python 3.12 runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact numeric runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir "pip==25.2" "numpy==2.2.6"
          python -m pip install --no-cache-dir --no-deps -e .
          python -m pip check
      - name: Validate audited pooled-evaluation request
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/evaluate_dot_rope_cut3r_pooled.py \
            validate-request \
            --request "$REQUEST_PATH"
      - name: Download exact sealed provider bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.PROVIDER_ARTIFACT_NAME }}
          path: ${{ steps.workspace.outputs.root }}/provider
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROVIDER_RUN_ID }}
      - name: Download and verify official DOT source archive
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          archive="$root/dataset/$ARCHIVE_NAME"
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --output "$archive" \
            "$DATAFILE_API_ROOT/$ARCHIVE_DATAFILE_ID"
          test "$(stat -c %s "$archive")" = "$ARCHIVE_BYTES"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$archive" | md5sum --check --strict
      - name: Evaluate pooled markers without decoding normal-view images
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            python scripts/science/evaluate_dot_rope_cut3r_pooled.py \
              evaluate \
              --request "$REQUEST_PATH" \
              --dataset-root "$root/dataset" \
              --provider-bundle "$root/provider/bundle" \
              --output-dir "$root/evidence/result" \
              --repository-revision "$GITHUB_SHA"
      - name: Require complete source result and summarize
        shell: bash
        run: |
          set -euo pipefail
          result="${{ steps.workspace.outputs.root }}/evidence/result/result.json"
          RESULT="$result" python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          if value.get("decision") != "complete-source-evaluation-pooled-marker-support":
              raise SystemExit("pooled evaluator did not produce a complete source result")
          print(json.dumps({
              "evaluation_id": value["evaluation_id"],
              "best_method": value["aggregate_methods"][0]["method"],
              "aggregate_methods": value["aggregate_methods"],
              "sequence_results": value["sequence_results"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload complete pooled-evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-rope-cut3r-pooled-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 30
