name: Temporary validate Tracking Cloth finite-orbit v3

on:
  push:
    branches:
      - repair/tracking-cloth-finite-orbit-motive-parser-v1
    paths:
      - ".github/workflows/temporary-tracking-cloth-finite-orbit-v3-validation.yml"
      - "protocols/tracking-cloth-finite-orbit-real-v3.json"
      - "scripts/science/run_tracking_cloth_finite_orbit_real_v3.py"
      - "tests/test_tracking_cloth_finite_orbit_real_v3.py"

permissions:
  contents: read

concurrency:
  group: temporary-tracking-cloth-finite-orbit-v3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5"
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check
      - name: Validate v3 protocol and wrapper
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/science/run_tracking_cloth_finite_orbit_real_v3.py \
            tests/test_tracking_cloth_finite_orbit_real_v3.py
          python -m ruff format --check \
            scripts/science/run_tracking_cloth_finite_orbit_real_v3.py \
            tests/test_tracking_cloth_finite_orbit_real_v3.py
          python -m pytest -q \
            tests/test_tracking_cloth_finite_orbit_real_v3.py \
            tests/test_tracking_cloth_finite_orbit_real_v2.py \
            tests/test_motive_csv.py
          python -m compileall -q \
            scripts/science/run_tracking_cloth_finite_orbit_real_v3.py
