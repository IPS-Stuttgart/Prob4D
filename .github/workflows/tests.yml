name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality and provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests 2>&1 | tee ruff-output.txt
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail on Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Type-check stable provider interfaces
        run: >-
          python -m mypy
          src/prob4d/cli.py
          src/prob4d/calibration_compatibility.py
          src/prob4d/covariance_root.py
          src/prob4d/provider_manifest.py
          src/prob4d/provider_manifest_cli.py
          src/prob4d/provider_v1.py
          src/prob4d/provider_v2.py
      - name: Emit provider manifest
        run: >-
          prob4d provider manifest
          --provider-revision "${GITHUB_SHA}"
          --output provider-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: prob4d-provider-manifest
          path: provider-manifest.json
          retention-days: 14

  test:
    name: NumPy core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight package
        run: python -m pip install -e ".[dev]"
      - name: Verify stable imports do not load GPU stacks
        run: |
          python - <<'PY'
          import sys

          import prob4d.cli
          import prob4d.covariance_root
          import prob4d.provider_manifest
          import prob4d.provider_v1
          import prob4d.provider_v2

          forbidden = {"torch", "diffusers", "decord"}
          loaded = sorted(forbidden & set(sys.modules))
          if loaded:
              raise SystemExit(f"optional GPU dependencies loaded by stable imports: {loaded}")
          PY
      - name: Run complete suite
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-results-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build distributions
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installed-artifact:
    name: Installed ${{ matrix.kind }} and CLI smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/prob4d-artifact-smoke"
          python_bin="$RUNNER_TEMP/prob4d-artifact-smoke/bin/python"
          "$python_bin" -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          "$python_bin" -m pip install "$artifact"
          "$python_bin" -m pip check
          "$python_bin" - <<'PY'
          import prob4d
          import prob4d.provider_v1 as provider_v1
          import prob4d.provider_v2 as provider_v2

          print(prob4d.__version__)
          assert provider_v1.PROVIDER_API_VERSION == 1
          assert provider_v2.PROVIDER_API_VERSION == 2
          PY
      - name: Exercise grouped and legacy command help
        shell: bash
        run: |
          bin="$RUNNER_TEMP/prob4d-artifact-smoke/bin"
          "$bin/prob4d" --help
          "$bin/prob4d" provider manifest --help
          "$bin/prob4d" observation export --help
          "$bin/prob4d" motioncrafter --help
          "$bin/prob4d-provider-manifest" --help
          "$bin/prob4d-ablate" --help
          "$bin/prob4d-benchmark" --help
          "$bin/prob4d-export-observation-belief" --help
          "$bin/prob4d-motioncrafter" --help
          "$bin/prob4d-phystwin" --help
          "$bin/prob4d-phystwin-state" --help
          "$bin/prob4d-phystwin-uncertainty" --help
          "$bin/prob4d-sintel-uncertainty" --help
          "$bin/prob4d-validate-observation" --help
          "$bin/prob4d-vggt-baseline" --help
