name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/prob4d-wheel
      - run: /tmp/prob4d-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/prob4d-wheel/bin/python -c "import prob4d; print(prob4d.__version__)"
      - name: Smoke-test prob4d-ablate help
        run: /tmp/prob4d-wheel/bin/prob4d-ablate --help >/dev/null
      - name: Smoke-test prob4d-benchmark help
        run: /tmp/prob4d-wheel/bin/prob4d-benchmark --help >/dev/null
      - name: Smoke-test prob4d-export-observation-belief help
        run: /tmp/prob4d-wheel/bin/prob4d-export-observation-belief --help >/dev/null
      - name: Smoke-test prob4d-motioncrafter help
        run: /tmp/prob4d-wheel/bin/prob4d-motioncrafter --help >/dev/null
      - name: Smoke-test prob4d-phystwin help
        run: /tmp/prob4d-wheel/bin/prob4d-phystwin --help >/dev/null
      - name: Smoke-test prob4d-phystwin-state help
        run: /tmp/prob4d-wheel/bin/prob4d-phystwin-state --help >/dev/null
      - name: Smoke-test prob4d-phystwin-uncertainty help
        run: /tmp/prob4d-wheel/bin/prob4d-phystwin-uncertainty --help >/dev/null
      - name: Smoke-test prob4d-sintel-uncertainty help
        run: /tmp/prob4d-wheel/bin/prob4d-sintel-uncertainty --help >/dev/null
      - name: Smoke-test prob4d-validate-observation help
        run: /tmp/prob4d-wheel/bin/prob4d-validate-observation --help >/dev/null
      - name: Smoke-test prob4d-vggt-baseline help
        run: /tmp/prob4d-wheel/bin/prob4d-vggt-baseline --help >/dev/null
