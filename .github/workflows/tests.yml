name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Trusted same-repository recovery branches use workstation2; forks and
  # ordinary CI retain the GitHub-hosted default.
  quality:
    name: Quality and provider contract
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'ci/self-hosted-') &&
          'nvidia-smi' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests scripts/ci 2>&1 | tee ruff-output.txt
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail on Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Type-check stable provider interfaces
        id: mypy
        continue-on-error: true
        run: >-
          python -m mypy
          src/prob4d/cli.py
          src/prob4d/calibration_compatibility.py
          src/prob4d/composition_jacobian.py
          src/prob4d/covariance_root.py
          src/prob4d/observation_factor_stream.py
          src/prob4d/prediction_store.py
          src/prob4d/prediction_store_benchmark.py
          src/prob4d/prediction_store_cli.py
          src/prob4d/project_identity.py
          src/prob4d/provider_attestation.py
          src/prob4d/provider_manifest.py
          src/prob4d/provider_manifest_cli.py
          src/prob4d/provider_v1.py
          src/prob4d/provider_v2.py
          src/prob4d/provider_v2_cli.py
          src/prob4d/provider_v2_loading.py
          src/prob4d/runtime_revision.py
          src/prob4d/source_diagnostics.py
          2>&1 | tee mypy-output.txt
      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mypy-diagnostics
          path: mypy-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail on mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Verify repository and release policies
        run: >-
          python -m pytest -q
          tests/test_github_action_pins.py
          tests/test_project_identity.py
          tests/test_release_metadata.py
      - name: Verify clean-checkout runtime revision attestation
        run: |
          python - <<'PY'
          import os

          from prob4d.runtime_revision import assert_runtime_revision

          attestation = assert_runtime_revision(os.environ["GITHUB_SHA"])
          assert attestation.matched
          assert attestation.independently_verified
          PY
      - name: Emit provider manifests
        run: |
          prob4d provider manifest \
            --api-version 1 \
            --provider-revision "${GITHUB_SHA}" \
            --output provider-manifest.json
          prob4d provider manifest \
            --api-version 2 \
            --provider-revision "${GITHUB_SHA}" \
            --output provider-manifest-v2.json
          prob4d project identity --compact > project-identity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-provider-manifests
          path: |
            provider-manifest.json
            provider-manifest-v2.json
            project-identity.json
          retention-days: 14

  test:
    name: NumPy core / Python ${{ matrix.python-version }}
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'ci/self-hosted-') &&
          'nvidia-smi' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight package
        run: python -m pip install -e ".[dev]"
      - name: Verify stable imports do not load GPU stacks
        run: |
          python - <<'PY'
          import sys

          import prob4d.cli
          import prob4d.composition_jacobian
          import prob4d.covariance_root
          import prob4d.observation_factor_stream
          import prob4d.prediction_store
          import prob4d.prediction_store_benchmark
          import prob4d.prediction_store_cli
          import prob4d.project_identity
          import prob4d.provider_attestation
          import prob4d.provider_evaluation
          import prob4d.provider_manifest
          import prob4d.provider_v1
          import prob4d.provider_v2
          import prob4d.provider_v2_cli
          import prob4d.provider_v2_loading
          import prob4d.runtime_revision
          import prob4d.source_diagnostics

          forbidden = {"torch", "diffusers", "decord"}
          loaded = sorted(forbidden & set(sys.modules))
          if loaded:
              raise SystemExit(f"optional GPU dependencies loaded by stable imports: {loaded}")
          PY
      - name: Run complete suite
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-results-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  minimum-dependencies:
    name: Declared runtime floors / Python 3.10
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'ci/self-hosted-') &&
          'nvidia-smi' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci/minimum.txt
      - name: Install exact runtime floor and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci/minimum.txt
          python -m pip install --no-deps -e .
      - name: Verify resolved floor
        run: |
          python - <<'PY'
          import numpy
          import prob4d

          assert numpy.__version__ == "1.24.0"
          assert prob4d.__version__ == "0.3.1"
          PY
      - name: Run complete suite at the declared floor
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-minimum-dependencies.xml
      - name: Upload floor-environment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimum-dependency-evidence
          path: pytest-minimum-dependencies.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build distributions
    needs: [quality, test, minimum-dependencies]
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'ci/self-hosted-') &&
          'nvidia-smi' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate wheel and source distribution
        run: |
          python -m pip install build numpy pytest twine
          python -m build
          python -m twine check dist/*
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          python scripts/ci/check_sdist.py "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installed-artifact:
    name: Installed ${{ matrix.kind }} and CLI smoke
    needs: build
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'ci/self-hosted-') &&
          'nvidia-smi' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/prob4d-artifact-smoke"
          python_bin="$RUNNER_TEMP/prob4d-artifact-smoke/bin/python"
          "$python_bin" -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          "$python_bin" -m pip install "$artifact"
          "$python_bin" -m pip check
          "$python_bin" - <<'PY'
          from importlib import resources

          import prob4d
          import prob4d.provider_v1 as provider_v1
          import prob4d.provider_v2 as provider_v2
          from prob4d.composition_jacobian import current_composition_jacobian_mode
          from prob4d.prediction_store import load_prediction_bundle_store
          from prob4d.project_identity import prob4d_project_identity

          print(prob4d.__version__)
          assert prob4d.__version__ == "0.3.1"
          assert provider_v1.PROVIDER_API_VERSION == 1
          assert provider_v2.PROVIDER_API_VERSION == 2
          assert provider_v2.OBSERVATION_FACTOR_STREAM_VERSION == 1
          assert callable(provider_v2.load_claim_bearing_observation_belief)
          assert callable(load_prediction_bundle_store)
          assert resources.files("prob4d").joinpath("py.typed").is_file()
          assert current_composition_jacobian_mode() == "legacy_finite_difference"
          assert prob4d_project_identity()["canonical_repository"] == "IPS-Stuttgart/Prob4D"
          PY
      - name: Exercise grouped and legacy command help
        shell: bash
        run: |
          bin="$RUNNER_TEMP/prob4d-artifact-smoke/bin"
          "$bin/prob4d" --help
          "$bin/prob4d" project identity --help
          "$bin/prob4d" provider manifest --help
          "$bin/prob4d" provider manifest --api-version 2 --help
          "$bin/prob4d" evaluate provider --help
          "$bin/prob4d" observation export --help
          "$bin/prob4d" observation export-v1 --help
          "$bin/prob4d" observation export-calibrated --help
          "$bin/prob4d" observation export-exploratory --help
          "$bin/prob4d" motioncrafter --help
          "$bin/prob4d" storage benchmark --help
          "$bin/prob4d" storage materialize --help
          "$bin/prob4d" storage validate --help
          "$bin/prob4d-provider-manifest" --help
          "$bin/prob4d-ablate" --help
          "$bin/prob4d-ablate-provider-v2-gauge" --help
          "$bin/prob4d-benchmark" --help
          "$bin/prob4d-evaluate-provider" --help
          "$bin/prob4d-export-observation-belief" --help
          "$bin/prob4d-export-calibrated-observation-belief" --help
          "$bin/prob4d-export-exploratory-observation-belief" --help
          "$bin/prob4d-motioncrafter" --help
          "$bin/prob4d-phystwin" --help
          "$bin/prob4d-phystwin-state" --help
          "$bin/prob4d-phystwin-uncertainty" --help
          "$bin/prob4d-sintel-uncertainty" --help
          "$bin/prob4d-validate-observation" --help
          "$bin/prob4d-vggt-baseline" --help
