name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -e ".[dev]"
      - name: Capture Ruff diagnostics
        run: ruff check src tests --output-format=concise > ruff-report.txt || true
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Enforce Ruff
        run: test ! -s ruff-report.txt
      - run: pytest -q
