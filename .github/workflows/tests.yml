name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -e ".[dev]"
      - run: ruff check src tests
      - name: Capture pytest diagnostics
        run: pytest -q > pytest-report.txt 2>&1 || true
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.txt
      - name: Enforce pytest
        run: test "$(tail -n 1 pytest-report.txt)" != ""
          && ! grep -Eq "[1-9][0-9]* failed|ERRORS" pytest-report.txt
