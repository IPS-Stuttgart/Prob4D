name: Temporary provider matrix formatter

on:
  push:
    branches: [agent/provider-adapter-readiness-matrix]
    paths:
      - ".github/workflows/temporary-provider-matrix-format.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-provider-matrix-format
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/provider-adapter-readiness-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact provider-matrix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-adapter-readiness-matrix
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the repository formatter
        run: python -m pip install "ruff>=0.6"
      - name: Apply canonical Ruff fixes and formatting
        run: |
          python -m ruff check --fix \
            src/prob4d/adapter \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py
          python -m ruff format \
            src/prob4d/adapter \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py
          git diff --check
      - name: Commit the formatter result when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/adapter \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py
          git commit -m "Apply provider matrix Ruff formatting"
          git push origin HEAD:agent/provider-adapter-readiness-matrix
