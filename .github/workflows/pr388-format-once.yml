name: PR 388 one-shot Ruff formatting

on:
  push:
    branches: [science/dot-marker-support-audit-20260831]
    paths:
      - ".github/workflows/pr388-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/Prob4D'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/dot-marker-support-audit-20260831
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the authoritative formatter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.5'
          python -m ruff format \
            scripts/science/audit_dot_rope_marker_support.py \
            tests/test_dot_rope_marker_support_audit.py \
            tests/test_trusted_self_hosted_validation_policy.py
          /usr/bin/git rm .github/workflows/pr388-format-once.yml
          /usr/bin/git config user.name 'github-actions[bot]'
          /usr/bin/git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          /usr/bin/git add \
            scripts/science/audit_dot_rope_marker_support.py \
            tests/test_dot_rope_marker_support_audit.py \
            tests/test_trusted_self_hosted_validation_policy.py
          /usr/bin/git diff --cached --check
          /usr/bin/git commit -m 'Apply Ruff formatting to DOT marker audit'
          /usr/bin/git push origin HEAD:science/dot-marker-support-audit-20260831
