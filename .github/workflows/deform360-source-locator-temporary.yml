name: Temporary Deform360 processed-source locator

on:
  push:
    branches: [science/deform360-rope-query-pilot-v1]
    paths:
      - ".github/workflows/deform360-source-locator-temporary.yml"

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve public Hub and mounted processed layouts
        shell: bash
        env:
          DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/deform360-source-locator-$GITHUB_RUN_ID"
          rm -rf -- "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.2.6" "huggingface_hub==0.34.4"
          "$venv/bin/python" - <<'PY'
          from collections import Counter
          from pathlib import Path

          import numpy as np
          from huggingface_hub import HfApi

          api = HfApi()
          repository = "brownu/deform360_processed"
          info = api.dataset_info(repository)
          print("=== PINNED PROCESSED REPOSITORY ===")
          print("repository", repository)
          print("sha", info.sha)
          for subpath in ("processed", "processed/001-rope"):
              print(f"=== HUB TREE {subpath} ===")
              try:
                  entries = list(
                      api.list_repo_tree(
                          repository,
                          path_in_repo=subpath,
                          repo_type="dataset",
                          revision=info.sha,
                          recursive=False,
                      )
                  )
                  for item in entries[:300]:
                      print(
                          "entry",
                          item.path,
                          type(item).__name__,
                          getattr(item, "size", None),
                          getattr(item, "blob_id", None),
                          getattr(item, "lfs", None),
                      )
              except Exception as exc:
                  print("TREE_ERROR", subpath, type(exc).__name__, str(exc))

          root = Path("/mnt/seagate10tb/florianpfaff/datasets/deform360")
          object_root = root / "processed-repository" / "processed" / "001-rope"
          print("=== LOCAL OBJECT TREE ===")
          print("object_root", object_root)
          suffixes = Counter()
          count = 0
          total_bytes = 0
          for path in sorted(object_root.rglob("*")):
              if not path.is_file():
                  continue
              suffixes[path.suffix.lower() or "<none>"] += 1
              count += 1
              total_bytes += path.stat().st_size
              if count <= 500:
                  print("local", path.relative_to(root), path.stat().st_size)
          print("local_file_count", count)
          print("local_total_bytes", total_bytes)
          print("local_suffix_counts", dict(suffixes))

          source_robot = object_root / "episode_0" / "robot" / "robot.npy"
          print("=== SOURCE EPISODE LEGACY ROBOT HEADER ===")
          print("source_robot_exists", source_robot.is_file())
          if source_robot.is_file():
              value = np.load(source_robot, allow_pickle=True)
              print("container_shape", value.shape)
              print("container_dtype", value.dtype)
              payload = value.item() if value.shape == () else value
              print("payload_type", type(payload).__name__)
              if isinstance(payload, dict):
                  for key in sorted(payload):
                      member = np.asarray(payload[key])
                      print("robot_member", key, member.shape, member.dtype)
              elif isinstance(payload, np.ndarray):
                  print("robot_array", payload.shape, payload.dtype)
          PY
          rm -rf -- "$venv"
