name: Cycle guard finite-sample calibration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cycle-guard-conformal.yml"
      - "MANIFEST.in"
      - "docs/cycle-guard-conformal.md"
      - "protocols/cycle-guard-conformal-v1.json"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/finite_sample_threshold.py"
      - "src/prob4d/cycle_guard_conformal_monte_carlo.py"
      - "src/prob4d/cycle_guard_conformal_reporting.py"
      - "src/prob4d/cli.py"
      - "src/prob4d/__init__.py"
      - "tests/test_finite_sample_threshold.py"
      - "tests/test_cycle_guard_conformal_monte_carlo.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycle-guard-conformal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Fresh-seed finite-sample calibration study
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and compatible typing environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/finite_sample_threshold.py \
            src/prob4d/cycle_guard_conformal_monte_carlo.py \
            src/prob4d/cycle_guard_conformal_reporting.py \
            src/prob4d/cli.py \
            src/prob4d/__init__.py \
            tests/test_finite_sample_threshold.py \
            tests/test_cycle_guard_conformal_monte_carlo.py
          python -m mypy \
            src/prob4d/finite_sample_threshold.py \
            src/prob4d/cycle_guard_conformal_monte_carlo.py \
            src/prob4d/cycle_guard_conformal_reporting.py
      - name: Run finite-sample and study regressions
        run: >-
          python -m pytest -q
          tests/test_finite_sample_threshold.py
          tests/test_cycle_guard_conformal_monte_carlo.py
          tests/test_uncertainty_normalized_cycle_guard.py
          tests/test_causal_gauge_graph.py
      - name: Run frozen fresh-seed study
        id: experiment
        shell: bash
        run: |
          set +e
          prob4d diagnostic cycle-guard-conformal \
            --output-dir outputs/cycle-guard-conformal \
            --calibration-trials 96 \
            --target-trials-per-scenario 128 \
            --calibration-seed 408260804 \
            --target-seed 731260804 \
            --empirical-threshold-quantile 0.95 \
            --conformal-miscoverage 0.05 \
            --representative-radius 1.0 \
            --minimum-uncertainty-scale 1e-12 \
            --num-frames 28 \
            --height 4 \
            --width 6 \
            --window-size 11 \
            --overlap 7 \
            --minimum-edge-weight 0.0 \
            --bootstrap-resamples 2000 \
            --endpoint-noninferiority-margin 0.001 \
            --minimum-clean-coverage 0.90 \
            --maximum-clean-covariance-trace-ratio 1.25 \
            --source-revision "$SOURCE_REVISION"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
            exit "$status"
          fi
          echo "decision_exit_code=$status" >> "$GITHUB_OUTPUT"
          cp protocols/cycle-guard-conformal-v1.json \
            outputs/cycle-guard-conformal/protocol.json
          (
            cd outputs/cycle-guard-conformal
            sha256sum protocol.json >> SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Verify frozen protocol and decision
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          from pathlib import Path

          protocol = json.loads(
              Path("protocols/cycle-guard-conformal-v1.json").read_text()
          )
          report = json.loads(
              Path(
                  "outputs/cycle-guard-conformal/"
                  "cycle_guard_conformal_monte_carlo.json"
              ).read_text()
          )
          configuration = report["configuration"]
          calibration = protocol["calibration"]
          target = protocol["target"]
          geometry = protocol["synthetic_geometry"]
          bootstrap = protocol["bootstrap"]
          acceptance = protocol["acceptance_criteria"]

          assert configuration["calibration_trials"] == calibration["trial_count"]
          assert configuration["calibration_seed"] == calibration["seed_start"]
          assert configuration["target_trials_per_scenario"] == target[
              "trials_per_scenario"
          ]
          assert configuration["target_seed"] == target["seed_start"]
          assert configuration["empirical_threshold_quantile"] == calibration[
              "empirical_threshold_quantile"
          ]
          assert configuration["conformal_miscoverage"] == calibration[
              "conformal_miscoverage"
          ]
          for name in (
              "num_frames",
              "height",
              "width",
              "window_size",
              "overlap",
              "representative_radius",
              "minimum_uncertainty_scale",
              "minimum_edge_weight",
          ):
              assert configuration[name] == geometry[name]
          assert configuration["bootstrap_resamples"] == bootstrap["resamples"]
          assert configuration["endpoint_noninferiority_margin"] == acceptance[
              "endpoint_noninferiority_margin"
          ]
          assert configuration["minimum_clean_coverage"] == acceptance[
              "minimum_clean_coverage"
          ]
          assert configuration["maximum_clean_covariance_trace_ratio"] == acceptance[
              "maximum_clean_covariance_trace_ratio"
          ]
          assert configuration["scenarios"] == protocol["scenarios"]
          assert {row["method_id"] for row in report["aggregate"]} == set(
              protocol["methods"]
          )

          finite = report["calibration"][
              "finite_sample_normalized_cycle_threshold"
          ]
          count = calibration["trial_count"]
          alpha = calibration["conformal_miscoverage"]
          rank = math.ceil((count + 1) * (1.0 - alpha))
          assert finite["semantics"] == calibration["finite_sample_method"]
          assert finite["calibration_count"] == count
          assert finite["order_statistic_rank"] == rank
          assert finite["guaranteed_miscoverage_upper_bound"] <= alpha

          decision = report["decision"]
          criteria = decision["criteria"]
          conformal = decision["conformal_normalized_guard"]
          empirical = decision["empirical_normalized_guard"]
          margins = decision["registered_margins"]
          diagnostics = decision["secondary_clean_diagnostics"]
          assert criteria[
              "finite_sample_bound_at_most_requested_miscoverage"
          ] == (
              margins["guaranteed_miscoverage_upper_bound"]
              <= margins["conformal_miscoverage"]
          )
          assert criteria["strong_detection_at_least_0_95"] == (
              conformal["strong_outlier_detection_rate"]
              >= acceptance["strong_detection_at_least"]
          )
          assert criteria[
              "strong_detection_noninferior_to_empirical_by_0_05"
          ] == (
              conformal["strong_outlier_detection_rate"]
              >= empirical["strong_outlier_detection_rate"]
              - acceptance[
                  "strong_detection_noninferiority_margin_vs_empirical"
              ]
          )
          assert criteria["mild_detection_at_least_0_90"] == (
              conformal["mild_outlier_detection_rate"]
              >= acceptance["mild_detection_at_least"]
          )
          assert criteria[
              "mild_detection_noninferior_to_empirical_by_0_05"
          ] == (
              conformal["mild_outlier_detection_rate"]
              >= empirical["mild_outlier_detection_rate"]
              - acceptance["mild_detection_noninferiority_margin_vs_empirical"]
          )
          assert criteria["worst_clean_false_fallback_at_most_0_10"] == (
              conformal["worst_clean_false_fallback_rate"]
              <= acceptance["worst_clean_false_fallback_at_most"]
          )
          assert criteria[
              "worst_clean_false_fallback_not_worse_than_empirical"
          ] == (
              conformal["worst_clean_false_fallback_rate"]
              <= empirical["worst_clean_false_fallback_rate"]
          )
          assert criteria["clean_endpoint_noninferiority"] == (
              max(
                  diagnostics["endpoint_delta_ci95_upper_by_scenario"].values()
              )
              <= acceptance["endpoint_noninferiority_margin"]
          )
          assert criteria["clean_coverage_at_least_registered_minimum"] == (
              min(diagnostics["coverage_by_scenario"].values())
              >= acceptance["minimum_clean_coverage"]
          )
          assert criteria[
              "clean_covariance_width_within_registered_ratio"
          ] == (
              max(
                  diagnostics[
                      "covariance_trace_ratio_vs_tree_by_scenario"
                  ].values()
              )
              <= acceptance["maximum_clean_covariance_trace_ratio"]
          )
          assert decision["overall_passed"] == all(criteria.values())
          assert report["claim_boundary"] == protocol["claim_boundary"]
          PY
      - name: Publish study summary
        if: always()
        run: |
          summary=outputs/cycle-guard-conformal/cycle_guard_conformal_monte_carlo.md
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Decision exit code: ${{ steps.experiment.outputs.decision_exit_code }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cycle-guard-conformal
          path: outputs/cycle-guard-conformal/
          if-no-files-found: warn
          retention-days: 90
