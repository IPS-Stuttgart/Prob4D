name: Apply race-safe artifact publication patch

on:
  push:
    branches:
      - agent/race-safe-artifact-publication
    paths:
      - ".github/workflows/apply-race-safe-artifact-publication.yml"

permissions:
  contents: write

concurrency:
  group: apply-race-safe-artifact-publication
  cancel-in-progress: false

jobs:
  apply:
    name: Apply verified patch and remove transport files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply the exact local patch
        shell: bash
        run: |
          set -euo pipefail
          transport_root=".github/.race-safe-patch"
          old_payload=".github/.apply-race-safe-artifact-patch.gz.b64"
          workflow=".github/workflows/apply-race-safe-artifact-publication.yml"
          mapfile -t parts < <(find "${transport_root}" -maxdepth 1 -type f -name 'part-*' | LC_ALL=C sort)
          test "${#parts[@]}" -eq 12
          cat "${parts[@]}" > /tmp/prob4d-full.patch.gz.b64
          test "$(wc -c < /tmp/prob4d-full.patch.gz.b64)" -eq 8252
          echo "dd2576006054de96fb33fa63b6a0025df86a4b801785f7dbf5f3460bfb0ad1ac  /tmp/prob4d-full.patch.gz.b64" \
            | sha256sum --check -
          base64 --decode /tmp/prob4d-full.patch.gz.b64 > /tmp/prob4d-full.patch.gz
          echo "a5e0369315e460a1a8b37571c397276d26199ebe6bbfccf006f2e2f96a4bcddd  /tmp/prob4d-full.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/prob4d-full.patch.gz > /tmp/prob4d-full.patch
          echo "67f6b4346daa224e161ca9ba4ffcaa4ad61c287c3570c9699a7c2fde82090f4d  /tmp/prob4d-full.patch" \
            | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/prob4d-full.patch
          rm -rf -- "${transport_root}" "${old_payload}" "${workflow}"
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make artifact publication race-safe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
