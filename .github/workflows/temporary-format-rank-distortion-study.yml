name: Temporary rank-distortion study formatter

on:
  push:
    branches:
      - research/query-rank-distortion-frontier-v1
    paths:
      - .github/workflows/temporary-format-rank-distortion-study.yml

permissions:
  contents: write

jobs:
  format:
    name: Format and push study source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/query-rank-distortion-frontier-v1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Format study source
        run: |
          python -m pip install "ruff==0.16.1"
          python -m ruff format scripts/research/posterior_rank_distortion_study.py
          git diff --check

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- scripts/research/posterior_rank_distortion_study.py; then
            echo "Study source was already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research/posterior_rank_distortion_study.py
          git commit -m "Format posterior rank-distortion study"
          git push origin HEAD:research/query-rank-distortion-frontier-v1
