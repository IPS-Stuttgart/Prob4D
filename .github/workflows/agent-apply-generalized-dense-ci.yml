name: Apply generalized dense fusion

on:
  push:
    branches: [agent/generalized-dense-ci]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-generalized-dense-ci
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/generalized-dense-ci
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Materialize the reviewed source file
        shell: bash
        run: |
          cat .github/agent-staging/fusion.b64.* | base64 --decode > fusion.py.tmp
          echo "9b365215c4e91d8ee96f8e636eecd912c1b0b5df1b4bd6e3ebd8d08768303a08  fusion.py.tmp" | sha256sum --check
          mv fusion.py.tmp src/prob4d/fusion.py
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Type-check stable provider interfaces
        run: >-
          python -m mypy
          src/prob4d/cli.py
          src/prob4d/provider_manifest.py
          src/prob4d/provider_manifest_cli.py
          src/prob4d/provider_v1.py
      - name: Run complete suite
        run: python -m pytest --tb=short
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Publish the validated implementation and remove staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prob4d/fusion.py
          git rm -r .github/agent-staging .github/workflows/agent-apply-generalized-dense-ci.yml
          git commit -m "Fuse dense contributors jointly with generalized CI"
          git push origin HEAD:agent/generalized-dense-ci
