name: Execute BPT controlled decisive study

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bpt-controlled-decisive-v1.yml"
      - "tests/test_bpt_controlled_decisive_execution_workflow.py"
      - "docs/bpt-controlled-decisive-execution.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpt-controlled-decisive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROB4D_SOURCE_REVISION: aa8ffc6541011d044561e09870569a14ab3f586f
  BPT_SOURCE_REVISION: db0f0119a3a4220f5489566829846681e844627d
  BPT_BASE_REVISION: b2da5df5eddd5437d444b60b11130262d115e264
  PROTOCOL_SHA256: 921da8a6f14f9430b3f4861d68326d904f61b922e3aedd2b35882ea97bc63111
  REFERENCE_REPORT_ID: c592807d62e9f5121acf85747432574601264160de67b15e9a1c8e48a12cc040
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  decisive-study:
    name: Exact Prob4D + complete BPT source on workstation2
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out exact frozen Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROB4D_SOURCE_REVISION }}
          path: prob4d-source
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Initialize infrastructure evidence
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-bpt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}/evidence"
          echo "EVIDENCE_ROOT=${root}/evidence" >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "prob4d_revision=${PROB4D_SOURCE_REVISION}"
            echo "bpt_revision=${BPT_SOURCE_REVISION}"
            echo "bpt_base_revision=${BPT_BASE_REVISION}"
            echo "protocol_sha256=${PROTOCOL_SHA256}"
            echo "reference_report_id=${REFERENCE_REPORT_ID}"
            uname -a
            python -VV
          } > "${root}/evidence/runtime.txt"

      - name: Verify exact Prob4D checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C prob4d-source rev-parse HEAD)" = \
            "${PROB4D_SOURCE_REVISION}"
          test -z "$(git -C prob4d-source status --porcelain=v1)"
          git -C prob4d-source fsck --no-dangling
          {
            echo "resolution=current_repository_token"
            echo "path=$(realpath prob4d-source)"
            echo "revision=$(git -C prob4d-source rev-parse HEAD)"
          } > "${EVIDENCE_ROOT}/prob4d-source-resolution.txt"

      - name: Resolve exact runner-local BayesianPhysTwin source
        id: bpt
        shell: bash
        run: |
          set -euo pipefail
          dst="${RUNNER_TEMP}/bpt-controlled-decisive-source"
          diagnostic="${EVIDENCE_ROOT}/bpt-source-resolution.txt"
          rm -rf "${dst}"
          : > "${diagnostic}"

          candidates=(
            "${HOME}/src/BayesianPhysTwin"
            "${RUNNER_WORKSPACE}/../BayesianPhysTwin/BayesianPhysTwin"
            "${RUNNER_WORKSPACE}/../bayesianphystwin/BayesianPhysTwin"
            "${RUNNER_WORKSPACE}/../BayesianPhysTwin"
            "${HOME}/BayesianPhysTwin"
          )
          while IFS= read -r gitdir; do
            candidates+=("${gitdir%/.git}")
          done < <(
            find "${RUNNER_WORKSPACE}/.." -maxdepth 5 -type d -name .git \
              -print 2>/dev/null | sort -u
          )

          for src in "${candidates[@]}"; do
            echo "candidate=${src}" >> "${diagnostic}"
            if ! git -C "${src}" rev-parse --git-dir >/dev/null 2>&1; then
              echo "candidate_status=not_a_checkout" >> "${diagnostic}"
              continue
            fi
            if ! git -C "${src}" cat-file -e \
              "${BPT_SOURCE_REVISION}^{commit}" 2>/dev/null; then
              echo "candidate_status=exact_commit_missing" >> "${diagnostic}"
              continue
            fi
            git clone --no-local --no-checkout --quiet "${src}" "${dst}"
            echo "resolution=runner_local_complete_clone" >> "${diagnostic}"
            echo "source=${src}" >> "${diagnostic}"
            break
          done

          if [[ ! -d "${dst}/.git" ]]; then
            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"
            if GIT_SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new" \
              git clone --filter=blob:none --no-checkout --quiet \
              git@github.com:IPS-Stuttgart/BayesianPhysTwin.git "${dst}"; then
              echo "resolution=runner_ssh_identity" >> "${diagnostic}"
            else
              rm -rf "${dst}"
              echo "ssh_resolution=failed" >> "${diagnostic}"
            fi
          fi

          if [[ ! -d "${dst}/.git" ]]; then
            echo "resolution=unavailable" >> "${diagnostic}"
            echo "Exact private BayesianPhysTwin source is unavailable" >&2
            exit 1
          fi

          git -C "${dst}" cat-file -e "${BPT_SOURCE_REVISION}^{commit}"
          git -C "${dst}" checkout --quiet --detach "${BPT_SOURCE_REVISION}"
          test "$(git -C "${dst}" rev-parse HEAD)" = "${BPT_SOURCE_REVISION}"
          git -C "${dst}" merge-base --is-ancestor \
            "${BPT_BASE_REVISION}" "${BPT_SOURCE_REVISION}"
          test -z "$(git -C "${dst}" status --porcelain=v1)"
          git -C "${dst}" fsck --no-dangling
          {
            echo "path=${dst}"
            echo "revision=$(git -C "${dst}" rev-parse HEAD)"
          } >> "${diagnostic}"
          echo "path=${dst}" >> "${GITHUB_OUTPUT}"

      - name: Install exact source snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/prob4d-bpt-venv"
          python -m venv "${RUNNER_TEMP}/prob4d-bpt-venv"
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/prob4d-bpt-venv" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/prob4d-bpt-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/prob4d-bpt-venv/bin/python" -m pip install \
            --upgrade pip
          "${RUNNER_TEMP}/prob4d-bpt-venv/bin/python" -m pip install \
            -e "./prob4d-source[dev]"
          "${RUNNER_TEMP}/prob4d-bpt-venv/bin/python" -m pip install \
            -e "${{ steps.bpt.outputs.path }}[dev]"
          "${RUNNER_TEMP}/prob4d-bpt-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/prob4d-bpt-venv/bin/python" -m pip freeze --all \
            > "${EVIDENCE_ROOT}/pip-freeze.txt"

      - name: Verify frozen protocol and complete implementation
        shell: bash
        env:
          BPT_PATH: ${{ steps.bpt.outputs.path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          bpt = Path(os.environ["BPT_PATH"])
          protocol_path = (
              bpt / "protocols" / "prob4d_bpt_controlled_decisive_v1.json"
          )
          protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
          actual = hashlib.sha256(
              json.dumps(
                  protocol,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          if actual != os.environ["PROTOCOL_SHA256"]:
              raise SystemExit(f"protocol changed: {actual}")
          pins = protocol["repository_pins"]
          if pins["prob4d"] != os.environ["PROB4D_SOURCE_REVISION"]:
              raise SystemExit("Prob4D protocol pin changed")
          if pins["bayesian_phystwin_base"] != os.environ["BPT_BASE_REVISION"]:
              raise SystemExit("BayesianPhysTwin protocol base changed")

          required = (
              "scripts/science/prob4d_bpt_controlled_decisive_core_v1.py",
              "scripts/science/run_prob4d_bpt_controlled_decisive_v1.py",
              "tests/test_prob4d_bpt_controlled_decisive_v1.py",
              "results/diagnostics/prob4d_bpt_controlled_decisive_v1/report.json",
              "results/diagnostics/prob4d_bpt_controlled_decisive_v1/trials.csv",
          )
          for relative in required:
              path = bpt / relative
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing complete controlled-study file: {relative}")
          for relative in required[:3]:
              compile((bpt / relative).read_bytes(), relative, "exec")

          retained = json.loads(
              (
                  bpt
                  / "results/diagnostics/prob4d_bpt_controlled_decisive_v1/report.json"
              ).read_text(encoding="utf-8")
          )
          if retained["report_id"] != os.environ["REFERENCE_REPORT_ID"]:
              raise SystemExit("retained controlled-study report identity changed")
          if retained["decision"]["overall_passed"] is not True:
              raise SystemExit("retained registered decision is not a pass")
          PY

      - name: Run focused cross-repository regressions
        shell: bash
        run: |
          set -euo pipefail
          bpt="${{ steps.bpt.outputs.path }}"
          python -m ruff check \
            "${bpt}/scripts/science/prob4d_bpt_controlled_decisive_core_v1.py" \
            "${bpt}/scripts/science/run_prob4d_bpt_controlled_decisive_v1.py" \
            "${bpt}/tests/test_prob4d_bpt_controlled_decisive_v1.py"
          python -m ruff format --check \
            "${bpt}/scripts/science/prob4d_bpt_controlled_decisive_core_v1.py" \
            "${bpt}/scripts/science/run_prob4d_bpt_controlled_decisive_v1.py" \
            "${bpt}/tests/test_prob4d_bpt_controlled_decisive_v1.py"
          python -m pytest -q \
            "${bpt}/tests/test_prob4d_bpt_controlled_decisive_v1.py"

      - name: Execute all registered controlled groups
        id: experiment
        shell: bash
        run: |
          set +e
          bpt="${{ steps.bpt.outputs.path }}"
          python \
            "${bpt}/scripts/science/run_prob4d_bpt_controlled_decisive_v1.py" \
            --protocol \
            "${bpt}/protocols/prob4d_bpt_controlled_decisive_v1.json" \
            --output-dir "${EVIDENCE_ROOT}/result" \
            --repository-revision "${BPT_SOURCE_REVISION}" \
            --prob4d-revision "${PROB4D_SOURCE_REVISION}" \
            --force 2>&1 | tee "${EVIDENCE_ROOT}/console.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "${status}" -ne 0 && "${status}" -ne 3 ]]; then
            exit "${status}"
          fi
          echo "decision_exit_code=${status}" >> "${GITHUB_OUTPUT}"

      - name: Independently verify evidence and registered decision
        shell: bash
        env:
          BPT_PATH: ${{ steps.bpt.outputs.path }}
        run: |
          set -euo pipefail
          (
            cd "${EVIDENCE_ROOT}/result"
            sha256sum --check SHA256SUMS
          )
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          result = Path(os.environ["EVIDENCE_ROOT"]) / "result"
          bpt = Path(os.environ["BPT_PATH"])
          protocol = json.loads((result / "protocol.json").read_text())
          report = json.loads((result / "report.json").read_text())
          if report["protocol_sha256"] != os.environ["PROTOCOL_SHA256"]:
              raise SystemExit("result protocol identity changed")
          if report["repository_revision"] != os.environ["BPT_SOURCE_REVISION"]:
              raise SystemExit("result BayesianPhysTwin revision changed")
          if report["prob4d_revision"] != os.environ["PROB4D_SOURCE_REVISION"]:
              raise SystemExit("result Prob4D revision changed")

          with (result / "trials.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          expected = (
              len(protocol["methods"])
              * len(protocol["scenarios"])
              * protocol["target"]["groups_per_scenario"]
          )
          if len(rows) != expected:
              raise SystemExit(
                  f"target trial row count changed: expected {expected}, got {len(rows)}"
              )

          primary = report["aggregate"][protocol["primary_method"]]
          marginal = report["aggregate"]["P1_marginal_gauge_persistent"]
          limits = protocol["acceptance_criteria"]
          worst_regression = max(
              0.0,
              max(
                  -float(value["deployed_improvement_fraction"])
                  for value in primary["by_scenario"].values()
              ),
          )
          recomputed = {
              "mean_improvement_at_least_registered": (
                  primary["deployed_improvement_fraction"]
                  >= limits["mean_improvement_fraction_at_least"]
              ),
              "paired_upper_bound_below_zero": (
                  primary["paired_deployed_minus_baseline_95_m"][1] < 0.0
              ),
              "harmful_accepted_rate_at_most_registered": (
                  primary["harmful_accepted_rate"]
                  <= limits["harmful_accepted_rate_at_most"]
              ),
              "worst_scenario_regression_at_most_registered": (
                  worst_regression
                  <= limits["worst_scenario_regression_fraction_at_most"]
              ),
              "all_rejections_exact_fallback": (
                  primary["all_rejections_exact_fallback"] is True
              ),
              "explicit_persistent_noninferior_to_marginal": (
                  primary["deployed_mean_rmse_m"]
                  <= (
                      1.0
                      + limits["explicit_vs_marginal_noninferiority_fraction"]
                  )
                  * marginal["deployed_mean_rmse_m"]
              ),
          }
          if recomputed != report["decision"]["criteria"]:
              raise SystemExit("registered decision criteria do not recompute")
          if report["decision"]["overall_passed"] != all(recomputed.values()):
              raise SystemExit("overall decision does not match registered criteria")

          expected_exit = 0 if all(recomputed.values()) else 3
          actual_exit = int(os.environ["DECISION_EXIT_CODE"])
          if actual_exit != expected_exit:
              raise SystemExit(
                  f"decision exit changed: expected {expected_exit}, got {actual_exit}"
              )

          retained_trials = (
              bpt
              / "results/diagnostics/prob4d_bpt_controlled_decisive_v1/trials.csv"
          ).read_bytes()
          if (result / "trials.csv").read_bytes() != retained_trials:
              raise SystemExit("fresh target rows differ from retained deterministic evidence")
          print(json.dumps(report["decision"], indent=2, sort_keys=True))
          PY
          test -z "$(git -C prob4d-source status --porcelain=v1)"
          test -z "$(git -C "${{ steps.bpt.outputs.path }}" status --porcelain=v1)"
          {
            echo "decision_exit_code=${{ steps.experiment.outputs.decision_exit_code }}"
            echo "prob4d_revision=${PROB4D_SOURCE_REVISION}"
            echo "bpt_revision=${BPT_SOURCE_REVISION}"
          } > "${EVIDENCE_ROOT}/execution.txt"
          (
            cd "${EVIDENCE_ROOT}"
            sha256sum \
              runtime.txt \
              prob4d-source-resolution.txt \
              bpt-source-resolution.txt \
              execution.txt \
              console.log > INFRASTRUCTURE_SHA256SUMS
            sha256sum --check INFRASTRUCTURE_SHA256SUMS
          )
        env:
          DECISION_EXIT_CODE: ${{ steps.experiment.outputs.decision_exit_code }}

      - name: Publish scientific summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${EVIDENCE_ROOT}/result/summary.md" ]]; then
            cat "${EVIDENCE_ROOT}/result/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo
            echo "Decision exit code: ${{ steps.experiment.outputs.decision_exit_code }}"
            echo
            echo "Prob4D revision: \`${PROB4D_SOURCE_REVISION}\`"
            echo "BayesianPhysTwin revision: \`${BPT_SOURCE_REVISION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-bpt-controlled-decisive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
