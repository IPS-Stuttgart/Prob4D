name: Finalize cross-provider replay hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/patch-cross-provider-replay-final.yml"

permissions:
  contents: write

concurrency:
  group: patch-cross-provider-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Execute the reviewed replay transform with disjoint result types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              ".github/workflows/patch-cross-provider-replay-v3.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          /usr/bin/python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate and publish exact source"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit("embedded replay transform boundaries changed")
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          source = dedent(payload)
          replacements = {
              "replayed = fit_cross_provider_calibration(": (
                  "replayed_calibration = fit_cross_provider_calibration("
              ),
              "if replayed.to_record() != calibration.to_record():": (
                  "if replayed_calibration.to_record() != calibration.to_record():"
              ),
              "replayed = apply_cross_provider_calibration(calibration, panel)": (
                  "replayed_decision = apply_cross_provider_calibration("
                  "calibration, panel)"
              ),
              "if replayed.to_record() != decision.to_record():": (
                  "if replayed_decision.to_record() != decision.to_record():"
              ),
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"embedded replay transform changed: {old}")
              source = source.replace(old, new, 1)
          exec(compile(source, "<cross-provider-replay-transform>", "exec"), {})
          PY

      - name: Validate and publish exact source
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-cross-provider-replay-final-venv"
          python -m venv --clear "$environment"
          echo "$environment/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3" "ruff==0.16.1"
          files=(
            src/prob4d/cross_provider_guard.py
            tests/test_cross_provider_guard.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- src/prob4d/cli.py "${files[@]}"
          python -m ruff format --check --diff -- src/prob4d/cli.py "${files[@]}"
          python -m mypy --python-version 3.12 src/prob4d/cross_provider_guard.py
          python -m pytest -q \
            tests/test_cross_provider_guard.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_vggt_provider_adapter.py \
            tests/test_finite_sample_threshold.py
          python -m compileall -q src/prob4d
          python -m pip check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git commit -m "Require deterministic cross-provider artifact replay"
          git push origin HEAD:agent/cross-provider-guard-v1
