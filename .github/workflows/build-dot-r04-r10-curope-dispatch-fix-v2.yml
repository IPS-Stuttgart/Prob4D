name: Build DOT R04-R10 cuRoPE dispatch fix v2

on:
  push:
    branches: [fix/dot-r04-r10-pytorch211-curope-dispatch]
    paths:
      - ".github/workflows/build-dot-r04-r10-curope-dispatch-fix-v2.yml"

permissions:
  contents: write

jobs:
  build:
    name: Reapply validated transformation and commit it
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-pytorch211-curope-dispatch
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Execute the exact previously validated transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/build-dot-r04-r10-curope-dispatch-fix.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format and validate focused repair"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit("validated transformation block changed")
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = block.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("validated transformation indentation changed")
          source = "\n".join(
              line[10:] if line else ""
              for line in lines
          ) + "\n"
          namespace = {"__name__": "__main__"}
          exec(compile(source, "validated-curope-transformation", "exec"), namespace)
          EXTRACT

      - name: Revalidate and commit only the scientific repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            scripts/science/prepare_cut3r_runtime.py \
            tests/test_prepare_cut3r_runtime.py
          python -m ruff check \
            scripts/science/prepare_cut3r_runtime.py \
            tests/test_prepare_cut3r_runtime.py
          python -m pytest -q \
            tests/test_prepare_cut3r_runtime.py \
            tests/test_dot_rope_cut3r_heldout_confirmation_workflow.py \
            tests/test_github_action_pins.py
          python -m compileall -q scripts/science/prepare_cut3r_runtime.py
          git diff --check

          scientific=(
            CHANGELOG.d/dot-r04-r10-pytorch211-curope-dispatch.md
            scripts/science/prepare_cut3r_runtime.py
            tests/test_prepare_cut3r_runtime.py
          )
          for path in "${scientific[@]}"; do
            test -e "$path"
          done
          git add -- "${scientific[@]}"
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix CUT3R native RoPE dispatch for PyTorch 2.11"
          git push origin HEAD:fix/dot-r04-r10-pytorch211-curope-dispatch
