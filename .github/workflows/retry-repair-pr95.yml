name: Retry repair PR 95

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/retry-repair-pr95.yml]

permissions:
  contents: write

concurrency:
  group: repair-pr95
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/material-identity-hypothesis-stream'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/material-identity-hypothesis-stream
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Configure repair identity and refresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Execute reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/hosted-repair-pr95.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '          PY\n      - name: Validate focused contract'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, str(workflow_path), 'exec'))
          PY
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py
          python -m mypy src/prob4d/material_identity_stream.py
          python -m pytest -q \
            tests/test_material_identity_stream.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Publish ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/material-identity-stream.md \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py
          git diff --cached --check
          git commit -m 'Harden material-identity provenance and validation'
          git push origin HEAD:agent/material-identity-hypothesis-stream
