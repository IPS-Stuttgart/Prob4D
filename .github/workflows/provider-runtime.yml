name: Provider-neutral executable runtime

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/provider-runtime.yml"
      - "docs/provider-neutral-runtime.md"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/prediction_cli.py"
      - "src/prob4d/provider_runtime.py"
      - "tests/test_cli.py"
      - "tests/test_provider_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Causal loading, coordinate dispatch, and conservative fusion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-provider-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"
          echo "PROVIDER_RUNTIME_EVIDENCE=${root}" >> "${GITHUB_ENV}"

      - name: Install lightweight development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "numpy>=1.24,<2.3"
          python -m pip check

      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_runtime.py \
            tests/test_cli.py \
            tests/test_provider_runtime.py
          python -m ruff format --check \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_runtime.py \
            tests/test_cli.py \
            tests/test_provider_runtime.py
          python -m mypy \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_runtime.py

      - name: Run runtime and adjacent regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_provider_runtime.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_vggt_provider_adapter.py \
            tests/test_fusion.py \
            tests/test_io.py \
            tests/test_cli.py \
            | tee "${PROVIDER_RUNTIME_EVIDENCE}/pytest.txt"
          python -m compileall -q src/prob4d

      - name: Smoke-test installed runtime command
        run: |
          prob4d prediction runtime --help
          python -c "import prob4d.provider_runtime"

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            python -m pip --version
            python -m pip freeze --all
          } > "${PROVIDER_RUNTIME_EVIDENCE}/environment.txt"

      - name: Verify clean repository state
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROVIDER_RUNTIME_EVIDENCE }}/environment.txt
            ${{ env.PROVIDER_RUNTIME_EVIDENCE }}/pytest.txt
          if-no-files-found: warn
          retention-days: 30
