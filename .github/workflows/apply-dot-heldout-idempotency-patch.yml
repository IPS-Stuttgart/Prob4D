name: Apply DOT held-out recovery idempotency patch

on:
  push:
    branches:
      - fix/dot-r04-r10-recovery-idempotent-v1
    paths:
      - ".github/workflows/apply-dot-heldout-idempotency-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-recovery-idempotent-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply bounded workflow and regression-test changes
        shell: bash
        env:
          REPLACEMENT_B64: 
          TEST_OLD_B64: ICAgIGFzc2VydCAib2xkIGNvbmZpcm1hdGlvbiBwcm92aWRlciBtYXkgaGF2ZSBzdGFydGVkOyByZWNvdmVyeSBpcyBmb3JiaWRkZW4iIGluIHRleHQK
          TEST_NEW_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          workflow = Path(
              ".github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml"
          )
          text = workflow.read_text(encoding="utf-8")
          start_marker = '          run = request(f"/actions/runs/{run_id}")\n'
          end_marker = "          PY\n\n  provider:"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode(
              __import__("os").environ["REPLACEMENT_B64"]
          ).decode("utf-8")
          workflow.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path(
              "tests/test_dot_rope_cut3r_heldout_confirmation_workflow.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          old = base64.b64decode(
              __import__("os").environ["TEST_OLD_B64"]
          ).decode("utf-8")
          new = base64.b64decode(
              __import__("os").environ["TEST_NEW_B64"]
          ).decode("utf-8")
          if tests.count(old) != 1:
              raise SystemExit("workflow-test insertion anchor changed")
          test_path.write_text(
              tests.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )

          Path(
              ".github/workflows/apply-dot-heldout-idempotency-patch.yml"
          ).unlink()
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make held-out predecessor proof idempotent across reruns"
          git push origin HEAD:fix/dot-r04-r10-recovery-idempotent-v1
