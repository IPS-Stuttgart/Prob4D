name: DEFORM DLO4/DLO5 evidence contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform-dlo45-*.yml"
      - "scripts/science/*deform_dlo45*.py"
      - "protocols/execution_requests/deform_dlo45_*.json"
      - "evidence/deform-dlo45-query-observability-heldout-v1/**"
      - "docs/deform-dlo45-query-observability-heldout-v1.md"
      - "tests/test_deform_dlo45_query_observability_evidence.py"
      - "src/prob4d/observable_gauge.py"
      - "src/prob4d/query_observability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-evidence-contract-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  contract:
    name: Validate immutable evidence without reopening evaluation data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"

      - name: Check evidence implementation formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/audit_deform_dlo45_local_segments_official_v2.py
            scripts/science/audit_deform_dlo45_local_segments_v2.py
            scripts/science/audit_deform_dlo45_observability_official_mirror_v1.py
            scripts/science/audit_deform_dlo45_observability_v1.py
            scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py
            scripts/science/calibrate_deform_dlo45_query_gate_v1.py
            scripts/science/evaluate_deform_dlo45_query_observability_official_v1.py
            scripts/science/evaluate_deform_dlo45_query_observability_v1.py
            tests/test_deform_dlo45_query_observability_evidence.py
          )
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m compileall -q \
            scripts/science/audit_deform_dlo45_local_segments_official_v2.py \
            scripts/science/audit_deform_dlo45_local_segments_v2.py \
            scripts/science/audit_deform_dlo45_observability_official_mirror_v1.py \
            scripts/science/audit_deform_dlo45_observability_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_v1.py \
            scripts/science/evaluate_deform_dlo45_query_observability_official_v1.py \
            scripts/science/evaluate_deform_dlo45_query_observability_v1.py

      - name: Run evidence, mechanism, and workflow-policy regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_deform_dlo45_query_observability_evidence.py \
            tests/test_query_observability.py \
            tests/test_observable_gauge.py \
            tests/test_axial_query_certificate.py \
            tests/test_axial_query_certificate_integration.py \
            tests/test_github_action_pins.py \
            tests/test_trusted_self_hosted_validation_policy.py
