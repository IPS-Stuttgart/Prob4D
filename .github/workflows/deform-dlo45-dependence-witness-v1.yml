name: DEFORM DLO4/DLO5 dependence witness v1

on:
  push:
    branches: [science/information-contract-falsification-witness-v1]
    paths:
      - "benchmarks/information_contract_v1/requests/deform_dlo45_dependence_witness_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-dependence-witness-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFORM_REPOSITORY: roahmlab/DEFORM
  DEFORM_COMMIT: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  ADAPTER_PROTOCOL: benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.json
  EVALUATOR: benchmarks/information_contract_v1/adapters/deform_dlo45_dependence_witness_v1.py
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source:
    name: Select and seal source-only dependence witness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact evaluator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Check out pinned source-only DEFORM trajectories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/train
            data_set/DLO5/train
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and validate focused evaluator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            "${EVALUATOR}" \
            tests/test_deform_dlo45_dependence_witness_v1.py
          python -m pytest -q \
            tests/test_information_contract_witness.py \
            tests/test_deform_dlo45_dependence_witness_v1.py

      - name: Freeze the dependence-sensitive source query
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          test ! -e upstream-DEFORM/data_set/DLO4/eval
          test ! -e upstream-DEFORM/data_set/DLO5/eval
          out="${RUNNER_TEMP}/deform-dependence-source"
          python "${EVALUATOR}" source \
            --protocol "${ADAPTER_PROTOCOL}" \
            --dataset-root "${GITHUB_WORKSPACE}/upstream-DEFORM/data_set" \
            --output-root "${out}"
          OUT="${out}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUT"])
          receipt = json.loads((root / "source_receipt.json").read_text())
          witness = json.loads((root / "witness.json").read_text())
          assert receipt["source_fit_trajectory_count"] == 80
          assert receipt["source_witness_trajectory_count"] == 32
          assert receipt["source_case_count"] == 608
          assert receipt["held_trajectory_count_opened"] == 0
          assert len(receipt["summary_components"]) == 4
          assert len(witness["query_vector"]) == 12
          assert witness["held_outcomes_opened_during_selection"] is False
          PY

      - name: Upload frozen source witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-dependence-source-${{ github.run_id }}
          path: ${{ runner.temp }}/deform-dependence-source/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  held:
    name: Evaluate frozen dependence witness on held trajectories
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact evaluator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Check out pinned held-only DEFORM trajectories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/eval
            data_set/DLO5/eval
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NumPy-only evaluator
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Download exact source witness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: deform-dlo45-dependence-source-${{ github.run_id }}
          path: ${{ runner.temp }}/deform-dependence-source

      - name: Open held outcomes once and score the frozen query
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          test ! -e upstream-DEFORM/data_set/DLO4/train
          test ! -e upstream-DEFORM/data_set/DLO5/train
          out="${RUNNER_TEMP}/deform-dependence-held"
          python "${EVALUATOR}" held \
            --protocol "${ADAPTER_PROTOCOL}" \
            --dataset-root "${GITHUB_WORKSPACE}/upstream-DEFORM/data_set" \
            --source-root "${RUNNER_TEMP}/deform-dependence-source" \
            --output-root "${out}"
          OUT="${out}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["OUT"]) / "comparison.json").read_text()
          )
          assert result["held_case_count"] == 532
          assert result["held_independent_trajectory_count"] == 28
          assert result["same_residuals_across_covariance_submissions"] is True
          assert result["target_query_reselection"] is False
          assert len(result["query_vector"]) == 12
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload complete retrospective dependence result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-dependence-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deform-dependence-source/source_manifest.json
            ${{ runner.temp }}/deform-dependence-source/source_payload.npz
            ${{ runner.temp }}/deform-dependence-source/source_receipt.json
            ${{ runner.temp }}/deform-dependence-source/witness.json
            ${{ runner.temp }}/deform-dependence-held/held_manifest.json
            ${{ runner.temp }}/deform-dependence-held/result.json
            ${{ runner.temp }}/deform-dependence-held/comparison.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
