name: Finalize open Prob4D improvements

on:
  push:
    branches: [ci/self-hosted-finalize-improvements]
  pull_request:
    branches: [ci/finalizer-base]
    paths:
      - ".github/workflows/finalize-open-improvements.yml"
      - "scripts/ci/finalize_open_improvements.py"

permissions:
  contents: write

concurrency:
  group: finalize-open-prob4d-improvements
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    name: Validate and publish focused branches
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'ci/self-hosted-finalize-improvements')
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 90
    steps:
      - name: Check out finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/self-hosted-finalize-improvements
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Finalize all focused branches
        run: python scripts/ci/finalize_open_improvements.py
