name: Temporary repair DLO45 code only

on:
  push:
    branches: [science/deform-dlo45-source-calibrated-covariance-v1]
    paths:
      - ".github/workflows/temporary-repair-dlo45-code-only.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-source-calibrated-covariance-v1
          fetch-depth: 0
      - name: Add tested helper and align the focused workflow test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path(
              "scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py"
          )
          script = script_path.read_text(encoding="utf-8")
          marker = "\n\ndef load_json(path: Path) -> dict[str, Any]:\n"
          helper = '''

          def mahalanobis(error: np.ndarray, covariance: np.ndarray) -> float:
              """Return the squared Mahalanobis distance for a positive covariance."""

              vector = np.asarray(error, dtype=np.float64)
              matrix = np.asarray(covariance, dtype=np.float64)
              return float(vector @ np.linalg.solve(matrix, vector))


          def load_json(path: Path) -> dict[str, Any]:
          '''
          if "def mahalanobis(" not in script:
              if marker not in script:
                  raise SystemExit("script insertion point changed")
              script_path.write_text(script.replace(marker, "\n" + helper, 1), encoding="utf-8")

          test_path = Path("tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py")
          test = test_path.read_text(encoding="utf-8")
          for line in (
              '    assert "new_data_collection_authorized" in text\n',
              '    assert "source_calibration_authorized" in text\n',
              '    assert "existing_eval_reanalysis_authorized" in text\n',
          ):
              test = test.replace(line, "")
          test_path.write_text(test, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check 'ruff==0.16.5' 'pytest==9.1.1' 'numpy==2.5.2'
          python -m ruff check --fix \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m ruff format \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          PYTHONPATH=src:scripts/science python -m pytest -q \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m py_compile \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          git commit -m 'Repair source-calibrated DLO covariance tests'
          git push origin HEAD:science/deform-dlo45-source-calibrated-covariance-v1
