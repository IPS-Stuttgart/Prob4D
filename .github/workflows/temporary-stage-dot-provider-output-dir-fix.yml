name: Temporary stage DOT provider output-dir fix

on:
  push:
    branches: [fix/dot-r04-r10-provider-output-dir-v1]
    paths:
      - ".github/workflows/temporary-stage-dot-provider-output-dir-fix.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-provider-output-dir-v1
          persist-credentials: true
          clean: true
      - name: Stage exact workflow fix as ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          source=.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          target=tmp/patched-dot-rope-cut3r-heldout-confirmation-v1.yml
          cp "$source" "$target"
          TARGET="$target" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text(encoding='utf-8')
          old = '''          /usr/bin/mkdir -p \\\n            "$root/home" \\\n            "$root/cache" \\\n            "$root/tmp" \\\n            "$root/evidence" \\\n            "$root/provider"\n'''
          new = '''          /usr/bin/mkdir -p \\\n            "$root/home" \\\n            "$root/cache" \\\n            "$root/tmp" \\\n            "$root/evidence"\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one premature provider-directory creation')
          patched = text.replace(old, new)
          if 'output.mkdir(parents=True, exist_ok=False)' in patched:
              raise SystemExit('provider implementation unexpectedly embedded in workflow')
          path.write_text(patched, encoding='utf-8')
          PY
          diff -u "$source" "$target" || test $? -eq 1
          git diff --no-index --check "$source" "$target" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Stage DOT provider output-dir workflow fix'
          git push origin HEAD:fix/dot-r04-r10-provider-output-dir-v1
