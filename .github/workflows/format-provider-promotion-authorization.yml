name: Repair provider promotion authorization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-provider-promotion-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.head_ref == 'agent/bind-support-feasibility-promotion-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bind-support-feasibility-promotion-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Repair CLI path boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/provider_promotion_authorization.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "load_promotion_lock(parsed.promotion_lock)",
                  "load_promotion_lock(Path(parsed.promotion_lock))",
              ),
              (
                  "load_provider_support_feasibility(parsed.support_feasibility)",
                  "load_provider_support_feasibility(Path(parsed.support_feasibility))",
              ),
              (
                  "load_provider_promotion_authorization(parsed.artifact)",
                  "load_provider_promotion_authorization(Path(parsed.artifact))",
              ),
              (
                  "load_provider_promotion_authorization(parsed.authorization)",
                  "load_provider_promotion_authorization(Path(parsed.authorization))",
              ),
              (
                  "load_heldout_provider_evidence(parsed.evidence)",
                  "load_heldout_provider_evidence(Path(parsed.evidence))",
              ),
          )
          changed = False
          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed = True
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f"unexpected marker counts for {old!r}: "
                      f"old={old_count}, new={new_count}"
                  )
          if changed:
              path.write_text(text, encoding="utf-8")
          PY
      - name: Validate focused repair
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            src/prob4d/provider_promotion_authorization.py \
            tests/test_provider_promotion_authorization.py
          python -m ruff format \
            src/prob4d/provider_promotion_authorization.py \
            tests/test_provider_promotion_authorization.py
          python -m ruff check \
            src/prob4d/provider_promotion_authorization.py \
            tests/test_provider_promotion_authorization.py
          python -m ruff format --check \
            src/prob4d/provider_promotion_authorization.py \
            tests/test_provider_promotion_authorization.py
          python -m pytest -q tests/test_provider_promotion_authorization.py
          git diff --check
      - name: Publish repaired implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/provider_promotion_authorization.py \
            tests/test_provider_promotion_authorization.py
          if git diff --cached --quiet; then
            echo "Implementation is already repaired."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Repair provider promotion CLI path handling"
          git push origin HEAD:agent/bind-support-feasibility-promotion-v2
