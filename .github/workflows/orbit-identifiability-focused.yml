name: Robust orbit-identifiability focused checks

on:
  pull_request:
    paths:
      - ".github/workflows/orbit-identifiability-focused.yml"
      - "src/prob4d/orbit_identifiability.py"
      - "docs/estimated-orbit-query-identifiability.md"
      - "protocols/tracking-cloth-finite-orbit-robustness-v1.json"
      - "scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py"
      - "tests/test_orbit_identifiability.py"
      - "tests/test_tracking_cloth_finite_orbit_robustness_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install focused tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" "pytest==8.4.2" "ruff==0.12.12" "mypy==1.17.1"
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
      - name: Verify formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/prob4d/orbit_identifiability.py \
            scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            tests/test_orbit_identifiability.py \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py
          python -m ruff format --check \
            src/prob4d/orbit_identifiability.py \
            scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            tests/test_orbit_identifiability.py \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py
      - name: Type-check reusable certificate
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy src/prob4d/orbit_identifiability.py
      - name: Run theorem, parser, and numerical controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            validate-protocol \
            --protocol protocols/tracking-cloth-finite-orbit-robustness-v1.json
          python scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            self-test \
            --protocol protocols/tracking-cloth-finite-orbit-robustness-v1.json
          python -m pytest -q \
            tests/test_orbit_identifiability.py \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py
