name: Temporary fix information-contract nested case paths

on:
  push:
    branches: [science/information-contract-benchmark-sealed-v1]
    paths:
      - "tools/requests/fix_information_contract_nested_case_path.json"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Patch nested payload reference and add regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/prob4d/information_contract_sealed.py")
          text = source.read_text(encoding="utf-8")
          old = '                    "payload": merged_payload.name,\n'
          new = (
              '                    "payload": merged_payload.relative_to(temporary_root)' 
              '.as_posix(),\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one merged-payload basename reference, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_information_contract_sealed.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_hierarchical_case_ids_resolve_joined_payloads"
          if marker in test_text:
              raise SystemExit("nested-case regression already exists")
          addition = r'''


def test_hierarchical_case_ids_resolve_joined_payloads(tmp_path: Path) -> None:
    challenge, submission = generate_sealed_smoke(tmp_path / "sealed")
    for manifest_path in (challenge, submission):
        manifest = _load(manifest_path)
        for case in manifest["cases"]:
            case["case_id"] = f"dataset/sequence/{case['case_id']}"
        _write(manifest_path, manifest)

    result = evaluate_sealed_information_contract(challenge, submission)

    assert result["aggregate"]["contract"]["all_cases_pass"] is True
    assert all(
        case["case_id"].startswith("dataset/sequence/")
        for case in result["cases"]
    )
'''
          tests.write_text(test_text + addition, encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.5" "pytest==9.1.1" "numpy==2.2.6"
          python -m pip install --no-deps -e .
          python -m ruff check --fix \
            src/prob4d/information_contract_sealed.py \
            tests/test_information_contract_sealed.py
          python -m ruff check \
            src/prob4d/information_contract_sealed.py \
            tests/test_information_contract_sealed.py
          python -m pytest -q tests/test_information_contract_sealed.py
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            src/prob4d/information_contract_sealed.py
            tests/test_information_contract_sealed.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
      - name: Commit only the reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/information_contract_sealed.py \
            tests/test_information_contract_sealed.py
          git commit -m "Fix sealed benchmark hierarchical case joins"
          git push origin "HEAD:${GITHUB_REF_NAME}"
