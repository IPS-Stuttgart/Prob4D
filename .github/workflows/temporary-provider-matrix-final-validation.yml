name: Temporary provider matrix final validation

on:
  push:
    branches: [agent/provider-adapter-readiness-matrix]
    paths:
      - ".github/workflows/temporary-provider-matrix-final-validation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-provider-matrix-final-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/provider-adapter-readiness-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact provider-matrix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-adapter-readiness-matrix
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Validate focused source quality
        run: |
          python -m ruff check \
            src/prob4d/adapter \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py
          python -m ruff format --check \
            src/prob4d/adapter \
            src/prob4d/prediction_cli.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py
          python -m mypy \
            src/prob4d/adapter/v1.py \
            src/prob4d/provider_adapter.py \
            src/prob4d/provider_adapter_conformance.py \
            src/prob4d/_provider_readiness_matrix_core.py \
            src/prob4d/provider_readiness_matrix.py
      - name: Run focused regressions and command smoke tests
        run: |
          python -m pytest -q \
            tests/test_prediction_extension_cli.py \
            tests/test_provider_adapter.py \
            tests/test_provider_adapter_conformance.py \
            tests/test_provider_readiness_matrix.py \
            tests/test_cli.py
          prob4d prediction adapter-conformance --help
          prob4d prediction readiness-matrix --help
      - name: Run repository-wide lint and tests
        run: |
          python -m ruff check src tests scripts/ci
          python -m pytest -q
      - name: Remove this temporary gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-provider-matrix-final-validation.yml
          git commit -m "Record successful provider matrix validation"
          git push origin HEAD:agent/provider-adapter-readiness-matrix
      - name: Mark PR 234 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 234 --repo IPS-Stuttgart/Prob4D
