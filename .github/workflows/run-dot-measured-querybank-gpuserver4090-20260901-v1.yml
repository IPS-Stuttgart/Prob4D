name: Run local DOT measured query bank 20260901 v1

on:
  push:
    branches:
      - run/dot-measured-querybank-gpuserver4090-20260901-v1
    paths:
      - protocols/execution_requests/dot-measured-querybank-gpuserver4090-20260901-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: dot-measured-querybank-gpuserver4090-20260901-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/dot
  ARCHIVE_PATH: /mnt/seagate10tb/florianpfaff/datasets/dot/R01-10.zip
  ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
  REQUEST_PATH: protocols/execution_requests/dot-measured-querybank-gpuserver4090-20260901-v1.json
  PROTOCOL_PATH: protocols/dot-rope-cut3r-measured-querybank-v1.json
  PROVIDER_RUN_ID: "33329701704"
  PROVIDER_ARTIFACT_NAME: dot-rope-cut3r-sealed-provider-33329701704-1
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Validate local-DOT source-only request and query-bank capsule
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out request revision with parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Require one newly added frozen request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          expected = {
              "schema": "prob4d.dot-measured-querybank-local-request.v1",
              "schema_version": 1,
              "request_id": "dot-measured-querybank-gpuserver4090-20260901-v1",
              "runner_label": "gpuserver4090",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/dot",
              "archive": "R01-10.zip",
              "source_sequences": ["R01", "R02", "R03"],
              "reserved_sequences": "R04-R70",
              "provider_run_id": 33329701704,
              "target_payloads_authorized": False,
              "heldout_transfer_claimed": False,
              "paper_claim_authorized": False,
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit(
                  "request differs from the frozen local-DOT contract:\n"
                  + json.dumps({"actual": request, "expected": expected}, indent=2)
              )
          PY

      - name: Install and validate measured query-bank implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            scripts/science/run_dot_rope_cut3r_measured_querybank_v1.py \
            tests/test_dot_rope_cut3r_measured_querybank_v1.py
          python -m pytest -q \
            tests/test_posterior_preserving_compression.py \
            tests/test_dot_rope_cut3r_measured_querybank_v1.py \
            tests/test_github_action_pins.py
          python -m compileall -q scripts/science/run_dot_rope_cut3r_measured_querybank_v1.py

  evaluate:
    name: Reproduce source-bound measured DOT query bank / gpuserver4090
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    steps:
      - name: Initialize isolated workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/dot-measured-querybank-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${root}"
          mkdir -p "${root}/provider" "${root}/evidence"
          echo "root=${root}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Bind and verify the local complete DOT source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test -f "${ARCHIVE_PATH}"
          test ! -L "${ARCHIVE_PATH}"
          printf '%s  %s\n' "${ARCHIVE_MD5}" "${ARCHIVE_PATH}" | md5sum --check --strict
          identity="$(stat -c '%s:%Y:%Z' "${ARCHIVE_PATH}")"
          echo "DOT_ARCHIVE_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          protocol = json.loads(Path(os.environ["PROTOCOL_PATH"]).read_text())
          if request["source_sequences"] != protocol["source_sequences"]:
              raise SystemExit("request and protocol source rosters differ")
          if request["reserved_sequences"] != protocol["reserved_sequences"]:
              raise SystemExit("request and protocol reserved rosters differ")
          if protocol["claim_boundary"]["r04_r70_opened"] is not False:
              raise SystemExit("protocol opened reserved DOT sequences")
          print(json.dumps({
              "archive": os.environ["ARCHIVE_PATH"],
              "source_sequences": request["source_sequences"],
              "reserved_sequences_not_opened": request["reserved_sequences"],
          }, indent=2, sort_keys=True))
          PY

      - name: Install pinned numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5"
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Download immutable source-provider artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PROVIDER_ARTIFACT_NAME }}
          path: ${{ steps.workspace.outputs.root }}/provider
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROVIDER_RUN_ID }}

      - name: Run the source-bound measured query-bank reproduction
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          set +e
          PYTHONPATH=src python \
            scripts/science/run_dot_rope_cut3r_measured_querybank_v1.py \
              --dataset-root "${DATASET_ROOT}" \
              --provider-bundle "${root}/provider/bundle" \
              --protocol "${PROTOCOL_PATH}" \
              --output-dir "${root}/evidence/result" \
              --source-revision "${GITHUB_SHA}" \
              > "${root}/stdout.txt" 2> "${root}/stderr.txt"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${root}/process-exit-code.txt"
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Verify read-only archive identity and remove provider payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s:%Y:%Z' "${ARCHIVE_PATH}")" = "${DOT_ARCHIVE_IDENTITY}"
          root="${{ steps.workspace.outputs.root }}"
          rm -rf -- "${root}/provider"
          if find "${root}/evidence" -type f \( \
            -iname '*.npz' -o -iname '*.zip' -o -iname '*.jpg' -o -iname '*.png' \
          \) -print -quit | grep -q .; then
            echo "Raw provider or DOT payload appeared in evidence" >&2
            exit 3
          fi

      - name: Upload compact source-bound DOT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dot-measured-querybank-gpuserver4090-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          summary="${{ steps.workspace.outputs.root }}/evidence/result/summary.md"
          if test -f "${summary}"; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          elif test -f "${{ steps.workspace.outputs.root }}/stderr.txt"; then
            printf '```text\n' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 100 "${{ steps.workspace.outputs.root }}/stderr.txt" >> "${GITHUB_STEP_SUMMARY}"
            printf '\n```\n' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Enforce completed exact source-only experiment
        shell: bash
        env:
          PROCESS_EXIT: ${{ steps.experiment.outputs.exit_code }}
          RESULT_PATH: ${{ steps.workspace.outputs.root }}/evidence/result/result.json
        run: |
          set -euo pipefail
          test "${PROCESS_EXIT}" = "0"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text())
          assert result["status"] == "evaluated-measured-dot-cut3r-querybank"
          assert result["information_boundary"]["provider_inference_rerun"] is False
          assert result["information_boundary"]["reserved_sequences"] == "R04-R70"
          assert result["information_boundary"]["target_payloads_opened"] is False
          aggregate = result["aggregate"]
          assert aggregate["sequence_count"] == 3
          assert aggregate["bank_evaluation_count"] == 12
          assert aggregate["maximum_relative_gain_error"] <= 1e-7
          assert aggregate["maximum_relative_posterior_covariance_error"] <= 1e-7
          assert aggregate["all_posteriors_valid"] is True
          print(json.dumps(aggregate, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Remove isolated workspace
        if: always()
        shell: bash
        run: rm -rf -- "${{ steps.workspace.outputs.root }}"
