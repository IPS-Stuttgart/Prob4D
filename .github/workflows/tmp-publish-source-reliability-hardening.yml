name: Temporary source-reliability hardening publisher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/harden-source-reliability-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATCH_GZIP_BASE64: ""
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply hardening patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          patch = gzip.decompress(base64.b64decode(os.environ["PATCH_GZIP_BASE64"]))
          Path("/tmp/source-reliability-hardening.patch").write_bytes(patch)
          PY
          git apply --index --whitespace=error-all /tmp/source-reliability-hardening.patch
      - name: Verify focused quality
        run: |
          python -m ruff format src/prob4d/source_reliability.py tests/test_source_reliability.py
          python -m ruff check src/prob4d/source_reliability.py tests/test_source_reliability.py
          python -m ruff format --check src/prob4d/source_reliability.py tests/test_source_reliability.py
          python -m mypy src/prob4d/source_reliability.py
          python -m pytest -q tests/test_source_reliability.py
      - name: Publish clean hardening commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prob4d/source_reliability.py tests/test_source_reliability.py CHANGELOG.md
          git rm .github/workflows/tmp-publish-source-reliability-hardening.yml
          git commit -m "Harden source-reliability artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
