name: Apply gauge covariance contracts

on:
  push:
    branches: [agent/harden-gauge-covariance-contracts]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-gauge-covariance-contracts
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/harden-gauge-covariance-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply the reviewed gauge-contract patch
        run: python .github/agent-staging/apply_gauge_covariance_contracts.py
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests 2>&1 | tee ruff-output.txt
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: gauge-covariance-contracts-ruff
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail on Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Type-check stable provider interfaces
        run: >-
          python -m mypy
          src/prob4d/cli.py
          src/prob4d/provider_manifest.py
          src/prob4d/provider_manifest_cli.py
          src/prob4d/provider_v1.py
      - name: Run focused covariance tests
        run: >-
          python -m pytest
          tests/test_gauge_covariance_contracts.py
          tests/test_gauge.py
          tests/test_covariance_validation.py
          --tb=short
      - name: Run complete suite
        run: python -m pytest --tb=short
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Publish the validated implementation and remove staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -r .github/agent-staging .github/workflows/agent-apply-gauge-covariance-contracts.yml
          git commit -m "Harden gauge covariance contracts"
          git push origin HEAD:agent/harden-gauge-covariance-contracts
