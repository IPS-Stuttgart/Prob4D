name: Portable sparse gauge-tree prior artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gauge-tree-prior-artifact.yml"
      - "docs/command-line.md"
      - "docs/gauge-tree-prior-artifact.md"
      - "docs/sparse-gauge-tree-prior.md"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/__init__.py"
      - "src/prob4d/_gauge_tree_artifact_*.py"
      - "src/prob4d/command_registry.py"
      - "src/prob4d/gauge_tree_prior.py"
      - "src/prob4d/gauge_tree_prior_artifact.py"
      - "src/prob4d/gauge_tree_prior_io.py"
      - "tests/test_cli.py"
      - "tests/test_command_registry.py"
      - "tests/test_gauge_tree_prior_artifact.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauge-tree-prior-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lightweight development environment
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]" "numpy>=1.24,<2.3"
          python -m pip check

      - name: Validate source and contracts
        run: |
          set -euo pipefail
          files=(
            src/prob4d/__init__.py
            src/prob4d/_gauge_tree_artifact_common.py
            src/prob4d/_gauge_tree_artifact_io.py
            src/prob4d/command_registry.py
            src/prob4d/gauge_tree_prior.py
            src/prob4d/gauge_tree_prior_artifact.py
            src/prob4d/gauge_tree_prior_io.py
            tests/test_cli.py
            tests/test_command_registry.py
            tests/test_gauge_tree_prior_artifact.py
          )
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/prob4d/__init__.py \
            src/prob4d/_gauge_tree_artifact_common.py \
            src/prob4d/_gauge_tree_artifact_io.py \
            src/prob4d/command_registry.py \
            src/prob4d/gauge_tree_prior.py \
            src/prob4d/gauge_tree_prior_artifact.py \
            src/prob4d/gauge_tree_prior_io.py
          python -m pytest -q \
            tests/test_gauge_tree_prior_artifact.py \
            tests/test_gauge_tree_contract.py \
            tests/test_gauge_tree_observation.py \
            tests/test_gauge_tree_prior.py \
            tests/test_sparse_observation_factors.py \
            tests/test_cli.py \
            tests/test_command_registry.py
          python -m compileall -q src/prob4d tests
          python -m prob4d.gauge_tree_prior_artifact --help
          prob4d gauge prior --help

      - name: Build and inspect distributions
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build
          python -m twine check dist/*
          python scripts/ci/check_sdist.py dist/*.tar.gz
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          from prob4d.gauge_tree_prior_io import (
              gauge_tree_prior_artifact_id,
              load_gauge_tree_prior,
              write_gauge_tree_prior,
          )

          assert callable(load_gauge_tree_prior)
          assert callable(write_gauge_tree_prior)
          assert callable(gauge_tree_prior_artifact_id)
          PY
          python -m prob4d.gauge_tree_prior_artifact --help
          prob4d gauge prior --help
