name: Apply stable-interface type fixes

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-stable-interface-type-fixes.yml"
      - ".github/patches/fail-closed-type-fixes.patch.gz.b64"
  push:
    branches:
      - agent/make-quality-checks-fail-closed

permissions:
  contents: write

concurrency:
  group: apply-stable-interface-type-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/make-quality-checks-fail-closed
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and apply type fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/fail-closed-type-fixes.patch.gz.b64 \
            | gzip --decompress > /tmp/fail-closed-type-fixes.patch
          echo 'c46e7dbe92e00de56f4d5df9bcefccebe6eec45f2800eba7bdc03b0c2f2cd8bd  /tmp/fail-closed-type-fixes.patch' \
            | sha256sum --check --strict
          patch --dry-run -p1 < /tmp/fail-closed-type-fixes.patch
          patch -p1 < /tmp/fail-closed-type-fixes.patch
          python -m compileall -q src

      - name: Remove staging files
        run: |
          rm .github/patches/fail-closed-type-fixes.patch.gz.b64
          rm .github/workflows/apply-stable-interface-type-fixes.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Commit and push fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair stable-interface type contracts'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/make-quality-checks-fail-closed
