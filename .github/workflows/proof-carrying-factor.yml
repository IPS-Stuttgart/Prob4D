name: Proof-carrying factor protocol

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proof-carrying-factor.yml"
      - "CHANGELOG.d/proof-carrying-factor.md"
      - "docs/proof-carrying-factors.md"
      - "examples/proof4d/**"
      - "pyproject.toml"
      - "scripts/generate_proof_carrying_factor_examples.py"
      - "src/prob4d/proof_carrying_factor.py"
      - "src/prob4d_independent_verifier/**"
      - "tests/test_proof_carrying_factor*.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/proof-carrying-factor.yml"
      - "CHANGELOG.d/proof-carrying-factor.md"
      - "docs/proof-carrying-factors.md"
      - "examples/proof4d/**"
      - "pyproject.toml"
      - "scripts/generate_proof_carrying_factor_examples.py"
      - "src/prob4d/proof_carrying_factor.py"
      - "src/prob4d_independent_verifier/**"
      - "tests/test_proof_carrying_factor*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-carrying-factor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  source-contract:
    name: Source contract / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the lightweight development environment
        run: python -m pip install -e ".[dev]"
      - name: Check generated certificates
        run: python scripts/generate_proof_carrying_factor_examples.py --check
      - name: Lint and type-check the certificate implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/prob4d/proof_carrying_factor.py
            src/prob4d_independent_verifier/proof_carrying.py
            scripts/generate_proof_carrying_factor_examples.py
            tests/test_proof_carrying_factor.py
            tests/test_proof_carrying_factor_full_rank.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            --config-file pyproject.toml \
            src/prob4d/proof_carrying_factor.py \
            src/prob4d_independent_verifier/proof_carrying.py
      - name: Run producer, verifier, tamper, and fallback tests
        run: >-
          python -m pytest -q
          tests/test_proof_carrying_factor.py
          tests/test_proof_carrying_factor_full_rank.py
          --junitxml=proof4d-${{ matrix.python }}.xml
      - name: Exercise execution-gate exit codes
        shell: bash
        run: |
          set -euo pipefail
          proof4d-verify examples/proof4d/linear-query-supported.json --compact
          set +e
          proof4d-verify examples/proof4d/linear-query-rejected.json --compact
          status=$?
          set -e
          test "$status" -eq 2
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proof4d-source-contract-python-${{ matrix.python }}
          path: proof4d-${{ matrix.python }}.xml
          if-no-files-found: warn
          retention-days: 14

  installed-wheel:
    name: Installed-wheel independent verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install one isolated wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/proof4d-wheel"
          python_bin="$RUNNER_TEMP/proof4d-wheel/bin/python"
          "$python_bin" -m pip install dist/*.whl
          "$python_bin" -m pip check
          "$RUNNER_TEMP/proof4d-wheel/bin/proof4d-verify" \
            examples/proof4d/linear-query-supported.json \
            --compact > installed-wheel-report.json
      - name: Verify the wheel does not couple the independent checker to Prob4D imports
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$RUNNER_TEMP/proof4d-wheel/bin/python"
          "$python_bin" - <<'PY'
          import ast
          from importlib.util import find_spec
          from pathlib import Path

          spec = find_spec("prob4d_independent_verifier.proof_carrying")
          if spec is None or spec.origin is None:
              raise SystemExit("installed verifier module was not found")
          tree = ast.parse(Path(spec.origin).read_text(encoding="utf-8"))
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  names = [alias.name for alias in node.names]
              elif isinstance(node, ast.ImportFrom):
                  names = [node.module or ""]
              else:
                  continue
              if any(name == "prob4d" or name.startswith("prob4d.") for name in names):
                  raise SystemExit(f"independent verifier imports producer: {names}")
          PY
      - name: Upload installed-wheel report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proof4d-installed-wheel-report
          path: installed-wheel-report.json
          if-no-files-found: warn
          retention-days: 14
