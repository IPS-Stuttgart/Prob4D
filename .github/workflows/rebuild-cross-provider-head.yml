name: Rebuild cross-provider PR head from current main

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
    paths:
      - ".github/workflows/rebuild-cross-provider-head.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-cross-provider-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out refreshed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Restore only the reviewed product files
        shell: bash
        run: |
          set -euo pipefail
          backup=agent/cross-provider-guard-v1-backup
          git fetch origin "$backup"
          for path in \
            docs/cross-provider-guard.md \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/$backup:$path" > "$path"
          done
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/cli.py")
          text = path.read_text(encoding="utf-8")
          route = '''    ("diagnostic", "cross-provider-guard"): (
              "prob4d.cross_provider_guard",
              "main",
              "calibrate provider corroboration without independence assumptions",
          ),
          '''
          if '("diagnostic", "cross-provider-guard")' not in text:
              marker = '''    ("diagnostic", "cycle-guard-conformal"): (
          '''
              if marker not in text:
                  raise SystemExit("diagnostic route insertion marker changed")
              text = text.replace(marker, route + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile \
            src/prob4d/cli.py \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/cross-provider-guard.md \
            src/prob4d/cli.py \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git commit -m "Add calibration-separated cross-provider corroboration guard"
          git push origin HEAD:agent/cross-provider-guard-v1
