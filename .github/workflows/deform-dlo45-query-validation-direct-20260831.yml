          if-no-files-found: error
          retention-days: 30
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          test -f "${{ steps.workspace.outputs.root }}/evidence/summary.md" && \
            cat "${{ steps.workspace.outputs.root }}/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evaluator conclusion
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.evaluation.outcome }}
        run: test "$OUTCOME" = success
