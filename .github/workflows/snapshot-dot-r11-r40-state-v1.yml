name: Snapshot DOT R11-R40 execution state v1

on:
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/snapshot_dot_r11_r40_state_v1.trigger"

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Query exact workflow and artifact state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "Prob4D-DOT-R11-R40-snapshot/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          workflows = [
              "bootstrap-dot-r11-r20-source-on-main-v1.yml",
              "dot-rope-r11-r20-source-v1.yml",
              "continue-dot-r21-r40-after-source-v1.yml",
              "dot-rope-r21-r40-confirmation-v1.yml",
              "publish-dot-r21-r40-terminal-v1.yml",
          ]

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None

          rows = []
          for workflow in workflows:
              status, payload = get(
                  f"{api}/repos/{repo}/actions/workflows/{workflow}/runs"
                  "?branch=main&per_page=5"
              )
              row = {
                  "workflow": workflow,
                  "http_status": status,
                  "latest_run": None,
              }
              if status == 200 and payload.get("workflow_runs"):
                  run = payload["workflow_runs"][0]
                  run_id = int(run["id"])
                  _, artifact_payload = get(
                      f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
                  )
                  _, job_payload = get(
                      f"{api}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
                  )
                  row["latest_run"] = {
                      "id": run_id,
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                      "event": run.get("event"),
                      "artifacts": [
                          {
                              "id": int(item["id"]),
                              "name": item["name"],
                              "digest": item.get("digest"),
                              "expired": item.get("expired"),
                          }
                          for item in (artifact_payload or {}).get("artifacts", [])
                      ],
                      "jobs": [
                          {
                              "id": int(item["id"]),
                              "name": item["name"],
                              "status": item.get("status"),
                              "conclusion": item.get("conclusion"),
                              "steps": [
                                  {
                                      "name": step.get("name"),
                                      "status": step.get("status"),
                                      "conclusion": step.get("conclusion"),
                                  }
                                  for step in item.get("steps") or []
                              ],
                          }
                          for item in (job_payload or {}).get("jobs", [])
                      ],
                  }
              rows.append(row)

          files = {
              path: Path(path).is_file()
              for path in (
                  ".github/workflows/bootstrap-dot-r11-r20-source-on-main-v1.yml",
                  ".github/workflows/dot-rope-r11-r20-source-v1.yml",
                  "protocols/dot-rope-r11-r20-source-v1.json",
                  "protocols/execution_requests/dot_rope_r11_r20_source_v1.json",
                  "evidence/dot-r11-r20-source-support-qualification-v1.json",
                  ".github/workflows/dot-rope-r21-r40-confirmation-v1.yml",
                  "protocols/dot-rope-r21-r40-confirmation-v1.json",
                  "protocols/execution_requests/dot_rope_r21_r40_confirmation_v1.json",
                  "evidence/dot-r21-r40-confirmation-v1/terminal.json",
              )
          }
          snapshot = {
              "schema": "prob4d.dot-r11-r40-execution-snapshot",
              "schema_version": 1,
              "main_revision": os.popen("git rev-parse HEAD").read().strip(),
              "files": files,
              "workflows": rows,
          }
          destination = Path("evidence/dot-r11-r40-execution-snapshot-v1.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(snapshot, indent=2, sort_keys=True))
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/dot-r11-r40-execution-snapshot-v1.json
          git commit -m "Record DOT R11-R40 execution snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
