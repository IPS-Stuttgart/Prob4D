name: DEFORM DLO4/DLO5 falsification witness v1

on:
  push:
    branches: [science/information-contract-falsification-witness-v1]
    paths:
      - "benchmarks/information_contract_v1/requests/deform_dlo45_falsification_witness_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-falsification-witness-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFORM_REPOSITORY: roahmlab/DEFORM
  DEFORM_COMMIT: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  ADAPTER_PROTOCOL: benchmarks/information_contract_v1/adapters/deform_dlo45_retrospective_v1.json
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source:
    name: Select and seal source-only spatial witness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact evaluator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Check out pinned source-only DEFORM trajectories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/train
            data_set/DLO5/train
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NumPy-only evaluator
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Freeze worst source-selected physical direction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          test ! -e upstream-DEFORM/data_set/DLO4/eval
          test ! -e upstream-DEFORM/data_set/DLO5/eval
          out="${RUNNER_TEMP}/deform-witness-source"
          mkdir -p "${out}"
          OUT="${out}" DATASET="${GITHUB_WORKSPACE}/upstream-DEFORM/data_set" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import runpy
          from pathlib import Path

          import numpy as np

          from prob4d.information_contract_witness import select_falsification_witness

          adapter = runpy.run_path(
              "benchmarks/information_contract_v1/adapters/"
              "deform_dlo45_retrospective_v1.py"
          )
          load_protocol = adapter["_load_protocol"]
          trajectory_paths = adapter["_trajectory_paths"]
          load_trajectory = adapter["_load_trajectory"]
          prediction_and_truth = adapter["_prediction_and_truth"]
          window_starts = adapter["_window_starts"]
          deterministic_npz = adapter["_deterministic_npz"]
          sha256_file = adapter["_sha256_file"]
          write_json = adapter["_write_json"]

          protocol_path = Path(os.environ["ADAPTER_PROTOCOL"])
          _, spec = load_protocol(protocol_path)
          dataset = Path(os.environ["DATASET"])
          output = Path(os.environ["OUT"])
          split_domain = "prob4d-deform-dlo45-falsification-witness-v1"
          jitter = 1e-10
          covariance_scale = 0.05

          def ordered(paths, dlo):
              def key(path):
                  digest = hashlib.sha256(
                      split_domain.encode()
                      + b"\0"
                      + dlo.encode()
                      + b"\0"
                      + path.name.encode()
                  ).digest()
                  return digest, path.name
              return tuple(sorted(paths, key=key))

          def collect(paths):
              rows = []
              index = []
              for group, path in enumerate(paths):
                  trajectory = load_trajectory(path)
                  for current in window_starts(spec):
                      prediction, truth = prediction_and_truth(
                          trajectory, current, spec
                      )
                      residual = truth - prediction
                      rows.append(residual)
                      index.extend([group] * len(residual))
              return np.concatenate(rows), np.asarray(index, dtype=np.int64)

          def equal_group_mean(values, index, count):
              return np.mean(
                  [np.mean(values[index == group], axis=0) for group in range(count)],
                  axis=0,
              )

          def equal_group_second_moment(values, index, count):
              result = np.mean(
                  [
                      values[index == group].T @ values[index == group]
                      / np.count_nonzero(index == group)
                      for group in range(count)
                  ],
                  axis=0,
              )
              result = 0.5 * (result + result.T)
              result += jitter * np.eye(3)
              np.linalg.cholesky(result)
              return result

          model = {}
          source_rows = []
          source_covariances = []
          source_index = []
          source_groups = []
          group_offset = 0
          for dlo in ("DLO4", "DLO5"):
              paths = ordered(trajectory_paths(dataset, dlo, "train"), dlo)
              fit_paths = paths[:40]
              selection_paths = paths[40:]
              fit_rows, fit_index = collect(fit_paths)
              bias = equal_group_mean(fit_rows, fit_index, len(fit_paths))
              corrected_fit = fit_rows - bias
              raw_covariance = equal_group_second_moment(
                  fit_rows, fit_index, len(fit_paths)
              )
              corrected_covariance = equal_group_second_moment(
                  corrected_fit, fit_index, len(fit_paths)
              )
              selection_rows, selection_index = collect(selection_paths)
              corrected_selection = selection_rows - bias
              source_rows.append(corrected_selection)
              source_covariances.append(
                  np.repeat(
                      (covariance_scale * corrected_covariance)[None, :, :],
                      len(corrected_selection),
                      axis=0,
                  )
              )
              source_index.append(selection_index + group_offset)
              source_groups.extend(
                  f"{dlo}/{path.name}" for path in selection_paths
              )
              group_offset += len(selection_paths)
              model[dlo] = {
                  "bias": bias,
                  "raw_covariance": raw_covariance,
                  "corrected_covariance": corrected_covariance,
                  "fit_names": [path.name for path in fit_paths],
                  "selection_names": [path.name for path in selection_paths],
              }

          payload = output / "source_payload.npz"
          deterministic_npz(
              payload,
              {
                  "residual_vectors": np.concatenate(source_rows),
                  "reported_covariance": np.concatenate(source_covariances),
                  "group_index": np.concatenate(source_index),
                  "query_basis": np.eye(3, dtype=np.float64),
              },
          )
          source_manifest = {
              "schema_name": "prob4d.information-contract-witness-source",
              "schema_version": 1,
              "source_id": "deform-dlo45-spatial-witness-source-v1",
              "audited_submission_id": "source-bias-corrected-overconfident",
              "aggregation_unit": "group_index",
              "group_ids": source_groups,
              "payload": payload.name,
              "payload_sha256": sha256_file(payload),
              "query_family": {
                  "query_family_id": "metric-point-displacement-direction-r3-v1",
                  "semantic_label": (
                      "one common unit 3-D projection of metric internal-node "
                      "forecast error"
                  ),
                  "units": "metres",
                  "basis_frozen_before_source_outcomes": True,
              },
              "coverage_probability": 0.9,
              "information_order": "source-only",
              "claim_boundary": (
                  "The query is selected on official DLO4/DLO5 training "
                  "trajectories only. The result is a retrospective diagnostic, "
                  "not a fresh provider or target-calibration claim."
              ),
          }
          source_manifest_path = output / "source_manifest.json"
          write_json(source_manifest_path, source_manifest)
          witness = select_falsification_witness(source_manifest_path)
          write_json(output / "witness.json", witness)
          np.savez_compressed(
              output / "source_model.npz",
              dlo4_bias=model["DLO4"]["bias"],
              dlo4_raw_covariance=model["DLO4"]["raw_covariance"],
              dlo4_corrected_covariance=model["DLO4"]["corrected_covariance"],
              dlo5_bias=model["DLO5"]["bias"],
              dlo5_raw_covariance=model["DLO5"]["raw_covariance"],
              dlo5_corrected_covariance=model["DLO5"]["corrected_covariance"],
          )
          receipt = {
              "schema_name": "prob4d.deform-dlo45-witness-source-receipt",
              "schema_version": 1,
              "dataset_repository": os.environ["DEFORM_REPOSITORY"],
              "dataset_commit": os.environ["DEFORM_COMMIT"],
              "fit_trajectory_count": 80,
              "witness_selection_trajectory_count": 32,
              "held_evaluation_trajectory_count_opened": 0,
              "source_payload_sha256": sha256_file(payload),
              "witness_id": witness["witness_id"],
              "witness_query_vector": witness["query_vector"],
              "source_max_normalized_error_ratio": witness[
                  "source_max_normalized_error_ratio"
              ],
              "covariance_scale_control": covariance_scale,
              "model_partitions": {
                  dlo: {
                      "fit_names": model[dlo]["fit_names"],
                      "selection_names": model[dlo]["selection_names"],
                  }
                  for dlo in ("DLO4", "DLO5")
              },
          }
          write_json(output / "source_receipt.json", receipt)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload frozen source witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-witness-source-${{ github.run_id }}
          path: ${{ runner.temp }}/deform-witness-source/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  held:
    name: Evaluate frozen witness on held trajectories
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact evaluator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Check out pinned held-only DEFORM trajectories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/eval
            data_set/DLO5/eval
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NumPy-only evaluator
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Download exact source witness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: deform-dlo45-witness-source-${{ github.run_id }}
          path: ${{ runner.temp }}/deform-witness-source

      - name: Open held outcomes once and score the frozen witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          test ! -e upstream-DEFORM/data_set/DLO4/train
          test ! -e upstream-DEFORM/data_set/DLO5/train
          out="${RUNNER_TEMP}/deform-witness-held"
          mkdir -p "${out}"
          OUT="${out}" SOURCE="${RUNNER_TEMP}/deform-witness-source" \
          DATASET="${GITHUB_WORKSPACE}/upstream-DEFORM/data_set" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import runpy
          from pathlib import Path

          import numpy as np

          from prob4d.information_contract_witness import evaluate_frozen_witness

          adapter = runpy.run_path(
              "benchmarks/information_contract_v1/adapters/"
              "deform_dlo45_retrospective_v1.py"
          )
          load_protocol = adapter["_load_protocol"]
          trajectory_paths = adapter["_trajectory_paths"]
          load_trajectory = adapter["_load_trajectory"]
          prediction_and_truth = adapter["_prediction_and_truth"]
          window_starts = adapter["_window_starts"]
          deterministic_npz = adapter["_deterministic_npz"]
          sha256_file = adapter["_sha256_file"]
          write_json = adapter["_write_json"]

          _, spec = load_protocol(Path(os.environ["ADAPTER_PROTOCOL"]))
          dataset = Path(os.environ["DATASET"])
          source = Path(os.environ["SOURCE"])
          output = Path(os.environ["OUT"])
          witness = json.loads((source / "witness.json").read_text())
          source_receipt = json.loads((source / "source_receipt.json").read_text())
          if source_receipt["held_evaluation_trajectory_count_opened"] != 0:
              raise SystemExit("source stage opened held trajectories")
          covariance_scale = float(source_receipt["covariance_scale_control"])

          with np.load(source / "source_model.npz", allow_pickle=False) as archive:
              model = {name: np.array(archive[name], copy=True) for name in archive.files}

          modes = (
              "source-bias-corrected-overconfident",
              "source-bias-corrected-full",
              "transported-velocity-full",
              "transported-velocity-diagonal",
          )
          residuals = {mode: [] for mode in modes}
          covariances = {mode: [] for mode in modes}
          group_index = []
          group_ids = []
          group = 0
          for dlo in ("DLO4", "DLO5"):
              prefix = dlo.lower()
              bias = model[f"{prefix}_bias"]
              raw_covariance = model[f"{prefix}_raw_covariance"]
              corrected_covariance = model[f"{prefix}_corrected_covariance"]
              diagonal_covariance = np.diag(np.diag(raw_covariance))
              for path in trajectory_paths(dataset, dlo, "eval"):
                  group_ids.append(f"{dlo}/{path.name}")
                  trajectory = load_trajectory(path)
                  for current in window_starts(spec):
                      prediction, truth = prediction_and_truth(
                          trajectory, current, spec
                      )
                      raw = truth - prediction
                      corrected = raw - bias
                      count = len(raw)
                      residuals["source-bias-corrected-overconfident"].append(
                          corrected
                      )
                      residuals["source-bias-corrected-full"].append(corrected)
                      residuals["transported-velocity-full"].append(raw)
                      residuals["transported-velocity-diagonal"].append(raw)
                      covariances[
                          "source-bias-corrected-overconfident"
                      ].append(
                          np.repeat(
                              (covariance_scale * corrected_covariance)[None, :, :],
                              count,
                              axis=0,
                          )
                      )
                      covariances["source-bias-corrected-full"].append(
                          np.repeat(corrected_covariance[None, :, :], count, axis=0)
                      )
                      covariances["transported-velocity-full"].append(
                          np.repeat(raw_covariance[None, :, :], count, axis=0)
                      )
                      covariances["transported-velocity-diagonal"].append(
                          np.repeat(diagonal_covariance[None, :, :], count, axis=0)
                      )
                      group_index.extend([group] * count)
                  group += 1

          index = np.asarray(group_index, dtype=np.int64)
          submissions = []
          for mode in modes:
              payload = output / f"{mode}.npz"
              deterministic_npz(
                  payload,
                  {
                      "residual_vectors": np.concatenate(residuals[mode]),
                      "reported_covariance": np.concatenate(covariances[mode]),
                      "group_index": index,
                  },
              )
              submissions.append(
                  {
                      "submission_id": mode,
                      "payload": payload.name,
                      "payload_sha256": sha256_file(payload),
                  }
              )

          held_manifest = {
              "schema_name": "prob4d.information-contract-witness-held",
              "schema_version": 1,
              "held_id": "deform-dlo45-spatial-witness-held-v1",
              "source_witness_id": witness["witness_id"],
              "aggregation_unit": "group_index",
              "group_ids": group_ids,
              "information_order": "retrospective-open-target",
              "submissions": submissions,
              "claim_boundary": (
                  "This evaluates one source-selected 3-D projection on already "
                  "opened public DLO4/DLO5 evaluation trajectories. It is a "
                  "retrospective falsification diagnostic, not a prospective claim."
              ),
          }
          held_path = output / "held_manifest.json"
          write_json(held_path, held_manifest)
          result = evaluate_frozen_witness(held_path, source / "witness.json")
          write_json(output / "result.json", result)

          metrics = result["submissions"]
          def minimum_set(field):
              best = min(float(value[field]) for value in metrics.values())
              tolerance = 1e-12 * max(1.0, abs(best))
              return sorted(
                  name
                  for name, value in metrics.items()
                  if abs(float(value[field]) - best) <= tolerance
              )

          pair = (
              "source-bias-corrected-overconfident",
              "transported-velocity-full",
          )
          pair_point = min(
              pair,
              key=lambda name: (
                  float(metrics[name]["equal_group_coordinate_rmse"]), name
              ),
          )
          pair_calibration = min(
              pair,
              key=lambda name: (
                  float(
                      metrics[name][
                          "equal_group_query_absolute_log_calibration_error"
                      ]
                  ),
                  name,
              ),
          )
          comparison = {
              "schema_name": "prob4d.deform-dlo45-falsification-witness-result",
              "schema_version": 1,
              "classification": "retrospective public-data falsification diagnostic",
              "witness_id": witness["witness_id"],
              "query_vector": witness["query_vector"],
              "source_max_normalized_error_ratio": witness[
                  "source_max_normalized_error_ratio"
              ],
              "held_case_count": len(index),
              "held_independent_trajectory_count": len(group_ids),
              "target_query_reselection": result["target_query_reselection"],
              "point_accuracy_winner_set": minimum_set(
                  "equal_group_coordinate_rmse"
              ),
              "selected_query_calibration_winner_set": minimum_set(
                  "equal_group_query_absolute_log_calibration_error"
              ),
              "selected_query_nll_winner_set": minimum_set(
                  "equal_group_query_gaussian_nll"
              ),
              "registered_control_pair": list(pair),
              "control_pair_point_accuracy_winner": pair_point,
              "control_pair_query_calibration_winner": pair_calibration,
              "control_pair_ranking_reversal": pair_point != pair_calibration,
              "submissions": metrics,
              "claim_boundary": (
                  "The witness was selected on disjoint training trajectories, "
                  "but the held DLO4/DLO5 cohort was historically open. The "
                  "overconfident covariance is an explicit negative control."
              ),
          }
          write_json(output / "comparison.json", comparison)
          if comparison["held_case_count"] != 106400:
              raise SystemExit("unexpected held row count")
          if comparison["held_independent_trajectory_count"] != 28:
              raise SystemExit("unexpected held trajectory count")
          if comparison["target_query_reselection"] is not False:
              raise SystemExit("held query was reselected")
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Upload complete retrospective witness result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-falsification-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deform-witness-source/source_manifest.json
            ${{ runner.temp }}/deform-witness-source/source_payload.npz
            ${{ runner.temp }}/deform-witness-source/source_receipt.json
            ${{ runner.temp }}/deform-witness-source/witness.json
            ${{ runner.temp }}/deform-witness-held/held_manifest.json
            ${{ runner.temp }}/deform-witness-held/result.json
            ${{ runner.temp }}/deform-witness-held/comparison.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
