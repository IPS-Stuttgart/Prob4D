name: Harden CUT3R Deform360 source-freeze PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut3r-deform360-source-freeze.yml"

permissions:
  contents: write

concurrency:
  group: pr-274-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cut3r-deform360-source-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed reproducibility hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr_274_hardening.py

      - name: Validate the hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check --fix \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m compileall -q scripts/science/build_cut3r_deform360_source_freeze.py
          git diff --check

      - name: Commit and push non-workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/scripts/pr_274_hardening.py \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py
          git commit -m "Bind CUT3R camera calibration inputs"
          git push origin HEAD:agent/cut3r-deform360-source-freeze
