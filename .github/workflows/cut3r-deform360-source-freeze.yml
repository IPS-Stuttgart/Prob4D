name: Validate CUT3R Deform360 source freeze

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut3r-deform360-source-freeze.yml"
      - ".github/workflows/trusted-self-hosted-validation.yml"
      - "protocols/cut3r_deform360_source_v1.json"
      - "scripts/science/build_cut3r_deform360_source_freeze.py"
      - "tests/test_cut3r_deform360_source_freeze.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
      - "docs/cut3r-deform360-source-freeze.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cut3r-deform360-source-freeze-${{ github.ref }}
  cancel-in-progress: true

env:
  PROB4D_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Source-freeze contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROB4D_HEAD_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate source-only freeze implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format --check \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m compileall -q \
            scripts/science/build_cut3r_deform360_source_freeze.py
