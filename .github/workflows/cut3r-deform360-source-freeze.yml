name: Repair CUT3R Deform360 source-freeze PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut3r-deform360-source-freeze.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: pr-274-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cut3r-deform360-source-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          python .github/scripts/pr_274_repair.py

      - name: Validate the repaired branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check --fix \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m compileall -q \
            scripts/science/build_cut3r_deform360_source_freeze.py
          git diff --check

      - name: Commit and push the repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/scripts/pr_274_repair.py \
            .github/workflows/cut3r-deform360-source-freeze.yml \
            .github/workflows/pr-274-repair.yml \
            .github/workflows/trusted-self-hosted-validation.yml \
            docs/cut3r-deform360-source-freeze.md \
            scripts/science/build_cut3r_deform360_source_freeze.py \
            tests/test_cut3r_deform360_source_freeze.py \
            tests/test_trusted_self_hosted_validation_policy.py
          git commit -m "Repair CUT3R source-freeze validation architecture"
          git push origin HEAD:agent/cut3r-deform360-source-freeze
