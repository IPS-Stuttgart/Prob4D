name: Deform360 processed repository inventory v1

on:
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/deform360_processed_repository_inventory_v1.json"

permissions:
  contents: read

concurrency:
  group: deform360-processed-repository-inventory-v1
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory Deform360 processed repository on gpuserver4090
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360/processed-repository
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Require fixed execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -x /usr/bin/python3
          test "$SOURCE_ROOT" = "/mnt/seagate10tb/florianpfaff/datasets/deform360/processed-repository"
      - name: Build bounded metadata-only inventory
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deform360-processed-repository-inventory-${GITHUB_RUN_ID}"
          /usr/bin/rm -rf -- "$out"
          /usr/bin/mkdir -p "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          OUT="$out" /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import heapq
          import json
          import os
          import stat
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ["SOURCE_ROOT"])
          out = Path(os.environ["OUT"])
          forbidden_tokens = (
              "confirmation",
              "fresh-validation",
              "held-v8",
              "shadow",
              "target",
          )
          max_entries = 2_000_000
          max_depth = 80
          sample_limit = 500
          largest_limit = 100

          def normalized(name: str) -> str:
              return name.casefold().replace("_", "-").replace(" ", "-")

          def kind(mode: int) -> str:
              if stat.S_ISREG(mode):
                  return "file"
              if stat.S_ISDIR(mode):
                  return "directory"
              if stat.S_ISLNK(mode):
                  return "symlink"
              return "other"

          boundary = {
              "dataset_file_contents_opened": False,
              "symlinks_followed": False,
              "prediction_executed": False,
              "provider_residuals_opened": False,
              "target_payloads_opened": False,
              "target_outcomes_opened": False,
              "dataset_mutated": False,
          }
          result = {
              "schema": "prob4d.deform360-processed-repository-inventory",
              "schema_version": 1,
              "source_root": str(root),
              "repository_revision": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "runner_name": os.environ["RUNNER_NAME"],
              "runner_selector": ["self-hosted", "gpuserver4090"],
              "execution_boundary": boundary,
              "claim_boundary": (
                  "Metadata-only source inventory. No dataset file content, provider "
                  "prediction, residual, target payload/outcome, BayesianPhysTwin "
                  "innovation, Causal4D result, or dataset mutation is authorized."
              ),
          }

          try:
              root_stat = root.lstat()
          except FileNotFoundError:
              result["decision"] = "source-root-missing"
              result["inventory"] = {}
          except OSError as exc:
              result["decision"] = "source-root-unreadable"
              result["inventory"] = {"errno": exc.errno}
          else:
              if stat.S_ISLNK(root_stat.st_mode):
                  result["decision"] = "source-root-symlink-rejected"
                  result["inventory"] = {"root_mode": stat.S_IMODE(root_stat.st_mode)}
              elif not stat.S_ISDIR(root_stat.st_mode):
                  result["decision"] = "source-root-not-directory"
                  result["inventory"] = {"root_mode": stat.S_IMODE(root_stat.st_mode)}
              else:
                  counts = Counter({"directory": 1})
                  extensions = Counter()
                  top_level: dict[str, Counter[str]] = defaultdict(Counter)
                  forbidden = Counter()
                  errors = Counter()
                  samples: list[dict[str, object]] = []
                  largest: list[tuple[int, str]] = []
                  manifest = hashlib.sha256()
                  manifest.update(
                      f"directory\0{stat.S_IMODE(root_stat.st_mode):04o}\0{root_stat.st_size}\0.\n".encode()
                  )
                  total_file_bytes = 0
                  entry_count = 0
                  maximum_depth_seen = 0
                  limit_exceeded = False
                  stack: list[tuple[Path, str, int]] = [(root, "", 0)]

                  while stack and not limit_exceeded:
                      directory, relative_directory, directory_depth = stack.pop()
                      try:
                          with os.scandir(directory) as iterator:
                              entries = sorted(iterator, key=lambda item: item.name)
                      except OSError as exc:
                          errors[f"scandir-errno-{exc.errno}"] += 1
                          continue
                      children: list[tuple[Path, str, int]] = []
                      for entry in entries:
                          token = next(
                              (value for value in forbidden_tokens if value in normalized(entry.name)),
                              None,
                          )
                          if token is not None:
                              forbidden[token] += 1
                              counts["forbidden-subtree-skipped"] += 1
                              continue
                          if entry_count >= max_entries:
                              limit_exceeded = True
                              break
                          relative_path = (
                              entry.name
                              if not relative_directory
                              else f"{relative_directory}/{entry.name}"
                          )
                          depth = directory_depth + 1
                          if depth > max_depth:
                              counts["depth-limit-skipped"] += 1
                              continue
                          try:
                              metadata = entry.stat(follow_symlinks=False)
                          except OSError as exc:
                              errors[f"lstat-errno-{exc.errno}"] += 1
                              continue
                          entry_kind = kind(metadata.st_mode)
                          size = int(metadata.st_size)
                          entry_count += 1
                          counts[entry_kind] += 1
                          maximum_depth_seen = max(maximum_depth_seen, depth)
                          manifest.update(
                              f"{entry_kind}\0{stat.S_IMODE(metadata.st_mode):04o}\0{size}\0{relative_path}\n".encode()
                          )
                          top = relative_path.split("/", 1)[0]
                          top_level[top]["entries"] += 1
                          top_level[top][entry_kind] += 1
                          if entry_kind == "file":
                              total_file_bytes += size
                              top_level[top]["regular_file_bytes"] += size
                              extensions[Path(entry.name).suffix.casefold() or "<none>"] += 1
                              item = (size, relative_path)
                              if len(largest) < largest_limit:
                                  heapq.heappush(largest, item)
                              elif item > largest[0]:
                                  heapq.heapreplace(largest, item)
                          if len(samples) < sample_limit:
                              samples.append(
                                  {"path": relative_path, "type": entry_kind, "size_bytes": size}
                              )
                          if entry_kind == "directory":
                              children.append((Path(entry.path), relative_path, depth))
                      stack.extend(reversed(children))

                  if limit_exceeded:
                      decision = "entry-limit-exceeded"
                  elif errors:
                      decision = "source-bundle-partial"
                  else:
                      decision = "source-bundle-present"
                  result["decision"] = decision
                  result["inventory"] = {
                      "metadata_manifest_sha256": manifest.hexdigest(),
                      "entry_count_excluding_root": entry_count,
                      "counts_including_root": dict(sorted(counts.items())),
                      "total_regular_file_bytes": total_file_bytes,
                      "maximum_depth_seen": maximum_depth_seen,
                      "extension_counts": dict(sorted(extensions.items())),
                      "top_level": {
                          name: dict(sorted(values.items()))
                          for name, values in sorted(top_level.items())
                      },
                      "largest_regular_files": [
                          {"path": path, "size_bytes": size}
                          for size, path in sorted(largest, key=lambda item: (-item[0], item[1]))
                      ],
                      "deterministic_path_sample": samples,
                      "forbidden_path_components_skipped": sum(forbidden.values()),
                      "forbidden_token_counts": dict(sorted(forbidden.items())),
                      "metadata_error_counts": dict(sorted(errors.items())),
                      "entry_limit_exceeded": limit_exceeded,
                  }

          identity = dict(result)
          identity.pop("inventory_id", None)
          canonical = json.dumps(
              identity, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          result["inventory_id"] = hashlib.sha256(canonical).hexdigest()
          (out / "result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          inventory = result.get("inventory") or {}
          counts = inventory.get("counts_including_root") or {}
          lines = [
              "# Deform360 processed-repository inventory",
              "",
              f"- Decision: `{result['decision']}`",
              f"- Inventory ID: `{result['inventory_id']}`",
              f"- Runner: `{result['runner_name']}` via `gpuserver4090`",
              f"- Source root: `{result['source_root']}`",
              f"- Files: `{counts.get('file', 0)}`",
              f"- Directories: `{counts.get('directory', 0)}`",
              f"- Symlinks: `{counts.get('symlink', 0)}`",
              f"- Regular-file bytes: `{inventory.get('total_regular_file_bytes', 0)}`",
              f"- Top-level entries: `{len(inventory.get('top_level') or {})}`",
              f"- Forbidden components skipped: `{inventory.get('forbidden_path_components_skipped', 0)}`",
              "",
              result["claim_boundary"],
          ]
          (out / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps({"decision": result["decision"], "inventory_id": result["inventory_id"]}))
          PY
      - name: Upload sanitized inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deform360-processed-repository-inventory-${{ github.run_id }}
          path: ${{ steps.audit.outputs.out }}
          if-no-files-found: error
          retention-days: 30
      - name: Enforce usable source inventory
        shell: bash
        run: |
          set -euo pipefail
          RESULT="${{ steps.audit.outputs.out }}/result.json" /usr/bin/python3 - <<'PY'
          import json
          import os
          result = json.load(open(os.environ["RESULT"], encoding="utf-8"))
          if result.get("decision") not in {"source-bundle-present", "source-bundle-partial"}:
              raise SystemExit(f"unusable source inventory: {result.get('decision')}")
          PY

  report:
    name: Report processed-repository inventory
    if: always()
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download sanitized inventory evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: deform360-processed-repository-inventory-${{ github.run_id }}
          path: evidence
      - name: Post durable source-only receipt to issue 49
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          result = json.loads(Path("evidence/result.json").read_text(encoding="utf-8"))
          inventory = result.get("inventory") or {}
          counts = inventory.get("counts_including_root") or {}
          body = "\n".join(
              [
                  "## Deform360 full processed-repository inventory",
                  "",
                  f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
                  f"- revision: `{os.environ['GITHUB_SHA']}`",
                  f"- decision: `{result.get('decision')}`",
                  f"- inventory ID: `{result.get('inventory_id')}`",
                  f"- runner: `{result.get('runner_name')}` via `gpuserver4090`",
                  f"- source root: `{result.get('source_root')}`",
                  f"- files: `{counts.get('file', 0)}`",
                  f"- directories: `{counts.get('directory', 0)}`",
                  f"- symlinks: `{counts.get('symlink', 0)}`",
                  f"- bytes: `{inventory.get('total_regular_file_bytes', 0)}`",
                  f"- top-level entries: `{len(inventory.get('top_level') or {})}`",
                  f"- metadata manifest: `{inventory.get('metadata_manifest_sha256', 'unavailable')}`",
                  "",
                  result["claim_boundary"],
              ]
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/IPS-Stuttgart/Prob4D/issues/49/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected GitHub status: {response.status}")
          PY
