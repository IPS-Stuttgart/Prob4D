name: Hosted repair PR 94

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hosted-repair-pr94.yml]

permissions:
  contents: write

concurrency:
  group: hosted-repair-pr94
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-tracklet-association-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/harden-tracklet-association-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Refresh main and execute the reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/repair-pr94.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '          PY\n      - name: Validate focused contracts'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          payload = textwrap.dedent(workflow[start:end])
          docs_marker = 'replace_once(\n    "docs/causal-tracklets.md",'
          source_and_tests = payload[: payload.index(docs_marker)]
          exec(compile(source_and_tests, str(workflow_path), 'exec'))

          docs = Path('docs/causal-tracklets.md')
          text = docs.read_text(encoding='utf-8')
          old = '''`association_probability` is the cumulative product of the accepted link
          probabilities. It expresses support that the current row still belongs to the
          same seeded identity. It is not source reliability and must not be replaced by a
          physical residual or downstream posterior responsibility.

          ## Deform-mask policy

          `scene_flow[t]` predicts motion from frame `t` to frame `t + 1`, so the existing
          `deform_mask[t]` contract certifies the **source** row of that transition. The
          compatibility-preserving default is therefore
          `target_deform_mask_policy="allow"`: the next-frame candidate must be valid, while
          its own deform-mask value is not interpreted as a material-membership label.

          Set `target_deform_mask_policy="require"` only when the producer or experiment
          explicitly establishes that the target-frame deform mask is also a valid material
          support mask. Seeds and next-frame candidates must then lie in both `valid_mask`
          and `deform_mask`. A valid geometric candidate rejected only by this extra target
          mask is counted in `terminated_target_mask`, rather than being merged into the
          generic no-candidate count.
          '''
          new = '''`association_probability` is the cumulative product of the accepted link
          probabilities. It expresses support that the current row still belongs to the
          same seeded identity. It is not source reliability and must not be replaced by a
          physical residual or downstream posterior responsibility.

          `geometric_mean_association_probability` exposes the geometric mean of the
          accepted non-seed links up to each row. It is length-neutral for comparison
          across different track ages, remains uncalibrated, and does not replace the
          cumulative survival probability retained in `association_probability`.

          ## Deform-mask policy

          `scene_flow[t]` predicts motion from frame `t` to frame `t + 1`, so the existing
          `deform_mask[t]` contract certifies the **source** row of that transition. The
          compatibility-preserving default is therefore
          `target_deform_mask_policy="allow"`: the next-frame candidate must be valid, while
          its own deform-mask value is not interpreted as a material-membership label.

          Seeds always require both valid and source-side deform support. This prevents
          `minimum_track_length=1` from emitting a background-only singleton while keeping
          target-frame mask semantics independent.

          Set `target_deform_mask_policy="require"` only when the producer or experiment
          explicitly establishes that the target-frame deform mask is also a valid material
          support mask. Next-frame candidates must then lie in both `valid_mask` and
          `deform_mask`. A valid geometric candidate rejected only by this extra target mask
          is counted in `terminated_target_mask`, rather than being merged into the generic
          no-candidate count.
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected one causal-tracklet documentation section, found {text.count(old)}'
              )
          docs.write_text(text.replace(old, new), encoding='utf-8')
          workflow_path.unlink()
          Path('.github/workflows/hosted-repair-pr94.yml').unlink()
          PY
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m mypy \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m pytest -q \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Commit ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            docs/causal-tracklets.md \
            .github/workflows/repair-pr94.yml \
            .github/workflows/hosted-repair-pr94.yml
          git commit -m 'Harden tracklet seeds and add length-neutral support'
          git push origin HEAD:agent/harden-tracklet-association-contracts
