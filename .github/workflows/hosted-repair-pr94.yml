name: Hosted repair PR 94

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hosted-repair-pr94.yml]

permissions:
  contents: write

concurrency:
  group: hosted-repair-pr94
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-tracklet-association-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/harden-tracklet-association-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Refresh main and execute the reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/repair-pr94.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '          PY\n      - name: Validate focused contracts'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, str(workflow_path), 'exec'))
          Path('.github/workflows/hosted-repair-pr94.yml').unlink()
          PY
      - name: Validate focused contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          python -m mypy \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m pytest -q \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Commit ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py \
            tests/test_causal_tracklets.py \
            docs/causal-tracklets.md \
            .github/workflows/repair-pr94.yml \
            .github/workflows/hosted-repair-pr94.yml
          git commit -m 'Harden tracklet seeds and add length-neutral support'
          git push origin HEAD:agent/harden-tracklet-association-contracts
