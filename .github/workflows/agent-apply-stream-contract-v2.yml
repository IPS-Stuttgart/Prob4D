name: Apply agent patch

on:
  push:
    branches:
      - agent/version-prob4d-stream-contract-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply contract patch
        run: |
          git apply --check .github/agent-patches/stream-contract-v2.patch
          git apply .github/agent-patches/stream-contract-v2.patch
          rm .github/agent-patches/stream-contract-v2.patch
          rm .github/workflows/agent-apply-stream-contract-v2.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check src tests
          python -m pytest -q \
            tests/test_observation_export.py \
            tests/test_provider_manifest.py \
            tests/test_provider_v1.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Version the Prob4D causal stream contract'
          git push origin HEAD:${{ github.ref_name }}
