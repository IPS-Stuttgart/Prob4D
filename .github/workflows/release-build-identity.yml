name: Release build identity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-build-identity.yml"
      - "CHANGELOG.d/release-build-identity.md"
      - "MANIFEST.in"
      - "docs/distribution-boundaries.md"
      - "docs/release-build-identity.md"
      - "pyproject.toml"
      - "setup.py"
      - "src/prob4d/_build_identity.py"
      - "src/prob4d/runtime_revision.py"
      - "tests/test_build_identity.py"
      - "tests/test_runtime_revision.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build-identity:
    name: Exact installed package revision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build and focused quality tools
        run: python -m pip install --upgrade build pytest ruff

      - name: Verify source implementation and contracts
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            setup.py \
            src/prob4d/_build_identity.py \
            src/prob4d/runtime_revision.py \
            tests/test_build_identity.py \
            tests/test_runtime_revision.py
          python -m ruff format --check --diff \
            setup.py \
            src/prob4d/_build_identity.py \
            src/prob4d/runtime_revision.py \
            tests/test_build_identity.py \
            tests/test_runtime_revision.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_build_identity.py \
            tests/test_runtime_revision.py
          python -m compileall -q \
            setup.py \
            src/prob4d/_build_identity.py \
            src/prob4d/runtime_revision.py \
            tests/test_build_identity.py \
            tests/test_runtime_revision.py

      - name: Verify PEP 660 editable source attestation
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          environment="$RUNNER_TEMP/prob4d-editable-identity"
          python -m venv "$environment"
          python_bin="$environment/bin/python"
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install -e .
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          run_dir="$RUNNER_TEMP/prob4d-editable-run"
          mkdir -p "$run_dir"
          (
            cd "$run_dir"
            env -u PYTHONPATH PROB4D_EXPECTED_REVISION="$revision" \
              "$python_bin" - <<'PY'
          import os

          from prob4d.runtime_revision import assert_runtime_revision

          attestation = assert_runtime_revision(os.environ["PROB4D_EXPECTED_REVISION"])
          if attestation.source != "source_checkout":
              raise SystemExit("editable install did not use source-checkout provenance")
          if attestation.clean_checkout is not True:
              raise SystemExit("editable source checkout was not clean")
          if not attestation.independently_verified:
              raise SystemExit("editable source revision was not independently verified")
          PY
          )

      - name: Build direct wheel, source distribution, and rebuilt wheel
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          mkdir -p dist/direct dist/source dist/rebuilt
          python -m build --wheel --outdir dist/direct
          python -m build --sdist --outdir dist/source
          source="$(find dist/source -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$source"
          python -m pip wheel --no-deps --wheel-dir dist/rebuilt "$source"
          test "$(find dist/direct -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist/source -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist/rebuilt -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee dist/SHA256SUMS

      - name: Inspect staged build identities
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          REVISION="$revision" python - <<'PY'
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          revision = os.environ["REVISION"]
          direct_wheel = next(Path("dist/direct").glob("*.whl"))
          rebuilt_wheel = next(Path("dist/rebuilt").glob("*.whl"))
          source = next(Path("dist/source").glob("*.tar.gz"))

          def wheel_identity(path: Path) -> dict[str, object]:
              with zipfile.ZipFile(path) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if name == "prob4d/_build_identity.json"
                  ]
                  if names != ["prob4d/_build_identity.json"]:
                      raise SystemExit(f"wheel identity members changed in {path}: {names}")
                  return json.loads(archive.read(names[0]))

          with tarfile.open(source, "r:gz") as archive:
              names = [
                  member.name
                  for member in archive.getmembers()
                  if member.name.endswith("/src/prob4d/_build_identity.json")
              ]
              if len(names) != 1:
                  raise SystemExit(f"sdist identity members changed: {names}")
              member = archive.extractfile(names[0])
              if member is None:
                  raise SystemExit("cannot read sdist build identity")
              sdist_identity = json.loads(member.read())

          identities = (
              ("direct-wheel", wheel_identity(direct_wheel), "git_checkout"),
              ("sdist", sdist_identity, "git_checkout"),
              (
                  "sdist-rebuilt-wheel",
                  wheel_identity(rebuilt_wheel),
                  "inherited_source_archive",
              ),
          )
          for kind, identity, expected_source in identities:
              if identity.get("schema") != "prob4d.installed-build-identity":
                  raise SystemExit(f"{kind} build identity schema changed")
              if identity.get("source_revision") != revision:
                  raise SystemExit(f"{kind} source revision mismatch")
              if identity.get("source_tree_clean") is not True:
                  raise SystemExit(f"{kind} did not bind a clean source tree")
              if identity.get("source_identity_source") != expected_source:
                  raise SystemExit(
                      f"{kind} source identity mismatch: "
                      f"expected {expected_source}, "
                      f"observed {identity.get('source_identity_source')}"
                  )
          PY

      - name: Install and attest every distribution route
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          direct="$(find dist/direct -maxdepth 1 -name '*.whl' -print -quit)"
          source="$(find dist/source -maxdepth 1 -name '*.tar.gz' -print -quit)"
          rebuilt="$(find dist/rebuilt -maxdepth 1 -name '*.whl' -print -quit)"
          for kind in direct sdist rebuilt; do
            environment="$RUNNER_TEMP/prob4d-${kind}-identity"
            python -m venv "$environment"
            python_bin="$environment/bin/python"
            "$python_bin" -m pip install --upgrade pip
            case "$kind" in
              direct)
                artifact="$direct"
                expected_source="git_checkout"
                ;;
              sdist)
                artifact="$source"
                expected_source="inherited_source_archive"
                ;;
              rebuilt)
                artifact="$rebuilt"
                expected_source="inherited_source_archive"
                ;;
              *)
                exit 2
                ;;
            esac
            "$python_bin" -m pip install "$artifact"
            "$python_bin" -m pip check
            run_dir="$RUNNER_TEMP/prob4d-${kind}-run"
            mkdir -p "$run_dir"
            (
              cd "$run_dir"
              env -u PYTHONPATH \
                PROB4D_EXPECTED_REVISION="$revision" \
                PROB4D_EXPECTED_IDENTITY_SOURCE="$expected_source" \
                "$python_bin" - <<'PY'
          import json
          import os
          from importlib import resources

          from prob4d.runtime_revision import assert_runtime_revision

          expected = os.environ["PROB4D_EXPECTED_REVISION"]
          expected_source = os.environ["PROB4D_EXPECTED_IDENTITY_SOURCE"]
          identity = json.loads(
              resources.files("prob4d")
              .joinpath("_build_identity.json")
              .read_text(encoding="utf-8")
          )
          if identity.get("source_revision") != expected:
              raise SystemExit("installed build identity revision mismatch")
          if identity.get("source_tree_clean") is not True:
              raise SystemExit("installed build identity is not clean")
          if identity.get("source_identity_source") != expected_source:
              raise SystemExit("installed build identity source mismatch")
          attestation = assert_runtime_revision(expected)
          if not attestation.matched or not attestation.independently_verified:
              raise SystemExit("installed runtime revision was not independently verified")
          if attestation.source != "installed_vcs_metadata":
              raise SystemExit("installed runtime did not use packaged provenance")
          PY
            )
          done

      - name: Prove installed-package tampering fails closed
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          python_bin="$RUNNER_TEMP/prob4d-direct-identity/bin/python"
          run_dir="$RUNNER_TEMP/prob4d-direct-tamper"
          mkdir -p "$run_dir"
          (
            cd "$run_dir"
            env -u PYTHONPATH PROB4D_EXPECTED_REVISION="$revision" \
              "$python_bin" - <<'PY'
          import os
          from pathlib import Path

          import prob4d

          package_root = Path(prob4d.__file__).resolve().parent
          target = package_root / "runtime_revision.py"
          target.write_text(
              target.read_text(encoding="utf-8") + "\n# deliberate CI tamper\n",
              encoding="utf-8",
          )

          from prob4d.runtime_revision import inspect_runtime_revision

          try:
              inspect_runtime_revision(os.environ["PROB4D_EXPECTED_REVISION"])
          except RuntimeError as error:
              if "build identity is invalid" not in str(error):
                  raise
          else:
              raise SystemExit("tampered installed package was accepted")
          PY
          )

      - name: Upload exact distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-release-build-identity
          path: dist/
          if-no-files-found: error
          retention-days: 14
