name: DEFORM DLO4/DLO5 branch mechanical repair v2

on:
  push:
    branches:
      - science/deform-dlo45-query-observability-real-v1
    paths:
      - protocols/execution_requests/deform_dlo45_branch_repair_v2.trigger

permissions:
  contents: write

concurrency:
  group: deform-dlo45-mechanical-format-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Format evidence code and remove temporary write helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-query-observability-real-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply pinned Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.1"
          files=(
            scripts/science/audit_deform_dlo45_local_segments_official_v2.py
            scripts/science/audit_deform_dlo45_local_segments_v2.py
            scripts/science/audit_deform_dlo45_observability_official_mirror_v1.py
            scripts/science/audit_deform_dlo45_observability_v1.py
            scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py
            scripts/science/calibrate_deform_dlo45_query_gate_v1.py
            scripts/science/evaluate_deform_dlo45_query_observability_official_v1.py
            scripts/science/evaluate_deform_dlo45_query_observability_v1.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m compileall -q "${files[@]}"

      - name: Remove temporary write-enabled repair helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/deform-dlo45-mechanical-format-fix.yml \
            protocols/execution_requests/deform_dlo45_mechanical_format_fix.trigger \
            .github/workflows/deform-dlo45-branch-repair-v2.yml \
            protocols/execution_requests/deform_dlo45_branch_repair_v2.trigger

      - name: Verify the staged change boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            scripts/science/audit_deform_dlo45_local_segments_official_v2.py \
            scripts/science/audit_deform_dlo45_local_segments_v2.py \
            scripts/science/audit_deform_dlo45_observability_official_mirror_v1.py \
            scripts/science/audit_deform_dlo45_observability_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py \
            scripts/science/calibrate_deform_dlo45_query_gate_v1.py \
            scripts/science/evaluate_deform_dlo45_query_observability_official_v1.py \
            scripts/science/evaluate_deform_dlo45_query_observability_v1.py
          while IFS= read -r path; do
            case "$path" in
              scripts/science/audit_deform_dlo45_local_segments_official_v2.py|\
              scripts/science/audit_deform_dlo45_local_segments_v2.py|\
              scripts/science/audit_deform_dlo45_observability_official_mirror_v1.py|\
              scripts/science/audit_deform_dlo45_observability_v1.py|\
              scripts/science/calibrate_deform_dlo45_query_gate_official_v1.py|\
              scripts/science/calibrate_deform_dlo45_query_gate_v1.py|\
              scripts/science/evaluate_deform_dlo45_query_observability_official_v1.py|\
              scripts/science/evaluate_deform_dlo45_query_observability_v1.py|\
              .github/workflows/deform-dlo45-mechanical-format-fix.yml|\
              protocols/execution_requests/deform_dlo45_mechanical_format_fix.trigger|\
              .github/workflows/deform-dlo45-branch-repair-v2.yml|\
              protocols/execution_requests/deform_dlo45_branch_repair_v2.trigger)
                ;;
              *)
                echo "Unexpected staged path: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --cached --name-only)
          test -z "$(git diff --name-only)"

      - name: Commit and push the mechanical-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && {
            echo "No mechanical repair remained."
            exit 0
          }
          git commit -m "Apply mechanical formatting to DLO evidence code"
          git push origin HEAD:science/deform-dlo45-query-observability-real-v1
