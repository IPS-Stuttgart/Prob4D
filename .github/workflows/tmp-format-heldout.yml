name: Temporary held-out promotion formatter

on:
  push:
    branches:
      - agent/heldout-provider-promotion-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the CI formatter
        run: python -m pip install "ruff==0.16.1"
      - name: Format held-out promotion sources
        run: |
          python -m ruff format \
            src/prob4d/heldout_promotion.py \
            src/prob4d/_heldout_promotion_*.py \
            src/prob4d/material_identity_cli.py \
            tests/test_heldout_promotion.py \
            tests/test_material_identity_cli.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/heldout_promotion.py \
            src/prob4d/_heldout_promotion_*.py \
            src/prob4d/material_identity_cli.py \
            tests/test_heldout_promotion.py \
            tests/test_material_identity_cli.py
          git commit -m "Format held-out promotion sources"
          git push
