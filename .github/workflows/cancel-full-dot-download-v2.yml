    branches: [science/dot-gpuserver6000-direct-v1]
    paths:
      - ".github/workflows/cancel-full-dot-download-v2.yml"

permissions:
  contents: read

concurrency:
  group: dot-gpuserver6000-stage-runtime-data-v1
  cancel-in-progress: true

jobs:
