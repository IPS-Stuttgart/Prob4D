name: Temporary Ruff format for Deform360 inventory

on:
  push:
    branches: [science/deform360-pcd-query-inventory-v1]
    paths:
      - ".github/workflows/temp-format-deform360-inventory.yml"

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.repository == 'IPS-Stuttgart/Prob4D'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-pcd-query-inventory-v1
          persist-credentials: true
      - name: Apply repository formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          python -m ruff format \
            scripts/science/inventory_deform360_pcd_archives.py \
            tests/test_deform360_pcd_query_inventory.py
          python -m ruff check \
            scripts/science/inventory_deform360_pcd_archives.py \
            tests/test_deform360_pcd_query_inventory.py
          git diff --check
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/inventory_deform360_pcd_archives.py \
            tests/test_deform360_pcd_query_inventory.py
          git rm .github/workflows/temp-format-deform360-inventory.yml
          git commit -m "Format Deform360 inventory sources"
          git push origin HEAD:science/deform360-pcd-query-inventory-v1
