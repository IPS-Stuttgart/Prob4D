# One-shot branch workflow; it removes itself before committing the implementation.
name: Apply bounded provider evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-bounded-provider-evaluation.yml"
      - ".github/patches/bounded-provider-evaluation.patch.gz.b64*"
  push:
    branches:
      - agent/bounded-provider-evaluation

permissions:
  contents: write

concurrency:
  group: apply-bounded-provider-evaluation
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-provider-evaluation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Reassemble and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/bounded-provider-evaluation.patch.gz.b64 \
            .github/patches/bounded-provider-evaluation.patch.gz.b64.part01 \
            .github/patches/bounded-provider-evaluation.patch.gz.b64.part02 \
            .github/patches/bounded-provider-evaluation.patch.gz.b64.part03 \
            .github/patches/bounded-provider-evaluation.patch.gz.b64.part04 \
            .github/patches/bounded-provider-evaluation.patch.gz.b64.part05 \
            > /tmp/bounded-provider-evaluation.patch.gz.b64
          echo '56b766fde305cd85d303effc9481df579b9941eb948b25bf1e1346988da3372e  /tmp/bounded-provider-evaluation.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/bounded-provider-evaluation.patch.gz.b64 \
            | gzip --decompress > /tmp/bounded-provider-evaluation.patch
          echo 'd8b02d879077a7ca0d4b52ae0dc2109ca29b5580a68532b13e0eaf79130846eb  /tmp/bounded-provider-evaluation.patch' \
            | sha256sum --check --strict
          git apply --check /tmp/bounded-provider-evaluation.patch
          git apply /tmp/bounded-provider-evaluation.patch

      - name: Remove one-shot staging files
        shell: bash
        run: |
          rm .github/patches/bounded-provider-evaluation.patch.gz.b64*
          rm .github/workflows/apply-bounded-provider-evaluation.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Install development environment
        run: python -m pip install -e '.[dev]'

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/benchmark_evaluation_memory.py \
            src/prob4d/_provider_evaluation_compute.py \
            src/prob4d/evaluation_memory_benchmark.py \
            src/prob4d/evaluation_modes.py \
            src/prob4d/metrics.py \
            src/prob4d/provider_evaluation.py \
            tests/test_evaluation_memory_benchmark.py \
            tests/test_metrics.py \
            tests/test_provider_evaluation.py
          python -m pytest

      - name: Commit and push implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bound provider evaluation memory'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/bounded-provider-evaluation
