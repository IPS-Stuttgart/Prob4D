# One-shot branch workflow; it removes itself before committing the implementation.
name: Apply bounded provider evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-bounded-provider-evaluation.yml"
      - ".github/patches/bounded-provider-evaluation.patch.gz.b64"
  push:
    branches:
      - agent/bounded-provider-evaluation

permissions:
  contents: write

concurrency:
  group: apply-bounded-provider-evaluation
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-provider-evaluation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/bounded-provider-evaluation.patch.gz.b64 \
            | gzip --decompress > /tmp/bounded-provider-evaluation.patch
          git apply --check /tmp/bounded-provider-evaluation.patch
          git apply /tmp/bounded-provider-evaluation.patch

      - name: Remove one-shot staging files
        shell: bash
        run: |
          rm .github/patches/bounded-provider-evaluation.patch.gz.b64
          rm .github/workflows/apply-bounded-provider-evaluation.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Install development environment
        run: python -m pip install -e '.[dev]'

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests scripts/ci
          python -m pytest

      - name: Commit and push implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bound provider evaluation memory'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/bounded-provider-evaluation
