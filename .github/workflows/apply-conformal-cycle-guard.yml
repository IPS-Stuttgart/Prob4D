name: Apply conformal cycle guard

on:
  push:
    branches:
      - agent/conformal-cycle-guard-calibration
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-conformal-cycle-guard.yml"
      - ".github/patches/conformal-cycle-guard.patch.gz.b64"
      - ".github/conformal-cycle-guard-trigger.txt"

permissions:
  contents: write

concurrency:
  group: apply-conformal-cycle-guard
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/conformal-cycle-guard-calibration
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          echo '7b8e608ee9e2de24871fc6339847c181cacc45f21efe98ada990a8aa8366f0da  .github/patches/conformal-cycle-guard.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode .github/patches/conformal-cycle-guard.patch.gz.b64 \
            | gzip --decompress > /tmp/conformal-cycle-guard.patch
          echo 'ddb35f092b8e64549b23d67997c2a7310cb4b07ca5c1901f7886f44e7c4c97f5  /tmp/conformal-cycle-guard.patch' \
            | sha256sum --check --strict
          git apply --check /tmp/conformal-cycle-guard.patch
          git apply /tmp/conformal-cycle-guard.patch

      - name: Remove one-shot staging files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patches/conformal-cycle-guard.patch.gz.b64
          rm .github/workflows/apply-conformal-cycle-guard.yml
          rm -f .github/conformal-cycle-guard-trigger.txt
          rmdir .github/patches 2>/dev/null || true

      - name: Install development environment
        run: python -m pip install -e '.[dev]'

      - name: Validate source and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/ci/check_sdist.py \
            src/prob4d/__init__.py \
            src/prob4d/cli.py \
            src/prob4d/cycle_guard_conformal_monte_carlo.py \
            src/prob4d/finite_sample_threshold.py \
            tests/test_cycle_guard_conformal_monte_carlo.py \
            tests/test_finite_sample_threshold.py
          python -m mypy \
            src/prob4d/cycle_guard_conformal_monte_carlo.py \
            src/prob4d/finite_sample_threshold.py
          python -m pytest -q \
            tests/test_causal_gauge_graph.py \
            tests/test_uncertainty_normalized_cycle_guard.py \
            tests/test_cycle_guard_monte_carlo.py \
            tests/test_cycle_guard_conformal_monte_carlo.py \
            tests/test_finite_sample_threshold.py
          python -m pytest

      - name: Build and audit distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build
          python -m twine check dist/*
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          python scripts/ci/check_sdist.py "$archive"

      - name: Commit and push clean implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add finite-sample cycle guard calibration'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/conformal-cycle-guard-calibration
