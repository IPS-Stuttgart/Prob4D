name: Materialize PR 251 scope and quality cleanup

on:
  push:
    branches: [feat/target-free-observation-rehearsal]
    paths:
      - ".github/workflows/fix-pr251-scope-and-quality.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/target-free-observation-rehearsal
          fetch-depth: 0
          persist-credentials: true

      - name: Apply narrow cleanup and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          # Keep the repository-wide quality policy unchanged in this PR.
          git checkout origin/main -- \
            .github/workflows/fail-closed-quality.yml \
            tests/test_fail_closed_quality_workflow.py
          git rm -f scripts/ci/list_stable_mypy_targets.py

          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/target_free_rehearsal.py")
          text = path.read_text(encoding="utf-8")
          old = "from pathlib import Path\nfrom typing import Any, Mapping, Sequence, cast\n"
          new = "from collections.abc import Mapping, Sequence\nfrom pathlib import Path\nfrom typing import Any, cast\n"
          if old not in text:
              raise SystemExit("target_free_rehearsal import block changed")
          text = text.replace(old, new, 1)
          old_call = "        np.savez_compressed(\n"
          new_call = "        np.savez_compressed(  # type: ignore[arg-type]\n"
          if old_call not in text:
              raise SystemExit("savez_compressed call changed")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("src/prob4d_independent_verifier/__main__.py")
          text = path.read_text(encoding="utf-8")
          old = "from pathlib import Path\nfrom typing import Sequence\n"
          new = "from collections.abc import Sequence\nfrom pathlib import Path\n"
          if old not in text:
              raise SystemExit("independent verifier CLI import block changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/prob4d_independent_verifier/observation_belief.py")
          text = path.read_text(encoding="utf-8")
          old = "from dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any, Mapping, cast\n"
          new = "from collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any, cast\n"
          if old not in text:
              raise SystemExit("independent verifier import block changed")
          text = text.replace(old, new, 1)
          old_decl = "_ARRAY_DTYPES = {\n"
          new_decl = "_ARRAY_DTYPES: dict[str, np.dtype[Any]] = {\n"
          if old_decl not in text:
              raise SystemExit("independent verifier dtype table changed")
          text = text.replace(old_decl, new_decl, 1)
          path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          text = text.replace(
              "- A generated stable-interface MyPy target inventory and full-tree Ruff enforcement\n"
              "  in the authoritative quality workflow.\n",
              "",
              1,
          )
          changelog.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/fix-pr251-scope-and-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Narrow target-free rehearsal scope and fix quality issues"
          git push origin HEAD:feat/target-free-observation-rehearsal
