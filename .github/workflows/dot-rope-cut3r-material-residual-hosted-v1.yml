name: DOT rope CUT3R material residual hosted v1

on:
  push:
    branches:
      - research/dot-rope-cut3r-material-residual-v1
    paths:
      - ".github/workflows/dot-rope-cut3r-material-residual-hosted-v1.yml"
      - "scripts/science/evaluate_dot_rope_cut3r_material_residual_hosted.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dot-rope-cut3r-material-residual-hosted-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PROTOCOL_PATH: protocols/dot-rope-cut3r-material-residual-v1.json
  PROVIDER_RUN_ID: "33329701704"
  PROVIDER_ARTIFACT_NAME: dot-rope-cut3r-sealed-provider-33329701704-1
  ARCHIVE_NAME: R01-10.zip
  ARCHIVE_BYTES: "1705947395"
  ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
  DATASET_API: https://dataverse.orc.gmu.edu/api/datasets/:persistentId/?persistentId=doi:10.13021/ORC2020/XXLVXM
  DATAFILE_API_ROOT: https://dataverse.orc.gmu.edu/api/access/datafile
  OUTPUT_DIR: outputs/dot-rope-cut3r-material-residual-hosted-v1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  truth-scored-material-residual:
    name: R01-R03 official marker truth score
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact frozen experiment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned numerical dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.2.6"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python - <<'PY'
          import numpy
          from prob4d.dot_rope_cut3r_study import Sim3, robust_fit_sim3
          assert numpy.__version__ == "2.2.6"
          print({
              "numpy": numpy.__version__,
              "kernel": [Sim3.__name__, robust_fit_sim3.__name__],
          })
          PY

      - name: Validate frozen protocol and evaluator
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python \
            scripts/science/evaluate_dot_rope_cut3r_material_residual_hosted.py \
            validate-protocol --protocol "$PROTOCOL_PATH"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python \
            scripts/science/evaluate_dot_rope_cut3r_material_residual_hosted.py \
            self-test
          python -m py_compile \
            scripts/science/evaluate_dot_rope_cut3r_material_residual.py \
            scripts/science/evaluate_dot_rope_cut3r_material_residual_hosted.py

      - name: Initialize isolated provider and dataset workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dot-rope-material-residual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$root" "$OUTPUT_DIR"
          mkdir -p "$root/provider" "$root/dataset" "$root/evidence"
          {
            echo "WORK_ROOT=$root"
            echo "PROVIDER_ROOT=$root/provider"
            echo "DATASET_ROOT=$root/dataset"
          } >> "$GITHUB_ENV"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Download exact previously sealed CUT3R bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.PROVIDER_ARTIFACT_NAME }}
          path: ${{ env.PROVIDER_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROVIDER_RUN_ID }}

      - name: Resolve official DOT archive identity
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          DATASET_API="$DATASET_API" ARCHIVE_NAME="$ARCHIVE_NAME" \
            ARCHIVE_MD5="$ARCHIVE_MD5" ARCHIVE_BYTES="$ARCHIVE_BYTES" \
            WORK_ROOT="$WORK_ROOT" python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              os.environ["DATASET_API"],
              headers={"User-Agent": "Prob4D-DOT-material-residual/1"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)
          if metadata.get("status") != "OK":
              raise SystemExit("Dataverse metadata request did not return OK")
          files = metadata["data"]["latestVersion"]["files"]
          matches = [
              entry["dataFile"]
              for entry in files
              if entry.get("dataFile", {}).get("filename")
              == os.environ["ARCHIVE_NAME"]
          ]
          if len(matches) != 1:
              raise SystemExit("official metadata did not contain one R01-10.zip")
          data_file = matches[0]
          checksum = data_file.get("checksum", {})
          if (
              checksum.get("type") != "MD5"
              or checksum.get("value", "").lower()
              != os.environ["ARCHIVE_MD5"]
          ):
              raise SystemExit("official R01-10.zip checksum changed")
          byte_count = int(data_file["filesize"])
          if byte_count != int(os.environ["ARCHIVE_BYTES"]):
              raise SystemExit("official R01-10.zip byte count changed")
          file_id = int(data_file["id"])
          receipt = {
              "dataset_persistent_id": "doi:10.13021/ORC2020/XXLVXM",
              "dataset_version": metadata["data"]["latestVersion"][
                  "versionNumber"
              ],
              "filename": data_file["filename"],
              "datafile_id": file_id,
              "byte_count": byte_count,
              "checksum": checksum,
          }
          Path(
              os.environ["WORK_ROOT"],
              "evidence",
              "official-archive-metadata.json",
          ).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"datafile_id={file_id}\n")
          PY

      - name: Download and verify official R01-10.zip
        shell: bash
        env:
          DATAFILE_ID: ${{ steps.archive.outputs.datafile_id }}
        run: |
          set -euo pipefail
          archive="$DATASET_ROOT/$ARCHIVE_NAME"
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --output "$archive" \
            "$DATAFILE_API_ROOT/$DATAFILE_ID"
          test "$(stat -c %s "$archive")" = "$ARCHIVE_BYTES"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$archive" \
            | md5sum --check --strict

      - name: Score the frozen persistent material residual
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python \
            scripts/science/evaluate_dot_rope_cut3r_material_residual_hosted.py \
            evaluate \
            --protocol "$PROTOCOL_PATH" \
            --dataset-root "$DATASET_ROOT" \
            --provider-bundle "$PROVIDER_ROOT/bundle" \
            --output-dir "$OUTPUT_DIR" \
            --repository-revision "$(git rev-parse HEAD)"

      - name: Verify baseline reproduction, custody, and bounded result
        id: result
        if: always()
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          completed = output / "result.json"
          failed = output / "technical-failure.json"
          if os.environ["EXECUTION_OUTCOME"] != "success" or not completed.is_file():
              if failed.is_file():
                  raise SystemExit(failed.read_text())
              raise SystemExit("material-residual evaluator emitted no result")
          result = json.loads(completed.read_text())
          custody = json.loads((output / "opened-members.json").read_text())
          assert result["schema"] == (
              "prob4d.dot-rope-cut3r-material-residual-evaluation"
          )
          assert result["protocol_id"] == (
              "d81b0d02dcff3a83c7c6d6b7af34f51d026a0d11319e2327ba627a72ddaa1487"
          )
          assert result["provider_bundle_id"] == (
              "952421d140731b2a6eb99df3cbd348653e04863fa457aaa490be31fe0b4c06a7"
          )
          assert result["predecessor"]["evaluation_id"] == (
              "ec86014b945b5f0d7e0d1fc8e38e5976acfb5efc7ef92fc816714c1cc5b60e09"
          )
          assert result["decision"] in {
              "source-persistent-material-residual-supported",
              "source-persistent-material-residual-not-supported",
          }
          assert [row["sequence"] for row in result["sequences"]] == [
              "R01", "R02", "R03"
          ]
          expected = {
              "R01": {
                  "identity_stitch": 0.1121561549406431,
                  "global_sim3_stitch": 0.102378521734169,
                  "continuous": 0.09497317967336762,
                  "oracle_window": 0.05504552086329353,
              },
              "R02": {
                  "identity_stitch": 0.037155100701887295,
                  "global_sim3_stitch": 0.08133969917310162,
                  "continuous": 0.06643146424886696,
                  "oracle_window": 0.02958046756677207,
              },
              "R03": {
                  "identity_stitch": 0.05728196996570019,
                  "global_sim3_stitch": 0.05804710436166074,
                  "continuous": 0.05113562321170002,
                  "oracle_window": 0.03358124100438446,
              },
          }
          for row in result["sequences"]:
              for method, reference in expected[row["sequence"]].items():
                  measured = row["method_metrics"][method][
                      "rmse_fraction_of_truth_span"
                  ]
                  assert abs(measured - reference) < 1e-8, (
                      row["sequence"], method, measured, reference
                  )
              assert row["selected_shrinkage"] in {
                  0.0, 0.25, 0.5, 0.75, 1.0
              }
          boundary = result["information_boundary"]
          assert boundary["correction_fit_uses_ground_truth"] is False
          assert boundary["reserved_payloads_opened"] is False
          assert boundary["target_outcomes_used"] is False
          assert boundary["bayesian_phystwin_executed"] is False
          assert boundary["causal4d_executed"] is False
          assert boundary["opened_sequences"] == ["R01", "R02", "R03"]
          assert boundary["reserved_sequences"] == "R04-R70"
          assert boundary["opened_member_count"] == 42
          assert custody["archive"] == "R01-10.zip"
          assert custody["reserved_sequences"] == "R04-R70"
          assert len(custody["members"]) == 42
          member = re.compile(
              r"^R0[123]/coordinates/[23]d/frame00000[1-7]_cam001[.]txt$"
          )
          assert all(member.fullmatch(row["member"]) for row in custody["members"])
          assert set(path.name for path in output.iterdir()) == {
              "correction-models.csv",
              "opened-members.json",
              "result.json",
              "sequence-metrics.csv",
              "summary.md",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"decision={result['decision']}\n")
              stream.write(f"evaluation_id={result['evaluation_id']}\n")
          print({
              "evaluation_id": result["evaluation_id"],
              "decision": result["decision"],
              "diagnostic": result["decision_diagnostic"],
          })
          PY

      - name: Assemble bounded hosted evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/evidence/result"
          if [[ -d "$OUTPUT_DIR" ]]; then
            cp -a "$OUTPUT_DIR"/. "$WORK_ROOT/evidence/result/"
          fi
          if [[ -f "$OUTPUT_DIR/summary.md" ]]; then
            cat "$OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload truth-scored source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dot-rope-cut3r-material-residual-hosted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORK_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require a complete scientific result
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.result.outputs.decision }}
        run: |
          set -euo pipefail
          test "$DECISION" = "source-persistent-material-residual-supported" \
            -o "$DECISION" = "source-persistent-material-residual-not-supported"
