name: Refresh PR 95 on schema-v2 main

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/refresh-pr95.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pr95
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/material-identity-hypothesis-stream')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/material-identity-hypothesis-stream
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate schema-v2 material-identity integration
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install 'numpy>=1.24,<2.3'
          python -m ruff check \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py \
            src/prob4d/causal_tracklets.py \
            src/prob4d/cross_window_tracklets.py
          python -m ruff format --check \
            src/prob4d/material_identity_stream.py \
            tests/test_material_identity_stream.py
          python -m mypy src/prob4d/material_identity_stream.py
          python -m pytest -q \
            tests/test_material_identity_stream.py \
            tests/test_causal_tracklets.py \
            tests/test_cross_window_tracklets.py
          git diff --check
      - name: Publish refreshed branch
        run: git push origin HEAD:agent/material-identity-hypothesis-stream
