name: Restore exact cycle-guard protocol verification

on:
  push:
    branches:
      - agent/normalize-cycle-guard

permissions:
  contents: write

concurrency:
  group: restore-exact-cycle-guard-protocol
  cancel-in-progress: true

jobs:
  restore-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/normalize-cycle-guard
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore exact frozen-protocol equality
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cycle-guard-normalization.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          report_claim = report["claim_boundary"]
          protocol_claim = protocol["claim_boundary"]
          assert report_claim.startswith(
              "Controlled synthetic source-cycle admission only"
          )
          assert protocol_claim.startswith(
              "Controlled synthetic source-cycle admission only"
          )
          for excluded_claim in (
              "physical-object",
              "BayesianPhysTwin",
              "harmful-update",
              "Causal4D",
          ):
              assert excluded_claim in report_claim
              assert excluded_claim in protocol_claim
'''
          new = '''          assert report["claim_boundary"] == protocol["claim_boundary"]
'''
          if text.count(old) != 1:
              raise RuntimeError('semantic claim-boundary verifier changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused implementation
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/prob4d/uncertainty_normalized_cycles.py \
            src/prob4d/uncertainty_guarded_causal_gauge_graph.py \
            src/prob4d/cycle_guard_monte_carlo.py \
            src/prob4d/cli.py \
            tests/test_uncertainty_normalized_cycle_guard.py \
            tests/test_cycle_guard_monte_carlo.py
          python -m pytest -q \
            tests/test_causal_gauge_graph.py \
            tests/test_uncertainty_normalized_cycle_guard.py \
            tests/test_cycle_guard_monte_carlo.py
      - name: Remove one-shot files and publish correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/restore-exact-cycle-guard-protocol.yml
          rm -f .github/exact-cycle-guard-protocol-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/cycle-guard-normalization.yml \
            .github/workflows/restore-exact-cycle-guard-protocol.yml \
            .github/exact-cycle-guard-protocol-trigger.txt
          git diff --cached --check
          git commit -m 'Restore exact cycle guard protocol verification'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/normalize-cycle-guard
