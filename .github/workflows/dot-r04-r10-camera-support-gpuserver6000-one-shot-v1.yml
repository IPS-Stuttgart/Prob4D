name: One-shot DOT R04-R10 retained CUT3R cache census

on:
  push:
    branches:
      - ops/dot-camera-audit-gpuserver6000-v1
    paths:
      - .github/workflows/dot-r04-r10-camera-support-gpuserver6000-one-shot-v1.yml

permissions:
  contents: read

jobs:
  census:
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 15
    env:
      CACHE_ROOT: /home/github-runner/.cache/prob4d/dot-r04-r10-cut3r-gpuserver6000-v1
      ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
      CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
    steps:
      - name: Inventory reusable marker-free cache without reading reserved payloads
        id: census
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = workstation2
          test -d "$CACHE_ROOT"
          test -f "$CACHE_ROOT/dot-v29/R01-10.zip"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$CACHE_ROOT/dot-v29/R01-10.zip" | md5sum --check --strict
          output="$RUNNER_TEMP/dot-r04-r10-retained-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          CACHE_ROOT="$CACHE_ROOT" OUTPUT="$output" python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CACHE_ROOT"]).resolve(strict=True)
          allowed_json_names = {
              "manifest.json",
              "runtime-receipt.json",
              "result.json",
              "marker-support.json",
          }

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          files = []
          manifests = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              suffix = path.suffix.lower()
              record = {
                  "path": relative,
                  "bytes": path.stat().st_size,
              }
              if suffix in {".json", ".npz", ".pth", ".so"}:
                  record["sha256"] = sha256(path)
              files.append(record)
              if path.name in allowed_json_names and path.stat().st_size <= 2_000_000:
                  try:
                      value = json.loads(path.read_text(encoding="utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      continue
                  manifests[relative] = {
                      key: value.get(key)
                      for key in (
                          "schema",
                          "schema_version",
                          "decision",
                          "provider_bundle_id",
                          "artifact_id",
                          "evaluation_id",
                          "request_id",
                          "protocol_id",
                          "information_boundary",
                      )
                      if key in value
                  }

          result = {
              "schema": "prob4d.dot-r04-r10-retained-cut3r-cache-census",
              "schema_version": 1,
              "cache_root": root.as_posix(),
              "files": files,
              "safe_json_summaries": manifests,
              "scientific_boundary": {
                  "archive_payload_read": False,
                  "marker_payload_read": False,
                  "provider_prediction_array_read": False,
                  "r11_r70_opened": False,
                  "performance_metrics_computed": False,
              },
          }
          encoded = json.dumps(result, sort_keys=True, separators=(",", ":")).encode()
          result["census_id"] = hashlib.sha256(encoded).hexdigest()
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "census_id": result["census_id"],
              "file_count": len(files),
              "json_summaries": sorted(manifests),
              "top_level": sorted(path.name for path in root.iterdir()),
          }, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"result={os.environ['OUTPUT']}\n")
          PY

      - name: Upload bounded retained-cache census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dot-r04-r10-retained-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.census.outputs.result }}
          if-no-files-found: error
          retention-days: 90
