name: One-shot DOT R04-R10 archive layout census on gpuserver6000

on:
  push:
    branches:
      - ops/dot-camera-audit-gpuserver6000-v1
    paths:
      - .github/workflows/dot-r04-r10-camera-support-gpuserver6000-one-shot-v1.yml

permissions:
  contents: read

jobs:
  census:
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 20
    env:
      DATASET_ROOT: /home/github-runner/.cache/prob4d/dot-r04-r10-cut3r-gpuserver6000-v1/dot-v29
      ARCHIVE_NAME: R01-10.zip
      ARCHIVE_MD5: ca546ff5f22c0279123ccb18509858ee
    steps:
      - name: Verify intended runner and official archive
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -f "$DATASET_ROOT/$ARCHIVE_NAME"
          test ! -L "$DATASET_ROOT/$ARCHIVE_NAME"
          printf '%s  %s\n' "$ARCHIVE_MD5" "$DATASET_ROOT/$ARCHIVE_NAME" | md5sum --check --strict

      - name: Enumerate camera, 2-D, and 3-D carrier identities without reading payloads
        id: census
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dot-r04-r10-layout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          ARCHIVE="$DATASET_ROOT/$ARCHIVE_NAME" OUTPUT="$out" python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import zipfile
          from collections import defaultdict
          from pathlib import Path

          archive_path = Path(os.environ["ARCHIVE"])
          output = Path(os.environ["OUTPUT"])
          sequences = [f"R{i:02d}" for i in range(4, 11)]
          frames = range(1, 8)
          image_re = re.compile(r"^(R(?:0[4-9]|10))/images/normal_view/frame(\d{6})_(cam\d+)\.jpg$")
          two_re = re.compile(r"^(R(?:0[4-9]|10))/coordinates/2d/frame(\d{6})(?:_(cam\d+))?\.txt$")
          three_re = re.compile(r"^(R(?:0[4-9]|10))/coordinates/3d/frame(\d{6})(?:_(cam\d+))?\.txt$")

          records = {
              seq: {
                  str(frame): {"images": [], "coordinates_2d": [], "coordinates_3d": []}
                  for frame in frames
              }
              for seq in sequences
          }
          with zipfile.ZipFile(archive_path, "r") as archive:
              names = archive.namelist()
              for name in names:
                  for kind, regex in (
                      ("images", image_re),
                      ("coordinates_2d", two_re),
                      ("coordinates_3d", three_re),
                  ):
                      match = regex.match(name)
                      if match is None:
                          continue
                      sequence = match.group(1)
                      frame = int(match.group(2))
                      if sequence in records and frame in frames:
                          records[sequence][str(frame)][kind].append(name)
                      break
              examples = {
                  "R04_frame1_coordinate_members": sorted(
                      name for name in names
                      if name.startswith("R04/coordinates/") and "frame000001" in name
                  ),
                  "R04_frame1_image_members": sorted(
                      name for name in names
                      if name.startswith("R04/images/normal_view/frame000001")
                  ),
              }

          for sequence in records:
              for frame in records[sequence].values():
                  for kind in frame:
                      frame[kind].sort()

          result = {
              "schema": "prob4d.dot-r04-r10-archive-layout-census",
              "schema_version": 1,
              "archive": archive_path.name,
              "archive_md5": os.environ["ARCHIVE_MD5"],
              "sequences": sequences,
              "frames": list(frames),
              "records": records,
              "examples": examples,
              "scientific_boundary": {
                  "zip_member_payloads_read": False,
                  "r11_r70_opened": False,
                  "performance_metrics_computed": False,
                  "frozen_result_reinterpreted": False,
              },
          }
          encoded = json.dumps(result, sort_keys=True, separators=(",", ":")).encode()
          result["census_id"] = hashlib.sha256(encoded).hexdigest()
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "census_id": result["census_id"],
              **examples,
          }, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"result={output}\n")
          PY

      - name: Upload bounded archive-layout census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dot-r04-r10-layout-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.census.outputs.result }}
          if-no-files-found: error
          retention-days: 90
