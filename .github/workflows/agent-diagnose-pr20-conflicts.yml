name: Diagnose PR 20 merge conflicts

on:
  push:
    branches:
      - agent/content-addressed-covariance-calibration

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/content-addressed-covariance-calibration
          fetch-depth: 0
          show-progress: false
      - name: Merge current main without committing
        id: merge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          mkdir -p conflict-bundle/base conflict-bundle/pr conflict-bundle/main
          git status --short > conflict-bundle/status.txt
          git diff --name-only --diff-filter=U > conflict-bundle/conflicts.txt
          git diff --cc > conflict-bundle/combined.diff

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "conflict-bundle/base/$(dirname "$path")"
            mkdir -p "conflict-bundle/pr/$(dirname "$path")"
            mkdir -p "conflict-bundle/main/$(dirname "$path")"
            git show ":1:$path" > "conflict-bundle/base/$path" 2>/dev/null || true
            git show ":2:$path" > "conflict-bundle/pr/$path" 2>/dev/null || true
            git show ":3:$path" > "conflict-bundle/main/$path" 2>/dev/null || true
          done < conflict-bundle/conflicts.txt

          {
            echo '### Automated merge-conflict diagnostic'
            echo
            echo "Merge exit status: \`$status\`"
            echo
            echo '#### Conflicted paths'
            echo '```text'
            cat conflict-bundle/conflicts.txt
            echo '```'
            echo
            echo '#### Working-tree status'
            echo '```text'
            cat conflict-bundle/status.txt
            echo '```'
            echo
            echo '<details><summary>Combined conflict diff</summary>'
            echo
            echo '```diff'
            head -c 50000 conflict-bundle/combined.diff
            echo
            echo '```'
            echo '</details>'
          } > conflict-bundle/comment.md
      - name: Publish diagnostic on PR 20
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 20 --repo FlorianPfaff/Prob4D --body-file conflict-bundle/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr20-conflict-bundle
          path: conflict-bundle
          if-no-files-found: error
          retention-days: 1
      - name: Report merge result
        if: always()
        shell: bash
        run: |
          test "${{ steps.merge.outputs.status }}" = "0"
