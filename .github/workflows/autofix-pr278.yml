name: Autofix PR 278 formatting

on:
  push:
    branches:
      - agent/cut3r-support-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cut3r-support-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply the pinned Ruff fixes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.1
          python -m ruff check --fix \
            src/prob4d/_cut3r_source_competence_audit_manifest.py \
            tests/test_cut3r_source_competence_audit.py
          python -m ruff format \
            src/prob4d/_cut3r_source_competence_audit_manifest.py \
            tests/test_cut3r_source_competence_audit.py
          rm .github/workflows/autofix-pr278.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix CUT3R audit formatting"
          git push origin HEAD:agent/cut3r-support-audit
