name: Finalize inherited self-hosted workflow policy repair

on:
  push:
    branches:
      - fix/dot-r04-r10-curope-integration-v4
    paths:
      - .github/workflows/diagnose-self-hosted-policy-v1.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-curope-integration-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Register reviewed workflows and remove this diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/_trusted_self_hosted_validation_policy_base.py")
          text = path.read_text(encoding="utf-8")

          constants_anchor = (
              'DOT_CUT3R_RUNTIME_COMPLETE_WORKFLOW = '
              'WORKFLOW_ROOT / "complete-dot-cut3r-cu126-runtime.yml"\n'
              'CUT3R_RUNNER_SELECTOR = (\n'
          )
          constants = (
              'DOT_CUT3R_RUNTIME_COMPLETE_WORKFLOW = '
              'WORKFLOW_ROOT / "complete-dot-cut3r-cu126-runtime.yml"\n'
              'DOT_FROZEN_PROVIDER_PREWARM_RECOVERY_V2_WORKFLOW = (\n'
              '    WORKFLOW_ROOT / "dot-frozen-provider-prewarm-recovery-v2.yml"\n'
              ')\n'
              'DOT_ROPE_QUERY_SELECTIVE_HELDOUT_WORKFLOW = (\n'
              '    WORKFLOW_ROOT / "dot-rope-query-selective-heldout-v1.yml"\n'
              ')\n'
              'DOT_ROPE_R04_R10_ARCHIVE_RECOVERY_V2_WORKFLOW = (\n'
              '    WORKFLOW_ROOT / "recover-dot-r04-r10-archive-cache-v2.yml"\n'
              ')\n'
              'DOT_ROPE_R04_R10_ARCHIVE_RELAY_WORKFLOW = (\n'
              '    WORKFLOW_ROOT / "relay-dot-r04-r10-archive-v1.yml"\n'
              ')\n'
              'TRACKING_CLOTH_QUERY_PORTFOLIO_WORKFLOW = (\n'
              '    WORKFLOW_ROOT / "tracking-cloth-query-portfolio-v1.yml"\n'
              ')\n'
              'CUT3R_RUNNER_SELECTOR = (\n'
          )
          if text.count(constants_anchor) != 1:
              raise SystemExit("trusted-workflow constants anchor changed")
          text = text.replace(constants_anchor, constants, 1)

          tuple_anchor = (
              '    DOT_CUT3R_RUNTIME_BOOTSTRAP_WORKFLOW,\n'
              '    DOT_CUT3R_RUNTIME_COMPLETE_WORKFLOW,\n'
              ')\n'
          )
          tuple_replacement = (
              '    DOT_CUT3R_RUNTIME_BOOTSTRAP_WORKFLOW,\n'
              '    DOT_CUT3R_RUNTIME_COMPLETE_WORKFLOW,\n'
              '    DOT_FROZEN_PROVIDER_PREWARM_RECOVERY_V2_WORKFLOW,\n'
              '    DOT_ROPE_QUERY_SELECTIVE_HELDOUT_WORKFLOW,\n'
              '    DOT_ROPE_R04_R10_ARCHIVE_RECOVERY_V2_WORKFLOW,\n'
              '    DOT_ROPE_R04_R10_ARCHIVE_RELAY_WORKFLOW,\n'
              '    TRACKING_CLOTH_QUERY_PORTFOLIO_WORKFLOW,\n'
              ')\n'
          )
          if text.count(tuple_anchor) != 1:
              raise SystemExit("trusted-workflow tuple anchor changed")
          text = text.replace(tuple_anchor, tuple_replacement, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          helper=.github/workflows/diagnose-self-hosted-policy-v1.yml
          /usr/bin/git rm -- "$helper"
          /usr/bin/git diff --check

          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/_trusted_self_hosted_validation_policy_base.py")
          spec = importlib.util.spec_from_file_location("policy", path)
          assert spec is not None and spec.loader is not None
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          policy.test_only_reviewed_protected_workflows_can_use_self_hosted_runners()
          expected = {
              ".github/workflows/dot-frozen-provider-prewarm-recovery-v2.yml",
              ".github/workflows/dot-rope-query-selective-heldout-v1.yml",
              ".github/workflows/recover-dot-r04-r10-archive-cache-v2.yml",
              ".github/workflows/relay-dot-r04-r10-archive-v1.yml",
              ".github/workflows/tracking-cloth-query-portfolio-v1.yml",
          }
          registered = {
              item.relative_to(policy.ROOT).as_posix()
              for item in policy.TRUSTED_SELF_HOSTED_WORKFLOWS
          }
          assert expected <= registered
          PY

          mapfile -t changed < <(
            /usr/bin/git status --short |
              sed -E 's/^...//' |
              sort
          )
          expected=(
            .github/workflows/diagnose-self-hosted-policy-v1.yml
            tests/_trusted_self_hosted_validation_policy_base.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          /usr/bin/git config user.name "github-actions[bot]"
          /usr/bin/git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          /usr/bin/git add -A
          /usr/bin/git commit -m \
            "Register recently reviewed protected self-hosted workflows"
          commit=$(/usr/bin/git rev-parse HEAD)
          echo "MATERIALIZED_COMMIT=$commit"
          /usr/bin/git push origin \
            HEAD:fix/dot-r04-r10-curope-integration-v4
