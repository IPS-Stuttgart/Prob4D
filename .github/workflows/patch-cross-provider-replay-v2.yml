name: Apply cross-provider replay hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/patch-cross-provider-replay-v2.yml"

permissions:
  contents: write

concurrency:
  group: patch-cross-provider-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed replay hardening
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(path: Path, old: str, new: str, marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one {marker}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          module = Path("src/prob4d/cross_provider_guard.py")

          old = (
              "        first_manifest, _ = verify_prediction_provider_manifest(\n"
              "            first_manifest_path,\n"
              "            verify_payloads=True,\n"
              "        )\n"
              "        second_manifest, _ = verify_prediction_provider_manifest(\n"
              "            second_manifest_path,\n"
              "            verify_payloads=True,\n"
              "        )\n"
          )
          new = (
              "        first_manifest_sha256 = _sha256_file(first_manifest_path)\n"
              "        second_manifest_sha256 = _sha256_file(second_manifest_path)\n"
              + old
              + "        if _sha256_file(first_manifest_path) != first_manifest_sha256:\n"
              "            raise ValueError(\n"
              "                \"first provider manifest changed during verification\"\n"
              "            )\n"
              "        if _sha256_file(second_manifest_path) != second_manifest_sha256:\n"
              "            raise ValueError(\n"
              "                \"second provider manifest changed during verification\"\n"
              "            )\n"
          )
          replace_once(module, old, new, "manifest verification block")
          replace_once(
              module,
              "                first_manifest_sha256=_sha256_file(first_manifest_path),\n"
              "                second_manifest_sha256=_sha256_file(second_manifest_path),\n",
              "                first_manifest_sha256=first_manifest_sha256,\n"
              "                second_manifest_sha256=second_manifest_sha256,\n",
              "manifest score hashes",
          )

          for artifact_name in ("calibration", "decision"):
              old = (
                  "        metadata = frozen_finite_json_mapping(\n"
                  "            require_finite_json_mapping(\n"
                  "                self.metadata,\n"
                  f"                name=\"cross-provider {artifact_name} metadata\",\n"
                  "            ),\n"
                  f"            name=\"cross-provider {artifact_name} metadata\",\n"
                  "        )\n"
              )
              new = old.replace(
                  "require_finite_json_mapping(",
                  "_required_source_only_metadata(",
                  1,
              )
              replace_once(module, old, new, f"{artifact_name} source-only metadata")

          replace_once(
              module,
              "    verify_calibration = subparsers.add_parser(\"verify-calibration\")\n"
              "    verify_calibration.add_argument(\"calibration\")\n\n"
              "    verify_decision = subparsers.add_parser(\"verify-decision\")\n"
              "    verify_decision.add_argument(\"decision\")\n"
              "    verify_decision.add_argument(\"--calibration\", required=True)\n",
              "    verify_calibration = subparsers.add_parser(\"verify-calibration\")\n"
              "    verify_calibration.add_argument(\"calibration\")\n"
              "    verify_calibration.add_argument(\"--panel\", required=True)\n\n"
              "    verify_decision = subparsers.add_parser(\"verify-decision\")\n"
              "    verify_decision.add_argument(\"decision\")\n"
              "    verify_decision.add_argument(\"--calibration\", required=True)\n"
              "    verify_decision.add_argument(\"--panel\", required=True)\n",
              "verify parser arguments",
          )

          text = module.read_text(encoding="utf-8")
          start_marker = '    if arguments.command == "verify-calibration":\n'
          end_marker = '    if arguments.command == "stress":\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("verify implementation boundaries changed")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          verify_block = indent(
              dedent('''
                  if arguments.command == "verify-calibration":
                      calibration = load_cross_provider_calibration(arguments.calibration)
                      panel = evaluate_cross_provider_panel(
                          arguments.panel,
                          row_quantile=calibration.row_quantile,
                          expected_purpose="calibration",
                      )
                      replayed = fit_cross_provider_calibration(
                          panel,
                          miscoverage=calibration.finite_sample_threshold.miscoverage,
                          row_quantile=calibration.row_quantile,
                          minimum_support_fraction=calibration.minimum_support_fraction,
                      )
                      if replayed.to_record() != calibration.to_record():
                          raise ValueError(
                              "calibration artifact does not match deterministic replay"
                          )
                      print(
                          json.dumps(
                              {
                                  "artifact_id": calibration.artifact_id,
                                  "calibration_case_count": len(calibration.calibration_cases),
                                  "threshold": calibration.finite_sample_threshold.threshold,
                              },
                              indent=2,
                              sort_keys=True,
                          )
                      )
                      return 0
                  if arguments.command == "verify-decision":
                      calibration = load_cross_provider_calibration(arguments.calibration)
                      decision = load_cross_provider_decision(arguments.decision)
                      panel = evaluate_cross_provider_panel(
                          arguments.panel,
                          row_quantile=calibration.row_quantile,
                          expected_purpose="target",
                      )
                      replayed = apply_cross_provider_calibration(calibration, panel)
                      if replayed.to_record() != decision.to_record():
                          raise ValueError(
                              "decision artifact does not match deterministic replay"
                          )
                      print(
                          json.dumps(
                              {
                                  "artifact_id": decision.artifact_id,
                                  "accepted_count": decision.accepted_count,
                                  "rejected_count": decision.rejected_count,
                              },
                              indent=2,
                              sort_keys=True,
                          )
                      )
                      return 0
              ''').strip() + "\n",
              "    ",
          )
          module.write_text(text[:start] + verify_block + text[end:], encoding="utf-8")

          docs = Path("docs/cross-provider-guard.md")
          replace_once(
              docs,
              "prob4d diagnostic cross-provider-guard verify-calibration \\\n"
              "  cross-provider-calibration.json\n\n"
              "prob4d diagnostic cross-provider-guard verify-decision \\\n"
              "  cross-provider-decision.json \\\n"
              "  --calibration cross-provider-calibration.json\n",
              "prob4d diagnostic cross-provider-guard verify-calibration \\\n"
              "  cross-provider-calibration.json \\\n"
              "  --panel calibration-panel.json\n\n"
              "prob4d diagnostic cross-provider-guard verify-decision \\\n"
              "  cross-provider-decision.json \\\n"
              "  --calibration cross-provider-calibration.json \\\n"
              "  --panel target-panel.json\n",
              "documentation replay commands",
          )

          tests = Path("tests/test_cross_provider_guard.py")
          replace_once(
              tests,
              "    assert loaded_calibration.artifact_id == calibration.artifact_id\n",
              "    assert loaded_calibration.artifact_id == calibration.artifact_id\n"
              "    assert (\n"
              "        cross_provider.main(\n"
              "            [\n"
              "                \"verify-calibration\",\n"
              "                str(calibration_path),\n"
              "                \"--panel\",\n"
              "                str(calibration_panel_path),\n"
              "            ]\n"
              "        )\n"
              "        == 0\n"
              "    )\n",
              "calibration replay assertion",
          )
          replace_once(
              tests,
              "    assert load_cross_provider_decision(decision_path).artifact_id == decision.artifact_id\n",
              "    assert load_cross_provider_decision(decision_path).artifact_id == decision.artifact_id\n"
              "    assert (\n"
              "        cross_provider.main(\n"
              "            [\n"
              "                \"verify-decision\",\n"
              "                str(decision_path),\n"
              "                \"--calibration\",\n"
              "                str(calibration_path),\n"
              "                \"--panel\",\n"
              "                str(target_panel_path),\n"
              "            ]\n"
              "        )\n"
              "        == 0\n"
              "    )\n",
              "decision replay assertion",
          )
          text = tests.read_text(encoding="utf-8")
          marker = (
              "\ndef test_controlled_stress_exposes_provider_specific_but_not_shared_bias()"
              " -> None:\n"
          )
          if text.count(marker) != 1 or "test_resigned_source_only_metadata_tamper" in text:
              raise SystemExit("metadata tamper test insertion marker changed")
          addition = dedent('''

              def test_resigned_source_only_metadata_tamper_is_rejected(tmp_path: Path) -> None:
                  first_path, first, second_path, second = _provider_pair(tmp_path)
                  matched = tmp_path / "matched.npz"
                  _matched(matched)
                  panel_path = tmp_path / "panel.json"
                  _panel(
                      panel_path,
                      purpose="calibration",
                      first_manifest=first_path,
                      second_manifest=second_path,
                      first_payload_id=str(first.payloads[0].payload_id),
                      second_payload_id=str(second.payloads[0].payload_id),
                      matched=matched,
                  )
                  calibration = fit_cross_provider_calibration(
                      evaluate_cross_provider_panel(
                          panel_path,
                          row_quantile=0.95,
                          expected_purpose="calibration",
                      ),
                      miscoverage=0.5,
                      row_quantile=0.95,
                      minimum_support_fraction=0.75,
                  )
                  record = calibration.to_record()
                  metadata = record["metadata"]
                  assert isinstance(metadata, dict)
                  metadata["uses_truth"] = True
                  descriptor = {
                      key: value for key, value in record.items() if key != "artifact_id"
                  }
                  record["artifact_id"] = cross_provider._sha256_json(descriptor)
                  path = tmp_path / "metadata-tampered.json"
                  path.write_text(json.dumps(record), encoding="utf-8")
                  with pytest.raises(ValueError, match="uses_truth=false"):
                      load_cross_provider_calibration(path)
          ''')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Validate and publish exact source
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-cross-provider-replay-venv"
          python -m venv --clear "$environment"
          echo "$environment/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3" "ruff==0.16.1"
          files=(
            src/prob4d/cross_provider_guard.py
            tests/test_cross_provider_guard.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- src/prob4d/cli.py "${files[@]}"
          python -m ruff format --check --diff -- src/prob4d/cli.py "${files[@]}"
          python -m mypy --python-version 3.12 src/prob4d/cross_provider_guard.py
          python -m pytest -q \
            tests/test_cross_provider_guard.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_vggt_provider_adapter.py \
            tests/test_finite_sample_threshold.py
          python -m compileall -q src/prob4d
          python -m pip check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/cross-provider-guard.md \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git commit -m "Require deterministic cross-provider artifact replay"
          git push origin HEAD:agent/cross-provider-guard-v1
