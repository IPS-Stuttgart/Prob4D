name: Apply DOT R04-R10 shared-3D support-audit fix

on:
  push:
    branches:
      - fix/dot-r04-r10-shared-3d-support-v1
    paths:
      - .github/workflows/apply-dot-r04-r10-shared-3d-fix-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dot-r04-r10-shared-3d-support-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the census-proven carrier correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/audit_dot_r04_r10_camera_support.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'ARCHIVE_MD5 = "ca546ff5f22c0279123ccb18509858ee"\n',
                  'ARCHIVE_MD5 = "ca546ff5f22c0279123ccb18509858ee"\n'
                  'SHARED_3D_CAMERA = "cam001"\n'
                  'LAYOUT_CENSUS_ID = "74f090a99d6740ac3388c43493531ea5168291e4c5a709fb74344e45b46b4f19"\n',
              ),
              (
                  'def image_member(sequence: str, frame: int, camera: str) -> str:\n'
                  '    return f"{sequence}/images/normal_view/frame{frame:06d}_{camera}.jpg"\n\n\n',
                  'def image_member(sequence: str, frame: int, camera: str) -> str:\n'
                  '    return f"{sequence}/images/normal_view/frame{frame:06d}_{camera}.jpg"\n\n\n'
                  'def coordinate_members(sequence: str, frame: int, camera: str) -> tuple[str, str]:\n'
                  '    """Return one camera-specific 2-D carrier and the shared 3-D carrier."""\n\n'
                  '    return (\n'
                  '        member(sequence, 2, frame, camera),\n'
                  '        member(sequence, 3, frame, SHARED_3D_CAMERA),\n'
                  '    )\n\n\n',
              ),
              (
                  '                    image_name = image_member(sequence, frame, camera)\n'
                  '                    two_name = member(sequence, 2, frame, camera)\n'
                  '                    three_name = member(sequence, 3, frame, camera)\n',
                  '                    image_name = image_member(sequence, frame, camera)\n'
                  '                    two_name, three_name = coordinate_members(\n'
                  '                        sequence, frame, camera\n'
                  '                    )\n',
              ),
              (
                  '                    count = min(len(rows_2d), len(rows_3d))\n'
                  '                    rows_2d = rows_2d[:count]\n'
                  '                    rows_3d = rows_3d[:count]\n',
                  '                    if len(rows_2d) != len(rows_3d):\n'
                  '                        raise ValueError(\n'
                  '                            "camera-specific 2-D and shared 3-D row counts differ: "\n'
                  '                            f"{sequence}:{camera}:{frame:06d}:"\n'
                  '                            f"{len(rows_2d)}!={len(rows_3d)}"\n'
                  '                        )\n'
                  '                    count = len(rows_2d)\n',
              ),
              (
                  '                    per_frame[f"{sequence}:{camera}:{frame:06d}"] = {\n'
                  '                        "image_size": [width, height],\n',
                  '                    per_frame[f"{sequence}:{camera}:{frame:06d}"] = {\n'
                  '                        "image_size": [width, height],\n'
                  '                        "two_d_member": two_name,\n'
                  '                        "shared_3d_member": three_name,\n',
              ),
              (
                  '        "dataset": {\n'
                  '            "archive": ARCHIVE,\n'
                  '            "archive_md5": ARCHIVE_MD5,\n'
                  '            "cameras_present_on_every_sequence": cameras,\n'
                  '        },\n',
                  '        "dataset": {\n'
                  '            "archive": ARCHIVE,\n'
                  '            "archive_md5": ARCHIVE_MD5,\n'
                  '            "cameras_present_on_every_sequence": cameras,\n'
                  '            "coordinate_layout": (\n'
                  '                "camera-specific 2-D coordinates with one shared cam001 "\n'
                  '                "3-D carrier per sequence and frame"\n'
                  '            ),\n'
                  '            "shared_3d_camera_label": SHARED_3D_CAMERA,\n'
                  '            "layout_census_id": LAYOUT_CENSUS_ID,\n'
                  '        },\n',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"patch marker is not unique: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python3 -m py_compile scripts/science/audit_dot_r04_r10_camera_support.py

      - name: Commit the implementation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/audit_dot_r04_r10_camera_support.py
          git commit -m "Use DOT's shared 3-D carrier across camera views"
          git push origin HEAD:fix/dot-r04-r10-shared-3d-support-v1
