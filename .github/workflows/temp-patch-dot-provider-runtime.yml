name: Temporary patch DOT provider runtime binding

on:
  push:
    branches: [fix/dot-provider-bind-cu126-runtime]
    paths:
      - ".github/workflows/temp-patch-dot-provider-runtime.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-provider-bind-cu126-runtime
          fetch-depth: 0
          persist-credentials: true
      - name: Bind provider to the sealed persistent runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/dot-rope-cut3r-native-provider-v1.yml')
          text = workflow_path.read_text(encoding='utf-8')

          anchor = '  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/dot\n'
          addition = anchor + (
              '  CUT3R_RUNTIME_ROOT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1\n'
              '  CUT3R_RUNTIME_CHECKOUT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/CUT3R\n'
              '  CUT3R_RUNTIME_PYTHON: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python\n'
              '  CUT3R_RUNTIME_CHECKPOINT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/cut3r_512_dpt_4_64.pth\n'
              '  CUT3R_RUNTIME_MANIFEST: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/bootstrap-manifest.json\n'
              '  CUT3R_REVISION: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf\n'
              '  CUT3R_CHECKPOINT_SHA256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('dataset-root anchor changed')
          text = text.replace(anchor, addition, 1)

          select_pattern = re.compile(
              r'      - name: Select the retained CUT3R interpreter\n.*?'
              r'(?=      - name: Copy and bind the native-RoPE runtime\n)',
              re.DOTALL,
          )
          select_replacement = '''      - name: Bind the sealed persistent CUT3R runtime
        id: python
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CUT3R_RUNTIME_PYTHON"
          test -d "$CUT3R_RUNTIME_CHECKOUT/.git"
          test -f "$CUT3R_RUNTIME_CHECKPOINT"
          test -f "$CUT3R_RUNTIME_MANIFEST"
          test "$(/usr/bin/git -C "$CUT3R_RUNTIME_CHECKOUT" rev-parse HEAD)" = \
            "$CUT3R_REVISION"
          test "$(sha256sum "$CUT3R_RUNTIME_CHECKPOINT" | awk '{print $1}')" = \
            "$CUT3R_CHECKPOINT_SHA256"
          MANIFEST="$CUT3R_RUNTIME_MANIFEST" \
            EXPECTED_REVISION="$CUT3R_REVISION" \
            EXPECTED_CHECKPOINT_SHA256="$CUT3R_CHECKPOINT_SHA256" \
            EXPECTED_PYTHON="$CUT3R_RUNTIME_PYTHON" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          if manifest.get("cut3r_revision") != os.environ["EXPECTED_REVISION"]:
              raise SystemExit("runtime manifest binds another CUT3R revision")
          checkpoint = manifest.get("checkpoint") or {}
          if checkpoint.get("sha256") != os.environ["EXPECTED_CHECKPOINT_SHA256"]:
              raise SystemExit("runtime manifest binds another checkpoint")
          if manifest.get("runtime_python") != os.environ["EXPECTED_PYTHON"]:
              raise SystemExit("runtime manifest binds another interpreter")
          if not str(manifest.get("torch_version", "")).startswith("2.11.0"):
              raise SystemExit("runtime manifest binds another Torch version")
          if manifest.get("torch_cuda_version") != "12.6":
              raise SystemExit("runtime manifest binds another CUDA version")
          if manifest.get("cuda_available") is not True:
              raise SystemExit("runtime manifest does not attest CUDA")
          if manifest.get("dot_dataset_accessed") is not False:
              raise SystemExit("runtime bootstrap crossed the DOT data boundary")
          native_id = manifest.get("native_rope_artifact_id")
          if not isinstance(native_id, str) or len(native_id) != 64:
              raise SystemExit("runtime manifest has no native RoPE identity")
          PY
          PYTHONPATH="$CUT3R_RUNTIME_CHECKOUT:$CUT3R_RUNTIME_CHECKOUT/src" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import torch
          from dust3r.model import ARCroco3DStereo

          print(f"dust3r_model_import={ARCroco3DStereo.__name__}")
          print(f"torch={torch.__version__}")
          print(f"torch_cuda={torch.version.cuda}")
          print(f"cuda_device={torch.cuda.get_device_name(0)}")
          if torch.version.cuda != "12.6" or not torch.cuda.is_available():
              raise SystemExit("persistent CUT3R runtime is not CUDA 12.6")
          PY
          echo "python=$CUT3R_RUNTIME_PYTHON" >> "$GITHUB_OUTPUT"
'''
          text, count = select_pattern.subn(select_replacement, text, count=1)
          if count != 1:
              raise SystemExit('interpreter-selection step changed')

          copy_pattern = re.compile(
              r'      - name: Copy and bind the native-RoPE runtime\n.*?'
              r'(?=      - name: Run synthetic native-RoPE forward pass\n)',
              re.DOTALL,
          )
          copy_replacement = '''      - name: Copy and bind the sealed native-RoPE runtime
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-dot-cut3r-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/mkdir -p "$root/CUT3R"
          /usr/bin/cp -a "$CUT3R_RUNTIME_CHECKOUT/." "$root/CUT3R/"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            "${CUT3R_RUNTIME_PYTHON}" \
            scripts/science/prepare_cut3r_runtime.py \
              --cut3r-checkout "$root/CUT3R" \
              --output "$root/provider/runtime-receipt.json"
          MANIFEST="$CUT3R_RUNTIME_MANIFEST" \
            RECEIPT="$root/provider/runtime-receipt.json" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          if receipt.get("artifact_id") != manifest.get("native_rope_artifact_id"):
              raise SystemExit("copied native RoPE differs from sealed runtime")
          PY
          RECEIPT="$root/provider/runtime-receipt.json" \
            "$CUT3R_RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          root = Path(os.environ["RECEIPT"]).parents[1]
          checkout = root / "CUT3R"
          relative = Path(receipt["extension"]["relative_path"])
          with tarfile.open(root / "provider" / "native-rope-extension.tar.gz", "w:gz") as archive:
              archive.add(checkout / relative, arcname=relative.as_posix(), recursive=False)
          PY
'''
          text, count = copy_pattern.subn(copy_replacement, text, count=1)
          if count != 1:
              raise SystemExit('runtime-copy step changed')

          old_checkpoint = (
              '          CUT3R_CHECKPOINT: ' + '$' + '{{ vars.CUT3R_CHECKPOINT }}'
          )
          if text.count(old_checkpoint) != 2:
              raise SystemExit('checkpoint variable occurrence count changed')
          text = text.replace(
              old_checkpoint,
              '          CUT3R_CHECKPOINT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/cut3r_512_dpt_4_64.pth',
          )
          workflow_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_trusted_self_hosted_validation_policy.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = (
              '    assert "DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/dot" in text\n'
          )
          test_addition = test_anchor + (
              '    assert "CUT3R_RUNTIME_ROOT: /home/github-runner/.cache/prob4d/cut3r-runtime-v1" in text\n'
              '    assert "/home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python" in text\n'
              '    assert "/home/github-runner/.cache/prob4d/cut3r-runtime-v1/cut3r_512_dpt_4_64.pth" in text\n'
              '    assert "vars.CUT3R_CHECKOUT" not in text\n'
              '    assert "vars.CUT3R_CHECKPOINT" not in text\n'
              '    assert "--cut3r-checkout \\"$root/CUT3R\\"" in text\n'
          )
          if tests.count(test_anchor) != 1:
              raise SystemExit('self-hosted policy test anchor changed')
          tests = tests.replace(test_anchor, test_addition, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/temp-patch-dot-provider-runtime.yml
          python3 -m py_compile tests/test_trusted_self_hosted_validation_policy.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml \
            tests/test_trusted_self_hosted_validation_policy.py \
            .github/workflows/temp-patch-dot-provider-runtime.yml
          git commit -m 'Bind DOT provider to sealed CUDA 12.6 runtime'
          git push origin HEAD:fix/dot-provider-bind-cu126-runtime
