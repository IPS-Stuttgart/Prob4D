name: Temporary patch DOT provider runtime binding

on:
  push:
    branches: [fix/dot-provider-bind-cu126-runtime]
    paths:
      - ".github/workflows/temp-patch-dot-provider-runtime.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-provider-bind-cu126-runtime
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic runtime binding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/bootstrap/patch_dot_provider_runtime.py
          python3 .github/bootstrap/patch_dot_provider_runtime.py
          python3 -m py_compile tests/test_trusted_self_hosted_validation_policy.py
          grep -F 'CUT3R_RUNTIME_PYTHON: /home/github-runner/.cache/prob4d/cut3r-runtime-v1/venv/bin/python' \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml
          grep -F 'from dust3r.model import ARCroco3DStereo' \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml
          if grep -F 'vars.CUT3R_CHECKOUT' \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml; then
            echo 'legacy CUT3R checkout variable remains' >&2
            exit 2
          fi
          if grep -F 'vars.CUT3R_CHECKPOINT' \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml; then
            echo 'legacy CUT3R checkpoint variable remains' >&2
            exit 2
          fi
          rm \
            .github/workflows/temp-patch-dot-provider-runtime.yml \
            .github/bootstrap/patch_dot_provider_runtime.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/dot-rope-cut3r-native-provider-v1.yml \
            tests/test_trusted_self_hosted_validation_policy.py \
            .github/workflows/temp-patch-dot-provider-runtime.yml \
            .github/bootstrap/patch_dot_provider_runtime.py
          git commit -m 'Bind DOT provider to sealed CUDA 12.6 runtime'
          git push origin HEAD:fix/dot-provider-bind-cu126-runtime
