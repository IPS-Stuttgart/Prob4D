name: Temporary provider matrix final cleanup

on:
  push:
    branches: [agent/provider-adapter-readiness-matrix]
    paths:
      - ".github/workflows/temporary-provider-matrix-cleanup-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/provider-adapter-readiness-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact provider-matrix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-adapter-readiness-matrix
          fetch-depth: 0
      - name: Remove every temporary helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/temporary-provider-matrix-format.yml \
            .github/workflows/temporary-provider-matrix-cleanup.yml \
            .github/workflows/temporary-provider-matrix-cleanup-final.yml
          git commit -m "Remove temporary provider matrix helper workflows"
          git push origin HEAD:agent/provider-adapter-readiness-matrix
