name: Proof4D context finalizer once

on:
  push:
    branches:
      - science/proof-carrying-factors-v1
    paths:
      - protocols/execution_requests/proof4d_context_finalize_once.trigger

permissions:
  contents: write

concurrency:
  group: proof4d-context-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/proof-carrying-factors-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply authoritative formatting and verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . -r requirements/ci/quality.txt
          files=(
            src/prob4d/proof_carrying_factor.py
            src/prob4d/proof_carrying_orbit.py
            src/prob4d_independent_verifier/__init__.py
            src/prob4d_independent_verifier/proof_carrying.py
            src/prob4d_independent_verifier/orbit_advantage.py
            src/prob4d_independent_verifier/execution_gate.py
            scripts/generate_proof_carrying_factor_examples.py
            tests/test_proof_carrying_factor.py
            tests/test_proof_carrying_factor_full_rank.py
            tests/test_proof_carrying_orbit.py
            tests/test_proof_carrying_execution_gate.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --config-file pyproject.toml \
            src/prob4d/proof_carrying_factor.py \
            src/prob4d/proof_carrying_orbit.py \
            src/prob4d_independent_verifier/proof_carrying.py \
            src/prob4d_independent_verifier/orbit_advantage.py \
            src/prob4d_independent_verifier/execution_gate.py
          python scripts/generate_proof_carrying_factor_examples.py --check
          python -m pytest -q \
            tests/test_proof_carrying_factor.py \
            tests/test_proof_carrying_factor_full_rank.py \
            tests/test_proof_carrying_orbit.py \
            tests/test_proof_carrying_execution_gate.py

      - name: Remove one-shot write surface and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/proof4d-context-finalize-once.yml \
            protocols/execution_requests/proof4d_context_finalize_once.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "No context-finalizer changes remained."
            exit 0
          }
          git commit -m "Finalize Proof4D caller-context verification"
          git push origin HEAD:science/proof-carrying-factors-v1
