name: Information-contract falsification witness v1

on:
  push:
    branches:
      - science/information-contract-falsification-witness-v1
    paths:
      - ".github/workflows/information-contract-witness-v1.yml"
      - "src/prob4d/information_contract_witness.py"
      - "src/prob4d/information_contract_witness_smoke.py"
      - "tests/test_information_contract_witness.py"
      - "docs/information-contract-falsification-witnesses.md"
      - "benchmarks/information_contract_v1/STATUS.md"
  pull_request:
    branches:
      - science/information-contract-benchmark-public-dlo-v1
      - main
    paths:
      - ".github/workflows/information-contract-witness-v1.yml"
      - "src/prob4d/information_contract_witness.py"
      - "src/prob4d/information_contract_witness_smoke.py"
      - "tests/test_information_contract_witness.py"
      - "docs/information-contract-falsification-witnesses.md"
      - "benchmarks/information_contract_v1/STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: information-contract-witness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    name: Witness contract tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run focused witness tests
        run: |
          python -m ruff check \
            src/prob4d/information_contract_witness.py \
            src/prob4d/information_contract_witness_smoke.py \
            tests/test_information_contract_witness.py
          python -m pytest -q \
            tests/test_information_contract_benchmark.py \
            tests/test_information_contract_sealed.py \
            tests/test_information_contract_witness.py

  deterministic-control:
    name: Generate and replay source-selected ranking reversal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NumPy-only package
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Generate two byte-identical controls
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/witness-first"
          second="${RUNNER_TEMP}/witness-second"
          python -m prob4d.information_contract_witness smoke "${first}"
          python -m prob4d.information_contract_witness smoke "${second}"
          diff --recursive --brief "${first}" "${second}"
          python -m prob4d.information_contract_witness evaluate \
            "${first}/held.json" \
            "${first}/witness.json" \
            "${first}/replayed.json"
          cmp "${first}/result.json" "${first}/replayed.json"
          ROOT="${first}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          witness = json.loads((root / "witness.json").read_text())
          result = json.loads((root / "result.json").read_text())
          assert witness["query_vector"] == [1.0, 0.0, 0.0]
          assert witness["source_max_normalized_error_ratio"] == 10.0
          assert witness["held_outcomes_opened_during_selection"] is False
          assert result["target_query_reselection"] is False
          assert result["rankings"]["point_accuracy_winner"] == \
              "provider-a-accurate-overconfident"
          assert result["rankings"]["selected_query_calibration_winner"] == \
              "provider-b-less-accurate-calibrated"
          assert result["rankings"][
              "point_vs_query_calibration_ranking_reversal"
          ] is True
          assert result["information_order"]["prospective_claim_eligible"] is False
          print(json.dumps(result["rankings"], indent=2, sort_keys=True))
          PY
          find "${first}" -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum

      - name: Upload complete controlled witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: information-contract-witness-${{ github.sha }}
          path: ${{ runner.temp }}/witness-first/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
