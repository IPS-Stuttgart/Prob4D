name: Materialize PR 251 import-order cleanup

on:
  push:
    branches: [feat/target-free-observation-rehearsal]
    paths:
      - ".github/workflows/fix-pr251-import-order.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/target-free-observation-rehearsal
          fetch-depth: 0
          persist-credentials: true
      - name: Fix import order and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/target_free_rehearsal.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "from dataclasses import dataclass\n"
              "from importlib.metadata import version\n"
              "from collections.abc import Mapping, Sequence\n"
              "from pathlib import Path\n"
          )
          new = (
              "from collections.abc import Mapping, Sequence\n"
              "from dataclasses import dataclass\n"
              "from importlib.metadata import version\n"
              "from pathlib import Path\n"
          )
          if old not in text:
              raise SystemExit("target-free import block changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/fix-pr251-import-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix target-free rehearsal import ordering"
          git push origin HEAD:feat/target-free-observation-rehearsal
