name: Temporary repair DLO45 calibration contract

on:
  push:
    branches: [science/deform-dlo45-source-calibrated-covariance-v1]
    paths:
      - ".github/workflows/temporary-repair-dlo45-calibration-contract.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-source-calibrated-covariance-v1
          fetch-depth: 0
      - name: Repair focused tests and content identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          script_path = Path(
              "scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py"
          )
          script = script_path.read_text(encoding="utf-8")
          marker = "\n\ndef load_json(path: Path) -> dict[str, Any]:\n"
          helper = '''

          def mahalanobis(error: np.ndarray, covariance: np.ndarray) -> float:
              """Return the squared Mahalanobis distance for a positive covariance."""

              vector = np.asarray(error, dtype=np.float64)
              matrix = np.asarray(covariance, dtype=np.float64)
              return float(vector @ np.linalg.solve(matrix, vector))


          def load_json(path: Path) -> dict[str, Any]:
          '''
          if "def mahalanobis(" not in script:
              if marker not in script:
                  raise SystemExit("script insertion point changed")
              script = script.replace(marker, "\n" + helper, 1)
              script_path.write_text(script, encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/deform-dlo45-source-calibrated-query-covariance-v1.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          old = '''      - name: Validate source-only design and focused implementation
                  shell: bash
                  run: |
                    set -euo pipefail
                    python -m pip install -e ".[dev]"
          '''
          new = '''      - name: Validate source-only design and focused implementation
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY_REQUEST'
                    import json
                    import os
                    from pathlib import Path

                    request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
                    assert request["new_data_collection_authorized"] is False
                    assert request["source_calibration_authorized"] is True
                    assert request["existing_eval_reanalysis_authorized"] is True
                    PY_REQUEST
                    python -m pip install -e ".[dev]"
          '''
          if "PY_REQUEST" not in workflow:
              if old not in workflow:
                  raise SystemExit("workflow insertion point changed")
              workflow = workflow.replace(old, new, 1)
              workflow_path.write_text(workflow, encoding="utf-8")

          def content_id(value: dict, key: str) -> str:
              payload = dict(value)
              payload.pop(key, None)
              encoded = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          protocol_path = Path(
              "protocols/deform-dlo45-source-calibrated-query-covariance-v1.json"
          )
          protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
          protocol["protocol_id"] = content_id(protocol, "protocol_id")
          protocol_path.write_text(
              json.dumps(protocol, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          request_path = Path(
              "protocols/execution_requests/deform_dlo45_source_calibrated_query_covariance_v1.json"
          )
          request = json.loads(request_path.read_text(encoding="utf-8"))
          request["protocol_id"] = protocol["protocol_id"]
          request["request_id"] = content_id(request, "request_id")
          request_path.write_text(
              json.dumps(request, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "protocol_id": protocol["protocol_id"],
              "request_id": request["request_id"],
          }, sort_keys=True))
          PY
          python -m pip install --disable-pip-version-check 'ruff==0.16.5' 'pytest==9.1.1' 'numpy==2.5.2'
          python -m ruff check --fix \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m ruff format \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          PYTHONPATH=src:scripts/science python -m pytest -q \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          python -m py_compile \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/deform-dlo45-source-calibrated-query-covariance-v1.yml \
            protocols/deform-dlo45-source-calibrated-query-covariance-v1.json \
            protocols/execution_requests/deform_dlo45_source_calibrated_query_covariance_v1.json \
            scripts/science/run_deform_dlo45_source_calibrated_query_covariance_v1.py \
            tests/test_deform_dlo45_source_calibrated_query_covariance_v1.py
          git rm .github/workflows/temporary-repair-dlo45-calibration-contract.yml
          git commit -m 'Repair source-calibrated DLO covariance contract'
          git push origin HEAD:science/deform-dlo45-source-calibrated-covariance-v1
