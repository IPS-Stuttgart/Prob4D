name: Temporary portable gauge-artifact repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_repair_portable_gauge_artifact.yml"
      - "src/prob4d/_gauge_tree_artifact_io.py"
      - "tests/test_gauge_tree_prior_artifact.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-portable-gauge-artifact-repair-172
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.event.pull_request.number == 172 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/portable-gauge-tree-prior-artifact-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply exact idempotent source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/_gauge_tree_artifact_io.py")
          source = path.read_text(encoding="utf-8")
          old_mode = "            0o644,\n"
          new_mode = "            0o600,\n"
          if old_mode in source:
              if source.count(old_mode) != 1:
                  raise SystemExit("unexpected number of publication modes")
              source = source.replace(old_mode, new_mode)
          elif source.count(new_mode) != 1:
              raise SystemExit("owner-only publication mode is missing")

          old_raise = (
              '            raise FileExistsError('
              'f"refusing to replace different {name}: {path}")\n'
          )
          new_raise = old_raise.rstrip("\n") + " from None\n"
          if old_raise in source:
              if source.count(old_raise) != 1:
                  raise SystemExit("unexpected number of no-clobber raises")
              source = source.replace(old_raise, new_raise)
          elif source.count(new_raise) != 1:
              raise SystemExit("explicit no-clobber exception chaining is missing")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development environment
        run: python -m pip install -e ".[dev]" "numpy>=1.24,<2.3"

      - name: Canonicalize and validate repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m ruff format \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m ruff check \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m ruff format --check \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m pytest -q \
            tests/test_gauge_tree_prior_artifact.py \
            tests/test_gauge_tree_contract.py \
            tests/test_gauge_tree_observation.py \
            tests/test_gauge_tree_prior.py \
            tests/test_sparse_observation_factors.py
          python -W error::SyntaxWarning -m py_compile \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py

      - name: Commit only the reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            src/prob4d/_gauge_tree_artifact_io.py \
            tests/test_gauge_tree_prior_artifact.py
          git diff --cached --check
          git commit -m "Harden sparse gauge-prior artifact publication"
          git push origin HEAD:agent/portable-gauge-tree-prior-artifact-v1
