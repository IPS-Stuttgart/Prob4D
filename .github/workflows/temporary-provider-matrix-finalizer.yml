name: Temporary provider matrix PR finalizer

on:
  push:
    branches: [agent/provider-adapter-readiness-matrix]
    paths:
      - ".github/workflows/temporary-provider-matrix-finalizer.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/provider-adapter-readiness-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact provider-matrix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-adapter-readiness-matrix
          fetch-depth: 0
      - name: Remove every temporary helper and publish the cleanup head
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/temporary-provider-matrix-format.yml \
            .github/workflows/temporary-provider-matrix-cleanup.yml \
            .github/workflows/temporary-provider-matrix-cleanup-final.yml \
            .github/workflows/temporary-provider-matrix-final-validation.yml \
            .github/workflows/temporary-provider-matrix-finalizer.yml
          git commit -m "Finalize provider adapter and readiness matrix validation"
          git push origin HEAD:agent/provider-adapter-readiness-matrix
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for all exact-head workflows
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.cleanup.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          repository = os.environ["REPOSITORY"]
          head_sha = os.environ["HEAD_SHA"]
          stable_complete_polls = 0
          last_runs = []

          for attempt in range(90):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repository}/actions/runs",
                      "-f",
                      f"head_sha={head_sha}",
                      "-f",
                      "per_page=100",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              payload = json.loads(result.stdout)
              runs = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == head_sha
              ]
              last_runs = runs
              active = [
                  run
                  for run in runs
                  if run.get("status") != "completed"
              ]
              print(
                  json.dumps(
                      {
                          "attempt": attempt + 1,
                          "head_sha": head_sha,
                          "run_count": len(runs),
                          "active": [run.get("name") for run in active],
                          "conclusions": {
                              str(run.get("name")): run.get("conclusion")
                              for run in runs
                              if run.get("status") == "completed"
                          },
                      },
                      sort_keys=True,
                  )
              )

              if len(runs) >= 3 and not active:
                  stable_complete_polls += 1
                  if stable_complete_polls >= 2:
                      break
              else:
                  stable_complete_polls = 0
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact-head workflow completion")

          unsuccessful = [
              run
              for run in last_runs
              if run.get("conclusion") not in {"success", "skipped", "neutral"}
          ]
          summary = {
              "head_sha": head_sha,
              "run_count": len(last_runs),
              "unsuccessful": [
                  {
                      "name": run.get("name"),
                      "conclusion": run.get("conclusion"),
                      "url": run.get("html_url"),
                  }
                  for run in unsuccessful
              ],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("summary=" + json.dumps(summary, separators=(",", ":")) + "\n")
              output.write("passed=" + ("true" if not unsuccessful else "false") + "\n")
          if unsuccessful:
              raise SystemExit(json.dumps(summary, sort_keys=True))
          PY
      - name: Mark PR 234 ready and record the successful exact head
        if: steps.checks.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.cleanup.outputs.sha }}
          CHECK_SUMMARY: ${{ steps.checks.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready 234 --repo IPS-Stuttgart/Prob4D || true
          gh pr comment 234 --repo IPS-Stuttgart/Prob4D --body "Final exact-head validation succeeded for \`${HEAD_SHA}\`. All discovered workflows on that cleanup head completed without a failing or cancelled conclusion. Temporary formatter and validation workflows were removed. Machine summary: \`${CHECK_SUMMARY}\`."
