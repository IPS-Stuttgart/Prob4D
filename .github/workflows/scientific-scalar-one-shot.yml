name: Scientific scalar one-shot validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/scientific-scalar-one-shot.yml"
      - "src/prob4d/_scientific_scalars.py"
      - "src/prob4d/alignment.py"
      - "src/prob4d/cross_fitted_disagreement.py"
      - "src/prob4d/uncertainty.py"
      - "tests/test_scientific_scalar_validation.py"

permissions:
  contents: read

concurrency:
  group: scientific-scalar-one-shot-validation
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Workstation2 full validation
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 90
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Record runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/scientific-scalar-validation
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo
            uname -a
            echo
            python -VV
            python -c 'import numpy; print("numpy=" + numpy.__version__)'
            if command -v nvidia-smi >/dev/null 2>&1; then
              echo
              nvidia-smi --query-gpu=name,uuid,driver_version --format=csv,noheader
            fi
          } > outputs/scientific-scalar-validation/runtime.txt
      - name: Run changed-source quality checks
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/prob4d/_scientific_scalars.py \
            src/prob4d/alignment.py \
            src/prob4d/cross_fitted_disagreement.py \
            src/prob4d/uncertainty.py \
            tests/test_scientific_scalar_validation.py \
            | tee outputs/scientific-scalar-validation/ruff.txt
          python -m mypy src/prob4d/_scientific_scalars.py \
            | tee outputs/scientific-scalar-validation/mypy.txt
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_scientific_scalar_validation.py \
            tests/test_alignment.py \
            tests/test_cross_fitted_disagreement.py \
            tests/test_uncertainty.py \
            tests/test_group_balanced_point_calibration.py \
            | tee outputs/scientific-scalar-validation/focused-pytest.txt
      - name: Run complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            | tee outputs/scientific-scalar-validation/full-pytest.txt
      - name: Build and audit distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/* \
            | tee outputs/scientific-scalar-validation/distributions.txt
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          python scripts/ci/check_sdist.py "$archive" \
            | tee -a outputs/scientific-scalar-validation/distributions.txt
      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("outputs/scientific-scalar-validation")
          root.mkdir(parents=True, exist_ok=True)
          expected = (
              "runtime.txt",
              "ruff.txt",
              "mypy.txt",
              "focused-pytest.txt",
              "full-pytest.txt",
              "distributions.txt",
          )
          present = [name for name in expected if (root / name).is_file()]
          summary = {
              "schema": "prob4d.scientific-scalar-validation",
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "runner_name": os.environ["RUNNER_NAME"],
              "present_reports": present,
              "complete": set(present) == set(expected),
              "claim_boundary": (
                  "Software validation only; no dataset, estimator result, "
                  "calibration claim, or physical-prediction claim is produced."
              ),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Scientific scalar validation\n\n")
              stream.write(f"Revision: `{os.environ['GITHUB_SHA']}`\n\n")
              stream.write(f"Evidence complete: `{summary['complete']}`\n")
          PY
      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scientific-scalar-validation-${{ github.run_id }}
          path: outputs/scientific-scalar-validation
          if-no-files-found: error
          retention-days: 30
