name: Execute retained CUT3R source freeze automatically v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut3r-source-freeze-auto-v2.yml"
      - "CHANGELOG.d/cut3r-source-freeze-auto-v2.md"
      - "docs/cut3r-source-freeze-auto-v2.md"
      - "protocols/execution_requests/cut3r_deform360_source_freeze_v2.json"
      - "scripts/ci/cut3r_execution_preflight.py"
      - "scripts/science/run_cut3r_source_freeze_execution.py"
      - "tests/test_cut3r_execution_preflight.py"
      - "tests/test_cut3r_source_freeze_execution_driver.py"
      - "tests/test_trusted_self_hosted_validation_policy.py"
  push:
    branches: [main]
    paths:
      - "protocols/execution_requests/cut3r_deform360_source_freeze_v2.json"
  workflow_dispatch:
    inputs:
      execution_sha:
        description: Exact historical merged-main SHA containing the retained request
        required: true
        type: string
      request_id:
        description: Exact 64-character retained source-freeze request ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    cut3r-source-freeze-auto-v2-${{ github.event_name }}-${{
    inputs.execution_sha || github.sha }}-${{ inputs.request_id || 'push' }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  REQUEST_PATH: protocols/execution_requests/cut3r_deform360_source_freeze_v2.json

jobs:
  contract:
    name: Hosted automatic-execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the reviewed automatic execution surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            scripts/ci/cut3r_execution_preflight.py \
            scripts/science/run_cut3r_source_freeze_execution.py \
            tests/test_cut3r_execution_preflight.py \
            tests/test_cut3r_source_freeze_execution_driver.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m ruff format --check \
            scripts/ci/cut3r_execution_preflight.py \
            scripts/science/run_cut3r_source_freeze_execution.py \
            tests/test_cut3r_execution_preflight.py \
            tests/test_cut3r_source_freeze_execution_driver.py \
            tests/test_trusted_self_hosted_validation_policy.py
          python -m pytest -q \
            tests/test_cut3r_execution_preflight.py \
            tests/test_cut3r_source_freeze_execution_driver.py \
            tests/test_trusted_self_hosted_validation_policy.py \
            tests/test_github_action_pins.py
          python -m compileall -q \
            scripts/ci/cut3r_execution_preflight.py \
            scripts/science/run_cut3r_source_freeze_execution.py \
            scripts/science/build_cut3r_deform360_source_freeze.py

  authorize:
    name: Authorize exact merged-main v2 request
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.push_request.outputs.head_sha || steps.retry_request.outputs.head_sha }}
      base_sha: ${{ steps.push_request.outputs.base_sha || steps.retry_request.outputs.base_sha }}
      request_id: ${{ steps.push_request.outputs.request_id || steps.retry_request.outputs.request_id }}
      profile: ${{ steps.push_request.outputs.profile || steps.retry_request.outputs.profile }}
      authorization_mode: >-
        ${{ steps.push_request.outputs.authorization_mode ||
            steps.retry_request.outputs.authorization_mode }}
      trigger_mode: >-
        ${{ steps.push_request.outputs.trigger_mode ||
            steps.retry_request.outputs.trigger_mode }}
    steps:
      - name: Require an ordinary main push or a main-bound manual retry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$EVENT_REF" = "refs/heads/main"
            test "$EVENT_AFTER" = "$EXPECTED_SHA"
            test "$EVENT_FORCED" = "false"
            test "$EVENT_DELETED" = "false"
            test "$EVENT_BEFORE" != "0000000000000000000000000000000000000000"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$EVENT_REF" = "refs/heads/main" || {
              echo "exact retry must be dispatched from main" >&2
              exit 1
            }
          else
            echo "unsupported execution trigger" >&2
            exit 1
          fi

      - name: Check out current merged main with complete ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify immutable push request and changed-path authorization
        id: push_request
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          /usr/bin/git diff-tree --no-commit-id --name-only -r "$BASE_SHA" "$EXPECTED_SHA" \
            | grep -Fx "$REQUEST_PATH" >/dev/null
          python scripts/science/run_cut3r_source_freeze_execution.py verify-request \
            --repository . \
            --request "$REQUEST_PATH" \
            --expected-revision "$EXPECTED_SHA" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "head_sha=$EXPECTED_SHA"
            echo "base_sha=$BASE_SHA"
            echo "trigger_mode=merged_main_push"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact historical request retry
        id: retry_request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ github.sha }}
          EXECUTION_SHA: ${{ inputs.execution_sha }}
          EXPECTED_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          python scripts/ci/cut3r_execution_preflight.py authorize-retry \
            --repository . \
            --request "$REQUEST_PATH" \
            --current-revision "$CURRENT_MAIN_SHA" \
            --execution-revision "$EXECUTION_SHA" \
            --expected-request-id "$EXPECTED_REQUEST_ID" \
            --github-output "$GITHUB_OUTPUT"

  preflight:
    name: Check retained execution configuration
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [contract, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out current reviewed control-plane helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Check repository-variable presence without publishing values
        id: variables
        continue-on-error: true
        shell: bash
        env:
          BPT_CHECKOUT: ${{ vars.BPT_CHECKOUT }}
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: ${{ vars.DEFORM360_PROCESSED_ROOT }}
        run: |
          set -euo pipefail
          python scripts/ci/cut3r_execution_preflight.py check-variables \
            --required-variable BPT_CHECKOUT \
            --required-variable CUT3R_CHECKOUT \
            --required-variable CUT3R_CHECKPOINT \
            --required-variable DEFORM360_PROCESSED_ROOT \
            --report "$RUNNER_TEMP/cut3r-variable-readiness.json" \
            --github-output "$GITHUB_OUTPUT" \
            --require-ready

      - name: Publish bounded configuration blocker
        if: steps.variables.outputs.ready != 'true'
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          MISSING_VARIABLES: ${{ steps.variables.outputs.missing_variables_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          try:
              missing = json.loads(os.environ.get("MISSING_VARIABLES") or "[]")
          except json.JSONDecodeError:
              missing = ["preflight-report-unavailable"]
          if not isinstance(missing, list) or any(
              not isinstance(value, str) for value in missing
          ):
              missing = ["preflight-report-unavailable"]
          body = "\n".join(
              (
                  "## Retained CUT3R source-freeze configuration blocked",
                  "",
                  f"- request ID: `{os.environ['REQUEST_ID']}`",
                  f"- exact execution revision: `{os.environ['HEAD_SHA']}`",
                  f"- missing repository-variable names: `{json.dumps(missing)}`",
                  f"- workflow run: {os.environ['RUN_URL']}",
                  "",
                  "No variable value or retained path is published. The self-hosted "
                  "job was not queued, and no source, confirmation, target, "
                  "BayesianPhysTwin, or Causal4D outcome was opened.",
              )
          )
          request = urllib.request.Request(
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/issues/49/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Fail closed when retained configuration is incomplete
        if: steps.variables.outputs.ready != 'true'
        shell: bash
        run: |
          echo "retained CUT3R execution configuration is incomplete" >&2
          exit 1

  announce:
    name: Publish queued run pointer
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [contract, authorize, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment queued automatic execution on issue 49
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          AUTHORIZATION_MODE: ${{ needs.authorize.outputs.authorization_mode }}
          TRIGGER_MODE: ${{ needs.authorize.outputs.trigger_mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          body = "\n".join(
              (
                  "## Retained CUT3R source-freeze v2 queued",
                  "",
                  f"- request ID: `{os.environ['REQUEST_ID']}`",
                  f"- exact merged-main revision: `{os.environ['HEAD_SHA']}`",
                  f"- authorization: `{os.environ['AUTHORIZATION_MODE']}`",
                  f"- trigger: `{os.environ['TRIGGER_MODE']}`",
                  f"- workflow run: {os.environ['RUN_URL']}",
                  "",
                  "The self-hosted job has a read-only repository token and receives "
                  "no pull-request-controlled input. This stage remains target-closed "
                  "and does not execute CUT3R or open source outcomes.",
              )
          )
          request = urllib.request.Request(
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/issues/49/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

  execute:
    name: Freeze retained source inputs from trusted merged main
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [contract, authorize, preflight, announce]
    permissions:
      contents: read
    runs-on: [self-hosted, host-workstation2]
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.freeze.outputs.artifact_name }}
      decision: ${{ steps.freeze.outputs.decision }}
      exit_status: ${{ steps.freeze.outputs.exit_status }}
      freeze_artifact_id: ${{ steps.freeze.outputs.freeze_artifact_id }}
      request_id: ${{ steps.freeze.outputs.request_id }}
    steps:
      - name: Bind the sole retained Deform360 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation2"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v nvidia-smi >/dev/null 2>&1

      - name: Initialize isolated read-only execution workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-cut3r-source-freeze-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected="${RUNNER_TEMP}/prob4d-cut3r-source-freeze-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/mkdir -p \
            "$root/home" \
            "$root/cache" \
            "$root/tmp" \
            "$root/evidence"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "HOME=$root/home"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "PIP_CACHE_DIR=$root/cache/pip"
            echo "HF_HOME=$root/cache/huggingface"
            echo "TMPDIR=$root/tmp"
          } >> "$GITHUB_ENV"

      - name: Check out only the authorized merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact clean checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          EXPECTED_REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          /usr/bin/python3 scripts/science/run_cut3r_source_freeze_execution.py verify-request \
            --repository . \
            --request "$REQUEST_PATH" \
            --expected-revision "$EXPECTED_HEAD_SHA" \
            > "${{ steps.workspace.outputs.root }}/evidence/request-verification.json"
          grep -F "$EXPECTED_REQUEST_ID" \
            "${{ steps.workspace.outputs.root }}/evidence/request-verification.json" >/dev/null

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install the exact reviewed wheel
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          python -m venv "$root/build-venv"
          build_python="$root/build-venv/bin/python"
          "$build_python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "build==1.3.0"
          wheel_dir="$root/wheelhouse"
          /usr/bin/mkdir -p "$wheel_dir"
          "$build_python" -m build --wheel --outdir "$wheel_dir"
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' | sort)
          test "${#wheels[@]}" -eq 1
          python -m venv "$root/run-venv"
          "$root/run-venv/bin/python" -m pip install "pip==25.2"
          "$root/run-venv/bin/python" -m pip install "${wheels[0]}"
          "$root/run-venv/bin/python" -m pip check
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Run one target-closed source freeze
        id: freeze
        shell: bash
        env:
          BPT_CHECKOUT: ${{ vars.BPT_CHECKOUT }}
          CUT3R_CHECKOUT: ${{ vars.CUT3R_CHECKOUT }}
          CUT3R_CHECKPOINT: ${{ vars.CUT3R_CHECKPOINT }}
          DEFORM360_PROCESSED_ROOT: ${{ vars.DEFORM360_PROCESSED_ROOT }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          WHEEL_PATH: ${{ steps.wheel.outputs.wheel }}
        run: |
          set -euo pipefail
          for name in \
            BPT_CHECKOUT \
            CUT3R_CHECKOUT \
            CUT3R_CHECKPOINT \
            DEFORM360_PROCESSED_ROOT \
            WHEEL_PATH
          do
            value=${!name:-}
            if [[ -z "$value" ]]; then
              echo "Required repository variable or built input $name is unset" >&2
              exit 2
            fi
          done
          test -d "$BPT_CHECKOUT/.git"
          test -d "$CUT3R_CHECKOUT/.git"
          test -f "$CUT3R_CHECKPOINT"
          test -d "$DEFORM360_PROCESSED_ROOT"
          test -f "$WHEEL_PATH"

          root="${{ steps.workspace.outputs.root }}"
          output="$root/evidence/cut3r-deform360-source-freeze"
          selection="$BPT_CHECKOUT/protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
          test -f "$selection"
          cut3r_checkout=$(/usr/bin/realpath -e -- "$CUT3R_CHECKOUT")
          test -d "$cut3r_checkout/.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=safe.directory \
          GIT_CONFIG_VALUE_0="$cut3r_checkout" \
          "$root/run-venv/bin/python" \
            scripts/science/run_cut3r_source_freeze_execution.py execute \
            --repository . \
            --request "$REQUEST_PATH" \
            --expected-revision "$EXPECTED_HEAD_SHA" \
            --selection "$selection" \
            --processed-root "$DEFORM360_PROCESSED_ROOT" \
            --cut3r-checkout "$cut3r_checkout" \
            --checkpoint "$CUT3R_CHECKPOINT" \
            --prob4d-wheel "$WHEEL_PATH" \
            --output-dir "$output" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

          /usr/bin/git restore --worktree -- src/prob4d.egg-info
          /usr/bin/git diff --exit-code
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=no)"

      - name: Record exact automatic-execution environment
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          EXECUTION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          root="${{ steps.workspace.outputs.root }}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "head_sha=$EXPECTED_HEAD_SHA"
            echo "checked_out_sha=$(/usr/bin/git rev-parse HEAD)"
            echo "request_id=$REQUEST_ID"
            echo "authorization_mode=merged-main-read-only-self-hosted-v1"
            echo "repository_write_token_on_self_hosted=false"
            echo "environment_approval_required=false"
            echo "execution_status=$EXECUTION_STATUS"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            "$root/run-venv/bin/python" --version 2>/dev/null || true
            "$root/run-venv/bin/python" -m pip freeze --all 2>/dev/null || true
          } > "$root/evidence/environment.txt"
          {
            /usr/bin/uname -a
            command -v lscpu >/dev/null 2>&1 && lscpu || true
            command -v free >/dev/null 2>&1 && free -b || true
            command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi || true
          } > "$root/evidence/host.txt" 2>&1
          /usr/bin/python3 - "$root/evidence" <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained automatic source-freeze evidence
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.freeze.outputs.artifact_name || format('cut3r-source-freeze-v2-failed-{0}-{1}', github.run_id, github.run_attempt) }}
          path: ${{ steps.workspace.outputs.root }}/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated execution workspace and checkout residue
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.workspace.outputs.root }}"
          expected="${RUNNER_TEMP}/prob4d-cut3r-source-freeze-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$root" = "$expected"
          /usr/bin/rm -rf -- "$root"
          /usr/bin/git reset --hard HEAD
          /usr/bin/git clean -ffdx

  watchdog:
    name: Bound self-hosted runner acceptance wait
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [contract, authorize, preflight, announce]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Cancel a run that no matching runner accepts within twenty minutes
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          EXECUTE_JOB_NAME: Freeze retained source inputs from trusted merged main
          RUNNER_ACCEPTANCE_TIMEOUT_SECONDS: "1200"
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.request

          api_url = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = os.environ["RUN_ID"]
          job_name = os.environ["EXECUTE_JOB_NAME"]
          deadline = time.monotonic() + int(
              os.environ["RUNNER_ACCEPTANCE_TIMEOUT_SECONDS"]
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def job_status() -> str | None:
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/actions/runs/{run_id}/jobs"
                  "?filter=latest&per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              jobs = payload.get("jobs")
              if not isinstance(jobs, list):
                  raise SystemExit("workflow jobs response is malformed")
              matches = [
                  job
                  for job in jobs
                  if isinstance(job, dict) and job.get("name") == job_name
              ]
              if len(matches) > 1:
                  raise SystemExit("self-hosted execution job identity is ambiguous")
              if not matches:
                  return None
              status = matches[0].get("status")
              if status not in {
                  "queued",
                  "in_progress",
                  "completed",
                  "waiting",
                  "pending",
                  "requested",
              }:
                  raise SystemExit("self-hosted execution job status is unsupported")
              return str(status)

          while time.monotonic() < deadline:
              status = job_status()
              if status in {"in_progress", "completed"}:
                  with open(
                      os.environ["GITHUB_STEP_SUMMARY"],
                      "a",
                      encoding="utf-8",
                  ) as summary:
                      summary.write(
                          "The retained self-hosted job was accepted before the "
                          "bounded queue deadline.\n"
                      )
                  raise SystemExit(0)
              time.sleep(15)

          final_status = job_status()
          if final_status in {"in_progress", "completed"}:
              raise SystemExit(0)

          body = "\n".join(
              (
                  "## Retained CUT3R source-freeze runner acceptance timeout",
                  "",
                  f"- request ID: `{os.environ['REQUEST_ID']}`",
                  f"- exact execution revision: `{os.environ['HEAD_SHA']}`",
                  f"- last observed execution-job status: `{final_status or 'not-listed'}`",
                  f"- bounded acceptance window: `20 minutes`",
                  f"- workflow run: {os.environ['RUN_URL']}",
                  "",
                  "The hosted controller canceled the run before an unavailable "
                  "self-hosted queue could remain pending indefinitely. No source "
                  "outcome, confirmation object, target payload, BayesianPhysTwin "
                  "result, or Causal4D result is claimed by this receipt.",
              )
          )
          comment = urllib.request.Request(
              f"{api_url}/repos/{repository}/issues/49/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(comment, timeout=30):
              pass

          cancel = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}/cancel",
              data=b"{}",
              method="POST",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(cancel, timeout=30):
              pass
          PY

  report:
    name: Publish terminal v2 source-freeze receipt
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [authorize, preflight, execute, watchdog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment terminal automatic execution status on issue 49
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          TRIGGER_MODE: ${{ needs.authorize.outputs.trigger_mode }}
