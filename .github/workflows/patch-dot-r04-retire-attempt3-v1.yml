name: Patch DOT R04-R10 predecessor attempt contract

on:
  push:
    branches:
      - fix/dot-r04-r10-retire-attempt3-v1
    paths:
      - protocols/execution_requests/patch_dot_r04_retire_attempt3_v1.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-retire-attempt3-v1
          persist-credentials: true
          clean: true

      - name: Apply the bounded attempt-number correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'if run["run_attempt"] != 2:'
          new = 'if run["run_attempt"] != 3:'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected predecessor attempt contract')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'if run["run_attempt"] != 3:' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          ! grep -F 'if run["run_attempt"] != 2:' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml

      - name: Remove one-shot control files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/patch-dot-r04-retire-attempt3-v1.yml \
            protocols/execution_requests/patch_dot_r04_retire_attempt3_v1.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Retire untouched third DOT predecessor attempt'
          git push origin HEAD:fix/dot-r04-r10-retire-attempt3-v1
