name: Export patched DOT R04-R10 predecessor contract

on:
  push:
    branches:
      - fix/dot-r04-r10-retire-attempt3-v1
    paths:
      - protocols/execution_requests/patch_dot_r04_retire_attempt3_v1.trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-r04-r10-retire-attempt3-v1
          persist-credentials: false
          clean: true

      - name: Apply and verify the bounded attempt-number correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'if run["run_attempt"] != 2:'
          new = 'if run["run_attempt"] != 3:'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected predecessor attempt contract')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'if run["run_attempt"] != 3:' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          ! grep -F 'if run["run_attempt"] != 2:' \
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
          sha256sum .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml \
            > patched-workflow.sha256

      - name: Upload exact patched workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-dot-r04-heldout-workflow-${{ github.sha }}
          path: |
            .github/workflows/dot-rope-cut3r-heldout-confirmation-v1.yml
            patched-workflow.sha256
          if-no-files-found: error
          retention-days: 7
