name: Temporary estimated-orbit autoformat

on:
  push:
    branches:
      - research/tracking-cloth-estimated-orbit-robustness-v1
    paths:
      - ".github/workflows/temporary-estimated-orbit-autoformat.yml"

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply safe Ruff formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.12.12"
          python -m ruff check --fix \
            scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py
          python -m ruff format \
            scripts/science/run_tracking_cloth_finite_orbit_robustness_v1.py \
            tests/test_tracking_cloth_finite_orbit_robustness_v1.py
          rm .github/workflows/temporary-estimated-orbit-autoformat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format estimated-orbit robustness study"
          git push origin HEAD:research/tracking-cloth-estimated-orbit-robustness-v1
