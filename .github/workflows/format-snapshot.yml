name: Temporary format snapshot

on:
  push:
    branches: [agent/provider-readiness-cli-and-release-docs]
    paths:
      - src/prob4d/command_registry.py
      - tests/test_command_registry.py
      - .github/workflows/format-snapshot.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install ruff==0.12.7
      - name: Format changed Python files
        run: >-
          python -m ruff format
          src/prob4d/command_registry.py
          tests/test_command_registry.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-provider-readiness-files
          path: |
            src/prob4d/command_registry.py
            tests/test_command_registry.py
          if-no-files-found: error
          retention-days: 1
