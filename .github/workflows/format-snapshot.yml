name: Temporary format snapshot

on:
  push:
    branches: [agent/provider-readiness-cli-and-release-docs]
    paths:
      - .github/workflows/format-snapshot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-readiness-cli-and-release-docs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install ruff==0.12.7
      - name: Apply canonical formatting to the branch
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/prob4d/command_registry.py \
            tests/test_command_registry.py
          if git diff --quiet -- \
            src/prob4d/command_registry.py \
            tests/test_command_registry.py; then
            echo "Files already use canonical formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/command_registry.py \
            tests/test_command_registry.py
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:agent/provider-readiness-cli-and-release-docs
