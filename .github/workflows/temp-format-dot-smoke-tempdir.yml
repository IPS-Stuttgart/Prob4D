name: Temporary canonical DOT smoke formatting

on:
  push:
    branches: [fix/dot-cut3r-smoke-tempdir]
    paths:
      - .github/workflows/temp-format-dot-smoke-tempdir.yml

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.actor == 'FlorianPfaff' &&
      github.ref == 'refs/heads/fix/dot-cut3r-smoke-tempdir'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dot-cut3r-smoke-tempdir
          fetch-depth: 0
          persist-credentials: true
      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/science/run_dot_rope_cut3r_native_provider.py")
          source = source_path.read_text(encoding="utf-8")
          old_source = (
              "            frame_paths = _make_synthetic_frames(\n"
              "                Path(temporary) / \"frames\", count=3\n"
              "            )\n"
          )
          new_source = (
              "            frame_paths = _make_synthetic_frames("
              "Path(temporary) / \"frames\", count=3)\n"
          )
          if source.count(old_source) != 1 or new_source in source:
              raise SystemExit("DOT smoke formatting preimage changed")
          source_path.write_text(
              source.replace(old_source, new_source, 1),
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path("tests/test_dot_rope_cut3r_smoke_tempdir.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = (
              "    assert '_make_synthetic_frames(\\n                "
              "Path(temporary) / \"frames\", count=3' in text\n"
          )
          new_test = (
              "    assert '_make_synthetic_frames("
              "Path(temporary) / \"frames\", count=3)' in text\n"
          )
          if test.count(old_test) != 1 or new_test in test:
              raise SystemExit("DOT smoke regression preimage changed")
          test_path.write_text(
              test.replace(old_test, new_test, 1),
              encoding="utf-8",
              newline="\n",
          )

          Path(".github/workflows/temp-format-dot-smoke-tempdir.yml").unlink()
          PY
          python3 -m py_compile \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            tests/test_dot_rope_cut3r_smoke_tempdir.py
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_dot_rope_cut3r_native_provider.py \
            tests/test_dot_rope_cut3r_smoke_tempdir.py \
            .github/workflows/temp-format-dot-smoke-tempdir.yml
          git diff --cached --check
          git commit -m "Format DOT CUT3R smoke tempdir repair"
          git push origin HEAD:fix/dot-cut3r-smoke-tempdir
