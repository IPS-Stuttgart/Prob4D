name: Apply fail-closed quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-fail-closed-quality.yml"
  push:
    branches:
      - agent/make-quality-checks-fail-closed

permissions:
  contents: write

concurrency:
  group: apply-fail-closed-quality-checks
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/make-quality-checks-fail-closed
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"

      - name: Harden the quality workflow and its policy test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/tests.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          old_install = '        run: python -m pip install -e ".[dev]"\n'
          new_install = (
              "        run: |\n"
              "          python -m pip install -e \".[dev]\"\n"
              "          python -m pip install \"numpy>=1.24,<2.3\"\n"
          )
          if workflow.count(old_install) != 1:
              raise RuntimeError("unexpected development-install command")
          workflow = workflow.replace(old_install, new_install, 1)

          old_ruff = (
              "      - name: Run Ruff\n"
              "        id: ruff\n"
              "        continue-on-error: true\n"
              "        run: python -m ruff check src tests scripts/ci "
              "2>&1 | tee ruff-output.txt\n"
          )
          new_ruff = (
              "      - name: Run Ruff\n"
              "        id: ruff\n"
              "        continue-on-error: true\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -o pipefail\n"
              "          python -m ruff check src tests scripts/ci "
              "2>&1 | tee ruff-output.txt\n"
          )
          if workflow.count(old_ruff) != 1:
              raise RuntimeError("unexpected Ruff step")
          workflow = workflow.replace(old_ruff, new_ruff, 1)

          mypy_files = (
              "src/prob4d/cli.py",
              "src/prob4d/calibration_compatibility.py",
              "src/prob4d/composition_jacobian.py",
              "src/prob4d/covariance_root.py",
              "src/prob4d/observation_factor_stream.py",
              "src/prob4d/prediction_store.py",
              "src/prob4d/prediction_store_benchmark.py",
              "src/prob4d/prediction_store_cli.py",
              "src/prob4d/project_identity.py",
              "src/prob4d/provider_attestation.py",
              "src/prob4d/provider_manifest.py",
              "src/prob4d/provider_manifest_cli.py",
              "src/prob4d/provider_v1.py",
              "src/prob4d/provider_v2.py",
              "src/prob4d/provider_v2_cli.py",
              "src/prob4d/provider_v2_factor_bundle.py",
              "src/prob4d/provider_v2_loading.py",
              "src/prob4d/runtime_revision.py",
              "src/prob4d/source_diagnostics.py",
          )
          mypy_lines = [
              "      - name: Type-check stable provider interfaces",
              "        id: mypy",
              "        continue-on-error: true",
              "        shell: bash",
              "        run: |",
              "          set -o pipefail",
              "          python -m mypy \\",
          ]
          mypy_lines.extend(f"            {path} \\" for path in mypy_files)
          mypy_lines.append("            2>&1 | tee mypy-output.txt")
          new_mypy = "\n".join(mypy_lines) + "\n"
          mypy_start = workflow.index(
              "      - name: Type-check stable provider interfaces\n"
          )
          mypy_end = workflow.index(
              "      - name: Upload mypy diagnostics\n",
              mypy_start,
          )
          workflow = workflow[:mypy_start] + new_mypy + workflow[mypy_end:]

          import_anchor = (
              "          import prob4d.provider_v2\n"
              "          import prob4d.provider_v2_cli\n"
          )
          import_replacement = (
              "          import prob4d.provider_v2\n"
              "          import prob4d.provider_v2_cli\n"
              "          import prob4d.provider_v2_factor_bundle\n"
          )
          if workflow.count(import_anchor) != 1:
              raise RuntimeError("unexpected stable-import smoke block")
          workflow = workflow.replace(import_anchor, import_replacement, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          policy_path = Path("tests/test_github_action_pins.py")
          policy = policy_path.read_text(encoding="utf-8")
          helper_marker = "\n\ndef test_every_external_github_action_is_immutably_pinned() -> None:\n"
          helper = '''

          def _piped_run_block_errors(text: str, *, source: str) -> list[str]:
              block_run = re.compile(r"^(?P<indent>\\s*)run:\\s*(?:[|>][-+]?)\\s*$")
              inline_run = re.compile(r"^\\s*run:\\s*(?P<command>.+)$")
              lines = text.splitlines()
              errors: list[str] = []
              for index, line in enumerate(lines):
                  block_match = block_run.match(line)
                  if block_match is not None:
                      indentation = len(block_match.group("indent"))
                      block: list[str] = []
                      for candidate in lines[index + 1 :]:
                          if not candidate.strip():
                              block.append(candidate)
                              continue
                          candidate_stripped = candidate.lstrip()
                          candidate_indentation = len(candidate) - len(candidate_stripped)
                          if candidate_indentation <= indentation:
                              break
                          block.append(candidate)
                      command = "\\n".join(block)
                  else:
                      inline_match = inline_run.match(line)
                      if inline_match is None:
                          continue
                      command = inline_match.group("command")
                  if "| tee" not in command:
                      continue
                  if "set -o pipefail" in command or "set -euo pipefail" in command:
                      continue
                  errors.append(
                      f"{source}:{index + 1}: a command piped through tee must enable "
                      "pipefail so diagnostics cannot mask a failing producer"
                  )
              return errors
          '''
          if policy.count(helper_marker) != 1:
              raise RuntimeError("unexpected workflow-policy helper location")
          policy = policy.replace(helper_marker, helper + helper_marker, 1)

          test_marker = "\n\ndef test_pin_policy_rejects_tags_branches_and_short_shas() -> None:\n"
          tests = '''

          def test_piped_workflow_commands_enable_pipefail() -> None:
              errors: list[str] = []
              for path in sorted(WORKFLOW_ROOT.glob("*.yml")) + sorted(
                  WORKFLOW_ROOT.glob("*.yaml")
              ):
                  errors.extend(
                      _piped_run_block_errors(
                          path.read_text(encoding="utf-8"),
                          source=path.relative_to(ROOT).as_posix(),
                      )
                  )
              assert not errors, "\\n".join(errors)


          def test_pipefail_policy_rejects_masked_diagnostic_pipelines() -> None:
              unsafe_inline = "run: command 2>&1 | tee diagnostics.txt\\n"
              safe_inline = (
                  "run: set -o pipefail; command 2>&1 | tee diagnostics.txt\\n"
              )
              unsafe_block = "run: |\\n  command 2>&1 | tee diagnostics.txt\\n"
              safe_block = (
                  "run: |\\n"
                  "  set -o pipefail\\n"
                  "  command 2>&1 | tee diagnostics.txt\\n"
              )

              assert len(
                  _piped_run_block_errors(unsafe_inline, source="fixture.yml")
              ) == 1
              assert _piped_run_block_errors(safe_inline, source="fixture.yml") == []
              assert len(
                  _piped_run_block_errors(unsafe_block, source="fixture.yml")
              ) == 1
              assert _piped_run_block_errors(safe_block, source="fixture.yml") == []
          '''
          if policy.count(test_marker) != 1:
              raise RuntimeError("unexpected workflow-policy test location")
          policy = policy.replace(test_marker, tests + test_marker, 1)
          policy_path.write_text(policy, encoding="utf-8")

          bundle_test = Path("tests/test_observation_contract_bundle.py")
          bundle_text = bundle_test.read_text(encoding="utf-8")
          old_loop = "    for name, values in belief.arrays().items():\n"
          new_loop = "    for _name, values in belief.arrays().items():\n"
          if bundle_text.count(old_loop) != 1:
              raise RuntimeError("unexpected observation-contract loop")
          bundle_test.write_text(
              bundle_text.replace(old_loop, new_loop, 1),
              encoding="utf-8",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          fixed_anchor = "### Fixed\n\n"
          fixed_entry = (
              "- GitHub Actions quality checks now propagate Ruff and mypy failures "
              "through diagnostic `tee` pipelines; a repository policy test rejects "
              "piped workflow commands that omit `pipefail`. The Python-3.10-targeted "
              "mypy environment uses compatible NumPy stubs while the runtime matrix "
              "remains unconstrained.\n"
          )
          if fixed_entry not in changelog:
              if changelog.count(fixed_anchor) != 1:
                  raise RuntimeError("unexpected changelog Fixed section")
              changelog = changelog.replace(fixed_anchor, fixed_anchor + fixed_entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Normalize the existing Ruff diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix src tests scripts/ci
          python -m ruff check src tests scripts/ci

      - name: Verify stable-interface typing fails closed
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy \
            src/prob4d/cli.py \
            src/prob4d/calibration_compatibility.py \
            src/prob4d/composition_jacobian.py \
            src/prob4d/covariance_root.py \
            src/prob4d/observation_factor_stream.py \
            src/prob4d/prediction_store.py \
            src/prob4d/prediction_store_benchmark.py \
            src/prob4d/prediction_store_cli.py \
            src/prob4d/project_identity.py \
            src/prob4d/provider_attestation.py \
            src/prob4d/provider_manifest.py \
            src/prob4d/provider_manifest_cli.py \
            src/prob4d/provider_v1.py \
            src/prob4d/provider_v2.py \
            src/prob4d/provider_v2_cli.py \
            src/prob4d/provider_v2_factor_bundle.py \
            src/prob4d/provider_v2_loading.py \
            src/prob4d/runtime_revision.py \
            src/prob4d/source_diagnostics.py

      - name: Run complete test suite
        run: python -m pytest

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-fail-closed-quality.yml

      - name: Commit and push implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make quality checks fail closed'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/make-quality-checks-fail-closed
