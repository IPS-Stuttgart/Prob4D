name: Archive completed DEFORM DLO4/DLO5 execution workflows once

on:
  push:
    branches:
      - science/deform-dlo45-query-observability-real-v1
    paths:
      - protocols/execution_requests/archive_deform_dlo45_workflows_once.trigger

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-query-observability-real-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Archive completed execution definitions as evidence
        shell: bash
        run: |
          set -euo pipefail
          destination="evidence/deform-dlo45-query-observability-heldout-v1/executed-workflows"
          mkdir -p "$destination"
          workflows=(
            deform-dlo45-observability-source-v1.yml
            deform-dlo45-observability-official-mirror-v1.yml
            deform-dlo45-observability-hosted-v1.yml
            deform-dlo45-local-segment-source-v2.yml
            deform-dlo45-query-gate-source-v1.yml
            deform-dlo45-query-observability-heldout-v1.yml
          )
          for workflow in "${workflows[@]}"; do
            source=".github/workflows/$workflow"
            if [[ -f "$source" ]]; then
              git mv "$source" "$destination/$workflow"
            fi
          done
          rm -f -- \
            .github/workflows/archive-deform-dlo45-execution-workflows-once.yml \
            .github/workflows/cleanup-connector-probe-issue-once.yml \
            .github/workflows/deform-dlo45-mechanical-format-fix.yml \
            .github/workflows/deform-dlo45-pr-reconcile-once.yml \
            protocols/execution_requests/archive_deform_dlo45_workflows_once.trigger \
            protocols/execution_requests/cleanup_connector_probe_issue_once.trigger \
            protocols/execution_requests/deform_dlo45_mechanical_format_fix.trigger \
            protocols/execution_requests/deform_dlo45_pr_reconcile_once.trigger

      - name: Commit the archival-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Archive completed DLO execution workflows as provenance"
          git push origin HEAD:science/deform-dlo45-query-observability-real-v1
