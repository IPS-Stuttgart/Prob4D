name: Validate PR 114 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-validate-pr114.yml

permissions:
  contents: write

concurrency:
  group: validate-pr114-exact-head
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact Prob4D branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-hygiene-ecosystem-capsule
          path: prob4d
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Check out BayesianPhysTwin main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: main
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out Causal4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: main
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            prob4d/pyproject.toml
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Validate source, metadata, distributions, and capsule tooling
        working-directory: prob4d
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format --check \
            scripts/ci/build_ecosystem_release_capsule.py \
            scripts/ci/check_sdist.py \
            tests/test_ecosystem_release_capsule.py \
            tests/test_release_metadata.py
          python -m ruff check \
            scripts/ci/build_ecosystem_release_capsule.py \
            scripts/ci/check_sdist.py \
            tests/test_ecosystem_release_capsule.py \
            tests/test_release_metadata.py
          python -m mypy scripts/ci/build_ecosystem_release_capsule.py
          python -m pytest -q \
            tests/test_ecosystem_release_capsule.py \
            tests/test_release_metadata.py \
            tests/test_github_action_pins.py
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python scripts/ci/check_sdist.py "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Run and seal the installed-wheel ecosystem path
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin \
            prob4d \
            causal4d \
            2>&1 | tee ecosystem-golden-path.log
          prob4d_revision="$(git -C prob4d rev-parse --verify 'HEAD^{commit}')"
          bayesian_phystwin_revision="$(git -C bayesian-phystwin rev-parse --verify 'HEAD^{commit}')"
          causal4d_revision="$(git -C causal4d rev-parse --verify 'HEAD^{commit}')"
          python prob4d/scripts/ci/build_ecosystem_release_capsule.py build \
            --golden-path-log ecosystem-golden-path.log \
            --prob4d-revision "${prob4d_revision}" \
            --bayesian-phystwin-revision "${bayesian_phystwin_revision}" \
            --causal4d-revision "${causal4d_revision}" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --runner-os "${RUNNER_OS}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output ecosystem-release-capsule.json
          python prob4d/scripts/ci/build_ecosystem_release_capsule.py verify \
            ecosystem-release-capsule.json

      - name: Remove validator and publish the validated head
        working-directory: prob4d
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-validate-pr114.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate release hygiene and ecosystem capsule"
          git push origin HEAD:agent/release-hygiene-ecosystem-capsule
