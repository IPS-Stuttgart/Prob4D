name: Temporary retain DLO45 calibration evidence

on:
  push:
    branches: [science/deform-dlo45-source-calibrated-covariance-v1]
    paths:
      - ".github/workflows/temporary-retain-dlo45-calibration-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-source-calibrated-covariance-v1
          fetch-depth: 0
      - name: Download the immutable successful artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dlo45-source-calibrated-query-covariance-hosted-a56224488a93ea2bb8323f748d36df34c5df7b0d
          path: ${{ runner.temp }}/executed
          github-token: ${{ github.token }}
          repository: IPS-Stuttgart/Prob4D
          run-id: 33532006652
      - name: Retain exact source and evaluation evidence
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/executed"
          target=evidence/deform-dlo45-source-calibrated-query-covariance-v1
          rm -rf -- "$target"
          mkdir -p "$target/source" "$target/evaluation"
          cp "$source/source/calibration.json" "$target/source/"
          cp "$source/evaluation/result.json" "$target/evaluation/"
          cp "$source/evaluation/SUMMARY.md" "$target/evaluation/"
          cp "$source/deform-revision.txt" "$target/"
          cp "$source/SHA256SUMS" "$target/"
          cat > "$target/EXECUTION.md" <<'EOF'
          # Executed no-new-data covariance calibration

          - Workflow run: `33532006652`
          - Job: `99937185679`
          - Artifact: `9810128613`
          - Artifact digest: `sha256:7b999a6338b3d031c2f2f498f1f601cdfcf3e5e2dcd8a5d25c1436ff42334d11`
          - Prob4D execution revision: `a56224488a93ea2bb8323f748d36df34c5df7b0d`
          - Official DEFORM revision: `b73b8b8ecc033caefa693fab7898741d4e6dbeff`
          - Calibration ID: `c1efc8d6fe2ec27d63083ee29b4a677faf1c37b26cd4239b54e4cd7a90a34fcd`
          - Result ID: `383b78a1a66a02f0f54dffa11e68303cd2ded8c6cf05877a9c7c213fcd92aca4`

          The source stage opened only the 112 official DLO4/DLO5 training
          trajectories. It sealed scalar inflation `2.1227300133784226` before
          re-reading the already-opened 28-file evaluation split. No new data
          were collected; means, factors, admission decisions, and rejected-query
          fallback were unchanged.
          EOF
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m 'Retain source-calibrated DLO4/DLO5 covariance evidence'
          git push origin HEAD:science/deform-dlo45-source-calibrated-covariance-v1
