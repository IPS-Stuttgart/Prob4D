name: One-shot strict gauge-tree artifact schema

on:
  push:
    branches: [agent/portable-gauge-tree-prior-artifact-v1]
    paths:
      - ".github/workflows/_one_shot_harden_gauge_tree_artifact_schema.yml"
      - "scripts/ci/_one_shot_harden_gauge_tree_artifact_schema.py"

permissions:
  contents: write

concurrency:
  group: one-shot-gauge-tree-artifact-schema
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/Prob4D' &&
      github.ref == 'refs/heads/agent/portable-gauge-tree-prior-artifact-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact schema transformation
        run: |
          set -euo pipefail
          python scripts/ci/_one_shot_harden_gauge_tree_artifact_schema.py

      - name: Install and validate focused contracts
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/prob4d/_gauge_tree_artifact_common.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m ruff check \
            src/prob4d/_gauge_tree_artifact_common.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m ruff format --check \
            src/prob4d/_gauge_tree_artifact_common.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m mypy \
            src/prob4d/_gauge_tree_artifact_common.py \
            src/prob4d/_gauge_tree_artifact_io.py \
            src/prob4d/gauge_tree_prior_artifact.py
          python -m pytest -q \
            tests/test_gauge_tree_prior_artifact.py \
            tests/test_gauge_tree_prior.py \
            tests/test_sparse_observation_factor.py
          python -m py_compile \
            src/prob4d/_gauge_tree_artifact_common.py \
            tests/test_gauge_tree_prior_artifact.py
          python -m pip check

      - name: Remove one-shot transport and verify scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_one_shot_harden_gauge_tree_artifact_schema.yml \
            scripts/ci/_one_shot_harden_gauge_tree_artifact_schema.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          printf 'Final working-tree paths:\n%s\n' "${actual}"
          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/_one_shot_harden_gauge_tree_artifact_schema.yml|\
              scripts/ci/_one_shot_harden_gauge_tree_artifact_schema.py|\
              src/prob4d/_gauge_tree_artifact_common.py|\
              tests/test_gauge_tree_prior_artifact.py)
                ;;
              *)
                echo "unexpected final-scope path: ${path}" >&2
                exit 1
                ;;
            esac
          done <<<"${actual}"

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/_one_shot_harden_gauge_tree_artifact_schema.yml \
            scripts/ci/_one_shot_harden_gauge_tree_artifact_schema.py \
            src/prob4d/_gauge_tree_artifact_common.py \
            tests/test_gauge_tree_prior_artifact.py
          git commit -m 'Reject Boolean gauge-tree schema versions'
          git push origin HEAD:agent/portable-gauge-tree-prior-artifact-v1
