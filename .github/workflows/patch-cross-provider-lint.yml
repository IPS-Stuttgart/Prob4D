name: Patch cross-provider lint findings

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/patch-cross-provider-lint.yml"

permissions:
  contents: write

concurrency:
  group: patch-cross-provider-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cross-provider-guard-v1'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cross-provider-guard-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply exact Ruff repairs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          module = Path("src/prob4d/cross_provider_guard.py")
          text = module.read_text(encoding="utf-8")
          old = '''        except FileExistsError:
              if load_json_object(path, name=path.name) != plain_json(record):
                  raise ValueError(f"concurrent writer published different {path.name!r}")
          '''
          new = '''        except FileExistsError as error:
              if load_json_object(path, name=path.name) != plain_json(record):
                  raise ValueError(
                      f"concurrent writer published different {path.name!r}"
                  ) from error
          '''
          if old not in text:
              raise SystemExit("expected publication exception block changed")
          module.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_cross_provider_guard.py")
          text = tests.read_text(encoding="utf-8")
          old_import = "    CrossProviderCalibrationV1,\n"
          if text.count(old_import) != 1:
              raise SystemExit("expected unused import changed")
          tests.write_text(text.replace(old_import, "", 1), encoding="utf-8")
          PY
          python3 -m py_compile \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cross_provider_guard.py \
            tests/test_cross_provider_guard.py
          git commit -m "Fix cross-provider Ruff findings"
          git push origin HEAD:agent/cross-provider-guard-v1
