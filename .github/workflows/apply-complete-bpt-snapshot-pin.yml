name: Apply complete BPT execution snapshot pin

on:
  push:
    branches:
      - agent/run-bpt-controlled-decisive-v1
    paths:
      - ".github/bpt-complete-snapshot-pin-trigger.txt"

permissions:
  contents: write

concurrency:
  group: apply-complete-bpt-snapshot-pin
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/run-bpt-controlled-decisive-v1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin the complete payload-bearing BPT commit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "59256a124c4df1d780b79d1c31d6c1d01e63d10f"
          new = "dfdfa12bf1fbffb1d13f7782567f51133c69cbef"
          expected = {
              Path(".github/workflows/bpt-controlled-decisive-v1.yml"): 1,
              Path("tests/test_bpt_controlled_decisive_execution_workflow.py"): 1,
              Path("docs/bpt-controlled-decisive-execution.md"): 2,
          }
          for path, count in expected.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != count:
                  raise RuntimeError(
                      f"{path}: expected {count} old execution pins, "
                      f"found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Validate orchestration policy
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_bpt_controlled_decisive_execution_workflow.py
          grep -R --fixed-strings \
            'dfdfa12bf1fbffb1d13f7782567f51133c69cbef' \
            .github/workflows/bpt-controlled-decisive-v1.yml \
            tests/test_bpt_controlled_decisive_execution_workflow.py \
            docs/bpt-controlled-decisive-execution.md
          if grep -R --fixed-strings \
            '59256a124c4df1d780b79d1c31d6c1d01e63d10f' \
            .github/workflows/bpt-controlled-decisive-v1.yml \
            tests/test_bpt_controlled_decisive_execution_workflow.py \
            docs/bpt-controlled-decisive-execution.md; then
            echo 'Incomplete execution-pin replacement' >&2
            exit 1
          fi
      - name: Commit correction and remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/apply-complete-bpt-snapshot-pin.yml
          rm .github/bpt-complete-snapshot-pin-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/bpt-controlled-decisive-v1.yml \
            tests/test_bpt_controlled_decisive_execution_workflow.py \
            docs/bpt-controlled-decisive-execution.md \
            .github/workflows/apply-complete-bpt-snapshot-pin.yml \
            .github/bpt-complete-snapshot-pin-trigger.txt
          git diff --cached --check
          git commit -m 'Pin complete BPT decisive execution snapshot'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/run-bpt-controlled-decisive-v1
