name: Target provider admission

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/target-provider-admission.yml"
      - "docs/examples/deform360-target-provider-admission-config.json"
      - "docs/target-provider-admission.md"
      - "pyproject.toml"
      - "scripts/ci/check_sdist.py"
      - "src/prob4d/target_provider_admission.py"
      - "src/prob4d/target_provider_admission_cli.py"
      - "tests/test_target_provider_admission.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target-provider-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight development environment
        run: |
          python -m pip install -e ".[dev]" "numpy>=1.24,<2.3"
          python -m pip check

      - name: Validate target-admission source and contracts
        run: |
          python -m ruff check \
            src/prob4d/target_provider_admission.py \
            src/prob4d/target_provider_admission_cli.py \
            tests/test_target_provider_admission.py \
            scripts/ci/check_sdist.py
          python -m ruff format --check \
            src/prob4d/target_provider_admission.py \
            src/prob4d/target_provider_admission_cli.py \
            tests/test_target_provider_admission.py \
            scripts/ci/check_sdist.py
          python -m mypy \
            src/prob4d/target_provider_admission.py \
            src/prob4d/target_provider_admission_cli.py
          python -m pytest -q \
            tests/test_target_provider_admission.py \
            tests/test_deform360_cohort_binding.py \
            tests/test_prediction_provider_manifest.py \
            tests/test_heldout_promotion.py \
            tests/test_cli.py
          python -m compileall -q src/prob4d tests/test_target_provider_admission.py
          python -m pip check

      - name: Build and audit distributions
        run: |
          python -m build
          python -m twine check dist/*
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          python scripts/ci/check_sdist.py "$archive"

      - name: Smoke-test installed target-admission commands
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          environment="$RUNNER_TEMP/prob4d-target-admission-installed"
          python -m venv "$environment"
          "$environment/bin/python" -m pip install "$wheel"
          "$environment/bin/python" -m pip check
          "$environment/bin/prob4d-target-admit" --help
          "$environment/bin/prob4d-target-verify" --help

      - name: Verify clean exact-head execution
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
