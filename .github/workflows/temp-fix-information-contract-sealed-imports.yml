name: Temporary fix sealed benchmark imports

on:
  push:
    branches: [science/information-contract-benchmark-sealed-v1]
    paths:
      - "tools/requests/fix_information_contract_sealed_imports.json"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply only Ruff import fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.5"
          python -m ruff check --fix --select I,F401 \
            src/prob4d/information_contract_sealed.py \
            src/prob4d/information_contract_sealed_smoke.py
          python -m ruff check \
            src/prob4d/information_contract_sealed.py \
            src/prob4d/information_contract_sealed_smoke.py
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            src/prob4d/information_contract_sealed.py
            src/prob4d/information_contract_sealed_smoke.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
      - name: Commit the mechanical correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/information_contract_sealed.py \
            src/prob4d/information_contract_sealed_smoke.py
          git commit -m "Fix sealed benchmark import ordering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
