name: Temporary recursive visual-bias formatter

on:
  push:
    branches:
      - agent/recursive-visual-bias-stream

permissions:
  contents: write

concurrency:
  group: temporary-recursive-visual-bias-formatter
  cancel-in-progress: false

jobs:
  format-and-test:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-visual-bias-stream
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/prob4d-recursive-visual-bias-format"
          python -m venv --clear "$environment"
          "$environment/bin/python" -m ensurepip --upgrade
          "$environment/bin/python" -m pip install --upgrade pip
          echo "$environment/bin" >> "$GITHUB_PATH"

      - name: Install quality tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"

      - name: Apply deterministic formatting and fixes
        run: |
          python -m ruff check --fix \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          python -m ruff format \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py

      - name: Validate the formatted source
        run: |
          python -m ruff check \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          python -m ruff format --check \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          python -m mypy src/prob4d/visual_bias_stream.py
          python -m pytest -q \
            tests/test_visual_bias_stream.py \
            tests/test_visual_bias.py \
            tests/test_cli.py \
            tests/test_observation_factor_stream.py

      - name: Commit the deterministic formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/prob4d/cli.py \
            src/prob4d/visual_bias_stream.py \
            tests/test_cli.py \
            tests/test_visual_bias_stream.py
          git commit -m "Format recursive visual-bias stream"
          git push origin HEAD:agent/recursive-visual-bias-stream
