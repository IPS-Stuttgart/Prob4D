name: Probe sparse DOT archive access

on:
  push:
    branches: [science/dot-gpuserver6000-direct-v1]
    paths:
      - ".github/workflows/dot-dataverse-range-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe byte-range behavior
        shell: bash
        run: |
          set -euo pipefail
          url='https://dataverse.orc.gmu.edu/api/access/datafile/2343'
          headers="$RUNNER_TEMP/headers.txt"
          body="$RUNNER_TEMP/byte.bin"
          curl --fail --location --silent --show-error \
            --header 'Range: bytes=0-0' \
            --dump-header "$headers" \
            --output "$body" \
            "$url"
          cat "$headers"
          echo "range_body_bytes=$(stat -c '%s' "$body")"
          grep -Eiq '^HTTP/[^ ]+ 206 ' "$headers"
          grep -Eiq '^content-range: bytes 0-0/1705947395' "$headers"
      - name: Provision Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify remote ZIP member access
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'remotezip==0.12.6'
          python - <<'PY'
          import hashlib
          from remotezip import RemoteZip

          url = 'https://dataverse.orc.gmu.edu/api/access/datafile/2343'
          expected = 'R01/images/normal_view/frame000001_cam001.jpg'
          with RemoteZip(
              url,
              timeout=120,
              initial_buffer_size=8 * 1024 * 1024,
              support_suffix_range=False,
          ) as archive:
              names = set(archive.namelist())
              print(f'member_count={len(names)}')
              print('first_members=')
              for name in sorted(names)[:20]:
                  print(name)
              if expected not in names:
                  candidates = sorted(
                      name for name in names
                      if 'R01' in name and 'normal_view' in name and 'frame000001' in name
                  )
                  raise SystemExit(f'expected member absent; candidates={candidates[:20]}')
              raw = archive.read(expected)
          if not raw.startswith(b'\xff\xd8'):
              raise SystemExit('selected member is not a JPEG')
          print(f'selected_member={expected}')
          print(f'selected_bytes={len(raw)}')
          print(f'selected_sha256={hashlib.sha256(raw).hexdigest()}')
          PY
