name: One-shot MotionCrafter storage patch

on:
  push:
    branches:
      - agent/harden-prediction-storage-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-prediction-storage-evidence
          fetch-depth: 0
      - name: Preserve native float32 prediction storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prob4d/motioncrafter.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          candidates = [
              index
              for index in range(1, len(lines) - 1)
              if lines[index - 1].strip() == 'scene_flow=arrays.get("scene_flow"),'
              and lines[index].strip() == 'deform_mask=arrays.get("deform_mask"),'
              and lines[index + 1].strip() == ")"
          ]
          if len(candidates) != 1:
              raise SystemExit("MotionCrafter PredictionWindow construction changed")
          index = candidates[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index + 1, f'{indent}dense_storage_dtype="float32",\n')
          path.write_text("".join(lines), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-motioncrafter-storage-patch.yml
          git add src/prob4d/motioncrafter.py
          git commit -m "Preserve MotionCrafter float32 storage semantics"
          git push origin HEAD:agent/harden-prediction-storage-evidence
