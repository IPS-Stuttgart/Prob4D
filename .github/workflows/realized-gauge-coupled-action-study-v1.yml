name: Realized gauge-coupled action study v1

on:
  push:
    branches:
      - research/symmetry-complete-belief-v1
      - main
    paths:
      - ".github/workflows/realized-gauge-coupled-action-study-v1.yml"
      - "protocols/realized-gauge-coupled-action-study-v1.json"
      - "scripts/science/run_realized_gauge_coupled_action_study_v1.py"
      - "src/prob4d/equivariant_decision.py"
      - "src/prob4d/realized_equivariant_decision.py"
      - "tests/test_realized_equivariant_decision.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/realized-gauge-coupled-action-study-v1.yml"
      - "protocols/realized-gauge-coupled-action-study-v1.json"
      - "scripts/science/run_realized_gauge_coupled_action_study_v1.py"
      - "src/prob4d/equivariant_decision.py"
      - "src/prob4d/realized_equivariant_decision.py"
      - "tests/test_realized_equivariant_decision.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realized-gauge-coupled-action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Realized-intervention certificate / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify implementation and byte-identical study
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/prob4d/realized_equivariant_decision.py \
            scripts/science/run_realized_gauge_coupled_action_study_v1.py \
            tests/test_realized_equivariant_decision.py
          python -m pytest -q tests/test_realized_equivariant_decision.py
          root="$RUNNER_TEMP/realized-gauge-coupled-action-study-v1"
          mkdir -p "$root"
          python scripts/science/run_realized_gauge_coupled_action_study_v1.py \
            --output "$root/result-a.json"
          python scripts/science/run_realized_gauge_coupled_action_study_v1.py \
            --output "$root/result-b.json"
          cmp "$root/result-a.json" "$root/result-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "realized-gauge-coupled-action-study-v1"
          result = json.loads((root / "result-a.json").read_text(encoding="utf-8"))
          protocol = json.loads(
              Path("protocols/realized-gauge-coupled-action-study-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          assert result["decision"] == "controlled-realized-gauge-action-passed"
          assert all(result["checks"].values())
          assert result["realization_radii"] == protocol["intervention_uncertainty"][
              "realization_radii_for_action_0"
          ]
          final = result["zero_tolerance_sweep"][-1]
          assert final["selected_action"] == protocol["fallback_action"]
          assert abs(final["realized_regret_upper"][0] - 0.2) < 1e-12
          bounded = result["bounded_regret_case"]
          assert bounded["selected_action"] == 0
          assert bounded["status"] == "certified-bounded-regret"
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          sha256sum \
            protocols/realized-gauge-coupled-action-study-v1.json \
            "$root/result-a.json"
      - name: Upload controlled evidence
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: realized-gauge-coupled-action-study-${{ github.sha }}
          path: ${{ runner.temp }}/realized-gauge-coupled-action-study-v1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
