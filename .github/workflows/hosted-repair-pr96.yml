name: Hosted repair PR 96

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hosted-repair-pr96.yml]

permissions:
  contents: write

concurrency:
  group: hosted-repair-pr96
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/replayable-selection-evidence'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/replayable-selection-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Refresh main and bind replay state and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one repair target in {path}, found {count}'
                  )
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/prob4d/_selection_evidence_replay.py',
              '''        def aggregate(
                      metric_name: str,
                      aggregation: Aggregation,
                      *,
                      candidate_id: str = candidate.candidate_id,
                  ) -> float:
                      key = (metric_name, aggregation)
                      if key not in aggregate_cache:
                          values: list[float] = []
                          for group_id in groups:
                              row = by_key[(group_id, candidate_id)]
                              if metric_name not in row.metrics:
                                  raise ValueError(
                                      f"row {(group_id, candidate_id)!r} lacks "
                                      f"required metric {metric_name!r}"
                                  )
                              values.append(float(row.metrics[metric_name]))
                          aggregate_cache[key] = _aggregate(values, aggregation)
                      return aggregate_cache[key]
          ''',
              '''        def aggregate(
                      metric_name: str,
                      aggregation: Aggregation,
                      *,
                      candidate_id: str = candidate.candidate_id,
                      cache: dict[tuple[str, Aggregation], float] = aggregate_cache,
                  ) -> float:
                      key = (metric_name, aggregation)
                      if key not in cache:
                          values: list[float] = []
                          for group_id in groups:
                              row = by_key[(group_id, candidate_id)]
                              if metric_name not in row.metrics:
                                  raise ValueError(
                                      f"row {(group_id, candidate_id)!r} lacks "
                                      f"required metric {metric_name!r}"
                                  )
                              values.append(float(row.metrics[metric_name]))
                          cache[key] = _aggregate(values, aggregation)
                      return cache[key]
          ''',
          )
          replace_once(
              'src/prob4d/_selection_evidence_common.py',
              '''SELECTION_REPLAY_SCHEMA = "prob4d.selection-replay"
          FINAL_TIE_BREAK = "complexity-rank-then-candidate-id"
          ''',
              '''SELECTION_REPLAY_SCHEMA = "prob4d.selection-replay"
          SELECTION_CLAIM_BOUNDARY = (
              "Selection uses retained calibration groups only. Deployment decisions "
              "record guard outputs and exact fallback identities but are not selection "
              "inputs. Physical benefit requires a separately frozen target analysis."
          )
          FINAL_TIE_BREAK = "complexity-rank-then-candidate-id"
          ''',
          )
          replace_once(
              'src/prob4d/selection_evidence.py',
              '''    MetricOrderV1,
              SELECTION_EVIDENCE_SCHEMA,
          ''',
              '''    MetricOrderV1,
              SELECTION_CLAIM_BOUNDARY,
              SELECTION_EVIDENCE_SCHEMA,
          ''',
          )
          replace_once(
              'src/prob4d/selection_evidence.py',
              '''            "claim_boundary": (
                          "Selection uses retained calibration groups only. Deployment decisions "
                          "record guard outputs and exact fallback identities but are not selection "
                          "inputs. Physical benefit requires a separately frozen target analysis."
                      ),
          ''',
              '''            "claim_boundary": SELECTION_CLAIM_BOUNDARY,
          ''',
          )
          replace_once(
              'src/prob4d/selection_evidence.py',
              '''    if type(mapping["claim_boundary"]) is not str:
                  raise ValueError("claim_boundary must be a string")
          ''',
              '''    if mapping["claim_boundary"] != SELECTION_CLAIM_BOUNDARY:
                  raise ValueError("selection evidence claim_boundary mismatch")
          ''',
          )
          replace_once(
              'src/prob4d/selection_evidence.py',
              '''    except json.JSONDecodeError as error:
                  raise ValueError("selection evidence is not valid JSON") from error
          ''',
              '''    except (OSError, UnicodeError, json.JSONDecodeError) as error:
                  raise ValueError("selection evidence is unreadable or invalid JSON") from error
          ''',
          )
          replace_once(
              'src/prob4d/selection_evidence.py',
              '''    "SELECTION_EVIDENCE_SCHEMA",
              "SELECTION_EVIDENCE_VERSION",
          ''',
              '''    "SELECTION_CLAIM_BOUNDARY",
              "SELECTION_EVIDENCE_SCHEMA",
              "SELECTION_EVIDENCE_VERSION",
          ''',
          )
          replace_once(
              'tests/test_selection_evidence.py',
              '''def test_incomplete_calibration_matrix_is_rejected() -> None:
          ''',
              '''def test_tampered_claim_boundary_is_rejected() -> None:
              payload = copy.deepcopy(bundle().to_dict())
              payload["claim_boundary"] = "weakened claim boundary"

              with pytest.raises(ValueError, match="claim_boundary mismatch"):
                  selection_evidence_from_dict(payload)


          def test_incomplete_calibration_matrix_is_rejected() -> None:
          ''',
          )

          focused = Path('.github/workflows/selection-evidence.yml')
          workflow = focused.read_text(encoding='utf-8')
          runner = '    runs-on: [self-hosted, Linux, X64]\n'
          if workflow.count(runner) != 1:
              raise SystemExit('focused workflow runner target is not unique')
          focused.write_text(
              workflow.replace(runner, '    runs-on: ubuntu-latest\n'),
              encoding='utf-8',
          )
          Path('.github/workflows/hosted-repair-pr96.yml').unlink()
          PY
      - name: Validate replay and tamper contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check --fix \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m ruff format \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m ruff check \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py
          python -m mypy \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py
          python -m pytest -q tests/test_selection_evidence.py
          git diff --check
      - name: Commit ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prob4d/_selection_evidence_common.py \
            src/prob4d/_selection_evidence_records.py \
            src/prob4d/_selection_evidence_replay.py \
            src/prob4d/selection_evidence.py \
            tests/test_selection_evidence.py \
            .github/workflows/selection-evidence.yml \
            .github/workflows/hosted-repair-pr96.yml
          git commit -m 'Bind replay state and selection claim boundary'
          git push origin HEAD:agent/replayable-selection-evidence
